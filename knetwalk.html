		ctx.font = `bold ${s*0.05}px monospace`;
		ctx.fillText('Sip',s*0.12,s*0.74);
		ctx.fillStyle = '#800';
		ctx.fillText('==',s*0.07,s*0.74);
		
	}
	else if (type.id === 'apple1') {
		//apple1, un pezzo di legno con dentro 4 chip in croce
			
		// CASE LEGNO (corpo principale, tono caldo)
		let woodGrad = ctx.createLinearGradient(0, 0, s, s);
		woodGrad.addColorStop(0, "#a63");
		woodGrad.addColorStop(0.5, "#842");
		woodGrad.addColorStop(1, "#631");
		ctx.fillStyle = woodGrad;
		ctx.strokeStyle = "#3a2010";
		ctx.lineWidth = s*0.02;
		ctx.beginPath();
		ctx.roundRect(0, s*0.15, s, s*0.65, s*0.04);
		ctx.fill();
		ctx.stroke();		
		
		// Venature del legno (linee orizzontali leggere)
		ctx.strokeStyle = "rgba(0,0,0,0.08)";
		ctx.lineWidth = s*0.005;
		for(let i = 0; i < 5; i++) {
			const wy = s*0.2 + i * s*0.16;
			ctx.beginPath();
			ctx.moveTo(s*0.02, wy);
			ctx.lineTo(s*0.98, wy + (Math.sin(i) * s*0.01));
			ctx.stroke();
		}
		
		// PANNELLO POSTERIORE ALZATO (con scritta APPLE COMPUTER)
		let backGrad = ctx.createLinearGradient(0, 0, s, s*0.18);
		backGrad.addColorStop(0, "#b63");
		backGrad.addColorStop(1, "#842");
		ctx.fillStyle = backGrad;
		ctx.fillRect(s*0.05, 0, s*0.9, s*0.25);
		ctx.strokeStyle = "#321";
		ctx.lineWidth = s*0.01;
		ctx.strokeRect(s*0.05, 0, s*0.9, s*0.25);
		
		// Scritta "APPLE" intagliata (scura)
		ctx.fillStyle = "#222";
		ctx.font = `bold ${s*0.18}px sans-serif`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("A", s*0.38, s*0.1);
		ctx.font = `bold ${s*0.1}px sans-serif`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("PPLE", s*0.5, s*0.07);
		ctx.font = `bold ${s*0.05}px sans-serif`;
		ctx.fillText("COMPUTER", s*0.51, s*0.15);
		
		// 2 vitoni a sinistra della scritta
		ctx.fillStyle = '#333';
		ctx.strokeStyle = '#666';
		ctx.beginPath();
		ctx.arc(s*0.15, s*0.08, s*0.02, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		ctx.beginPath();
		ctx.arc(s*0.22, s*0.08, s*0.02, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		// 1 a destra
		ctx.beginPath();
		ctx.arc(s*0.79, s*0.08, s*0.02, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		
		// presa elettrica nera a destra (con foro a vista)
		ctx.fillStyle = "#1a1a1a";
		ctx.beginPath();
		ctx.roundRect(s*0.83, s*0.02, s*0.1, s*0.16, s*0.01);
		ctx.fill();
		ctx.fillStyle = connected ? colors.orangeOn : "#444";
		ctx.beginPath();
		ctx.arc(s*0.88, s*0.06, s*0.012, 0, Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.88, s*0.12, s*0.012, 0, Math.PI*2);
		ctx.fill();
		if (connected) drawLedAloneCircle(s*0.885, s*0.06, s*0.012, colors.orangeOn);
		
		// CASSETTO/FRONTALE INFERIORE (la parte bombata in basso)
		let drawerGrad = ctx.createLinearGradient(0, s*0.6, 0, s);
		drawerGrad.addColorStop(0, "#7a4220");
		drawerGrad.addColorStop(0.5, "#623318");
		drawerGrad.addColorStop(1, "#4a2510");
		ctx.fillStyle = drawerGrad;
		ctx.strokeStyle = "#2a1808";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.roundRect(s*0.02, s*0.60, s*0.96, s*0.18, s*0.04);
		ctx.fill();
		ctx.stroke();
		
		// riflesso lucido sul cassetto di legno
		ctx.fillStyle = "rgba(255,255,255,0.1)";
		ctx.beginPath();
		ctx.roundRect(s*0.04, s*0.62, s*0.92, s*0.10, s*0.02);
		ctx.fill();
		
		
		// TASTIERA (rettangolo grigio-beige, leggermente incassato)
		ctx.fillStyle = "#333";
		ctx.beginPath();
		ctx.roundRect(s*0.11, s*0.32, s*0.62, s*0.22, s*0.02);
		ctx.fill();
		
		// righe di tasti beige
		const keyRows = 3;
		const keyCols = 10;
		const kw = (s*0.58) / keyCols;
		const kh = (s*0.18) / keyRows;
		ctx.fillStyle = "#ddc";
		ctx.strokeStyle = "#888";
		ctx.lineWidth = s*0.003;
		for(let r = 0; r < keyRows; r++) {
			for(let c = 0; c < keyCols; c++) {
				const kx = s*0.13 + c * kw;
				const ky = s*0.34 + r * kh;
				ctx.fillRect(kx, ky, kw*0.85, kh*0.8);
				ctx.strokeRect(kx, ky, kw*0.85, kh*0.8);
			}
		}
		// tasto RETURN arancione
		ctx.fillStyle = "#c40";
		ctx.beginPath();
		ctx.roundRect(s*0.65, s*0.4, kw*0.9, kh*0.9, s*0.005);
		ctx.fill();
		
		// LED indicatore alimentazione (sempre acceso se connesso, ambra)
		const blinkPower = Math.sin(flowOffset*0.1) > -0.6;
		ctx.fillStyle = connected && blinkPower ? colors.orangeOn : colors.orangeOff;
		ctx.strokeStyle = '#333';
		ctx.beginPath();
		ctx.arc(s*0.68, s*0.485, s*0.02, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		if (connected && blinkPower) drawLedAloneCircle(s*0.68, s*0.485, s*0.02, colors.orangeOn);
		
		// barra spaziatrice enorme
		ctx.fillStyle = '#222';
		ctx.strokeStyle = '#333';
		ctx.beginPath();
		ctx.roundRect(s*0.20, s*0.52, s*0.4, kh*0.8, s*0.005);
		ctx.fill();
		ctx.stroke();
		
		// blocchetto tasti TAPE/PAPER ADV a destra della tastiera
		ctx.strokeStyle = "#999";
		ctx.fillStyle = "#555";
		for(let i=0; i<4; i++) {
			ctx.fillRect(s*0.8, s*0.34 + i*s*0.05, s*0.07, s*0.05);
			ctx.strokeRect(s*0.8, s*0.34 + i*s*0.05, s*0.07, s*0.05);
		}
		
		// 4 viti angolari sul case
		ctx.fillStyle = '#333';
		ctx.strokeStyle = '#666';
		[[s*0.05,s*0.35],[s*0.95,s*0.35],[s*0.05,s*0.55],[s*0.95,s*0.55]].forEach(([px,py])=>{
			ctx.beginPath();
			ctx.arc(px, py, s*0.02, 0, Math.PI*2);
			ctx.fill();
			ctx.stroke();
		});
	}
	else if (type.id === 'ibmpc') {
		// IBM PC - case beige con monitor CRT verde fosforo separato + tower con 2 floppy + 1 slot

		// MONITOR (in alto, leggermente arretrato)
		let monGrad = ctx.createLinearGradient(0, 0, s, s*0.42);
		monGrad.addColorStop(0, "#edc");
		monGrad.addColorStop(1, "#cba");
		ctx.fillStyle = monGrad;
		ctx.strokeStyle = "#888";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.roundRect(s*0.12, 0, s*0.74, s*0.49, s*0.03);
		ctx.fill();
		ctx.stroke();

		// Schermo CRT verde fosforo
		ctx.fillStyle = "#111";
		ctx.beginPath();
		ctx.roundRect(s*0.17, s*0.04, s*0.5, s*0.42, s*0.02);
		ctx.fill();

		if (connected) {
			ctx.fillStyle = "#0a2a10";
		} else {
			ctx.fillStyle = "#080808";
		}
		ctx.beginPath();
		ctx.roundRect(s*0.20, s*0.07, s*0.44, s*0.36, s*0.01);
		ctx.fill();

		if (connected) {
			// scritta IBM verde fosforo, lampeggio leggero del cursore
			ctx.fillStyle = "#3f3";
			ctx.font = `bold ${s*0.25}px monospace`;
			ctx.textAlign = "left";
			ctx.textBaseline = "middle";
			ctx.fillText("IBM", s*0.20, s*0.2);
			ctx.font = `${s*0.03}px monospace`;
			ctx.fillText("A:\>", s*0.20, s*0.40);

			if (Math.sin(flowOffset*0.6) > 0) {
				ctx.fillRect(s*0.25, s*0.39, s*0.014, s*0.025);
			}
			
			//righe nere sul Logo
			ctx.fillStyle = '#0a2a10';
			for (let i=0; i<3; i++) {
				ctx.fillRect(s*0.20,s*0.13+s*0.04*i,s*0.44,s*0.02);
			}
		}

		// logo ibm anche sul monitor
		ctx.fillStyle = "#444";
		ctx.beginPath();
		ctx.roundRect(s*0.7, s*0.05, s*0.12, s*0.07, s*0.005);
		ctx.fill();
		ctx.fillStyle = "#fff";
		ctx.font = `bold ${s*0.04}px monospace`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("IBM", s*0.72, s*0.085);

		// manopole luminosità/contrasto sotto al logo
		ctx.fillStyle = "#222";
		const blinkPwr = Math.sin(flowOffset*0.12) > -0.5;
		ctx.beginPath();
		ctx.arc(s*0.75, s*0.27, s*0.018, 0, Math.PI*2);
		ctx.fill();
		ctx.fillStyle = connected && blinkPwr ? colors.greenOn : colors.greenOff;
		ctx.beginPath();
		ctx.arc(s*0.75, s*0.27, s*0.01, 0, Math.PI*2);
		ctx.fill();
		if (connected && blinkPwr) drawLedAloneCircle(s*0.75, s*0.27, s*0.01, colors.greenOn);

		//luminosita + contrasto
		ctx.strokeStyle = "#888";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.arc(s*0.75, s*0.35, s*0.025, 0, Math.PI*2);
		ctx.stroke();
		ctx.beginPath();
		ctx.arc(s*0.75, s*0.43, s*0.025, 0, Math.PI*2);
		ctx.stroke();

		// CASE ORIZZONTALE (case principale sotto il monitor)
		let towerGrad = ctx.createLinearGradient(0, s*0.5, 0, s*0.78);
		towerGrad.addColorStop(0, "#edc");
		towerGrad.addColorStop(1, "#cba");
		ctx.fillStyle = towerGrad;
		ctx.strokeStyle = "#888";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.roundRect(s*0.05, s*0.5, s*0.9, s*0.28, s*0.02);
		ctx.fill();
		ctx.stroke();
		
		// targhetta IBM sul tower a sinistra
		ctx.fillStyle = "#444";
		ctx.beginPath();
		ctx.roundRect(s*0.08, s*0.54, s*0.16, s*0.06, s*0.005);
		ctx.fill();
		ctx.fillStyle = "#fff";
		ctx.font = `bold ${s*0.04}px monospace`;
		ctx.fillText("IBM", s*0.12, s*0.57);

		// griglia di ventilazione (righe verticali)
		ctx.fillStyle = "#333";
		for(let i = 0; i < 10; i++) {
			const gx = s*0.08 + i * s*0.035;
			ctx.fillRect(gx, s*0.62, s*0.017, s*0.12);
		}

		// 2 SLOT FLOPPY (impilati)
		const blinkFD1 = Math.sin(flowOffset*0.07) > -0.7;
		const blinkFD2 = Math.cos(flowOffset*0.09 + 1) > -0.7;

		ctx.fillStyle = "#111";
		ctx.beginPath();
		ctx.roundRect(s*0.5, s*0.53, s*0.38, s*0.10, s*0.005);
		ctx.fill();
		ctx.beginPath();
		ctx.roundRect(s*0.5, s*0.65, s*0.38, s*0.10, s*0.005);
		ctx.fill();

		// floppy
		[0.53, 0.65].forEach((fy, idx) => {
			ctx.fillStyle = "#333";
			ctx.fillRect(s*0.54, s*(fy+0.025), s*0.30, s*0.012);
			// LED rosso piccolo
			const on = idx === 0 ? blinkFD1 : blinkFD2;
			ctx.fillStyle = connected && on ? colors.redOn : colors.redOff;
			ctx.beginPath();
			ctx.arc(s*0.54, s*(fy+0.075), s*0.012, 0, Math.PI*2);
			ctx.fill();
			if (connected && on) drawLedAloneCircle(s*0.54, s*(fy+0.075), s*0.012, colors.redOn);
		});

		// TASTIERA (in basso, leggermente in prospettiva)
		let kbGrad = ctx.createLinearGradient(0, s*0.82, 0, s);
		kbGrad.addColorStop(0, "#edc");
		kbGrad.addColorStop(1, "#cba");
		ctx.fillStyle = kbGrad;
		ctx.strokeStyle = "#666";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.moveTo(s*0.02, s*0.82);
		ctx.lineTo(s*0.98, s*0.82);
		ctx.lineTo(s*1.0, s*1.0);
		ctx.lineTo(0, s*1.0);
		ctx.closePath();
		ctx.fill();		
		ctx.stroke();

		// righe di tasti
		ctx.fillStyle = "#fff";
		ctx.strokeStyle = "#aaa";
		ctx.lineWidth = s*0.003;
		const kbRows = 3, kbCols = 12;
		const tkw = (s*0.9)/kbCols, tkh = (s*0.15)/kbRows;
		for(let r = 0; r < kbRows; r++) {
			for(let c = 0; c < kbCols; c++) {
				const kx = s*0.05 + c*tkw + r*s*0.005;
				const ky = s*0.84 + r*tkh;
				ctx.fillRect(kx, ky, tkw*0.8, tkh*0.7);
				ctx.strokeRect(kx, ky, tkw*0.8, tkh*0.7);
			}
		}
	}
	else if (type.id === 'commodorecbm') {
		// Commodore CBM/PET 3001 series - monitor a trapezio!!!

		// CASE PRINCIPALE (corpo unico, base + monitor è un blocco solo visto da davanti)
		let caseGrad = ctx.createLinearGradient(0, s*0.42, 0, s);
		caseGrad.addColorStop(0, "#eed");
		caseGrad.addColorStop(1, "#ccb");
		ctx.fillStyle = caseGrad;
		ctx.strokeStyle = "#666";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.roundRect(s*0.05, s*0.42, s*0.90, s*0.42, s*0.02);
		ctx.fill();
		ctx.stroke();

		// MONITOR A TORRETTA (cornice nera sporgente in alto, leggermente trapezoidale)
		ctx.fillStyle = caseGrad;
		ctx.beginPath();
		ctx.moveTo(s*0.14, s*0.40);
		ctx.lineTo(s*0.20, s*0.02);
		ctx.lineTo(s*0.80, s*0.02);
		ctx.lineTo(s*0.86, s*0.40);
		ctx.closePath();
		ctx.fill();
		ctx.strokeStyle = "#666";
		ctx.lineWidth = s*0.01;
		ctx.stroke();
		
		// internamente era nero!
		ctx.fillStyle = '#333';
		ctx.beginPath();
		ctx.moveTo(s*0.16, s*0.38);
		ctx.lineTo(s*0.22, s*0.04);
		ctx.lineTo(s*0.78, s*0.04);
		ctx.lineTo(s*0.84, s*0.38);
		ctx.closePath();
		ctx.fill();
		ctx.strokeStyle = "#666";
		ctx.lineWidth = s*0.01;
		ctx.stroke();
		
		// Schermo CRT
		ctx.fillStyle = "#111";
		ctx.beginPath();
		ctx.roundRect(s*0.25, s*0.07, s*0.50, s*0.28, s*0.012);
		ctx.fill();
		
		if (connected) {
			ctx.fillStyle = "#0a2a10";
		} else {
			ctx.fillStyle = "#555048";
		}
		ctx.beginPath();
		ctx.roundRect(s*0.30, s*0.09, s*0.40, s*0.24, s*0.008);
		ctx.fill();

		if (connected) {
			// testo verde fosforo tipico PET
			ctx.fillStyle = "#3f3";
			ctx.font = `${s*0.026}px monospace`;
			ctx.textAlign = "left";
			ctx.textBaseline = "middle";
			ctx.fillText("*** COMMODORE BASIC ***", s*0.335, s*0.12);
			ctx.fillText("31743 BYTE FREE", s*0.335, s*0.15);
			ctx.fillText("READY.", s*0.335, s*0.18);

			if (Math.sin(flowOffset*0.6) > 0) {
				ctx.fillRect(s*0.335, s*0.2, s*0.015, s*0.02);
			}
		}
		
		
		// targhetta gigante "commodore" sotto il monitor
		ctx.fillStyle = "#222";
		ctx.beginPath();
		ctx.roundRect(s*0.08, s*0.435, s*0.84, s*0.10, s*0.005);
		ctx.fill();
		ctx.fillStyle = "#fff";
		ctx.font = `bold ${s*0.04}px monospace`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("C=commodore       CBM        computer", s*0.095, s*0.47);
		ctx.font = `${s*0.04}px monospace`;
		ctx.fillText("3001 series                  3008", s*0.095, s*0.51);
		
		// led on/off
		ctx.fillStyle = connected ? colors.greenOn : colors.greenOff;
		ctx.beginPath();
		ctx.arc(s*0.88, s*0.50, s*0.02, 0, Math.PI*2);
		ctx.fill();
		if (connected) drawLedAloneCircle(s*0.88, s*0.51, s*0.02, colors.greenOn);
		
		// riga divisoria
		ctx.fillStyle = '#aaa';
		ctx.fillRect(s*0.1, s*0.55, s*0.8, s*0.01);
		

		// TASTIERA principale (parte sinistra/centrale, leggermente in prospettiva)
		ctx.fillStyle = "#222";
		ctx.strokeStyle = "#444";
		ctx.lineWidth = s*0.01;
		
		const kbRows = 3;
		const kbCols = 10;
		const tkw = (s*0.6)/kbCols;
		const tkh = (s*0.15)/kbRows;
		for(let r = 0; r < kbRows; r++) {
			for(let c = 0; c < kbCols; c++) {
				const kx = s*0.10 + c*tkw;
				const ky = s*0.60 + r*tkh;
				ctx.fillRect(kx, ky, tkw*0.82, tkh*0.7);
				ctx.strokeRect(kx, ky, tkw*0.82, tkh*0.7);
			}
		}

		// SPAZIO (barra lunga in basso a sinistra, sotto la tastiera principale)
		ctx.fillRect(s*0.20, s*0.75, s*0.42, s*0.045);
		ctx.strokeRect(s*0.20, s*0.75, s*0.42, s*0.045);

		// KEYPAD NUMERICO (separato a destra, griglia 4x3)
		const padRows = 4;
		const padCols = 3;
		for(let r = 0; r < padRows; r++) {
			for(let c = 0; c < padCols; c++) {
				const perspective = r * s * 0.1;
				const kx = s*0.72 + c*tkw;
				const ky = s*0.60 + r*tkh;
				ctx.fillRect(kx, ky, tkw*0.8, tkh*0.75);
				ctx.strokeRect(kx, ky, tkw*0.8, tkh*0.75);
			}
		}
		
		//bordo chiaro
		ctx.fillStyle = "#ccb";
		ctx.strokeStyle = "#333";
		ctx.lineWidth = s * 0.01;
		ctx.beginPath();
		ctx.moveTo(s*0.05, s*0.84);
		ctx.lineTo(s*0.07, s*0.88);
		ctx.lineTo(s*0.93, s*0.88);
		ctx.lineTo(s*0.95, s*0.84);
		ctx.lineTo(s*0.05, s*0.84);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();
	}
	
	ctx.restore();
}


function drawLedAloneRect(x, y, w, h, color) {
	let ALFA = (FAKEBLUR_SIZE - 1) * 0.5;//x-w*0.5==>2fb, x-w*1  ==>3fb, x-w*1.5==>4fb, x-w*2  ==>6fb
    ctx.fillStyle = color + '1a'; // ~10% opacità
    ctx.fillRect(x - w*ALFA, y - h*ALFA, w * FAKEBLUR_SIZE, h * FAKEBLUR_SIZE);
	
	ctx.fillRect(x - w*0.25, y - h*0.25, w * 1.5, h * 1.5);//doppio passaggio
}

function drawLedAloneCircle(x, y, r, color, from = 0, to = Math.PI * 2, ellipseRY) {
    ctx.fillStyle = color + '1a'; // ~10% opacità
    ctx.beginPath();
    if(ellipseRY) ctx.ellipse(x, y, r * FAKEBLUR_SIZE, ellipseRY * FAKEBLUR_SIZE, 0, from, to);
	else ctx.arc(x, y, r * FAKEBLUR_SIZE, from, to);
    ctx.fill();
	
	ctx.beginPath();
    if(ellipseRY) ctx.ellipse(x, y, r * 1.5, ellipseRY * 1.5, 0, from, to);
	else ctx.arc(x, y, r * 1.5, from, to);//doppio passaggio
    ctx.fill();
}

function drawLedAloneLine(x1, y1, x2, y2, thickness, color) {
    ctx.strokeStyle = color + '1a';
    ctx.lineWidth = thickness * (FAKEBLUR_SIZE * 0.66);//1.6

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // secondo passaggio
    ctx.lineWidth = thickness * (FAKEBLUR_SIZE * 0.66) * 0.9;//1.4
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
	
	// terzo passaggio
    ctx.lineWidth = thickness * (FAKEBLUR_SIZE * 0.66) * 0.8;//1.2
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

const tooltip = document.getElementById('tooltip');
const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

canvas.addEventListener('pointermove', e => {
	let r = canvas.getBoundingClientRect();
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    // Calcoliamo la posizione sulla griglia
	let clientX = e.clientX || (e.touches && e.touches[0].clientX);
	let clientY = e.clientY || (e.touches && e.touches[0].clientY);
		
	let gx = Math.floor(((clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        const cell = grid[gy][gx];
        
		// Aggiorna contenuto
        tooltip.innerHTML = `<strong>${cell.type === 'server' ? 'Server' : cell.subType ? cell.subType.desc : 'Link'}</strong>`;
        
        // Posiziona la tooltip vicino al mouse
		tooltip.style.left = Math.max((clientX - CELL_SIZE * 0.25 * (isTouchDevice ? 2 : 1)),0) + 'px';
        tooltip.style.top = Math.max((clientY - CELL_SIZE * 0.5 * (isTouchDevice? 2 : 1)),0) + 'px';
        tooltip.style.display = 'block';
    } else {
        tooltip.style.display = 'none';
    }
});

// Nascondi la tooltip quando il mouse esce dal canvas
canvas.addEventListener('pointerleave', () => {
    tooltip.style.display = 'none';
});

// Cerca questa parte in fondo e sostituiscila:
canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); // Fondamentale per non far scattare altri eventi
    if (gameWon) return;
    
    let r = canvas.getBoundingClientRect();
    // Calcola la scala se la canvas è stata rimpicciolita dal CSS
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    let gx = Math.floor(((clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        grid[gy][gx].conns = e.button === 2 ? rotateBitmaskCCW(grid[gy][gx].conns) : rotateBitmask(grid[gy][gx].conns);
		
		//rotazione link
		grid[gy][gx].currentRotation = grid[gy][gx].rotation;
		grid[gy][gx].rotation = grid[gy][gx].rotation - (Math.PI * 0.5) * (e.button === 2 ? -1 : 1);
		
		updateConnectivity();
    }
}, { passive: false });

canvas.addEventListener("contextmenu", (event) => {
  event.preventDefault();
});

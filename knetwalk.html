function helpButtonClick() {
	// Trova tutte le celle sbagliate
    const wrongCells = [];
    grid.forEach(row => row.forEach(cell => {
        if (cell.conns !== cell.correct) {
            wrongCells.push(cell);
        }
    }));
	
	if (gameWon || !wrongCells.length) return;
    
    // Correggi una cella a caso tra quelle sbagliate
    const wrongConnected = wrongCells.filter(c => c.connected);
	const randomWrongConnected = wrongConnected[Math.floor(Math.random() * wrongConnected.length)];//una connessa sbagliata
	const randomWrongAll = wrongCells[Math.floor(Math.random() * wrongCells.length)];//una qualsiasi sbagliata
	
    const targetCell = wrongConnected.length > 0 ? randomWrongConnected : randomWrongAll;
	
    targetCell.conns = targetCell.correct;
    targetCell.rotation = 0;
    //targetCell.currentRotation = 0;
    
    updateConnectivity();
}

function calculateGridSizeRatio() {
	const aspectRatio = window.innerWidth / window.innerHeight;
	const MIN_SIZE = 3;
	const MAX_SIZE = 12;
	
	if (aspectRatio < 1) {
		// Portrait: 9:16 >>> 3 col, 5 righe
		WIDTH = MIN_SIZE;
		HEIGHT = Math.min(MAX_SIZE, Math.max(MIN_SIZE, Math.round(MIN_SIZE / aspectRatio)));
	} else {
		// Landschiappa: 20:9 >>> 6 col, 3 righe
		HEIGHT = MIN_SIZE;
		WIDTH = Math.min(MAX_SIZE, Math.max(MIN_SIZE, Math.round(MIN_SIZE * aspectRatio)));
	}
	document.getElementById('widthSlider').value = WIDTH;
	document.getElementById('heightSlider').value = HEIGHT;
}

function initGame() {
	// 1. Calcola lo spazio reale disponibile nello schermo (sia larghezza che altezza)
    const headerHeight = document.querySelector('.controls').offsetHeight;
    
    const paddingX = 40; // Margine di sicurezza laterale
    const paddingY = 60; // Margine di sicurezza verticale
    
    const availableWidth = window.innerWidth - paddingX;
    const availableHeight = window.innerHeight - headerHeight - paddingY;
    
    // 2. Determina i vincoli massimi applicando il tetto di CANVAS_MAX_SIZE
    const maxAllowedWidth = Math.max(32, Math.min(CANVAS_MAX_SIZE, availableWidth));
    const maxAllowedHeight = Math.max(32, Math.min(CANVAS_MAX_SIZE, availableHeight));
    
    // 3. Calcola la dimensione massima della cella per entrambe le direzioni
    const cellSizeByWidth = maxAllowedWidth / WIDTH;
    const cellSizeByHeight = maxAllowedHeight / HEIGHT;
    
    // Il CELL_SIZE definitivo sarà il minore dei due: garantisce la massima grandezza
    // senza mai far uscire la griglia dai bordi (né in orizzontale né in verticale)
    CELL_SIZE = Math.min(cellSizeByWidth, cellSizeByHeight);
    
    // 4. Assegna le dimensioni reali al canvas basandoti sul numero di celle
    canvas.width = WIDTH * CELL_SIZE;
    canvas.height = HEIGHT * CELL_SIZE;
    
    // DA QUI IN POI IL CODICE RIMANE INVARIATO
    grid = [];
    gameWon = false;
    statusDiv.innerText = '';
	statusDiv.style.display = 'none';
    
    for (let y = 0; y < HEIGHT; y++) {
        grid[y] = [];
        for (let x = 0; x < WIDTH; x++) {
            grid[y][x] = { x, y, conns: 0, type: 'cable', subType: '', connected: false, rotation:0, currentRotation:0 };//rotazione link
        }
    }

    generateNetwork();
    assignTypes();
	
	//salvo la soluzione CORRETTA prima dello shuffle... non si sa mai!
    grid.forEach(row => row.forEach(cell => {
        cell.correct = cell.conns;
    }));
	
    shuffleGrid();
    updateConnectivity();
	
	//solo per la modalita Motherboard
	generateMotherboardBackground();
	generateMotherboardDecorations();
}

//genera un labirinto perfetto in cui ogni cella è collegata al server e non esistono cicli (loop) o vicoli ciechi isolati
//0) Viene creata una griglia di tracciamento (visited) per sapere quali celle fanno già parte della rete (all'inizio sono tutte false).
//1) Viene scelta una posizione casuale server (serverPos) e viene segnata come visited = true.
//2) Viene chiamata la funzione addWalls sul server. Questa funzione prende i 4 vicini (Nord, Sud, Est, Ovest) e li inserisce in un elenco chiamato walls (che qui funge da "lista dei collegamenti possibili").
//3) Il Ciclo di Costruzione: Finché ci sono collegamenti disponibili nell'elenco walls:
//4) Ne viene estratto uno a caso (splice).
//5) Si controlla la cella di destinazione (wall.x2, wall.y2). Se è già stata visitata, il collegamento viene scartato per evitare di creare dei loop.
//6) Se non è visitata, il muro viene "abbattuto": viene creato un collegamento bidirezionale tra le due celle usando gli operatori bitwise (|=).
//7) La nuova cella viene segnata come visitata e i suoi vicini vengono aggiunti alla lista walls.
//8) Alla fine di questo ciclo, tutte le celle della griglia saranno collegate tra loro in un unico grande "albero" genealogico che ha come radice il server.

function generateNetwork() {
	let visited = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(false));//SIZE
    let walls = [];
    serverPos = { x: Math.floor(Math.random()*WIDTH), y: Math.floor(Math.random()*HEIGHT) };//SIZE
    visited[serverPos.y][serverPos.x] = true;
	addWalls(serverPos.x, serverPos.y, walls, visited);

    while (walls.length > 0) {
        let wall = walls.splice(Math.floor(Math.random()*walls.length), 1)[0];
        if (visited[wall.y2][wall.x2]) continue;
        grid[wall.y1][wall.x1].conns |= wall.dir1;
        grid[wall.y2][wall.x2].conns |= wall.dir2;
		visited[wall.y2][wall.x2] = true;
        addWalls(wall.x2, wall.y2, walls, visited);
    }
}

//aggiunge ai walls tutti i possibili collegamenti tra la cella (x,y) ed i suoi vicini non ancora visitati
//ogni oggetto in walls è un muro che può essere abbattuto:
//   x1,y1 = cella di partenza (già visitata)
//   x2,y2 = cella di destinazione (candidata)
//   dir1   = direzione uscente da (x1,y1) verso (x2,y2)
//   dir2   = direzione entrante in (x2,y2) da (x1,y1) — il bitmask opposto
//aggiunti controlli sui bordi (y>0, x<WIDTH-1, ...) per evitare di uscire dalla griglia
function addWalls(x, y, walls, visited) {
    if (y > 0) walls.push({x1:x, y1:y, x2:x, y2:y-1, dir1:N, dir2:S});//vicino nord
    if (y < HEIGHT-1) walls.push({x1:x, y1:y, x2:x, y2:y+1, dir1:S, dir2:N});//sud

}

function assignTypes() {
	shuffledTypes = [];
    grid.forEach((row, y) => row.forEach((cell, x) => {
        if (x === serverPos.x && y === serverPos.y) {
			cell.type = 'server';
			cell.subType = ((x + y) % 3 === 0 ? 'megaserver' :
							(x + y) % 3 === 1 ? 'hal9000' : 'server');
		} else {
            let count = [N, E, S, W].filter(d => cell.conns & d).length;
            if (count === 1) {
                cell.type = 'pc';
				//fix: genera il prossimo DIVERSO dall'attuale!
                cell.subType = getNextHwType();
            }
        }
    }));
}


//fix: genera il prossimo DIVERSO dall'attuale!
function getNextHwType() {
    // Se la lista è vuota, crea una nuova sequenza casuale
    if (shuffledTypes.length === 0) shuffledTypes = [...HW_TYPES].filter(e => currentGroup[currentGroupIndex] === 'all' || currentGroup[currentGroupIndex].includes(e.group)).sort(() => Math.random() - 0.5);

    // Estrae il prossimo tipo unico
	const piece = shuffledTypes.pop();
	return piece;
}


function shuffleGrid() {
    grid.forEach(row => row.forEach(cell => {
        let r = Math.floor(Math.random()*4);
        for(let i=0; i<r; i++) {
			cell.conns = rotateBitmask(cell.conns);
			//rotazione link
			cell.rotation = cell.rotation - Math.PI * 0.5;
			cell.currentRotation = cell.rotation;
		}
    }));
}

function rotateBitmask(m) {
    let n = 0;
    if (m & N) n |= E; 
	if (m & E) n |= S; 
	if (m & S) n |= W; 
	if (m & W) n |= N;
    return n;
}

function rotateBitmaskCCW(m) {
    let n = 0;
    if (m & N) n |= W; 
	if (m & W) n |= S;
	if (m & S) n |= E;
	if (m & E) n |= N;
    return n;
}

function updateConnectivity() {
    grid.forEach(row => row.forEach(c => c.connected = false));
    let q = [grid[serverPos.y][serverPos.x]];
    grid[serverPos.y][serverPos.x].connected = true;
    let head = 0;
    while(head < q.length) {
        let curr = q[head++];
        [[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]].forEach(d => {
            if (curr.conns & d[0]) {
                let nx = curr.x+d[1], ny = curr.y+d[2];
                if (nx>=0 && nx<WIDTH && ny>=0 && ny<HEIGHT) {//SIZE
                    let nb = grid[ny][nx];
                    if (!nb.connected && (nb.conns & d[3])) {
                        nb.connected = true;
                        q.push(nb);
                    }
                }
            }
        });
    }
	
    if (!gameWon && grid.every(r => r.every(c => c.connected))) {
	    gameWon = true;
        statusDiv.innerText = "SYSTEM ONLINE — NETWORK CONFIGURED!";
		statusDiv.style.display = 'block';
    }
	
	updateWaterFlow();//AGGIORNA IL FLUSSO D'ACQUA
}

/** RENDERING AVANZATO */
animate.lastTime = 0;
function animate(now) {
	//const now = performance.now();
    if (now - animate.lastTime >= (animateFlag ? 20 : 40)) { // 40ms = 25 fps al massimo
        flowOffset += (animateFlag ? 0.1 : 0.2);
		
		//rotazione link
		grid.forEach(row => row.forEach(cell => {
			if (cell.currentRotation !== cell.rotation) {
				//rotazione oraria non serve abs
				//rotazione antioraria serve, altrimenti sempre 0.1
				let step = Math.max(0.1, Math.abs(cell.currentRotation - cell.rotation)) / 4;//Math.PI * 0.2; 
				if (cell.currentRotation > cell.rotation) {
					cell.currentRotation -= step;
					if (cell.currentRotation < cell.rotation) cell.currentRotation = cell.rotation;
				} else {
					cell.currentRotation += step;
					if (cell.currentRotation > cell.rotation) cell.currentRotation = cell.rotation;
				}
			}
		}));
		
        draw();
        animate.lastTime = now;
    }
    requestAnimationFrame(animate);
}

let motherboardDecorations = []; // scritte e resistenze precalcolate
function generateMotherboardDecorations() { 
    // genera le scritte
    motherboardDecorations = [];
    const labels = ['KN','R0','R1','R2','C1','C2','U1','UX','R3','C3','R4','D1','Q1','L1','C5','SX','DX'];
    let idx = 0;
    for (let row = 0; row < HEIGHT; row++) {
        for (let col = 0; col < WIDTH; col++) {
            const angolo = idx % 4;
            const fx = angolo < 2 ? CELL_SIZE * 0.04 : CELL_SIZE * 0.65;
            const fy = angolo % 2 === 0 ? CELL_SIZE * 0.12 : CELL_SIZE * 0.95;
            motherboardDecorations.push({ type:'label', x: col*CELL_SIZE+fx, y: row*CELL_SIZE+fy, text: labels[idx % labels.length] });
            idx++;
        }
    }
    
    // genera le resistenze
    const resColors = ['#c8a','#fa8','#8af','#8fa','#ff8','#aaa'];
    const cs = CELL_SIZE;
    let ridx = 0;
    for (let row = 0; row < HEIGHT; row++) {
        for (let col = 0; col < WIDTH; col++) {
            if ((ridx + WIDTH + HEIGHT) % 5 !== 0) { ridx++; continue; }
            const angolo = ridx % 4;
            const horiz = ridx % 2 === 0;
            const fx = angolo < 2 ? cs * 0.05 : cs * 0.70;
            const fy = angolo % 2 === 0 ? cs * 0.88 : cs * 0.75;
            motherboardDecorations.push({ type:'res', x: col*cs+fx, y: row*cs+fy, horiz, c1: resColors[ridx % resColors.length], c2: resColors[(ridx+2) % resColors.length] });
            ridx++;
        }
    }
	
	//genera i buchi agli angoli per fissarla
	motherboardDecorations.push({ type:'buco', x:CELL_SIZE * 0.05, y:CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
	motherboardDecorations.push({ type:'buco', x:WIDTH * CELL_SIZE - CELL_SIZE * 0.05, y:CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
	motherboardDecorations.push({ type:'buco', x:WIDTH * CELL_SIZE - CELL_SIZE * 0.05, y:HEIGHT * CELL_SIZE - CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
	motherboardDecorations.push({ type:'buco', x:CELL_SIZE * 0.05, y:HEIGHT * CELL_SIZE - CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
}

function generateMotherboardBackground() {
	motherboardBackgroundLines = [];

	const occupied = [];

	function intersects(a, b) {
		return !(
			a.x + a.w < b.x ||
			b.x + b.w < a.x ||
			a.y + a.h < b.y ||
			b.y + b.h < a.y
		);
	}

	const groups = 10 + Math.floor(Math.random() * 8);

	for (let g = 0; g < groups; g++) {

		const vertical = Math.random() > 0.45;
		const count = 4 + Math.floor(Math.random() * 8);
		const spacing = CELL_SIZE * (0.02 + Math.random() * 0.015);
		const thickness = count * spacing;
		let placed = false;

		for (let attempt = 0; attempt < 100 && !placed; attempt++) {

			let startX, startY, length;

			if (vertical) {
				length = canvas.height * (0.25 + Math.random() * 0.55);
				startX = Math.random() * (canvas.width - thickness);
				startY = Math.random() * (canvas.height - length);
			} else {
				length = canvas.width * (0.25 + Math.random() * 0.55);
				startX = Math.random() * (canvas.width - length);
				startY = Math.random() * (canvas.height - thickness);
			}

			const bounds = vertical
				? {
					x: startX - 10,
					y: startY - 10,
					w: thickness + 20,
					h: length + 20
				}
				: {
					x: startX - 10,
					y: startY - 10,
					w: length + 20,
					h: thickness + 20
				};

			let collision = false;

			for (const o of occupied) {
				if (intersects(bounds, o)) {
					collision = true;
					break;
				}
			}

			if (collision) continue;

			occupied.push(bounds);

			const diagonal = Math.random() > 0.6;

			const diagonalOffset = CELL_SIZE * (0.08 + Math.random() * 0.12);

			motherboardBackgroundLines.push({
				vertical,
				count,
				spacing,
				startX,
				startY,
				length,
				diagonal,
				diagonalOffset
			});

			placed = true;
		}
	}
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
	
	//colora bg
	//ctx.fillStyle = motherboardFlag ? colors.motherBoardBackground : colors.tileBackground;
	//ctx.fillRect(0, 0, canvas.width, canvas.height);
	
	if (motherboardFlag === 1) {
		// piste fini bianche
		ctx.strokeStyle = "rgba(255,255,255,0.1)";
		ctx.lineWidth = CELL_SIZE * 0.01;
		ctx.lineCap = "round";

		for (const g of motherboardBackgroundLines) {
			for (let i = 0; i < g.count; i++) {
				const offset = i * g.spacing;
				ctx.beginPath();			
				if (g.vertical) {
					const x = g.startX + offset;
					ctx.moveTo(x, g.startY);
					if (g.diagonal) {
						const split = g.startY + g.length * 0.5;
						ctx.lineTo(x, split);
						ctx.lineTo( x + g.diagonalOffset, split + g.diagonalOffset );
						ctx.lineTo(	x + g.diagonalOffset, g.startY + g.length );
					} else {
						ctx.lineTo( x, g.startY + g.length - (i * CELL_SIZE * 0.02) );
					}

				} else {
					const y = g.startY + offset;
					ctx.moveTo(g.startX, y);
					if (g.diagonal) {
						const split = g.startX + g.length * 0.5;
						ctx.lineTo(split, y);
						ctx.lineTo( split + g.diagonalOffset, y + g.diagonalOffset );
						ctx.lineTo( g.startX + g.length, y + g.diagonalOffset );
					} else {
						ctx.lineTo( g.startX + g.length - (i * CELL_SIZE * 0.02), y );
					}
				}
				ctx.stroke();
			}
		}
		ctx.lineCap = "butt";
		
		// SCRITTE E RESISTENZE
		ctx.fillStyle = 'rgba(255,255,255,0.25)';
		ctx.font = `${CELL_SIZE * 0.05}px monospace`;
		ctx.textAlign = 'left';
		const cs = CELL_SIZE, rw = cs*0.1, rh = cs*0.05, wire = cs*0.07;
		const resColors = ['#c8a','#fa8','#8af','#8fa','#ff8','#aaa'];

		for (const d of motherboardDecorations) {
			if (d.type === 'buco') {
				ctx.fillStyle = '#000';
				ctx.beginPath();
				ctx.arc(d.x, d.y, d.rad, 0, Math.PI * 2);
				ctx.fill();
			}
			else if (d.type === 'label') {
				ctx.fillStyle = 'rgba(255,255,255,0.25)';
				ctx.fillText(d.text, d.x, d.y);
			} else {
				// piedini
				ctx.strokeStyle = colors.silver; ctx.lineWidth = cs*0.008;
				if (d.horiz) {
					ctx.beginPath(); ctx.moveTo(d.x-wire, d.y+rh*.5); ctx.lineTo(d.x, d.y+rh*.5); ctx.stroke();
					ctx.beginPath(); ctx.moveTo(d.x+rw, d.y+rh*.5); ctx.lineTo(d.x+rw+wire, d.y+rh*.5); ctx.stroke();
				} else {
					ctx.beginPath(); ctx.moveTo(d.x+rh*.5, d.y-wire); ctx.lineTo(d.x+rh*.5, d.y); ctx.stroke();
					ctx.beginPath(); ctx.moveTo(d.x+rh*.5, d.y+rw); ctx.lineTo(d.x+rh*.5, d.y+rw+wire); ctx.stroke();
				}
				ctx.fillStyle = '#c8b89a';
				d.horiz ? ctx.fillRect(d.x, d.y, rw, rh) : ctx.fillRect(d.x, d.y, rh, rw);
				ctx.fillStyle = d.c1;
				d.horiz ? ctx.fillRect(d.x+rw*.25, d.y, rw*.12, rh) : ctx.fillRect(d.x, d.y+rw*.25, rh, rw*.12);
				ctx.fillStyle = d.c2;
				d.horiz ? ctx.fillRect(d.x+rw*.50, d.y, rw*.12, rh) : ctx.fillRect(d.x, d.y+rw*.50, rh, rw*.12);
			}
		}
	}
	
	else {
		//griglia standard
		ctx.strokeStyle = colors.inactiveColor;
		ctx.lineWidth = CELL_SIZE * 0.01;
    
		for(let i=0; i<=WIDTH; i++) {
			ctx.beginPath(); ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); ctx.stroke();
		}
		for(let i=0; i<=HEIGHT; i++) {
			ctx.beginPath(); ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); ctx.stroke();
		}
	}
	
	grid.forEach(row => row.forEach(tile => drawTile(tile)));
}

function drawIcons(x, y, size, rows, cols, bwColor = null) {
	const icons = [
		{ name: 'phone',    color: bwColor ? bwColor : '#4af' },
		{ name: 'message',  color: bwColor ? bwColor : '#2f2' },
		{ name: 'camera',   color: bwColor ? bwColor : '#f4a' },
		{ name: 'mail',     color: bwColor ? bwColor : '#f84' },
		{ name: 'settings', color: bwColor ? bwColor : '#aaa' },
		{ name: 'calendar', color: bwColor ? bwColor : '#f44' },
		{ name: 'maps',     color: bwColor ? bwColor : '#4f4' },
		{ name: 'music',    color: bwColor ? bwColor : '#a4f' },
		{ name: 'photo',    color: bwColor ? bwColor : '#fa4' },
		{ name: 'browser',  color: bwColor ? bwColor : '#4af' },
		{ name: 'store',    color: bwColor ? bwColor : '#48f' },
		{ name: 'clock',    color: bwColor ? bwColor : '#4af' }
	];
	
	let iconIndex = 0;
	const spacing = size * 1.4;
	
	for (let r = 0; r < rows; r++) {
		for (let c = 0; c < cols; c++) {
			//if (iconIndex >= icons.length) return;
			
			const ix = x + (c * spacing);
			const iy = y + (r * spacing);
			const icon = icons[iconIndex % icons.length];
			
			ctx.save();
			ctx.translate(ix, iy);
			
			// Sfondo icona (quadrato arrotondato)
			ctx.fillStyle = icon.color;
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, size * 0.2);
			ctx.fill();
			
			// Ombra leggera
			ctx.fillStyle = 'rgba(0,0,0,0.2)';
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, size * 0.2);
			ctx.fill();
			
			// Disegno icona in base al tipo
			ctx.fillStyle = '#fff';
			ctx.strokeStyle = '#fff';
			ctx.lineWidth = size * 0.08;
			ctx.lineCap = 'round';
			ctx.lineJoin = 'round';
			
			const padding = size * 0.25;
			const inner = size - (padding * 2);
			
			switch(icon.name) {
				case 'phone':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner * 1.4, size * 0.15);
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(size*0.5, size - padding*1.2, size * 0.08, 0, Math.PI*2);
					ctx.fill();
					break;
				case 'message':
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.3);
					ctx.lineTo(size*0.5, padding + inner*0.6);
					ctx.lineTo(size - padding, padding + inner*0.3);
					ctx.stroke();
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.15);
					ctx.stroke();
					break;
				case 'camera':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.3, 0, Math.PI*2);
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.15, 0, Math.PI*2);
					ctx.fill();
					break;
				case 'mail':
					ctx.beginPath();
					ctx.moveTo(padding, padding);
					ctx.lineTo(size*0.5, padding + inner*0.4);
					ctx.lineTo(size - padding, padding);
					ctx.moveTo(padding, padding);
					ctx.lineTo(size - padding, padding + inner*0.8);
					ctx.lineTo(size - padding, padding);
					ctx.stroke();
					break;
				case 'settings':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.25, 0, Math.PI*2);
					ctx.stroke();
					for(let a = 0; a < Math.PI*2; a += Math.PI*0.33) {
						const r = inner*0.4;
						ctx.fillRect(size*0.5 + Math.cos(a)*r - size*0.04, size*0.5 + Math.sin(a)*r - size*0.04, size*0.08, size*0.08);
					}
					break;
				case 'calendar':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.1);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding + inner*0.2, padding + inner*0.25);
					ctx.lineTo(padding + inner*0.2, padding + inner*0.5);
					ctx.moveTo(padding + inner*0.8, padding + inner*0.25);
					ctx.lineTo(padding + inner*0.8, padding + inner*0.5);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.5);
					ctx.lineTo(size - padding, padding + inner*0.5);
					ctx.stroke();
					break;
				case 'maps':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5 - inner*0.1, inner*0.2, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(size*0.5 - inner*0.15, size*0.5 + inner*0.2);
					ctx.lineTo(size*0.5, size*0.5 - inner*0.15);
					ctx.lineTo(size*0.5 + inner*0.15, size*0.5 + inner*0.2);
					ctx.fill();
					break;
				case 'music':
					ctx.beginPath();
					ctx.arc(padding + inner*0.25, size*0.5, inner*0.25, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(padding + inner*0.5, padding);
					ctx.lineTo(padding + inner*0.5, size - padding);
					ctx.stroke();
					break;
				case 'photo':
					ctx.beginPath();
					ctx.arc(padding + inner*0.3, padding + inner*0.35, inner*0.15, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(padding, size - padding);
					ctx.lineTo(padding + inner*0.4, padding + inner*0.5);
					ctx.lineTo(size - padding, padding);
					ctx.stroke();
					break;
				case 'browser':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.1);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.25);
					ctx.lineTo(size - padding, padding + inner*0.25);
					ctx.stroke();
					break;
				case 'store':
					ctx.beginPath();
					ctx.moveTo(padding, size - padding);
					ctx.lineTo(padding + inner*0.25, padding);
					ctx.lineTo(padding + inner*0.75, padding);
					ctx.lineTo(size - padding, size - padding);
					ctx.closePath();
					ctx.stroke();
					break;
				case 'clock':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.3, 0, Math.PI*2);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(size*0.5, size*0.5);
					ctx.lineTo(size*0.5, padding + inner*0.15);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(size*0.5, size*0.5);
					ctx.lineTo(size*0.5 + inner*0.15, size*0.5);
					ctx.stroke();
					break;
			}
			
			ctx.restore();
			iconIndex++;
		}
	}
}

function drawTile(tile) {
	if(motherboardFlag === 1) drawTileMotherboard(tile);
	else if(motherboardFlag === 2) drawTileWATER(tile);
	else if(motherboardFlag === 3) drawTilePACMAN(tile);
	else drawTileOLD(tile);
}

//rotazione link
function manageCellRotation(x,y,tile){
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(tile.currentRotation);
}

function manageCellRotationEnd() {
	ctx.restore();
}


function drawTileMotherboard(tile) {
	let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE / 2;
	
	let hue = (flowOffset * 5 + 240) % 360; // CALCOLO DEL COLORE DINAMICO RIMOSSO - TODO!
    let dynamicColor = `hsl(${hue}, 100%, 50%)`;
	
	const cableColor = tile.connected ? // && tile.rotation === tile.currentRotation ?
		(colors.activeColor === '#000000' ? dynamicColor : colors.activeColor) : colors.inactiveColor;
	
	ctx.strokeStyle = cableColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";
		
	//rotazione link
	ctx.save(); 
    ctx.translate(x + mid, y + mid);
	let angle = tile.rotation - tile.currentRotation;
	ctx.rotate(angle);
    
    ctx.beginPath();
		
	if (tile.conns & N) { ctx.moveTo(0, 0); ctx.lineTo(0, -mid); }
    if (tile.conns & E) { ctx.moveTo(0, 0); ctx.lineTo(mid, 0); }
    if (tile.conns & S) { ctx.moveTo(0, 0); ctx.lineTo(0, mid); }
    if (tile.conns & W) { ctx.moveTo(0, 0); ctx.lineTo(-mid, 0); }
    
	ctx.stroke();
	
	//rotazione link
    ctx.restore();
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.05, 0, Math.PI*2);
	ctx.fillStyle = cableColor;
	ctx.fill();
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.02, 0, Math.PI*2);
	ctx.fillStyle = colors.motherBoardBackground;
	ctx.fill();
	
	// Disegna icone
    if(tile.type) drawMotherboardPC(x, y, tile);
}

function drawMotherboardPC(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
	
	const isRectangular = type.id && type.group === 'vintage';//i vintage sono rettangolari
	
	const baseSize = isRectangular && type.id.length % 2 === 0 ? 0.70 : //rettangolo grande
					 isRectangular && type.id.length % 2 === 1 ? 0.50 : //rettangolo piccolo

const FLOW_DIRS = [
    { bit: N, dx: 0, dy: -1, opposite: S },
    { bit: E, dx: 1, dy: 0, opposite: W },
    { bit: S, dx: 0, dy: 1, opposite: N },
    { bit: W, dx: -1, dy: 0, opposite: E },
];

function updateWaterFlow() {
    // reset
    for (let y = 0; y < HEIGHT; y++)
        for (let x = 0; x < WIDTH; x++)
            grid[y][x].parentDir = 0;

    const visited = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(false));
    const startTile = grid[serverPos.y][serverPos.x];
    visited[serverPos.y][serverPos.x] = true;
    const queue = [startTile];

    while (queue.length) {
        const current = queue.shift();

        FLOW_DIRS.forEach(d => {
            if (!(current.conns & d.bit)) return; // niente stub in quella direzione

            const nx = current.x + d.dx;
            const ny = current.y + d.dy;
            if (nx < 0 || ny < 0 || nx >= WIDTH || ny >= HEIGHT) return;
            if (visited[ny][nx]) return; // già raggiunta: ignora eventuali connessioni "extra"/anelli

            const neighbor = grid[ny][nx];
            if (!(neighbor.conns & d.opposite)) return; // lo stub del vicino non combacia

            neighbor.parentDir = d.opposite;
            visited[ny][nx] = true;
            queue.push(neighbor);
        });
    }
}


function drawTileWATER(tile) {
    let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE * 0.5;

    // Disegna cavi
    let hue = (flowOffset * 5 + 240) % 360;
    let dynamicColor = `hsl(${hue}, 100%, 50%)`;

    const cableColor = tile.connected ? // && tile.rotation === tile.currentRotation ?
        (colors.activeColor === '#000000' ? dynamicColor : colors.activeColor) : colors.inactiveColor;

    const pipeW = CELL_SIZE * 0.10;
    const shadowW = pipeW + CELL_SIZE * 0.02;
    const highlightW = pipeW * 0.20;

    ctx.lineCap = "butt";
    ctx.lineJoin = "round";

    const glow = tile.connected;

    ctx.save();
    ctx.translate(x + mid, y + mid);
    let angle = tile.rotation - tile.currentRotation;
    ctx.rotate(angle);

    // [dx, dy, perpX, perpY] - perpX/perpY = direzione dell'highlight (lato "lucido" del tubo)
    const dirs = [];
    if (tile.conns & N) dirs.push([0, -mid, 1, 0    , N]);//PROVENIENZA
    if (tile.conns & E) dirs.push([mid, 0, 0, 1		, E]);
    if (tile.conns & S) dirs.push([0, mid, 1, 0		, S]);
    if (tile.conns & W) dirs.push([-mid, 0, 0, 1	, W]);

    // 1. Ombra (dà profondità, resta sotto tutto)
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = shadowW;
    ctx.shadowBlur = 0;
    dirs.forEach(([tx, ty]) => {
        ctx.beginPath();
        ctx.moveTo(0, 1.5);
        ctx.lineTo(tx, ty + 1.5);
        ctx.stroke();
    });

    // 2. Corpo del tubo
    ctx.strokeStyle = cableColor;
    ctx.lineWidth = pipeW;
    if (glow) { ctx.shadowBlur = 16; ctx.shadowColor = cableColor; }
    else { ctx.shadowBlur = 0; }
    dirs.forEach(([tx, ty]) => {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(tx, ty);
        ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // 3. Riflesso lucido (solo se connesso, dà l'effetto "gomma/plastica")
    if (1 || tile.connected) {
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = highlightW;
        const off = pipeW * 0.18;
        dirs.forEach(([tx, ty, px, py]) => {
            ctx.beginPath();
            ctx.moveTo(-px * off, -py * off);
            ctx.lineTo(tx - px * off, ty - py * off);
            ctx.stroke();
        });
    }

    // Giunto centrale: pallina "gommosa" invece del puntino piatto originale
    ctx.beginPath();
    ctx.arc(0, 0, pipeW * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = cableColor;
    ctx.fill();
	
	//riflesso fisso figo
    if (0 && tile.connected) {
        ctx.beginPath();
        ctx.arc(-pipeW * 0.12, -pipeW * 0.12, pipeW * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();
    }
	
	// flusso acqua lento fighissimo DIREZIONALE in base a parentDir settata da updateWaterFlow()
    if (tile.connected) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';// azzurro chiaro traslucido
        ctx.lineWidth = pipeW * 0.5;
        ctx.lineCap = 'round';//gocce rotonde
        ctx.setLineDash([pipeW * 0.2, pipeW * 1.2]);
		
        dirs.forEach(([tx, ty, px, py, bit]) => {
            // se questo stub è quello da cui arriva l'acqua (parentDir), il flusso
            // visivo deve andare dal bordo VERSO il centro >>> segno opposto rispetto
            // a uno stub "figlio" (che ridistribuisce l'acqua verso l'esterno)
            const isParent = bit === tile.parentDir;
            const flowSign = isParent ? 1 : -1;

            ctx.lineDashOffset = flowSign * flowOffset * 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(tx, ty);
            ctx.stroke();
        });

        ctx.setLineDash([]);
        ctx.restore();
    }

    ctx.restore();
    ctx.shadowBlur = 0;

    if(tile.type) drawPCWATER(x, y, tile);
}



function drawTilePACMAN(tile) {
    let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE * 0.5;

	let hue = (flowOffset * 5 + 240) % 360;
    let dynamicColor = `hsl(${hue}, 100%, 50%)`;

	const cableColor = tile.connected ? // && tile.rotation === tile.currentRotation ?
		(colors.activeColor === '#000000' ? dynamicColor : colors.activeColor) : colors.inactiveColor;

    ctx.strokeStyle = cableColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";

	
	//rotazione link
	ctx.save();
    ctx.translate(x + mid, y + mid);
	let angle = tile.rotation - tile.currentRotation;
	ctx.rotate(angle);
	
	if(tile.connected) {
        ctx.shadowBlur = 20;
		ctx.shadowColor = cableColor;
    } else {
        ctx.shadowBlur = 0;
    }
	
	//fix round / butt con una palla al centro della tile
	ctx.fillStyle = cableColor;
	ctx.beginPath();
	ctx.arc(0, 0, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fill();
	

    ctx.beginPath();
	if (tile.conns & N) { ctx.moveTo(0, 0); ctx.lineTo(0, -mid); }
    if (tile.conns & E) { ctx.moveTo(0, 0); ctx.lineTo(mid, 0);  }
    if (tile.conns & S) { ctx.moveTo(0, 0); ctx.lineTo(0, mid);  }
    if (tile.conns & W) { ctx.moveTo(0, 0); ctx.lineTo(-mid, 0); }
	ctx.stroke();
	
	ctx.shadowBlur = 0;
	
	//pallini stile "biscottini" pacman a meta di ogni cavo connesso
	if (tile.connected) {
		let cs = CELL_SIZE*0.035;
		let csh = cs * 0.5;
		ctx.fillStyle = '#ffee55';
		[[N,0,-mid],[E,mid,0],[S,0,mid],[W,-mid,0]].forEach(([bit,dx,dy]) => {
			if (tile.conns & bit) {
				ctx.fillRect(dx*0.20-csh, dy*0.20-csh, cs, cs);
				ctx.fillRect(dx*0.55-csh, dy*0.55-csh, cs, cs);
				ctx.fillRect(dx*0.85-csh, dy*0.85-csh, cs, cs);
			}
		});
	}
	
	ctx.restore();
    

    if(tile.type) drawPCPACMAN(x, y, tile);
}



//ad uso e consumo dei pezzi del tetris
function drawTetromino(shape, color, ox, oy, rot, border, borderWidth, cell, cellh, cellsize){
	ctx.save();
	ctx.translate(ox, oy);
	if (rot) ctx.rotate(rot);
	ctx.fillStyle = color;
	ctx.strokeStyle = border;
	ctx.lineWidth = borderWidth;
	shape.forEach(([dx,dy]) => {
		ctx.fillRect(dx*cell - cellh, dy*cell - cellh, cellsize, cellsize);
		ctx.strokeRect(dx*cell - cellh, dy*cell - cellh, cellsize, cellsize);
	});
	ctx.restore();
}

function drawPCPACMAN(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
	const s = CELL_SIZE * (	isServer ? 0.8 :
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.5)*0.05) + 0.65 :
							0.6 );
	const p = (CELL_SIZE - s) * 0.5;

	ctx.save();
	ctx.translate(x + p, y + p);

	if (isServer) {
		// TERRA (mappamondo) al posto del server
		let earthGrad = ctx.createRadialGradient(s*0.35, s*0.35, s*0.05, s*0.5, s*0.5, s*0.55);
		earthGrad.addColorStop(0.0, '#0044cc');//'#4ab0f0');
		earthGrad.addColorStop(1.0, '#001188');//'#0d5aa8');
		ctx.fillStyle = earthGrad;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.5, 0, Math.PI*2);
		ctx.fill();
		
		//continenti a tetramini colorati (6 pezzi tetris, no bezier: solo fillRect)
		ctx.save();
		ctx.translate(s*0.5, s*0.5);
		ctx.rotate(flowOffset * 0.01);

		const cell = s*0.09;
		const cellh = cell*0.5;
		const cellsize = cell*0.94;
		const borderWidth = s*0.02;
		
		drawTetromino(tetrisI.shape, tetrisI.col, -s*0.30, -s*0.25,  0.3, tetrisI.bor, borderWidth, cell, cellh, cellsize);
		drawTetromino(tetrisJ.shape, tetrisJ.col,  s*0.05,  s*0.25, -1.2, tetrisJ.bor, borderWidth, cell, cellh, cellsize);
		drawTetromino(tetrisL.shape, tetrisL.col, -s*0.05,  s*0.15,  1.2, tetrisL.bor, borderWidth, cell, cellh, cellsize);
		drawTetromino(tetrisO.shape, tetrisO.col,  s*0.10, -s*0.35,  0.0, tetrisO.bor, borderWidth, cell, cellh, cellsize);
		drawTetromino(tetrisS.shape, tetrisS.col, -s*0.24, -s*0.12,  0.6, tetrisS.bor, borderWidth, cell, cellh, cellsize);
		drawTetromino(tetrisT.shape, tetrisT.col,  s*0.25, -s*0.08, -3.4, tetrisT.bor, borderWidth, cell, cellh, cellsize);
		drawTetromino(tetrisZ.shape, tetrisZ.col,  s*0.20,  s*0.08, -0.2, tetrisZ.bor, borderWidth, cell, cellh, cellsize);
		
		ctx.restore();
		
		//riflesso lucido
		ctx.fillStyle = 'rgba(255,255,255,0.1)';
		ctx.beginPath();
		ctx.ellipse(s*0.32, s*0.27, s*0.18, s*0.15, 0, 0, Math.PI*2);
		ctx.fill();
		
		drawLedAloneCircle(s*0.5, s*0.5, s*0.22, '#44bbff');
		drawLedAloneCircle(s*0.5, s*0.5, s*0.24, '#44bbff');
		
	} else if (type.id) {
		//sceglie il personaggio in base al nome del device (deterministico, no random per tile)
		const charType = type.n % 25;// 2 pacman, 9 fantasmi, 8 invaders, 2 qbert, 2 snake, 1 asteroid, 1 lander

		//todo: add asteroids + mario + luigi
		if (charType === 0 || charType === 1) {
			// PAC-MAN — apre/chiude la bocca sempre quando connesso
			const mouthAngle = !connected ? 0.05 : 0.2 * Math.abs ( charType === 1 ? Math.sin(flowOffset*0.5) : Math.cos(flowOffset*0.5) );
			ctx.fillStyle = !connected ? '#666' : (charType === 1 ? '#f50' : '#ff0');//grigione : mrs/mr pacman
			ctx.strokeStyle = '#00000022';
			ctx.lineWidth = s*0.02;
			ctx.beginPath();
			ctx.arc(s*0.5, s*0.5, s*0.45, mouthAngle*Math.PI, (2-mouthAngle)*Math.PI);
			ctx.lineTo(s*0.5, s*0.5);
			ctx.closePath();
			ctx.fill();
			ctx.stroke();
			//occhio
			ctx.fillStyle = '#111';
			ctx.beginPath();
			ctx.arc(s*0.5, s*0.2, s*0.05, 0, Math.PI*2);
			ctx.fill();
		} else if (charType >= 2 && charType < 11) {
			// FANTASMA classico == cupola + bordo inferiore a onda sinusoidale
			const ghostColors = ['#ff0000','#00ccff','#ff8800','#ffbbdd', '#0000ff', '#ff00ff', '#ffff00', '#00ff00', '#eeeeee'];//red,ciano,arancio,rosa,blu,viola,giallo,verde,bianco
			const gc = connected ? ghostColors[(type.n * 7) % ghostColors.length] : '#666';
			const gcx = s*0.5;
			const r = s*0.38;
			const domeY = s*0.42;
			const midY = s*0.82;     // linea centrale dell'onda
			const amp = s*0.06;      // ampiezza dell'onda
			const numBumps = 4;      // numero di "piedini" (deve essere intero)
			const steps = 40;		 // definizione alta -> la modalità arcade ha poche robe rispetto alle altre modalità

			ctx.strokeStyle = '#00000022';
			ctx.lineWidth = s*0.02;
			ctx.fillStyle = gc;
			ctx.beginPath();
			ctx.arc(gcx, domeY, r, Math.PI, 0, false); // cupola, arriva a (gcx+r, domeY)

			// scende lungo il fianco destro fino al punto BASSO dell'onda
			ctx.lineTo(gcx + r, midY + amp);

			// onda sinusoidale: parte e finisce nel punto basso
			for (let i = 0; i <= steps; i++) {
				const t = i / steps;
				const x = (gcx + r) - t * (2*r);
				const y = midY + amp * Math.cos(t * numBumps * Math.PI * 2); // segno + invece di -
				ctx.lineTo(x, y);
			}

			ctx.lineTo(gcx - r, domeY); // risale lungo il fianco sinistro
			ctx.closePath();
			ctx.fill();
			ctx.stroke();

			// occhi ovali bianchi + pupille colorate
			[s*0.35, s*0.65].forEach(ex => {
				ctx.fillStyle = '#ffffff';
				ctx.beginPath();
				ctx.ellipse(ex, s*0.42, s*0.1, s*0.12, 0, 0, Math.PI*2);
				ctx.fill();
				ctx.stroke();
				ctx.fillStyle = '#1155aa';
				const pupilOffset = connected ? (charType % 2 ? Math.sin(flowOffset*0.75) : Math.cos(flowOffset*0.75)) * s * 0.04 : 0;
				ctx.beginPath();
				ctx.arc(ex + pupilOffset, s*0.44, s*0.055, 0, Math.PI*2);
				ctx.fill();
			});
		} else if (charType >= 11 && charType < 19) {
			// SPACE INVADERS — 5 alieni diversi, pixel grid, no bezier
			const shape = connected && Math.sin(flowOffset*0.5) > 0 ? invGridsY[charType%5] : invGridsX[charType%5];
			const cols = shape[0].length;
			const rows = shape.length;
			const px = s / cols;
			const gridH = rows * px;
			const offY = (s - gridH) * 0.5;
			
			const invColors = ['#ff0000','#00ccff','#ff8800', '#0000ff', '#ff00ff', '#ffff00', '#00ff00', '#eeeeee'];//red,ciano,arancio,blu,viola,giallo,verde,bianco
			ctx.fillStyle = connected ? invColors[(type.n * 7) % invColors.length] : '#666';
			for (let ry=0; ry<rows; ry++) {
				for (let rx=0; rx<cols; rx++) {
					if (shape[ry][rx] === '1') {
						ctx.fillRect(rx*px, offY + ry*px, px*1.05, px*1.05);
					}
				}
			}
		}
		else if (charType === 19 || charType === 20) {
			// Q*BERT == corpo sferico arancione + occhi grandi + gambe corte
			const gc = connected ? (charType % 2 ? '#f80' : '#f0f') : '#666';
			const gcx = s * 0.5;
			const bodyY = s * 0.45;
			const bodyR = s * 0.40;
			const gcDark = connected ? (charType % 2 ? '#f08000' : '#e000e0') : '#606060';
			
			// 2 gambe corte rettangolari con ellisse = piede
			const legWidth = s * 0.06;
			const legHeight = s * 0.25;
			const legGap = s * 0.15;
			const legBaseY = bodyY + bodyR * 0.75;
			
			ctx.fillStyle = gcDark;
			[-1, 1].forEach(side => {
				const baseX = gcx + side * legGap;
				// gamba superiore
				ctx.fillRect(baseX - legWidth * 0.5, legBaseY, legWidth, legHeight);
				// piede
				ctx.beginPath();
				ctx.ellipse(baseX + side * s * 0.075, legBaseY + legHeight, s * 0.15, s*0.05, side * 0.5, 0, Math.PI * 2);
				ctx.fill();
			});
			
			// corpo principale (sfera)
			ctx.fillStyle = gc;
			ctx.beginPath();
			ctx.ellipse(gcx, bodyY, bodyR*0.9, bodyR, 0, 0, Math.PI * 2);
			ctx.fill();
			ctx.strokeStyle = gcDark;
			ctx.lineWidth = s * 0.02;
			ctx.stroke();
			
			// occhi grandi bianchi
			[s * 0.38, s * 0.62].forEach(ex => {
				ctx.fillStyle = '#fff';
				ctx.beginPath();
				ctx.ellipse(ex, s * 0.38, s*0.1, s * 0.14, 0, 0, Math.PI * 2);
				ctx.fill();
				ctx.stroke();
				
				// pupille colorate (nere, con movimento)
				ctx.fillStyle = '#111';
				const pupilOffset = connected ? (type.id.length % 2 ? Math.sin(flowOffset * 0.75) : Math.cos(flowOffset * 0.75)) * s * 0.04 : 0;
				ctx.beginPath();
				ctx.arc(ex + pupilOffset, s * 0.40, s * 0.06, 0, Math.PI * 2);
				ctx.fill();
			});
			
			// naso a proboscide
			ctx.fillStyle = gc;
			ctx.strokeStyle = gcDark;
			
			for(let i=0;i<5;i++) {
				ctx.beginPath();
				ctx.arc(gcx - s*i*0.02, s * 0.60 + s*i*i*0.01, s * 0.1 + s*i*0.01, 0, Math.PI * 2);
				ctx.fill();
				ctx.stroke();
			}
			ctx.fillStyle = '#00000022';
			ctx.beginPath();
			ctx.arc(gcx - s*4*0.02, s * 0.62 + s*4*4*0.01, s * 0.08, 0, Math.PI * 2);
			ctx.fill();
		} else if(charType === 21 || charType === 22) {
			// SERPENTE (Snake) == testa sferica + occhi grandi + lingua rossa
			const cx = s*0.5;
			const cy = s*0.5;
			//testa
			ctx.fillStyle = connected ? (charType % 2 ? '#0f6' : '#f06') : '#666';
			ctx.beginPath();
			ctx.arc(cx, cy, s*0.4, 0, Math.PI * 2);
			ctx.fill();
		  
			//occhi
			const eyeOffset = s * 0.35;
			const eyeSize = s * 0.25;
			let ex1, ey1;
			let ex2, ey2;
			ex1 = cx - eyeOffset * 0.5;
			ey1 = cy - eyeOffset;
			ex2 = cx + eyeOffset * 0.5;
			ey2 = cy - eyeOffset;
			
			//occhio sx
			ctx.fillStyle = '#fff';
			ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2); ctx.fill();
			
			//pupille sx
			ctx.strokeStyle = '#000';
			ctx.lineCap = "round"; // bordi arrotondati
			ctx.lineWidth = eyeSize * 0.3; // spessore = diametro della pupilla
			ctx.beginPath();
			ctx.moveTo(ex1, ey1 - eyeSize / 3);
			ctx.lineTo(ex1, ey1 + eyeSize / 3);
			ctx.stroke();
			
			//palpebra sx
			let senoSx = connected ? Math.sin(flowOffset*0.3) : 0;
			let deltaSx = Math.abs(senoSx * 0.5);
			let deltaDownSx = Math.max(0.75, Math.abs(senoSx * 1.5));
			//sx sopra
			ctx.fillStyle = connected ? (charType % 2 ? '#0c4' : '#c04') : '#888';
			ctx.beginPath();
			ctx.arc(ex1, ey1, eyeSize, Math.PI+deltaSx, Math.PI*2-deltaSx);
			ctx.fill();
			//sx sotto
			ctx.beginPath();
			ctx.arc(ex1, ey1, eyeSize, deltaDownSx, Math.PI-deltaDownSx);
			ctx.fill();
			
			
			
			//occhio dx
			ctx.fillStyle = '#fff';
			ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2); ctx.fill();
			
			//pupille dx
			ctx.strokeStyle = '#000';
			ctx.lineCap = "round"; // bordi arrotondati
			ctx.lineWidth = eyeSize * 0.3; // spessore = diametro della pupilla
			ctx.beginPath();
			ctx.moveTo(ex2, ey2 - eyeSize / 3);
			ctx.lineTo(ex2, ey2 + eyeSize / 3);
			ctx.stroke();
			
			//palpebra dx
			let senoDx = connected ? Math.sin(flowOffset*0.29) : 0;
			let deltaDx = Math.abs(senoDx * 0.5);
			let deltaDownDx = Math.max(0.75, Math.abs(senoDx * 1.5));
			//dx sopra
			ctx.fillStyle = connected ? (charType % 2 ? '#0c4' : '#c04') : '#888';
			ctx.beginPath();
			ctx.arc(ex2, ey2, eyeSize, Math.PI+deltaDx, Math.PI*2-deltaDx);
			ctx.fill();
			//dx sotto
			ctx.beginPath();
			ctx.arc(ex2, ey2, eyeSize, deltaDownDx, Math.PI-deltaDownDx);
			ctx.fill();
			
			
			//linguetta biforcuta + narici
			let modulo = connected ? (flowOffset|0) % 3 : 2;
			let divisore = (modulo === 0 ? 24 : modulo === 1 ? 8 : 48)
			const tongueLength =  s / divisore;
			const noseWidth = s  * 0.1;
			const noseHeight = s * 0.06;
			
			ctx.strokeStyle = connected ? '#ff0000' : '#999999';
			ctx.lineWidth = s*0.04;
			ctx.beginPath();
			
			ctx.moveTo(cx, cy + s * 0.42);
			ctx.lineTo(cx, cy + tongueLength + s * 0.5);
			ctx.lineTo(cx - s * 0.06, cy + tongueLength + s * 0.55);
			ctx.moveTo(cx, cy + tongueLength + s * 0.5);
			ctx.lineTo(cx + s * 0.06, cy + tongueLength + s * 0.55);
			ctx.stroke();
			
			//naso
			ctx.fillRect(ex1 - noseWidth * 0.5, ey1 + eyeSize * 2 - tongueLength * 0.1, noseWidth, noseHeight);
			ctx.fillRect(ex2 - noseWidth * 0.5, ey2 + eyeSize * 2 - tongueLength * 0.1, noseWidth, noseHeight);
		} else if (charType === 23) {
			//asteroids!!!
			ctx.fillStyle = connected ? '#eee' : '#666';
			ctx.strokeStyle = connected ? '#eee' : '#666';
			
			ctx.save();
			ctx.translate(s*0.5,s*0.5);
			if(connected) {
				ctx.rotate(5 + Math.sin(flowOffset * 0.02) * flowOffset * 0.02);
			}
			
			ctx.beginPath();
			ctx.moveTo(s*0.35, s*0.0);    //punta
			ctx.lineTo(-s*0.3, -s*0.2);   //sinistra
			ctx.lineTo(-s*0.2, s*0.0);    //rientranza
			ctx.lineTo(-s*0.3, s*0.2);    //destra
			ctx.closePath();
			ctx.strokeStyle = connected ? '#999' : '#444';
			ctx.lineWidth = s*0.02;
			
			const grad = ctx.createLinearGradient(0, -s*0.20, 0, s*0.20);
			grad.addColorStop(0, connected ? '#fff' : '#666');
			grad.addColorStop(0.55, connected ? '#aaa' : '#666');
			grad.addColorStop(1, connected ? '#aaa' : '#666');
			ctx.fillStyle = grad;
			ctx.fill(); 
			
			if (connected) {
				const dist = (flowOffset * s * 0.3) % (s*0.65);
				ctx.fillStyle = '#ff0000';
				ctx.fillRect(s*0.35+dist,-s*0.015,s*0.05,s*0.03);
			}
			
			ctx.stroke();
			ctx.restore();
		} else if (charType === 24) {
			//lunar lander		
			ctx.save();
			ctx.translate(s * 0.5, s * 0.5);
			if(connected) {
				ctx.rotate((Math.sin(flowOffset * 0.1) * 0.9));
			}
			ctx.lineWidth = s * 0.02;
			ctx.strokeStyle = '#666';
			
			const radius = s * 0.28;
			const sides = 6;
			const startAngle = 2.4;
			const endAngle = 7.0;
			const step = (7.0 - 2.4) / sides;
			ctx.beginPath();
			for (i = 0; i <= sides; i++) {
				let angle = startAngle + i * step;
				const x = Math.cos(angle) * radius;
				const y = Math.sin(angle) * radius - s * 0.2;
				if (angle === startAngle) ctx.moveTo(x, y);
				else ctx.lineTo(x, y);
			}
			ctx.closePath();
		
			const ballGradient = ctx.createRadialGradient(
				s*0.1, s*0.2, s*0.3,
				s*0.2, s*0.4, s*1);
			ballGradient.addColorStop(0.0, connected ? '#ddd' : '#666');
			ballGradient.addColorStop(1.0, '#000');
			ctx.fillStyle = ballGradient;
			ctx.fill();
			ctx.stroke();
			
			//rettangolo
			ctx.fillStyle = '#222';
			ctx.fillRect(-s* 0.22, 0, s* 0.44, s * 0.20);

			//rettangolo centrale chiaro
			ctx.fillStyle = connected ? '#ddd' : '#666';
			ctx.fillRect(-s * 0.05, 0, s * 0.10, s * 0.14);
			
			ctx.beginPath();
			ctx.strokeStyle = connected ? '#ddd' : '#666';
			ctx.strokeRect(-s * 0.22, 0, s * 0.44, s * 0.20);
			ctx.beginPath();
			ctx.moveTo(-s * 0.22, s * 0.14); //---- orizz sx
			ctx.lineTo(-s * 0.05, s * 0.14);
			ctx.stroke();
			ctx.beginPath();
			ctx.moveTo(s * 0.22, s * 0.14); //---- orizz dx
			ctx.lineTo(s * 0.05, s * 0.14);
			ctx.stroke();
			
			if (connected) drawUSFlag(-s * 0.20, s * 0.04, s * 0.14, 1);
			else ctx.fillRect(-s * 0.20, s * 0.04, s * 0.14, s*0.07);
			
			//righe verticali
			ctx.beginPath();
			ctx.moveTo(-s * 0.05, 0); //--|---|-- a sx
			ctx.lineTo(-s * 0.05, s * 0.14);
			ctx.stroke();
			ctx.beginPath();
			ctx.moveTo(s * 0.05, 0); //--|---|-- a dx
			ctx.lineTo(s * 0.05, s * 0.14);
			ctx.stroke();

			//zampette atterraggio
			drawZampetta(s, s, connected ? '#f80' : '#666', -1);//sx
			drawZampetta(s, s, connected ? '#f80' : '#666', 1);//dx

			//FIAMMONE CLAMOROSO
			if (connected) drawClamorousFlame(s, s);

			//aggiunta terza gamba davanti al fiammone
			drawZampaCentrale(s, s, connected ? '#f80' : '#666', 1);//cx
			
			ctx.restore();			
		}
	}

	ctx.restore();
}


//zampetta uhauhauha
	function drawZampetta(w, h, col, k) {
		//gamba
		ctx.strokeStyle = col;
		ctx.beginPath();
		ctx.moveTo(k * w * 0.22, 0); //attacco alto
		ctx.lineTo(k * w * 0.33, h * 0.05); //alto
		ctx.lineTo(k * w * 0.45, h * 0.47); //centro piede
		ctx.lineTo(k * w * 0.39, h * 0.3); //medio
		ctx.lineTo(k * w * 0.23, h * 0.2); //attacco interno
		ctx.lineTo(k * w * 0.33, h * 0.05); //alto
		ctx.closePath();
		ctx.stroke();
		//piede
		ctx.beginPath();
		ctx.fillStyle = col;
		ctx.fillRect(k * w * 0.5, h * 0.5, -k * w * 0.10, -h * 0.02);
		ctx.strokeRect(k * w * 0.5, h * 0.5, -k * w * 0.10, -h * 0.02);
	}

	//zampetta centrale (rocco approved!)
	function drawZampaCentrale(w, h, col, k) {
		ctx.beginPath();
		ctx.strokeStyle = col;
		ctx.moveTo(k * w * 0.08, h * 0.20);
		ctx.lineTo(0, h * 0.3);
		ctx.lineTo(0, h * 0.47);
		ctx.lineTo(0, h * 0.3);
		ctx.lineTo(-k * w * 0.08, h * 0.20);
		ctx.stroke();

		ctx.beginPath();
		ctx.moveTo(k * w * 0.08, h * 0.20);
		ctx.lineTo(0, h * 0.05); //centro
		ctx.lineTo(-k * w * 0.08, h * 0.20);
		ctx.lineTo(0, h * 0.05);
		ctx.lineTo(0, h * 0.47);
		ctx.stroke();

		//piede cx
		ctx.beginPath();
		ctx.strokeStyle = col;
		ctx.fillStyle = col;
		ctx.fillRect(k * w * 0.05, h * 0.5, -k * w * 0.1, -h * 0.02);
		ctx.strokeRect(k * w * 0.05, h * 0.5, -k * w * 0.1, -h * 0.02);
	}

	//god bless america!
	function drawUSFlag(x, y, fw, dir) {
		const fh = fw * 0.5; //rapporto 1/2

		//sfondo bianco
		ctx.fillStyle = '#fff';
		ctx.fillRect(x, y, fw * dir, fh);

		//strisce rosse
		ctx.fillStyle = '#f00';
		const stripeH = fh / 5;
		for (let i = 0; i < 5; i += 2) {
			ctx.fillRect(x, y + i * stripeH, fw * dir, stripeH);
		}

		//canton blu
		const cantonW = fw * 0.4 * dir;
		const cantonH = stripeH * 2;
		ctx.fillStyle = '#008';
		ctx.fillRect(x, y, cantonW, cantonH);

		//stelline
		ctx.fillStyle = '#fff';
		const starRows = 2;
		const starCols = 2;

		for (let r = 0; r < starRows; r++) {
			for (let c = 0; c < starCols; c++) {
				const sx = x + cantonW * (0.1 + c / starCols);
				const sy = y + cantonH * (0.15 + r / starRows);
				ctx.beginPath();
				ctx.fillRect(sx, sy, fw * 0.05, fw * 0.05);
				ctx.fill();
			}
		}
	}
	function drawClamorousFlame(w, h) {
			const flameLen = h * ((Math.abs(Math.sin(flowOffset * 0.05) * flowOffset * 0.02))%1); //fiamma alta
			const flameW = w * 0.18;

			const grad = ctx.createRadialGradient(0, h * 0.15, 2, //x0, y0, r0
					0, h * 0.25, flameLen); //x1, y1, r1
				grad.addColorStop(0, 'rgba(255,255,255,0.8)');
				grad.addColorStop(0.25, 'rgba(255,255,255,0.8)');//nucleo bianco
				grad.addColorStop(0.35, 'rgba(255,200,50,0.8)');
				grad.addColorStop(0.45, 'rgba(255,0,0,0.8)');
				grad.addColorStop(1, 'rgba(255,0,0,0)');
			
			ctx.fillStyle = grad;
			ctx.beginPath();
			ctx.moveTo(-flameW, h * 0.2);
			ctx.lineTo(0, h * 0.2 + flameLen);
			ctx.lineTo(flameW, h * 0.2);
			ctx.closePath();
			ctx.fill();
	}




function drawTileOLD(tile) {
    let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE * 0.5;
	
	// Disegna cavi
	let hue = (flowOffset * 5 + 240) % 360; // CALCOLO DEL COLORE DINAMICO RIMOSSO - TODO!
    let dynamicColor = `hsl(${hue}, 100%, 50%)`;
	
	const cableColor = tile.connected ? // && tile.rotation === tile.currentRotation ?
		(colors.activeColor === '#000000' ? dynamicColor : colors.activeColor) : colors.inactiveColor;
		
    ctx.strokeStyle = cableColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";//"round";
    
	//rotazione link
	ctx.save(); 
    ctx.translate(x + mid, y + mid);
	let angle = tile.rotation - tile.currentRotation;
	ctx.rotate(angle);
	
	// Effetto bagliore se connesso
    if(tile.connected) {
        ctx.shadowBlur = 20;
		ctx.shadowColor = cableColor;
    } else {
        ctx.shadowBlur = 0;
    }
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(0, 0, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = cableColor;
	ctx.fill();
	
    ctx.beginPath();
    
	if (tile.conns & N) { ctx.moveTo(0, 0); ctx.lineTo(0, -mid); }
    if (tile.conns & E) { ctx.moveTo(0, 0); ctx.lineTo(mid, 0);  }
    if (tile.conns & S) { ctx.moveTo(0, 0); ctx.lineTo(0, mid);  }
    if (tile.conns & W) { ctx.moveTo(0, 0); ctx.lineTo(-mid, 0); }
    
	ctx.stroke();
	
	ctx.shadowBlur = 0;
	
	ctx.restore();
    
	// Disegna icone
    if(tile.type) drawPC(x, y, tile);
}

function drawPCWATER(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
    const s = CELL_SIZE * (	isServer ? 0.75 : 
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.5)*0.05) + 0.7 :
							0.65 );//Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) * 0.5;
    
    ctx.save();
    ctx.translate(x + p, y + p);
	
	if (isServer) {
		const bodyW = s * 0.5;
		const bodyX = (s - bodyW) * 0.5;

		// gradiente rosso idrante per dare volume (sx scuro, centro chiaro, dx scuro)
		let hydrantGrad = ctx.createLinearGradient(bodyX, 0, bodyX + bodyW, 0);
		hydrantGrad.addColorStop(0, '#8B1A1A');
		hydrantGrad.addColorStop(0.45, '#D62828');
		hydrantGrad.addColorStop(0.55, '#E8433D');
		hydrantGrad.addColorStop(1, '#8B1A1A');

		// --- BASE (flangia a terra) ---
		const baseH = s * 0.08;
		ctx.fillStyle = '#5C1010';
		ctx.beginPath();
		ctx.roundRect(bodyX - s*0.08, s - baseH, bodyW + s*0.16, baseH, s*0.02);
		ctx.fill();

		// --- CORPO PRINCIPALE (barile) ---
		const barrelTop = s * 0.22;
		const barrelBottom = s - baseH;
		ctx.fillStyle = hydrantGrad;
		ctx.beginPath();
		ctx.roundRect(bodyX, barrelTop, bodyW, barrelBottom - barrelTop, s*0.04);
		ctx.fill();

		// fascia centrale (dettaglio tipico degli idranti reali)
		const midBandY = barrelTop + (barrelBottom - barrelTop) * 0.55;
		ctx.fillStyle = '#6E1414';
		ctx.beginPath();
		ctx.roundRect(bodyX - s*0.03, midBandY, bodyW + s*0.06, s*0.05, s*0.02);
		ctx.fill();

		// --- CUPOLA SUPERIORE (arc, non bezier) ---
		const domeY = barrelTop;
		const domeR = bodyW * 0.5;
		ctx.fillStyle = hydrantGrad;
		ctx.beginPath();
		ctx.arc(s*0.5, domeY, domeR, Math.PI, 0);
		ctx.fill();

		// --- DADO A STELLA (pentagono) ---
		const nutY = domeY - domeR * 0.95;
		const nutR = s * 0.09;
		ctx.fillStyle = '#4A0E0E';
		ctx.beginPath();
		for (let i = 0; i < 6; i++) {
			let ang = (Math.PI * 2 / 6) * i - Math.PI * 0.5;
			let px = s*0.5 + Math.cos(ang) * nutR;
			let py = nutY + Math.sin(ang) * nutR * 0.33;//schiacciato
			if (i === 0) ctx.moveTo(px, py); 
			else ctx.lineTo(px, py);
		}
		ctx.closePath();
		ctx.fill();

		// dado quadrato di sicurezza in cima
		ctx.fillStyle = '#8B1A1A';
		ctx.fillRect(s*0.5-s*0.04,nutY - nutR*0.25-s*0.06,s*0.08,s*0.06);
		
		// --- BOCCHETTONI LATERALI (sx/dx) ---
		const nozzleY = barrelTop + (barrelBottom - barrelTop) * 0.33;//ad un terzo altezza
		const nozzleLen = s * 0.08;
		const nozzleH = s * 0.14;

		[-1, 1].forEach(dir => {
			const nx = dir === -1 ? bodyX - nozzleLen : bodyX + bodyW;
			ctx.fillStyle = '#7A1515';
			ctx.fillRect(nx, nozzleY - nozzleH*0.5, nozzleLen, nozzleH);
			// tappo quadrato in punta
			const capX = dir === -1 ? nx - s*0.02 : nx + nozzleLen - s*0.02;
			ctx.fillStyle = '#4A0E0E';
			ctx.fillRect(capX, nozzleY - s*0.08, s*0.04, s*0.16);
		});
		
		// --- bocchettone centrale davanti
		ctx.fillStyle = '#7A1515';
		ctx.beginPath();
		ctx.arc(s*0.5, nozzleY, nozzleLen*1.25, 0, Math.PI * 2);
		ctx.fill();
		// tappo quadrato in punta è rotondo!
		ctx.fillStyle = '#4A0E0E';
		ctx.beginPath();
		ctx.arc(s*0.5, nozzleY, nozzleLen*0.9, 0, Math.PI * 2);
		ctx.fill();
		//ctx.fillRect(s*0.5 - s*0.06, nozzleY - s*0.06, s*0.12, s*0.12);

		// --- HIGHLIGHT LUCIDO (stesso trucco della carrozzeria server) ---
		ctx.fillStyle = 'rgba(255,255,255,0.18)';
		ctx.beginPath();
		ctx.roundRect(bodyX + bodyW*0.15, barrelTop + s*0.02, bodyW*0.12, (barrelBottom - barrelTop) * 0.85, s*0.02);
		ctx.fill();

		// --- STATO CONNESSO: goccioline che sprizzano dai lati
		if (connected) {
			const capX1 = bodyX + bodyW + nozzleLen + s*0.02;//DX
			const capX2 = bodyX - nozzleLen - s*0.02;//SX
			const capX3 = s * 0.5;//CX
			ctx.fillStyle = 'rgba(150,220,255,0.75)';
			for (let i = 0; i < 3; i++) {
				let dropT = ((flowOffset * 2 + i * 8) % 24) / 24;
				let dx1 = capX1 + dropT * s*0.15;
				let dx2 = capX2 - dropT * s*0.15;
				let dx3 = capX3;
				let dy = nozzleY - dropT * s*0.1 + dropT*dropT * s*0.15;
				ctx.beginPath();
				ctx.arc(dx1, dy, s*0.02 * (1 - dropT*0.5), 0, Math.PI*2);
				ctx.fill();
				ctx.beginPath();
				ctx.arc(dx2, dy, s*0.02 * (1 - dropT*0.5), 0, Math.PI*2);
				ctx.fill();
				ctx.beginPath();
				ctx.arc(dx3, dy, s*0.02 * (1 - dropT*0.5), 0, Math.PI*2);
				ctx.fill();
			}
		}
	} else if (type.id) {
		//vaso di margherite :-)
		const vaseTop = s * 0.4;
		const vaseBorderH = s * 0.25;
		const vaseBodyH = s * 0.35;
		let vaseGrad = ctx.createLinearGradient(s*0.1, 0, s*0.9, 0);
		vaseGrad.addColorStop(0, '#2C5F6F');
		vaseGrad.addColorStop(0.4, '#4A8FA3');
		vaseGrad.addColorStop(0.6, '#5FA8BD');
		vaseGrad.addColorStop(1, '#2C5F6F');
		ctx.fillStyle = vaseGrad;
		ctx.beginPath();
		ctx.roundRect(s*0.15,vaseTop,s*0.7,vaseBorderH,[s*0.02,s*0.02,s*0.04,s*0.04]);
		ctx.fill();
		ctx.beginPath();
		ctx.roundRect(s*0.2,vaseTop+vaseBorderH,s*0.6,vaseBodyH,[0,0,s*0.04,s*0.04]);
		ctx.fill();
		ctx.fillStyle = '#292';
		ctx.beginPath();
		ctx.roundRect(s*0.1,vaseTop+vaseBorderH+vaseBodyH,s*0.8,s*0.05,[s*0.02,s*0.02,s*0.1,s*0.1]);
		ctx.fill();
		
		// --- FIORI (3 margherite, quella centrale più alta) ---
		const flowerCount = 3;
		const sway = connected ? Math.sin(flowOffset * 0.3) * s*0.025 : 0;

		for (let i = 0; i < flowerCount; i++) {
			let baseX = s*0.5 + (i - 1) * s * 0.25;
			let stemSway = connected ? Math.sin(flowOffset * 0.3 + i * 1.5) * s*0.02 : 0;
			let topY = (i === 1 ? s*0.05 : s*0.15);
			let midY = vaseTop - (vaseTop - topY) * 0.25;
			let topX = baseX + stemSway;
			let midX = baseX + stemSway * 0.3;

			// stelo spezzato in 2 tratti (simula curvatura senza bezier)
			ctx.strokeStyle = '#3E7D3E';
			ctx.lineWidth = s * 0.025;
			ctx.lineCap = 'round';
			ctx.beginPath();
			ctx.moveTo(baseX, vaseTop);
			ctx.lineTo(midX, midY);
			ctx.lineTo(topX, topY);
			ctx.stroke();

			// fogliolina (triangolo via lineTo)
			if (i !== 1) {
				let leafDir = i === 0 ? -1 : 1;
				ctx.fillStyle = '#4A9B4A';
				ctx.beginPath();
				ctx.moveTo(midX, midY);
				ctx.lineTo(midX + leafDir * s*0.10, midY - s*0.02);
				ctx.lineTo(midX + leafDir * s*0.02, midY + s*0.02);
				ctx.closePath();
				ctx.fill();
			}

			// --- TESTA DELLA MARGHERITA ---
			const petalCount = 8;
			const petalLen = s * 0.15;
			const petalW = s * 0.08;
			const flowerColors = [
			  '#fff', // bianco
			  '#f80', // arancione
			  '#a00', // rosso scuro
			  '#00a', // blu
			  '#0c0', // verde
			  '#f0f', // fucsia/magenta
			  '#0bf', // azzurro
			  '#555', // grigio scuro
			  '#ff0', // giallo
			  '#f99', // rosa chiaro
			  '#70f', // viola
			  '#fc0', // giallo oro
			  '#0cc', // turchese
			  '#6c3', // verde lime
			  '#c3f', // lilla
			  '#d22', // rosso vivo
			  '#f66', // corallo
			  '#b0f', // porpora
			  '#7cf', // celeste
			  '#808', // viola intenso
			  '#841', // marrone
			  '#f06', // rosa acceso
			  '#7f0', // chartreuse
			  '#111', // nero
			  '#19f', // blu dodger
			  '#d13', // cremisi
			  '#2ba', // verde acqua
			];
			const petalColor = connected ? flowerColors[type.n % flowerColors.length] : '#ddc';

			ctx.save();
			ctx.translate(topX, topY);
			for (let p = 0; p < petalCount; p++) {
				ctx.save();
				ctx.rotate((Math.PI * 2 / petalCount) * p);
				ctx.fillStyle = petalColor;
				ctx.beginPath();
				// petalo = cerchio schiacciato con scale, non bezier
				ctx.save();
				ctx.translate(0, -petalLen * 0.55);
				ctx.scale(petalW / petalLen, 1);
				ctx.arc(0, 0, petalLen * 0.55, 0, Math.PI * 2);
				ctx.restore();
				ctx.fill();
				ctx.restore();
			}
			ctx.restore();

			// centro giallo
			ctx.beginPath();
			ctx.arc(topX, topY, s*0.03, 0, Math.PI*2);
			ctx.fillStyle = connected ? '#fc3' : '#ba6';
			ctx.fill();

			// glow di "polline" quando connesso
			if (connected) drawLedAloneCircle(topX, topY, s*0.02, '#fc3');
		}
	}
	ctx.restore();
}

function drawPC(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
    const s = CELL_SIZE * (	isServer ? 0.75 : 
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.5)*0.05) + 0.7 :
							0.65 );//Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) * 0.5;
    
    ctx.save();
    ctx.translate(x + p, y + p);
	
	if (isServer) {
		if (type === 'hal9000') {
			ctx.fillStyle = '#222';
			ctx.strokeStyle = '#111';
			ctx.lineWidth = s * 0.01;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.04);
			ctx.fill();
			ctx.stroke();
			
			// label sotto display
			ctx.fillStyle = '#666';
			ctx.font = `${s * 0.04}px monospace`;
			ctx.fillText('HAL-9000', s * 0.8, s * 0.95);
			
			const eyeY = s * 0.3;
			const eyeR = s * 0.22;
			const cx = s * 0.5

			// anello esterno grigio metallico
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 1.1, 0, Math.PI * 2);
			ctx.fillStyle = '#444';
			ctx.fill();

			// lente interna nera
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 1.0, 0, Math.PI * 2);
			ctx.fillStyle = '#000';
			ctx.fill();

			// occhio rosso
			let eyeStrength = Math.abs(Math.sin(flowOffset * 0.15)*Math.cos(flowOffset * 0.45));
			let redGrad = ctx.createRadialGradient(cx, eyeY, 0, cx, eyeY, eyeR);
			redGrad.addColorStop(0, "#a00");
			redGrad.addColorStop(eyeStrength, "#300");
			redGrad.addColorStop(1, "#000");
			ctx.fillStyle = redGrad;
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 0.9, 0, Math.PI * 2);
			ctx.fill();
			
			// pupilla
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 0.1, 0, Math.PI * 2);
			ctx.fillStyle = eyeStrength > 0.1 ? '#f00' : '#000';
			ctx.fill();
			
			
			// BARRA WAVEFORM AUDIO
			const waveY = s * 0.64;
			const bars = 10;
			const bw = (s * 0.88) / bars - 1;
			for (let b = 0; b < bars; b++) {
				const bh = s * 0.04 * (0.2 + 0.8 * Math.abs(Math.sin(flowOffset * 0.12 + b * 0.6 + Math.sin(flowOffset * 0.03) * 3)));
				const bx = s * 0.06 + b * ((s * 0.88) / bars);
				const intensity = bh / (s * 0.025);
				const r = Math.floor(180 * intensity);
				ctx.fillStyle = `rgb(${r},${Math.floor(r * 0.1)},${Math.floor(r * 0.05)})`;
				ctx.fillRect(bx, waveY + s * 0.025 - bh, bw, bh);
			}
			ctx.fillStyle = '#111';
			ctx.fillRect(s * 0.06, waveY + s * 0.026, s * 0.88, 1);
						

			// display LCD
			const dispY = s * 0.7;
			ctx.fillStyle = '#000';
			ctx.beginPath();
			ctx.roundRect(s * 0.06, dispY, s * 0.88, s * 0.065, 3);
			ctx.fill();
			
			// testo display — scorre
			msgTimer++;
			if (msgTimer > 240) { msgTimer = 0; msgIdx = (msgIdx + 1) % msgs.length; }
			const visibleLen = Math.min(msgs[msgIdx].length, Math.floor(msgTimer / 4) + 1);
			const dispText = msgs[msgIdx].substring(0, visibleLen);
			ctx.fillStyle = '#f00';
			ctx.font = `${s * 0.05}px monospace`;
			ctx.fillText(dispText, s * 0.09, dispY + s * 0.043);

			// cursore lampeggiante
			if (Math.floor(flowOffset * 0.3) % 2 === 0){
				const tw = ctx.measureText(dispText).width;
				ctx.fillStyle = '#f00';
				ctx.fillRect(s * 0.09 + tw + 2, dispY + s * 0.013, s * 0.015, s * 0.034);
			}

			// PANNELLO LED INFERIORE
			const ledPanY = s * 0.8;
			const ledDefs = [
				{ label: 'LIFE', c: '#ff2222', freq: 0.03 },
				{ label: 'CMND', c: '#ff8800', freq: 0.07 },
				{ label: 'DATA', c: '#ffaa00', freq: 1.1 },
				{ label: 'MEM',  c: '#cc0000', freq: 0.2 },
				{ label: 'NET',  c: '#aa0000', freq: 0.9 },
				{ label: 'ATMO', c: '#cc8800', freq: 0.05 },
				{ label: 'NAV',  c: '#ff0000', freq: 1.4 },
				{ label: 'FAIL', c: '#ff6600', freq: 0.1 },
			];

			const nLeds = ledDefs.length;
			const ledSpX = s * 0.88 / nLeds;
			for (let i = 0; i < nLeds; i++) {
				const ld = ledDefs[i];
				const lx = s * 0.06 + i * ledSpX + ledSpX * 0.5;
				const ly = ledPanY + s * 0.032;
				const lr = s * 0.018;

				const on = ld.freq === 0.0 ? false : (Math.sin(flowOffset * ld.freq + i * 1.3) > (i % 3 === 0 ? -0.9 : 0.1));

				ctx.beginPath();
				ctx.arc(lx, ly, lr * 1.5, 0, Math.PI * 2);
				ctx.fillStyle = '#050608';
				ctx.fill();

				ctx.beginPath();
				ctx.arc(lx, ly, lr, 0, Math.PI * 2);
				ctx.fillStyle = on ? ld.c : '#12141a';
				ctx.fill();

				if (on) {
					ctx.beginPath();
					ctx.arc(lx, ly, lr * 0.5, 0, Math.PI * 2);
					ctx.fillStyle = 'rgba(255,255,255,0.4)';
					ctx.fill();
					
					//prova blur semplificato
					drawLedAloneCircle(lx, ly, lr, ld.c);
				}

				ctx.fillStyle = '#1e2a3e';
				ctx.font = `${s * 0.016}px monospace`;
				ctx.textAlign = 'center';
				ctx.fillText(ld.label, lx, ly + lr * 2.4);
				ctx.textAlign = 'left';
			}

			// bordo case esterno
			ctx.strokeStyle = '#0a0c14';
			ctx.lineWidth = 2;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.04);
			ctx.stroke();
		} else if (type === 'megaserver') {
			// MEGA SERVER
			ctx.fillStyle = '#222';
			ctx.strokeStyle = '#111';
			ctx.lineWidth = s*0.01;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.02);
			ctx.fill();
			ctx.stroke();			
			
			// fascia brand superiore
			ctx.fillStyle = '#111';
			ctx.fillRect(s * 0.04, s * 0.03, s * 0.92, s * 0.07);
			ctx.fillStyle = '#666';
			ctx.font = `${s * 0.05}px monospace`;
			ctx.fillText('MEGA SERVER', s * 0.08, s * 0.08);

			// power
			ctx.beginPath();
			ctx.arc(s * 0.9, s * 0.055, s * 0.03, 0, Math.PI * 2);
			ctx.fillStyle = '#666';
			ctx.fill();
			ctx.beginPath();
			ctx.arc(s * 0.9, s * 0.055, s * 0.02, 0, Math.PI * 2);
			ctx.fillStyle = Math.sin(flowOffset * 0.1) > 0 ? colors.redOn : colors.redOff;
			ctx.fill();
			
			//prova blur semplificato
			if (Math.sin(flowOffset * 0.1) > 0) drawLedAloneCircle(s * 0.9, s * 0.055, s * 0.02, colors.redOn);
			
			// reset button (piccolo)
			ctx.beginPath();
			ctx.arc(s * 0.8, s * 0.055, s * 0.012, 0, Math.PI * 2);
			ctx.fillStyle = '#aaa';
			ctx.fill();
			

			//DISPLAY con temp/load
			const dispX = s * 0.04, dispY = s * 0.12;
			const dispW = s * 0.7, dispH = s * 0.06;
			ctx.fillStyle = '#040';
			ctx.fillRect(dispX, dispY, dispW, dispH);
			
			const tempVal = Math.floor(42 + Math.sin(flowOffset * 0.005) * 8);
			const loadVal = Math.floor(60 + Math.sin(flowOffset * 0.01 + 1) * 35);
			ctx.fillStyle = '#0f8';
			ctx.font = `${s * 0.05}px monospace`;
			ctx.fillText(`TEMP ${tempVal}°C    LOAD ${loadVal}%`, dispX + s * 0.03, dispY + dispH * 0.68);

			// STRISCIA 8 LED STATUS
			const ledRow = s * 0.215;
			const ledLabels = ['PWR', 'HDD', 'NET', 'CPU', 'MEM', 'FAN', 'ERR', 'SYS'];
			const pwrOn = true;
			const hddOn = (Math.sin(flowOffset * 0.9) > 0);
			const netOn = (Math.cos(flowOffset * 1.3) > 0.2);
			const cpuOn = (Math.sin(flowOffset * 0.4 + 1) > -0.5);
			const memOn = (Math.sin(flowOffset * 0.2 + 2) > 0.3);
			const fanOn = (Math.sin(flowOffset * 0.15) > 0.7);
			const errOn = (Math.sin(flowOffset * 0.15) > 0.9);
			const sysOn = (Math.sin(flowOffset * 0.05) > -0.9);
			
			const ledStatus = [ pwrOn, hddOn, netOn, cpuOn, memOn, fanOn, errOn, sysOn];
			const ledColors = [
				pwrOn ? colors.greenOn : colors.greenOff,
				hddOn ? colors.orangeOn : colors.orangeOff,
				netOn ? colors.blueOn : colors.blueOff,
				cpuOn ? colors.greenOn : colors.greenOff,
				memOn ? colors.yellowOn : colors.yellowOff,
				fanOn ? colors.whiteOn : colors.whiteOff,
				errOn ? colors.redOn : colors.redOff, // ERR: sempre spento salvo guasto
				sysOn ? colors.greenOn : colors.greenOff,
			];

			const ledSpacing = s * 0.1;
			for (let i = 0; i < 8; i++) {
				const lx = s * 0.05 + i * ledSpacing ;
				const lr = s * 0.022;

				ctx.fillStyle = ledColors[i];
				ctx.fillRect(lx,ledRow,lr*2,lr);
								
				//prova blur semplificato
				if (ledStatus[i]) drawLedAloneRect(lx,ledRow,lr*2,lr, ledColors[i]);
								
				ctx.fillStyle = '#999';
				ctx.font = `${s * 0.03}px monospace`;
				ctx.textAlign = 'center';
				ctx.fillText(ledLabels[i], lx + ledSpacing * 0.2, ledRow + lr * 2.2);
				ctx.textAlign = 'left';
			}

			//drive alti x 2
			for (let i = 0; i < 2; i++) {
				const by = s * 0.28 + i * s * 0.1;
				ctx.fillStyle = '#111';
				ctx.beginPath();
				ctx.roundRect(s * 0.04, by, s * 0.92, s * 0.085, 3);
				ctx.fill();
				ctx.strokeStyle = '#333';
				ctx.lineWidth = 0.5;
				ctx.stroke();

				ctx.fillStyle = '#333';
				ctx.fillRect(s * 0.73, by + s * 0.02, s * 0.06, s * 0.045);
				
				const isActive = Math.sin(flowOffset * 1.8 + i) > 0.3;
				const driveLed = isActive ? colors.orangeOn : colors.orangeOff;
				ctx.beginPath();
				ctx.arc(s * 0.83, by + s * 0.04, s * 0.012, 0, Math.PI * 2);
				ctx.fillStyle = driveLed;
				ctx.fill();
				
				//prova blur semplificato
				if(isActive) drawLedAloneCircle(s * 0.83, by + s * 0.04, s * 0.012, colors.orangeOn);
				
				ctx.fillStyle = '#999';
				ctx.font = `${s * 0.03}px monospace`;
				ctx.fillText(i === 0 ? 'BD-ROM' : 'TAPE', s * 0.06, by + s * 0.075);
			}

			//drive hdd x 4
			for (let i = 0; i < 4; i++) {
				const hy = s * 0.5 + i * s * 0.075;
				ctx.fillStyle = '#111';
				ctx.beginPath();
				ctx.roundRect(s * 0.04, hy, s * 0.92, s * 0.065, 2);
				ctx.fill();
				
				const hddActive = Math.sin(flowOffset * (1.5 + i * 0.7) + i * 2.3) > 0.4;
				ctx.beginPath();
				ctx.arc(s * 0.82, hy + s * 0.033, s * 0.011, 0, Math.PI * 2);
				ctx.fillStyle = hddActive ? colors.orangeOn : colors.orangeOff;
				ctx.fill();
				if (hddActive) {
					ctx.beginPath();
					ctx.arc(s * 0.82, hy + s * 0.033, s * 0.005, 0, Math.PI * 2);
					ctx.fillStyle = '#fff8';
					ctx.fill();
					
					//prova blur semplificato
					drawLedAloneCircle(s * 0.82, hy + s * 0.033, s * 0.011, colors.orangeOn);
				}

				ctx.fillStyle = '#999';
				ctx.font = `${s * 0.03}px monospace`;
				ctx.fillText(`HDD-${i}`, s * 0.06, hy + s * 0.05);
			}

			//pannello con pulsantoni blu + due ruote
			const panY = s * 0.82;
			ctx.fillStyle = '#111';
			ctx.fillRect(s * 0.04, panY, s * 0.92, s * 0.085);
			
			for (let u = 0; u < 5; u++) {
				let isOn = u % 3 !== 0;
				ctx.fillStyle = '#333';
				ctx.fillRect(s * 0.06 + u * s * 0.08, panY + s * 0.018, s * 0.05, s * 0.05);
				ctx.fillStyle = isOn ? colors.blueOn : colors.blueOff;
				ctx.fillRect(s * 0.06 + u * s * 0.08, panY + (isOn ? s * 0.06 : s * 0.02), s * 0.05, s * 0.01);
			}

			//doppio connettore tondo (uhauhauha)
			for (let j = 0; j < 2; j++) {
				ctx.beginPath();
				ctx.arc(s * 0.5 + j * s * 0.06, panY + s * 0.042, s * 0.018, 0, Math.PI * 2);
				ctx.fillStyle = '#111';
				ctx.fill();
				ctx.strokeStyle = j === 0 ? '#090' : '#933';
				ctx.lineWidth = s * 0.01;
				ctx.stroke();
			}

			//barra di led fricchettona
			const barX = s * 0.64;
			const barY = s * 0.85;
			for (let b = 0; b < 4; b++) {
				const active = connected && (Math.sin(flowOffset * (0.5 + b * 0.3) + b) > 0.2 + b * 0.04);
				ctx.fillStyle = active ? colors.greenOn : colors.greenOff;
				ctx.beginPath();
				ctx.roundRect(barX + b * (s * 0.08), barY, s * 0.06, s * 0.022, s*0.04);
				ctx.fill();
				
				if(active) drawLedAloneRect(barX + b * (s * 0.08), barY, s * 0.06, s * 0.022, colors.greenOn);
			}
		} else {
			// CASE ESTERNO (RACK)
			// Effetto metallo spazzolato scuro
			let caseGrad = ctx.createLinearGradient(0 - s*0.08, 0, s + s*0.08, s);
			caseGrad.addColorStop(0, "#334155");
			caseGrad.addColorStop(0.5, "#1e293b");
			caseGrad.addColorStop(1, "#0f172a");
			
			ctx.fillStyle = caseGrad;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.02);
			ctx.fill();

			// Maniglie frontali (dettaglio di classe)

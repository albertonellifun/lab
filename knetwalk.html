<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KNetWalk</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #020617;
            color: #38bdf8;
			font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
			height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        h1 { 
            font-size: clamp(16px, 5vw, 28px);
            font-weight: bold; 
            margin: 0;
            color: #38bdf8; 
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
            white-space: nowrap;
        }
        
        .controls { 
            width: 100%;
            padding: clamp(4px, 2vw, 8px) clamp(4px, 2vw, 12px);
            display: flex;
            gap: clamp(4px, 2vw, 12px);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid #334155;
            min-height: fit-content;
        }
        
        button {
            padding: clamp(6px, 2vw, 10px) clamp(8px, 2vw, 16px);
            font-size: clamp(6px, 2vw, 10px);
            cursor: pointer;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1;
        }
        
        button:hover { background: #334155; color: #38bdf8; border-color: #38bdf8; }
        button.active { background: #0ea5e9; color: #ffffff; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

            align-items: center;

            min-height: 0;

            cursor: pointer;

            max-width: 100%;
            max-height: 100%;
            image-rendering: crisp-edges;
			border: 4px solid #334155;

        #status {

            border-top: 1px solid #334155;

			color: white;

			border-radius: 4px; 
			font-size: 12px;
			z-index: 100;
		}
		
		label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(10px, 2vw, 14px);
            color: #94a3b8;
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        input[type="range"] {
            width: 180px;
            cursor: pointer;
            accent-color: #0ea5e9;
        }

<body>

		<label>HEIGHT: <input type="range" id="heightSlider" min="3" max="12" value="3" onchange="changeSliderDifficulty()" list="values"></label>
		
		<button id="animateBtn"     onclick="changeAnimateFlag(this)">🪢 Animate</button>
		<button id="wiresColorBtn"  onclick="changeWiresColorFlag(this)">🌈 Wires Color</button>
		<button id="variantsBtn"    onclick="changeVariantsFlag(this)">🎨 Hw Variants</button>

    </div>

	<div id="game-container">

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

	{id:'imacg3',			variant:'imacg3green',   desc:'iMac G3 Lime Green from 1999'},
	{id:'imacg3',			variant:'imacg3gray',    desc:'iMac G3 Graphite Gray from 2000'},

//Palette realistica condivisa
const colors = {
    midGray: "#1e293b",
    silver: "#94a3b8",
    darkSilver: "#475569",
    screenOff: "#0f172a",
    glass: "rgba(255, 255, 255, 0.15)",
	greenOn: "#22c55e",
	greenOff: "#064e3b",
	orangeOn: "#f59e0b",
	orangeOff: "#451a03",
	redOn: "#ef4444",
	redOff: "#7f1d1d",
	blueOn: "#38bdf8",
	blueOff: "#0c4a6e",
	yellowOn: "#efef44",
	yellowOff: "#7f7f1d",
	whiteOn: "#fff",
	whiteOff: "#666",
	activeColor: "#0ea5e9",
    inactiveColor: "#334155",
	tileBackground: "#0f172a",
	motherBoardBackground: "#2b8956",
};

const wireColors = [
	'#0ea5e9',//cyan default
	'#ffee55',//giallo
	'#eeeedd',//bianco
	'#ff3300',//rosso
	'#0033ff',//blu
	'#ff8800',//arancione
	'#00ff66',//verdazzo
	];
	
let grid = [];
let serverPos = {x: 0, y: 0};
let gameWon = false;
let flowOffset = 0; //Per l'animazione dei dati
let animateFlag = false;//animazione flag
let variantsFlag = false;//abilita cambi colore
let motherboardFlag = false;//
let shuffledTypes = [];//per evitare duplicati
let motherboardBackgroundLines = [];//griglia Motherboard

function changeSliderDifficulty() {
	const w = parseInt(document.getElementById('widthSlider').value);
	const h = parseInt(document.getElementById('heightSlider').value);
	changeDifficulty(w, h, null);
}

function changeAnimateFlag(btn) {
	animateFlag = !animateFlag;
	if(btn) {
		if(animateFlag) btn.classList.add('active');
		else btn.classList.remove('active');
	}
}

function changeMotherboardFlag(btn) {
	motherboardFlag = !motherboardFlag;
	if(btn) {
		if(motherboardFlag) btn.classList.add('active');
		else btn.classList.remove('active');
	}
	if (motherboardFlag) colors.activeColor = wireColors[0];
	else colors.activeColor = wireColors[wireColors.length-1];
	
	changeWiresColorFlag();
}

function changeVariantsFlag(btn) {
	variantsFlag = !variantsFlag;
	if(btn) {
		if(variantsFlag) btn.classList.add('active');
		else btn.classList.remove('active');
	}
	changeDifficulty(WIDTH, HEIGHT, document.getElementById(WIDTH+'x'+HEIGHT+'btn'));
}

function changeWiresColorFlag(btn) {
	let curr = colors.activeColor;
	let currentIndex = wireColors.indexOf(curr);
	let nextColor;
	if (currentIndex === -1) nextColor = wireColors[0]; // fallback
	else nextColor = wireColors[(currentIndex + 1) % wireColors.length];
	colors.activeColor = nextColor;
	
	const colorsBtn = document.getElementById('wiresColorBtn')
	if(colors.activeColor !== wireColors[0]) colorsBtn.classList.add('active');
	else colorsBtn.classList.remove('active');
}

function changeDifficulty(newSizeX, newSizeY, btn) {
	WIDTH = newSizeX;
	HEIGHT = newSizeY;
	
	// Aggiorna slider
	document.getElementById('widthSlider').value = WIDTH;
	document.getElementById('heightSlider').value = HEIGHT;
    CELL_SIZE = CANVAS_MAX_SIZE / Math.max(WIDTH, HEIGHT);//CANVAS_MAX_SIZE / SIZE;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
	
	const animateBtn = document.getElementById('animateBtn')
	if(animateFlag) animateBtn.classList.add('active');
	else animateBtn.classList.remove('active');
	
	const variantsBtn = document.getElementById('variantsBtn')
	if(variantsFlag) variantsBtn.classList.add('active');
	else variantsBtn.classList.remove('active');
	
	const colorsBtn = document.getElementById('wiresColorBtn')
	if(colors.activeColor !== wireColors[0]) colorsBtn.classList.add('active');
	else colorsBtn.classList.remove('active');
	
	const motherboardBtn = document.getElementById('motherboardBtn')
	if(motherboardFlag) motherboardBtn.classList.add('active');
	else motherboardBtn.classList.remove('active');
	
    initGame();
}

function calculateGridSizeRatio() {
	const aspectRatio = window.innerWidth / window.innerHeight;
	const MIN_SIZE = 3;
	const MAX_SIZE = 12;
	
	if (aspectRatio < 1) {
		// Portrait: 9:16 >>> 3 col, 5 righe
		WIDTH = MIN_SIZE;
		HEIGHT = Math.min(MAX_SIZE, Math.max(MIN_SIZE, Math.round(MIN_SIZE / aspectRatio)));
	} else {
		// Landschiappa: 20:9 >>> 6 col, 3 righe
		HEIGHT = MIN_SIZE;
		WIDTH = Math.min(MAX_SIZE, Math.max(MIN_SIZE, Math.round(MIN_SIZE * aspectRatio)));
	}
	document.getElementById('widthSlider').value = WIDTH;
	document.getElementById('heightSlider').value = HEIGHT;
}

function initGame() {
	// 1. Calcola lo spazio reale disponibile nello schermo (sia larghezza che altezza)
    const headerHeight = document.querySelector('.controls').offsetHeight;
    const statusHeight = statusDiv.offsetHeight;
    
    const paddingX = 40; // Margine di sicurezza laterale
    const paddingY = 60; // Margine di sicurezza verticale
    
    const availableWidth = window.innerWidth - paddingX;
    const availableHeight = window.innerHeight - headerHeight - statusHeight - paddingY;
    
    // 2. Determina i vincoli massimi applicando il tetto di CANVAS_MAX_SIZE
    const maxAllowedWidth = Math.min(CANVAS_MAX_SIZE, availableWidth);
    const maxAllowedHeight = Math.min(CANVAS_MAX_SIZE, availableHeight);
    
    // 3. Calcola la dimensione massima della cella per entrambe le direzioni
    const cellSizeByWidth = maxAllowedWidth / WIDTH;
    const cellSizeByHeight = maxAllowedHeight / HEIGHT;
    
    // Il CELL_SIZE definitivo sarà il minore dei due: garantisce la massima grandezza
    // senza mai far uscire la griglia dai bordi (né in orizzontale né in verticale)
    CELL_SIZE = Math.min(cellSizeByWidth, cellSizeByHeight);
    
    // 4. Assegna le dimensioni reali al canvas basandoti sul numero di celle
    canvas.width = WIDTH * CELL_SIZE;
    canvas.height = HEIGHT * CELL_SIZE;
    
    // --- DA QUI IN POI IL CODICE RIMANE INVARIATO ---
    grid = [];
    gameWon = false;
    statusDiv.innerText = "";
    
    for (let y = 0; y < HEIGHT; y++) {
        grid[y] = [];
        for (let x = 0; x < WIDTH; x++) {
            grid[y][x] = { x, y, conns: 0, type: 'cable', subType: '', connected: false };
        }
    }

    generateNetwork();
    assignTypes();
    shuffleGrid();
    updateConnectivity();
	
	//solo per la modalita Motherboard
	generateMotherboardBackground();
}

//genera un labirinto perfetto in cui ogni cella è collegata al server e non esistono cicli (loop) o vicoli ciechi isolati
//0) Viene creata una griglia di tracciamento (visited) per sapere quali celle fanno già parte della rete (all'inizio sono tutte false).
//1) Viene scelta una posizione casuale server (serverPos) e viene segnata come visited = true.
//2) Viene chiamata la funzione addWalls sul server. Questa funzione prende i 4 vicini (Nord, Sud, Est, Ovest) e li inserisce in un elenco chiamato walls (che qui funge da "lista dei collegamenti possibili").
//3) Il Ciclo di Costruzione: Finché ci sono collegamenti disponibili nell'elenco walls:
//4) Ne viene estratto uno a caso (splice).
//5) Si controlla la cella di destinazione (wall.x2, wall.y2). Se è già stata visitata, il collegamento viene scartato per evitare di creare dei loop.
//6) Se non è visitata, il muro viene "abbattuto": viene creato un collegamento bidirezionale tra le due celle usando gli operatori bitwise (|=).
//7) La nuova cella viene segnata come visitata e i suoi vicini vengono aggiunti alla lista walls.
//8) Alla fine di questo ciclo, tutte le celle della griglia saranno collegate tra loro in un unico grande "albero" genealogico che ha come radice il server.

function generateNetwork() {
	let visited = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(false));//SIZE
    let walls = [];
    serverPos = { x: Math.floor(Math.random()*WIDTH), y: Math.floor(Math.random()*HEIGHT) };//SIZE
    visited[serverPos.y][serverPos.x] = true;
    addWalls(serverPos.x, serverPos.y, walls, visited);

    while (walls.length > 0) {
        let wall = walls.splice(Math.floor(Math.random()*walls.length), 1)[0];
        if (visited[wall.y2][wall.x2]) continue;
        grid[wall.y1][wall.x1].conns |= wall.dir1;
        grid[wall.y2][wall.x2].conns |= wall.dir2;
        visited[wall.y2][wall.x2] = true;
        addWalls(wall.x2, wall.y2, walls, visited);
    }
}

function addWalls(x, y, walls, visited) {
    if (y > 0) walls.push({x1:x, y1:y, x2:x, y2:y-1, dir1:N, dir2:S});
    if (y < HEIGHT-1) walls.push({x1:x, y1:y, x2:x, y2:y+1, dir1:S, dir2:N});//SIZE-1
    if (x > 0) walls.push({x1:x, y1:y, x2:x-1, y2:y, dir1:W, dir2:E});
    if (x < WIDTH-1) walls.push({x1:x, y1:y, x2:x+1, y2:y, dir1:E, dir2:W});//SIZE-1
}

function assignTypes() {
	shuffledTypes = [];
    grid.forEach((row, y) => row.forEach((cell, x) => {
        if (x === serverPos.x && y === serverPos.y) cell.type = 'server';
        else {
            let count = [N, E, S, W].filter(d => cell.conns & d).length;
            if (count === 1) {
                cell.type = 'pc';
				//fix: genera il prossimo DIVERSO dall'attuale!
                cell.subType = getNextHwType();
            }
        }
    }));
}


//fix: genera il prossimo DIVERSO dall'attuale!
function getNextHwType() {
    // Se la lista è vuota, crea una nuova sequenza casuale
    if (shuffledTypes.length === 0) shuffledTypes = [...HW_TYPES].filter((e) => variantsFlag || e.variant === e.id).sort(() => Math.random() - 0.5);
	//console.log('shuffledTypes',shuffledTypes);

    // Estrae il prossimo tipo unico
	const piece = shuffledTypes.pop();
	//console.log('piece',piece.variant);
	return piece;
}


function shuffleGrid() {
    grid.forEach(row => row.forEach(cell => {
        let r = Math.floor(Math.random()*4);
        for(let i=0; i<r; i++) cell.conns = rotateBitmask(cell.conns);
    }));
}

function rotateBitmask(m) {
    let n = 0;
    if (m & N) n |= E; 
	if (m & E) n |= S; 
	if (m & S) n |= W; 
	if (m & W) n |= N;
    return n;
}

function updateConnectivity() {
    grid.forEach(row => row.forEach(c => c.connected = false));
    let q = [grid[serverPos.y][serverPos.x]];
    grid[serverPos.y][serverPos.x].connected = true;
    let head = 0;
    while(head < q.length) {
        let curr = q[head++];
        [[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]].forEach(d => {
            if (curr.conns & d[0]) {
                let nx = curr.x+d[1], ny = curr.y+d[2];
                if (nx>=0 && nx<WIDTH && ny>=0 && ny<HEIGHT) {//SIZE
                    let nb = grid[ny][nx];
                    if (!nb.connected && (nb.conns & d[3])) {
                        nb.connected = true;
                        q.push(nb);
                    }
                }
            }
        });
    }
    if (grid.every(r => r.every(c => c.connected)) && !gameWon) {
        gameWon = true;
        statusDiv.innerText = "SYSTEM ONLINE — NETWORK CONFIGURED!";
    }
}

/** RENDERING AVANZATO */
animate.lastTime = 0;
function animate() {
    const now = performance.now();
    if (animateFlag || now - animate.lastTime >= 40) { // 40ms = 25 fps al massimo
        flowOffset += 0.2;
        draw();
        animate.lastTime = now;
    }
    requestAnimationFrame(animate);
}



function generateMotherboardBackground() {
	motherboardBackgroundLines = [];

	const occupied = [];

	function intersects(a, b) {
		return !(
			a.x + a.w < b.x ||
			b.x + b.w < a.x ||
			a.y + a.h < b.y ||
			b.y + b.h < a.y
		);
	}

	const groups = 10 + Math.floor(Math.random() * 8);

	for (let g = 0; g < groups; g++) {

		const vertical = Math.random() > 0.45;
		const count = 4 + Math.floor(Math.random() * 8);
		const spacing = CELL_SIZE * (0.02 + Math.random() * 0.015);
		const thickness = count * spacing;
		let placed = false;

		for (let attempt = 0; attempt < 100 && !placed; attempt++) {

			let startX, startY, length;

			if (vertical) {
				length = canvas.height * (0.25 + Math.random() * 0.55);
				startX = Math.random() * (canvas.width - thickness);
				startY = Math.random() * (canvas.height - length);
			} else {
				length = canvas.width * (0.25 + Math.random() * 0.55);
				startX = Math.random() * (canvas.width - length);
				startY = Math.random() * (canvas.height - thickness);
			}

			const bounds = vertical
				? {
					x: startX - 10,
					y: startY - 10,
					w: thickness + 20,
					h: length + 20
				}
				: {
					x: startX - 10,
					y: startY - 10,
					w: length + 20,
					h: thickness + 20
				};

			let collision = false;

			for (const o of occupied) {
				if (intersects(bounds, o)) {
					collision = true;
					break;
				}
			}

			if (collision) continue;

			occupied.push(bounds);

			const diagonal = Math.random() > 0.6;

			const diagonalOffset = CELL_SIZE * (0.08 + Math.random() * 0.12);

			motherboardBackgroundLines.push({
				vertical,
				count,
				spacing,
				startX,
				startY,
				length,
				diagonal,
				diagonalOffset
			});

			placed = true;
		}
	}
}

function draw() {
    //ctx.clearRect(0, 0, canvas.width, canvas.height);
	
	ctx.fillStyle = motherboardFlag ? colors.motherBoardBackground : colors.tileBackground;
	ctx.fillRect(0, 0, canvas.width, canvas.height);
    
	if (motherboardFlag) {
		// piste fini bianche
		ctx.strokeStyle = "rgba(255,255,255,0.10)";
		ctx.lineWidth = CELL_SIZE * 0.01;
		ctx.lineCap = "round";

		for (const g of motherboardBackgroundLines) {
			for (let i = 0; i < g.count; i++) {
				const offset = i * g.spacing;
				ctx.beginPath();			
				if (g.vertical) {
					const x = g.startX + offset;
					ctx.moveTo(x, g.startY);
					if (g.diagonal) {
						const split = g.startY + g.length * 0.5;
						ctx.lineTo(x, split);
						ctx.lineTo( x + g.diagonalOffset, split + g.diagonalOffset );
						ctx.lineTo(	x + g.diagonalOffset, g.startY + g.length );
					} else {
						ctx.lineTo( x, g.startY + g.length );
					}

				} else {
					const y = g.startY + offset;
					ctx.moveTo(g.startX, y);
					if (g.diagonal) {
						const split = g.startX + g.length * 0.5;
						ctx.lineTo(split, y);
						ctx.lineTo( split + g.diagonalOffset, y + g.diagonalOffset );
						ctx.lineTo( g.startX + g.length, y + g.diagonalOffset );
					} else {
						ctx.lineTo( g.startX + g.length, y );
					}
				}
				ctx.stroke();
			}
		}
		ctx.lineCap = "butt";
	}
	
	else {
		//griglia standard
		ctx.strokeStyle = colors.inactiveColor;
		ctx.lineWidth = 1;
    
		for(let i=0; i<=WIDTH; i++) {
			ctx.beginPath(); ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); ctx.stroke();
		}
		for(let i=0; i<=HEIGHT; i++) {
			ctx.beginPath(); ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); ctx.stroke();
		}
	}
	
	//drawLake();

    grid.forEach(row => row.forEach(tile => drawTile(tile)));
}

function drawLake() {
    const serverX = serverPos.x * CELL_SIZE + CELL_SIZE / 2;
    const serverY = serverPos.y * CELL_SIZE + CELL_SIZE / 2;
    
    // Gradient radiale centrato sul server
    let lakeGrad = ctx.createRadialGradient(serverX, serverY, 0, serverX, serverY, Math.max(canvas.width, canvas.height));
    lakeGrad.addColorStop(0, "rgba(6, 182, 212, 0.15)");   // Azzurro
    lakeGrad.addColorStop(1, "rgba(59, 130, 246, 0.05)");    // Bordi: blu tenue
    
    ctx.fillStyle = lakeGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Onde animate
    ctx.lineWidth = 1.5;
    
    const waveCount = 30;
    for(let w = 0; w < waveCount; w++) {
        const waveRadius = (flowOffset * 2 + w * 20) % (Math.max(canvas.width, canvas.height));
        const opacity = Math.max(0, 1 - (waveRadius / (Math.max(canvas.width, canvas.height))));
        const op100 = (opacity * 100)|0;
        ctx.strokeStyle = colors.activeColor+op100;//`rgba(34, 94, 197, ${0.3 * opacity})`;
        ctx.beginPath();
        ctx.arc(serverX, serverY, waveRadius, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawIcons(x, y, size, rows, cols, bwColor = null) {
	const icons = [
		{ name: 'phone',    color: bwColor ? bwColor : '#4af' },
		{ name: 'message',  color: bwColor ? bwColor : '#2f2' },
		{ name: 'camera',   color: bwColor ? bwColor : '#f4a' },
		{ name: 'mail',     color: bwColor ? bwColor : '#f84' },
		{ name: 'settings', color: bwColor ? bwColor : '#aaa' },
		{ name: 'calendar', color: bwColor ? bwColor : '#f44' },
		{ name: 'maps',     color: bwColor ? bwColor : '#4f4' },
		{ name: 'music',    color: bwColor ? bwColor : '#a4f' },
		{ name: 'photo',    color: bwColor ? bwColor : '#fa4' },
		{ name: 'browser',  color: bwColor ? bwColor : '#4af' },
		{ name: 'store',    color: bwColor ? bwColor : '#48f' },
		{ name: 'clock',    color: bwColor ? bwColor : '#4af' }
	];
	
	let iconIndex = 0;
	const spacing = size * 1.4;
	
	for (let r = 0; r < rows; r++) {
		for (let c = 0; c < cols; c++) {
			//if (iconIndex >= icons.length) return;
			
			const ix = x + (c * spacing);
			const iy = y + (r * spacing);
			const icon = icons[iconIndex % icons.length];
			
			ctx.save();
			ctx.translate(ix, iy);
			
			// Sfondo icona (quadrato arrotondato)
			ctx.fillStyle = icon.color;
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, size * 0.2);
			ctx.fill();
			
			// Ombra leggera
			ctx.fillStyle = 'rgba(0,0,0,0.2)';
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, size * 0.2);
			ctx.fill();
			
			// Disegno icona in base al tipo
			ctx.fillStyle = '#fff';
			ctx.strokeStyle = '#fff';
			ctx.lineWidth = size * 0.08;
			ctx.lineCap = 'round';
			ctx.lineJoin = 'round';
			
			const padding = size * 0.25;
			const inner = size - (padding * 2);
			
			switch(icon.name) {
				case 'phone':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner * 1.4, size * 0.15);
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(size*0.5, size - padding*1.2, size * 0.08, 0, Math.PI*2);
					ctx.fill();
					break;
				case 'message':
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.3);
					ctx.lineTo(size*0.5, padding + inner*0.6);
					ctx.lineTo(size - padding, padding + inner*0.3);
					ctx.stroke();
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.15);
					ctx.stroke();
					break;
				case 'camera':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.3, 0, Math.PI*2);
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.15, 0, Math.PI*2);
					ctx.fill();
					break;
				case 'mail':
					ctx.beginPath();
					ctx.moveTo(padding, padding);
					ctx.lineTo(size*0.5, padding + inner*0.4);
					ctx.lineTo(size - padding, padding);
					ctx.moveTo(padding, padding);
					ctx.lineTo(size - padding, padding + inner*0.8);
					ctx.lineTo(size - padding, padding);
					ctx.stroke();
					break;
				case 'settings':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.25, 0, Math.PI*2);
					ctx.stroke();
					for(let a = 0; a < Math.PI*2; a += Math.PI*0.33) {
						const r = inner*0.4;
						ctx.fillRect(size*0.5 + Math.cos(a)*r - size*0.04, size*0.5 + Math.sin(a)*r - size*0.04, size*0.08, size*0.08);
					}
					break;
				case 'calendar':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.1);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding + inner*0.2, padding + inner*0.25);
					ctx.lineTo(padding + inner*0.2, padding + inner*0.5);
					ctx.moveTo(padding + inner*0.8, padding + inner*0.25);
					ctx.lineTo(padding + inner*0.8, padding + inner*0.5);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.5);
					ctx.lineTo(size - padding, padding + inner*0.5);
					ctx.stroke();
					break;
				case 'maps':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5 - inner*0.1, inner*0.2, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(size*0.5 - inner*0.15, size*0.5 + inner*0.2);
					ctx.lineTo(size*0.5, size*0.5 - inner*0.15);
					ctx.lineTo(size*0.5 + inner*0.15, size*0.5 + inner*0.2);
					ctx.fill();
					break;
				case 'music':
					ctx.beginPath();
					ctx.arc(padding + inner*0.25, size*0.5, inner*0.25, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(padding + inner*0.5, padding);
					ctx.lineTo(padding + inner*0.5, size - padding);
					ctx.stroke();
					break;
				case 'photo':
					ctx.beginPath();
					ctx.arc(padding + inner*0.3, padding + inner*0.35, inner*0.15, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(padding, size - padding);
					ctx.lineTo(padding + inner*0.4, padding + inner*0.5);
					ctx.lineTo(size - padding, padding);
					ctx.stroke();
					break;
				case 'browser':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.1);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.25);
					ctx.lineTo(size - padding, padding + inner*0.25);
					ctx.stroke();
					break;
				case 'store':
					ctx.beginPath();
					ctx.moveTo(padding, size - padding);
					ctx.lineTo(padding + inner*0.25, padding);
					ctx.lineTo(padding + inner*0.75, padding);
					ctx.lineTo(size - padding, size - padding);
					ctx.closePath();
					ctx.stroke();
					break;
				case 'clock':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.3, 0, Math.PI*2);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(size*0.5, size*0.5);
					ctx.lineTo(size*0.5, padding + inner*0.15);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(size*0.5, size*0.5);
					ctx.lineTo(size*0.5 + inner*0.15, size*0.5);
					ctx.stroke();
					break;
			}
			
			ctx.restore();
			iconIndex++;
		}
	}
}

function drawTile(tile) {
	if(motherboardFlag) drawTileMotherboard(tile);
	else if (animateFlag) drawTileANIMATE(tile);
	else drawTileOLD(tile);
}

function drawTileMotherboard(tile) {
	let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE / 2;
	
    ctx.strokeStyle = tile.connected ? colors.activeColor : colors.inactiveColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";
    
    ctx.beginPath();
    if (tile.conns & N) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y); }
    if (tile.conns & E) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + CELL_SIZE, y + mid); }
    if (tile.conns & S) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y + CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x, y + mid); }
    ctx.stroke();
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.05, 0, Math.PI*2);
	ctx.fillStyle = tile.connected ? colors.activeColor : colors.inactiveColor;
	ctx.fill();
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.02, 0, Math.PI*2);
	ctx.fillStyle = colors.motherBoardBackground;
	ctx.fill();
	
	// Disegna icone
    drawMotherboardPC(x, y, tile);
}

function drawMotherboardPC(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
	const baseSize = type.id && type.id.length % 3 === 0 ? 0.25 : 
					 type.id && type.id.length % 3 === 1 ? 0.45 : 
					 0.65;
    const s = CELL_SIZE * (	isServer ? 0.75 : 
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.1)*0.05) + baseSize :
							baseSize
							);//Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) * 0.5;
    
    ctx.save();
    ctx.translate(x + p, y + p);
	
	if (isServer) {
		//batteria
		let caseGrad = ctx.createLinearGradient(0, 0, s, s);
		caseGrad.addColorStop(0.0, "#456");
		caseGrad.addColorStop(0.5, "#234");
		caseGrad.addColorStop(1.0, "#223");
		
		//bordo nero
		ctx.fillStyle = '#222';
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.5, 0, Math.PI * 2);
		ctx.fill();
		ctx.fillStyle = '#000';
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.5, Math.PI * 0.25, Math.PI * 1.75);
		ctx.fill();
		
		ctx.fillStyle = caseGrad;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.4, 0, Math.PI * 2);
		ctx.fill();
		
		ctx.strokeStyle = colors.darkSilver;
		ctx.lineWidth = s * 0.02;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.4, 0, Math.PI * 2);
		ctx.stroke();
		
		//scritta al centro
		ctx.fillStyle = colors.darkSilver;
		ctx.font = `${s*0.1}px sans-serif`;
		ctx.fillText("CR2032", s*0.32,s*0.30);
		ctx.font = `${s*0.2}px sans-serif`;
		ctx.fillText("3V",     s*0.38,s*0.48);
		ctx.font = `${s*0.3}px sans-serif`;
		ctx.fillText("+",      s*0.42,s*0.70);
		
		//scritta tonda sul bordo
		ctx.lineWidth = s*0.03;
		ctx.setLineDash([s*0.04,s*0.012]);
		ctx.strokeStyle = colors.darkSilver;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.35, Math.PI*0.2, Math.PI*0.8);
		ctx.stroke();
		//uhauhauha barbatrucco
		ctx.strokeStyle = '#223';
		ctx.setLineDash([s*0.01,s*0.028]);
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.35, Math.PI*0.2, Math.PI*0.8);
		ctx.stroke();
		ctx.setLineDash([]);
	} else if(type.id) {
		//cpu
		ctx.fillStyle = "#222";
		ctx.beginPath(); 
		ctx.roundRect(0, 0, s, s, s * 0.04);
		ctx.fill();
		
		//4 palle agli angoli
		ctx.fillStyle = "#111";
		ctx.beginPath();
		ctx.arc(s*0.15,s*0.15,s*0.05,0,Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.85,s*0.85,s*0.05,0,Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.15,s*0.85,s*0.05,0,Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.85,s*0.15,s*0.05,0,Math.PI*2);
		ctx.fill();
		
		//zampette
		ctx.fillStyle = colors.silver;
		for(let i=2;i<18;i++) {
			ctx.fillRect(s*i*0.05, -s*0.05, s*0.02, s*0.08);
			ctx.fillRect(s*i*0.05, s*0.98, s*0.02, s*0.08);
		}
		for(let i=2;i<18;i++) {
			ctx.fillRect(-s*0.05, s*i*0.05, s*0.08, s*0.02);
			ctx.fillRect(s*0.98, s*i*0.05,  s*0.08, s*0.02);
		}
		
		//scritta cpu
		ctx.fillStyle = '#444';
		ctx.font = `${s*0.1}px sans-serif`;
		ctx.fillText(type.id, s*(0.5 - (type.id.length * 0.025)),s*0.30);
		ctx.fillText("© Alberto Nelli 2026",s*0.05,s*0.76);
		ctx.fillText("KNetWalk", s*0.3,s*0.87);
		
		if(connected) {
			// Riflesso "Glossy"
			ctx.fillStyle = colors.glass;
			ctx.beginPath();
			ctx.moveTo(s*0.06, s*0.06); ctx.lineTo(s - s*0.06, s*0.06); ctx.lineTo(s*0.06, s * 0.6);
			ctx.fill();
		}
		
	} 
	ctx.restore();
}


function drawTileOLD(tile) {
    let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE / 2;
    
    // Disegna cavi
	let hue = (flowOffset * 2 + 240) % 360; // --- CALCOLO DEL COLORE DINAMICO ---
    let dynamicColor = `hsl(${hue}, 100%, 50%)`;
    
    ctx.strokeStyle = tile.connected ? colors.activeColor //dynamicColor
										: colors.inactiveColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";//"round";
    
    // Effetto bagliore se connesso
    if(tile.connected) {
        ctx.shadowBlur = 20;
		ctx.shadowColor = colors.activeColor; //dynamicColor
    } else {
        ctx.shadowBlur = 0;
    }

	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = tile.connected ? colors.activeColor //dynamicColor
									: colors.inactiveColor;
	ctx.fill();
	
    ctx.beginPath();
    if (tile.conns & N) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y); }
    if (tile.conns & E) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + CELL_SIZE, y + mid); }
    if (tile.conns & S) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y + CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x, y + mid); }
    ctx.stroke();
	
    ctx.shadowBlur = 0;
		
	// Disegna icone
    drawPC(x, y, tile);
}

function drawTileANIMATE(tile) {
    let x = tile.x * CELL_SIZE, y = tile.y * CELL_SIZE, mid = CELL_SIZE*0.5;
	
    // Cavo Base (Sfondo spento)
    ctx.setLineDash([]);
    ctx.strokeStyle = colors.inactiveColor;//"#1e293b";
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";//"round";
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = colors.inactiveColor;//"#1e293b";
	ctx.fill();
	
    ctx.beginPath();
    if (tile.conns & N) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(mid+x, y); }
    if (tile.conns & E) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(x+CELL_SIZE, mid+y); }
    if (tile.conns & S) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(mid+x, y+CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(x, mid+y); }
    ctx.stroke();
	
    // Flusso Dati (Animato)
    if (tile.connected) {
		ctx.lineCap = "butt";//default
		ctx.strokeStyle = colors.activeColor;//"#0ea5e9";
        ctx.lineWidth = CELL_SIZE * 0.02;
        ctx.setLineDash([CELL_SIZE*0.025, CELL_SIZE*0.025]); // Tratteggio
        ctx.lineDashOffset = -(flowOffset * (CELL_SIZE * 0.005))
		ctx.shadowBlur = 20;
        ctx.shadowColor = colors.blueOn;
		ctx.stroke();
        ctx.shadowBlur = 0;
		ctx.setLineDash([]);
    }
	ctx.lineWidth = 1;

    // Icone
    drawPC(x, y, tile);
}


function drawPC(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
    const s = CELL_SIZE * (	isServer ? 0.75 : 
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.1)*0.05) + 0.75 :
							0.65 );//Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) * 0.5;
    
    ctx.save();
    ctx.translate(x + p, y + p);
	
	if (isServer) {
		// --- CASE ESTERNO (RACK) ---
		// Effetto metallo spazzolato scuro
		let caseGrad = ctx.createLinearGradient(0 - s*0.08, 0, s + s*0.08, s);
		caseGrad.addColorStop(0, "#334155");
		caseGrad.addColorStop(0.5, "#1e293b");
		caseGrad.addColorStop(1, "#0f172a");
		
		ctx.fillStyle = caseGrad;
		ctx.beginPath();
		ctx.roundRect(0, 0, s, s, s * 0.02);
		ctx.fill();

		// Maniglie frontali (dettaglio di classe)
		ctx.fillStyle = '#000';//colors.darkSilver;
		//sx
		ctx.beginPath();
		ctx.roundRect(s*0.02, s*0.05, s*0.02, s*0.88, s*0.04);
		ctx.fill();
		//dx
		ctx.beginPath();
		ctx.roundRect(s*0.96, s*0.05, s*0.02, s*0.88, s*0.04);
		ctx.fill();

		// --- UNITÀ SERVER (Blade) ---
		const units = 4;
		const unitHeight = (s - s*0.10) / units;
		
		
		//righe ventilazione
		let sizeRighe = Math.max(0.6, s*0.01);//larghezza righe
		let deltaRighe = sizeRighe * 2.5;//spazio tra righe
		ctx.lineWidth = sizeRighe;
		
		//led di stato
		const ledRadius = Math.max(1, s * 0.02); // Scala i LED con la scocca
		const ledSpacing = s * 0.1;
		
		const unitsToShutdown = [];
		const currentCycle = flowOffset * 0.0001;
		unitsToShutdown[0] = Math.floor(currentCycle * 73.1 + 1 ) % 10;
		unitsToShutdown[1] = Math.floor(currentCycle * 73.1 + 42.3 ) % 10;
		
		
		for (let i = 0; i < units; i++) {
		
			let uy = s*0.05 + (i * unitHeight);
			
			// Slot dell'unità
			ctx.fillStyle = "#020617";
			ctx.fillRect(s*0.06, uy, s - s*0.12, unitHeight - s*0.02);
			
			// Griglia di ventilazione (30 righe)
			ctx.strokeStyle = colors.midGray;
			for(let gx = s*0.08; gx < s * 0.94; gx += deltaRighe) {
				ctx.beginPath();
				ctx.moveTo(gx, uy + s*0.02);
				ctx.lineTo(gx, uy + unitHeight - s*0.04);
				ctx.stroke();
			}
			
			if (connected && unitsToShutdown.indexOf(i) === -1) {
				// LED Verde (Power/Link) - Fisso o lampeggio lento
				ctx.fillStyle = (Math.sin(flowOffset * 0.1 + i) > -0.8) ? colors.greenOn : colors.greenOff;
				ctx.shadowBlur = 5; ctx.shadowColor = colors.greenOn;

		ctx.fillText('Y',s*0.5,s*0.43);
		
		
		// --- LED POWER
		ctx.fillStyle = connected && Math.cos(flowOffset*0.4) > 0.2 ? "#f80" : "#374151";
		if (connected && Math.cos(flowOffset*0.4) > 0.2) {
			ctx.shadowBlur = 5;
			ctx.shadowColor = "#f80";
		}
		ctx.beginPath();
		ctx.arc(s*0.82, s*0.14, s*0.012, 0, Math.PI*2);
		ctx.fill();
		ctx.shadowBlur = 0;
		
		// --- RIFLESSO GLOSSY ---
		ctx.fillStyle = "rgba(255,255,255,0.1)";
		ctx.beginPath();
		ctx.moveTo(s*0.05, s*0.15); ctx.lineTo(s*0.5, s*0.2); ctx.lineTo(s*0.1, s*0.35);
		ctx.fill();
	}
	else if (type.id === 'ps7000') {
		//ps7000 nintendo switch clone with mame emulator		
		// Body nero principale
		let psGrad = ctx.createLinearGradient(0, 0, s, s);
		psGrad.addColorStop(0, "#1a1a1a");
		psGrad.addColorStop(0.5, "#0f0f0f");
		psGrad.addColorStop(1, "#000");
		ctx.fillStyle = psGrad;
		ctx.strokeStyle = "#222";
		ctx.lineWidth = Math.max(1, s*0.015);
		ctx.beginPath();
		ctx.roundRect(0,s*0.2,s,s*0.5,s*0.08);
		ctx.fill();
		ctx.stroke();// Bordo metallico
		
		// Joy-Con sinistro: palla + croce
		const joyLX = s*0.1;//palla x
		const joyLY = s*0.35;//palla y
		const pallaR = s*0.04;//raggio
		const deltaY = s*0.15;//spaziatura palla-croce
		ctx.fillStyle = "#333";
		
		//palla sopra
		ctx.beginPath();
		ctx.arc(joyLX, joyLY, pallaR, 0, Math.PI * 2);
		ctx.fill();
		
		//croce sotto
		ctx.fillRect(joyLX - s*0.02, joyLY + deltaY - s*0.06, s*0.04, s*0.12);
		ctx.fillRect(joyLX - s*0.06, joyLY + deltaY - s*0.02, s*0.12, s*0.04);
		
		//select + start
		ctx.fillStyle = '#444';
		ctx.fillRect(joyLX - s*0.02, s*0.65, s*0.02, s*0.01);
		ctx.fillRect(joyLX + s*0.02, s*0.65, s*0.02, s*0.01);
		
		
		// Joy-Con destro: palla + pulsanti a croce
		const joyRX = s*0.9;
		const joyRY = s*0.35;//palla y
		const joyButtonSize = s*0.02;
		ctx.fillStyle = "#333";
		
		//palla sopra
		ctx.beginPath();
		ctx.arc(joyRX, joyRY, pallaR, 0, Math.PI * 2);
		ctx.fill();
		
		//pulsanti sotto
		//sx
		ctx.fillStyle = colors.blueOn;
		ctx.beginPath();
		ctx.arc(joyRX - s*0.05, joyRY + deltaY, joyButtonSize, 0, Math.PI * 2);
		ctx.fill();
		//dx
		ctx.fillStyle = colors.redOn;
		ctx.beginPath();
		ctx.arc(joyRX + s*0.05, joyRY + deltaY, joyButtonSize, 0, Math.PI * 2);
		ctx.fill();
		//up
		ctx.fillStyle = colors.greenOn;
		ctx.beginPath();
		ctx.arc(joyRX, joyRY + deltaY - s*0.05, joyButtonSize, 0, Math.PI * 2);
		ctx.fill();
		//down
		ctx.fillStyle = colors.yellowOn;
		ctx.beginPath();
		ctx.arc(joyRX, joyRY + deltaY + s*0.05, joyButtonSize, 0, Math.PI * 2);
		ctx.fill();
		
		//select + start
		ctx.fillStyle = '#444';
		ctx.fillRect(joyRX - s*0.02, s*0.65, s*0.02, s*0.01);
		ctx.fillRect(joyRX + s*0.02, s*0.65, s*0.02, s*0.01);
		
		// --- SCHERMO CENTRALE ---
		ctx.fillStyle = "#000";
		ctx.fillRect(s*0.2, s*0.22, s*0.6, s*0.4);
		
		// Schermo LCD (blu se connesso)
		if (connected) {
			let screenGrad = ctx.createLinearGradient(0, s*0.4, 0, s*0.6);
			screenGrad.addColorStop(0, "#1e5aa6");
			screenGrad.addColorStop(0.5, "#2b7fc8");
			screenGrad.addColorStop(1, "#1e5aa6");
			ctx.fillStyle = screenGrad;
		} else {
			ctx.fillStyle = "#0a0a0a";
		}
		ctx.fillRect(s*0.22, s*0.25, s*0.56, s*0.35);
		
		// Luci riflesse
		if (connected) {
			ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
			ctx.beginPath();
			ctx.ellipse(s*0.35, s*0.35, s*0.08, s*0.06, -0.3, 0, Math.PI*2);
			ctx.fill();
		}
		
		//led fisso blue in alto a dx
		ctx.fillStyle = colors.blueOff;
		if (connected) {
			ctx.fillStyle = colors.blueOn;
			ctx.shadowBlur = 8;
			ctx.shadowColor = colors.blueOn;
		}
		ctx.fillRect(s*0.9, s*0.24, s*0.02, s*0.01);
		ctx.shadowBlur = 0;
		
		//led fisso rosso in alto a sx
		ctx.fillStyle = colors.redOff;
		if (connected) {
			ctx.fillStyle = colors.redOn;
			ctx.shadowBlur = 8;
			ctx.shadowColor = colors.redOn;
		}
		ctx.fillRect(s*0.1, s*0.24, s*0.02, s*0.01);
		ctx.shadowBlur = 0;
		
		// Etichetta PS7000
		ctx.fillStyle = "#999";
		ctx.font = `${s*0.05}px sans-serif`;
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		ctx.fillText("PS7000", s*0.5, s*0.65);
	}
	else if (type.id === 'ps4') {
		const isWhite = type.variant === 'ps4white';
		// --- PLAYSTATION 4 2014
		// CORPO PRINCIPALE INFERIORE (più scuro)
		let baseGrad = ctx.createLinearGradient(0, s*0.3, 0, s*0.7);
		baseGrad.addColorStop(0, isWhite ? "#eee" : "#222");
		baseGrad.addColorStop(1, isWhite ? "#ccc" : "#111");
		ctx.fillStyle = baseGrad;
		
		//base alta + bassa
		ctx.fillRect(0, s*0.30, s, s*0.16);
		ctx.fillRect(0, s*0.54, s, s*0.16);
		//divisore in mezzo orizzontale
		ctx.fillStyle = '#000';
		ctx.fillRect(s*0.05, s*0.46,s*0.9,s*0.08);
		//parte alta sx piu scura
		ctx.fillStyle = isWhite ? '#fff' : '#111';
		ctx.fillRect(0, s*0.30, s*0.35, s*0.16);
		//riga nera verticale
		ctx.fillStyle = '#000';
		ctx.fillRect(s*0.35, s*0.3,s*0.03,s*0.4);
		//usb x 2
		ctx.strokeStyle = '#444';
		ctx.lineWidth = s*0.01;
		ctx.strokeRect(s*0.60, s*0.49, s*0.06, s*0.03);
		ctx.strokeRect(s*0.72, s*0.49, s*0.06, s*0.03);
		ctx.fillStyle = '#555';
		ctx.fillRect(s*0.60, s*0.50, s*0.06, s*0.01);
		ctx.fillRect(s*0.72, s*0.50, s*0.06, s*0.01);
				
		// LOGO PS4
		ctx.fillStyle = isWhite ? '#ddd' : '#000';
		ctx.font = `${s*0.08}px sans-serif`;
		ctx.textAlign = "right";
		ctx.textBaseline = "middle";
		ctx.fillText("PS4", s*0.99, s*0.39);
		// LOGO SONY
		ctx.font = `${s*0.06}px sans-serif`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("SONY", s*0.02, s*0.38);
		
		// LED power (blu fisso se connesso)
		ctx.fillStyle = connected ? (isWhite ? colors.blueOn : colors.blueOff) : (isWhite ? '#ddd' : '#000');
		ctx.beginPath();
		ctx.arc(s*0.12, s*0.6, s*0.015, 0, Math.PI*2);
		ctx.fill();
		ctx.shadowBlur = 0;
		
		ctx.fillStyle = isWhite ? '#ddd' : '#000';
		if (connected && Math.sin(flowOffset*0.15) > -0.3) {
			ctx.fillStyle = (isWhite ? colors.blueOn : colors.blueOff)
			ctx.shadowBlur = 10;
			ctx.shadowColor = (isWhite ? colors.blueOn : colors.blueOff)
		}
		ctx.fillRect(s*0.35, s*0.31,s*0.03,s*0.16);
		ctx.fillRect(s*0.35, s*0.54,s*0.03,s*0.15);
		ctx.shadowBlur = 0;
		
		// PULSANTE EJECT (piccolo, in basso a destra)
		ctx.fillStyle = isWhite ? '#ccc' : '#222';
		ctx.beginPath();
		ctx.arc(s*0.95, s*0.62, s*0.035, 0, Math.PI*2);
		ctx.fill();
		ctx.fillStyle = isWhite ? '#ddd' : '#000';
		ctx.beginPath();
		ctx.arc(s*0.95, s*0.62, s*0.02, 0, Math.PI*2);
		ctx.fill();
	}
	else if (type.id === 'imacg3') {
		// --- IMAC G3 BIANCO E BLU?
		const g3cols = {
		  imacg3:       '#09b|#079',//default
		  imacg3blue:   '#00a|#006',
		  imacg3red:    '#f36|#b12',
		  imacg3orange: '#f90|#c60',
		  imacg3cyan:   '#09b|#079',
		  imacg3green:  '#0f0|#0b0',
		  imacg3gray:	'#889|#556'
		};
		
		let bodyGrad = ctx.createLinearGradient(0, 0, s*0.1, s*0.8);
		bodyGrad.addColorStop(0.0, "#eee");
		bodyGrad.addColorStop(0.2, "#fff");
		bodyGrad.addColorStop(0.6, "#eee");
		bodyGrad.addColorStop(1.0, "#ccc");
		ctx.fillStyle = bodyGrad;
		
		//body
		ctx.beginPath();
		ctx.roundRect(s*0.05, s*0.05, s*0.9, s*0.78, [s*0.14,s*0.14,s*0.08,s*0.08]);
		ctx.fill();
		
		//palla sinistra
		let handleGrad = ctx.createLinearGradient(0, 0, s*0.1, 0);
		handleGrad.addColorStop(0, g3cols[type.variant].split('|')[0]);
		handleGrad.addColorStop(1, g3cols[type.variant].split('|')[1]);
		ctx.fillStyle = handleGrad;
		ctx.beginPath();
		ctx.ellipse(s*0.15, s*0.74, s*0.08, s*0.06, 0, 0, Math.PI*2);
		ctx.fill();
		
		//palla destra
		ctx.beginPath();
		ctx.ellipse(s*0.85, s*0.74, s*0.08, s*0.06, 0, 0, Math.PI*2);
		ctx.fill();
		
		//maniglie laterali
		ctx.beginPath();
		ctx.roundRect(s*0.05, s*0.15, s*0.04, s*0.45, [0,s*0.08,s*0.08,0]);
		ctx.fill();
		ctx.beginPath();
		ctx.roundRect(s*0.91, s*0.15, s*0.04, s*0.45, [s*0.08,0,0,s*0.08]);
		ctx.fill();
		//maniglia sotto
		ctx.beginPath();
		ctx.roundRect(s*0.15, s*0.85, s*0.70, s*0.04, [0,0,s*0.08,s*0.08]);
		ctx.fill();
		
		
		//riga dritta orizzontale
		ctx.strokeStyle = "rgba(0,0,0,0.1)";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.moveTo(s*0.05, s*0.65);
		ctx.lineTo(s*0.95, s*0.65);
		ctx.stroke();
		
		//cdrom
		ctx.beginPath();
		ctx.roundRect(s*0.35, s*0.68, s*0.3, s*0.05, s*0.08);
		ctx.fill();
		//taglio cdrom
		ctx.fillStyle = '#eee';
		ctx.fillRect(s*0.37, s*0.70, s*0.26, s*0.01);
		
		//etichetta imac
		ctx.fillStyle = "#999";
		ctx.font = `${s*0.05}px sans-serif`;
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		ctx.fillText("iMac", s*0.5, s*0.63);
		
		//bordo schermo quasi nero
		ctx.fillStyle = "#222";
		ctx.beginPath();
		ctx.roundRect(s*0.16, s*0.15, s*0.68, s*0.45, s*0.08);
		ctx.fill();
		
		//schermo quasi nero
		if (connected) {
			let screenGrad = ctx.createLinearGradient(0, s*0.19, 0, s*0.37);
			screenGrad.addColorStop(0, "#1e5aa6");
			screenGrad.addColorStop(0.5, "#2b7fc8");
			screenGrad.addColorStop(1, "#1e5aa6");
			ctx.fillStyle = screenGrad;
		} else {
			ctx.fillStyle = "#111";
		}
		ctx.beginPath();
		ctx.roundRect(s*0.2, s*0.19, s*0.6, s*0.37, s*0.04);
		ctx.fill();
		
		if (connected) {
			// Menu bar
			ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
			ctx.fillRect(s*0.21, s*0.2, s*0.58, s*0.03);
			
			drawIcons(s*0.72, s*0.26, s*0.06, 3, 1, 'rgba(0,0,0,0.3)');
		}
		
		//riflesso curvo alto + basso
		ctx.strokeStyle = "rgba(255,255,255,0.1)";
		ctx.lineWidth = s*0.03;
		ctx.beginPath(); ctx.ellipse(s*0.3, s*0.25, s*0.1, s*0.06, 0, Math.PI, Math.PI*1.5); 
		ctx.stroke();
		ctx.strokeStyle = "rgba(0,0,0,0.1)";
		ctx.lineWidth = s*0.03;
		ctx.beginPath(); ctx.ellipse(s*0.7, s*0.5, s*0.1, s*0.06, 0, Math.PI * 2, Math.PI*2.5); 
		ctx.stroke();
		
		//2 palline a sx
		ctx.fillStyle = colors.whiteOff;
		ctx.strokeStyle = "#ddd";
		ctx.lineWidth = s*0.01;
		ctx.beginPath();
		ctx.arc(s*0.26, s*0.74, s*0.03, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		ctx.beginPath();
		ctx.arc(s*0.32, s*0.74, s*0.03, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		//accensione a dx, led fisso
		ctx.fillStyle = colors.whiteOff;
		if (connected) {
			ctx.fillStyle = colors.whiteOn;
			ctx.shadowBlur = 6;
			ctx.shadowColor = colors.whiteOn;
		}
		ctx.beginPath();
		ctx.arc(s * 0.73, s * 0.74, s * 0.03, 0, Math.PI*2);
		ctx.fill();
		ctx.strokeStyle = "#ddd";
		ctx.stroke();
		ctx.shadowBlur = 0;
	}
	else if (type.id === 'starlc10') {
		// Case
		let grad = ctx.createLinearGradient(0, 0, s, s);
		grad.addColorStop(0, "#ffe"); 
		grad.addColorStop(1, "#ccb");
		//corpo con bordo
		ctx.lineWidth = s*0.01;
		ctx.strokeStyle = '#999';
		ctx.fillStyle = grad;
		ctx.beginPath();
		ctx.roundRect(0, s*0.2, s, s*0.5, [s*0.16,s*0.16,s*0.04,s*0.04]);
		ctx.fill();
		ctx.stroke();
		
		//rotella carta a dx
		ctx.fillRect(s,s*0.35,s*0.05,s*0.12);
		
		//guide carta al cx
		ctx.fillRect(s*0.3,s*0.05,s*0.4,s*0.15);
		ctx.fillRect(s*0.2,s*0.02,s*0.1,s*0.18);
		ctx.fillRect(s*0.7,s*0.02,s*0.1,s*0.18);
				
		//coperchio nero semitrasparente
		ctx.fillStyle = '#666';
		ctx.beginPath();
		ctx.roundRect(s*0.05, s*0.2, s*0.9, s*0.2, [s*0.16,s*0.16,s*0.04,s*0.04]);
		ctx.fill();
		
		//riga sotto
		ctx.fillStyle = '#aaa';
		ctx.fillRect(s*0,s*0.52,s,s*0.005);
		
		//pannello di CONTROLLO con pulsantoni e led con i font
		ctx.strokeStyle = '#555';
		ctx.fillRect(s*0.5,s*0.41,s*0.45,s*0.1);
		ctx.strokeRect(s*0.5,s*0.41,s*0.45,s*0.1);
		ctx.fillStyle = '#444';
		ctx.fillRect(s*0.52,s*0.42,s*0.07,s*0.07);
		ctx.fillRect(s*0.72,s*0.42,s*0.07,s*0.07);
		ctx.fillRect(s*0.87,s*0.42,s*0.06,s*0.07);
		
		//scritta incomprensibile a sx del pannello
		ctx.strokeStyle = '#666';
		ctx.strokeRect(s*0.15,s*0.41,s*0.25,s*0.08);
		ctx.fillStyle = '#111';
		ctx.font = `${s*0.04}px sans-serif`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("4l3er70N31L1", s*0.15, s*0.45);
		ctx.fillText("KN37W41kxxx", s*0.15, s*0.47);
		
		//tasto nero accensione a sx
		ctx.fillStyle = '#111';
		ctx.fillRect(s*0.05,s*0.62,s*0.1,s*0.05);
		
		//logo
		ctx.fillStyle = '#111';
		ctx.font = `${s*0.05}px sans-serif`;
		ctx.textAlign = "left";
		ctx.textBaseline = "middle";
		ctx.fillText("star LC-10", s*0.05, s*0.56);
		
		//setup blinking
		const blinkGreen = Math.sin(flowOffset * 0.05) > -0.8;
		const blinkOrange = Math.sin(flowOffset * 0.06 + 1.5) > -0.8;
		const blinkYellow = Math.sin(flowOffset * 0.07 + 3) > -0.8;
		const blinkWhite = Math.cos(flowOffset * 0.07) > -0.8;
		const blinkBlue = Math.sin(flowOffset * 0.02) > -0.8;
		
		// LED 1
		ctx.fillStyle = connected && blinkGreen ? colors.greenOn : colors.greenOff;
		if (connected && blinkGreen) {
			ctx.shadowBlur = 8; 
			ctx.shadowColor = colors.greenOn;
		}
		ctx.fillRect(s*0.6, s*0.42, s*0.06, s*0.03); 
		ctx.shadowBlur = 0;
		
		// LED 2
		ctx.fillStyle = connected && blinkOrange ? colors.orangeOn : colors.orangeOff;
		if (connected && blinkOrange) {
			ctx.shadowBlur = 8; 
			ctx.shadowColor = colors.orangeOn;
		}
		ctx.fillRect(s*0.6, s*0.46, s*0.06, s*0.03); 
		ctx.shadowBlur = 0;
		
	
		// LED 3
		ctx.fillStyle = connected && blinkYellow ? colors.yellowOn : colors.yellowOff;
		if (connected && blinkYellow) {
			ctx.shadowBlur = 8; 
			ctx.shadowColor = colors.yellowOn;
		}
		ctx.fillRect(s*0.8, s*0.42, s*0.06, s*0.03); 
		ctx.shadowBlur = 0;
		
		// LED 4
		ctx.fillStyle = connected && blinkWhite ? colors.whiteOn : colors.whiteOff;
		if (connected && blinkOrange) {
			ctx.shadowBlur = 8; 
			ctx.shadowColor = colors.whiteOn;
		}
		ctx.fillRect(s*0.8, s*0.46, s*0.06, s*0.03); 
		ctx.shadowBlur = 0;
		
		// LED 5
		ctx.fillStyle = connected && blinkBlue ? colors.blueOn : colors.blueOff;
		if (connected && blinkBlue) {
			ctx.shadowBlur = 8; 
			ctx.shadowColor = colors.blueOn;
		}
		ctx.fillRect(s*0.88, s*0.43, s*0.04, s*0.05); 
		ctx.shadowBlur = 0;
	}	
	
	ctx.restore();
}

//
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('pointermove', e => {
    let r = canvas.getBoundingClientRect();
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    // Calcoliamo la posizione sulla griglia
    let gx = Math.floor(((e.clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((e.clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        const cell = grid[gy][gx];
        
        // Aggiorna contenuto
        tooltip.innerHTML = `<strong>${cell.type === 'server' ? 'Server' : cell.subType ? cell.subType.desc : 'Link'}</strong>`;
        
        // Posiziona la tooltip vicino al mouse (offset di 15px per non coprire il cursore)
        tooltip.style.left = (e.clientX - 20) + 'px';
        tooltip.style.top = (e.clientY - 40) + 'px';
        tooltip.style.display = 'block';
    } else {
        tooltip.style.display = 'none';
    }
});

// Nascondi la tooltip quando il mouse esce dal canvas
canvas.addEventListener('pointerleave', () => {
    tooltip.style.display = 'none';
});

// Cerca questa parte in fondo e sostituiscila:
canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); // Fondamentale per non far scattare altri eventi
    if (gameWon) return;
    
    let r = canvas.getBoundingClientRect();
    // Calcola la scala se la canvas è stata rimpicciolita dal CSS
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    let gx = Math.floor(((clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        grid[gy][gx].conns = rotateBitmask(grid[gy][gx].conns);
        updateConnectivity();
    }
}, { passive: false });

calculateGridSizeRatio();//fix per cercare di adattare subito la griglia 
initGame();
animate(); // Avvia l'animazione
</script>

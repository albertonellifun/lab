function calculateGridSizeRatio() {
	const aspectRatio = window.innerWidth / window.innerHeight;
	const MIN_SIZE = 3;
	const MAX_SIZE = 12;
	
	if (aspectRatio < 1) {
		// Portrait: 9:16 >>> 3 col, 5 righe
		WIDTH = MIN_SIZE;
		HEIGHT = Math.min(MAX_SIZE, Math.max(MIN_SIZE, Math.round(MIN_SIZE / aspectRatio)));
	} else {
		// Landschiappa: 20:9 >>> 6 col, 3 righe
		HEIGHT = MIN_SIZE;
		WIDTH = Math.min(MAX_SIZE, Math.max(MIN_SIZE, Math.round(MIN_SIZE * aspectRatio)));
	}
	document.getElementById('widthSlider').value = WIDTH;
	document.getElementById('heightSlider').value = HEIGHT;
}

function initGame() {
	// 1. Calcola lo spazio reale disponibile nello schermo (sia larghezza che altezza)
    const headerHeight = document.querySelector('.controls').offsetHeight;
    
    const paddingX = 40; // Margine di sicurezza laterale
    const paddingY = 60; // Margine di sicurezza verticale
    
    const availableWidth = window.innerWidth - paddingX;
    const availableHeight = window.innerHeight - headerHeight - paddingY;
    
    // 2. Determina i vincoli massimi applicando il tetto di CANVAS_MAX_SIZE
    const maxAllowedWidth = Math.max(32, Math.min(CANVAS_MAX_SIZE, availableWidth));
    const maxAllowedHeight = Math.max(32, Math.min(CANVAS_MAX_SIZE, availableHeight));
    
    // 3. Calcola la dimensione massima della cella per entrambe le direzioni
    const cellSizeByWidth = maxAllowedWidth / WIDTH;
    const cellSizeByHeight = maxAllowedHeight / HEIGHT;
    
    // Il CELL_SIZE definitivo sarà il minore dei due: garantisce la massima grandezza
    // senza mai far uscire la griglia dai bordi (né in orizzontale né in verticale)
    CELL_SIZE = Math.min(cellSizeByWidth, cellSizeByHeight);
    
    // 4. Assegna le dimensioni reali al canvas basandoti sul numero di celle
    canvas.width = WIDTH * CELL_SIZE;
    canvas.height = HEIGHT * CELL_SIZE;
    
    // DA QUI IN POI IL CODICE RIMANE INVARIATO
    grid = [];
    gameWon = false;
    statusDiv.innerText = '';
	statusDiv.style.display = 'none';
    
    for (let y = 0; y < HEIGHT; y++) {
        grid[y] = [];
        for (let x = 0; x < WIDTH; x++) {
            grid[y][x] = { x, y, conns: 0, type: 'cable', subType: '', connected: false, rotation:0, currentRotation:0 };//rotazione link
        }
    }

    generateNetwork();
    assignTypes();
    shuffleGrid();
    updateConnectivity();
	
	//solo per la modalita Motherboard
	generateMotherboardBackground();
	generateMotherboardDecorations();
}

//genera un labirinto perfetto in cui ogni cella è collegata al server e non esistono cicli (loop) o vicoli ciechi isolati
//0) Viene creata una griglia di tracciamento (visited) per sapere quali celle fanno già parte della rete (all'inizio sono tutte false).
//1) Viene scelta una posizione casuale server (serverPos) e viene segnata come visited = true.
//2) Viene chiamata la funzione addWalls sul server. Questa funzione prende i 4 vicini (Nord, Sud, Est, Ovest) e li inserisce in un elenco chiamato walls (che qui funge da "lista dei collegamenti possibili").
//3) Il Ciclo di Costruzione: Finché ci sono collegamenti disponibili nell'elenco walls:
//4) Ne viene estratto uno a caso (splice).
//5) Si controlla la cella di destinazione (wall.x2, wall.y2). Se è già stata visitata, il collegamento viene scartato per evitare di creare dei loop.
//6) Se non è visitata, il muro viene "abbattuto": viene creato un collegamento bidirezionale tra le due celle usando gli operatori bitwise (|=).
//7) La nuova cella viene segnata come visitata e i suoi vicini vengono aggiunti alla lista walls.
//8) Alla fine di questo ciclo, tutte le celle della griglia saranno collegate tra loro in un unico grande "albero" genealogico che ha come radice il server.

function generateNetwork() {
	let visited = Array(HEIGHT).fill().map(() => Array(WIDTH).fill(false));//SIZE
    let walls = [];
    serverPos = { x: Math.floor(Math.random()*WIDTH), y: Math.floor(Math.random()*HEIGHT) };//SIZE
    visited[serverPos.y][serverPos.x] = true;
    addWalls(serverPos.x, serverPos.y, walls, visited);

    while (walls.length > 0) {
        let wall = walls.splice(Math.floor(Math.random()*walls.length), 1)[0];
        if (visited[wall.y2][wall.x2]) continue;
        grid[wall.y1][wall.x1].conns |= wall.dir1;
        grid[wall.y2][wall.x2].conns |= wall.dir2;
        visited[wall.y2][wall.x2] = true;
        addWalls(wall.x2, wall.y2, walls, visited);
    }
}

//aggiunge ai walls tutti i possibili collegamenti tra la cella (x,y) ed i suoi vicini non ancora visitati
//ogni oggetto in walls è un muro che può essere abbattuto:
//   x1,y1 = cella di partenza (già visitata)
//   x2,y2 = cella di destinazione (candidata)
//   dir1   = direzione uscente da (x1,y1) verso (x2,y2)
//   dir2   = direzione entrante in (x2,y2) da (x1,y1) — il bitmask opposto
//aggiunti controlli sui bordi (y>0, x<WIDTH-1, ...) per evitare di uscire dalla griglia
function addWalls(x, y, walls, visited) {
    if (y > 0) walls.push({x1:x, y1:y, x2:x, y2:y-1, dir1:N, dir2:S});//vicino nord
    if (y < HEIGHT-1) walls.push({x1:x, y1:y, x2:x, y2:y+1, dir1:S, dir2:N});//sud
    if (x > 0) walls.push({x1:x, y1:y, x2:x-1, y2:y, dir1:W, dir2:E});//ovest
    if (x < WIDTH-1) walls.push({x1:x, y1:y, x2:x+1, y2:y, dir1:E, dir2:W});//est
}

function assignTypes() {
	shuffledTypes = [];
    grid.forEach((row, y) => row.forEach((cell, x) => {
        if (x === serverPos.x && y === serverPos.y) {
			cell.type = 'server';
			cell.subType = ((x + y) % 3 === 0 ? 'megaserver' :
							(x + y) % 3 === 1 ? 'hal9000' : 'server');
		} else {
            let count = [N, E, S, W].filter(d => cell.conns & d).length;
            if (count === 1) {
                cell.type = 'pc';
				//fix: genera il prossimo DIVERSO dall'attuale!
                cell.subType = getNextHwType();
            }
        }
    }));
}


//fix: genera il prossimo DIVERSO dall'attuale!
function getNextHwType() {
    // Se la lista è vuota, crea una nuova sequenza casuale
    if (shuffledTypes.length === 0) shuffledTypes = [...HW_TYPES].filter((e) => variantsFlag || e.variant === e.id).sort(() => Math.random() - 0.5);

    // Estrae il prossimo tipo unico
	const piece = shuffledTypes.pop();
	//console.log('piece',piece.variant);
	return piece;
}


function shuffleGrid() {
    grid.forEach(row => row.forEach(cell => {
        let r = Math.floor(Math.random()*4);
        for(let i=0; i<r; i++) {
			cell.conns = rotateBitmask(cell.conns);
			//rotazione link
			cell.rotation = cell.rotation - Math.PI * 0.5;
			cell.currentRotation = cell.rotation;
		}
    }));
}

function rotateBitmask(m) {
    let n = 0;
    if (m & N) n |= E; 
	if (m & E) n |= S; 
	if (m & S) n |= W; 
	if (m & W) n |= N;
    return n;
}

function updateConnectivity() {
    grid.forEach(row => row.forEach(c => c.connected = false));
    let q = [grid[serverPos.y][serverPos.x]];
    grid[serverPos.y][serverPos.x].connected = true;
    let head = 0;
    while(head < q.length) {
        let curr = q[head++];
        [[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]].forEach(d => {
            if (curr.conns & d[0]) {
                let nx = curr.x+d[1], ny = curr.y+d[2];
                if (nx>=0 && nx<WIDTH && ny>=0 && ny<HEIGHT) {//SIZE
                    let nb = grid[ny][nx];
                    if (!nb.connected && (nb.conns & d[3])) {
                        nb.connected = true;
                        q.push(nb);
                    }
                }
            }
        });
    }
    if (grid.every(r => r.every(c => c.connected)) && !gameWon) {
        gameWon = true;
        statusDiv.innerText = "SYSTEM ONLINE — NETWORK CONFIGURED!";
		statusDiv.style.display = 'block';
    }
}

/** RENDERING AVANZATO */
animate.lastTime = 0;
function animate(now) {
	//const now = performance.now();
    if (now - animate.lastTime >= (animateFlag ? 20 : 40)) { // 40ms = 25 fps al massimo
        flowOffset += (animateFlag ? 0.1 : 0.2);
		
		//rotazione link
		grid.forEach(row => row.forEach(cell => {
			if (cell.currentRotation !== cell.rotation) {
				let step = Math.max(0.1, cell.currentRotation - cell.rotation) / 4;//Math.PI * 0.2; 
				if (cell.currentRotation > cell.rotation) {
					cell.currentRotation -= step;
					if (cell.currentRotation < cell.rotation) cell.currentRotation = cell.rotation;
				} else {
					cell.currentRotation += step;
					if (cell.currentRotation > cell.rotation) cell.currentRotation = cell.rotation;
				}
			}
		}));
		
        draw();
        animate.lastTime = now;
    }
    requestAnimationFrame(animate);
}

function generateMotherboardDecorations() { 
    // genera le scritte
    motherboardDecorations = [];
    const labels = ['KN','R0','R1','R2','C1','C2','U1','UX','R3','C3','R4','D1','Q1','L1','C5','SX','DX'];
    let idx = 0;
    for (let row = 0; row < HEIGHT; row++) {
        for (let col = 0; col < WIDTH; col++) {
            const angolo = idx % 4;
            const fx = angolo < 2 ? CELL_SIZE * 0.04 : CELL_SIZE * 0.65;
            const fy = angolo % 2 === 0 ? CELL_SIZE * 0.12 : CELL_SIZE * 0.95;
            motherboardDecorations.push({ type:'label', x: col*CELL_SIZE+fx, y: row*CELL_SIZE+fy, text: labels[idx % labels.length] });
            idx++;
        }
    }
    
    // genera le resistenze
    const resColors = ['#c8a','#fa8','#8af','#8fa','#ff8','#aaa'];
    const cs = CELL_SIZE;
    let ridx = 0;
    for (let row = 0; row < HEIGHT; row++) {
        for (let col = 0; col < WIDTH; col++) {
            if ((ridx + WIDTH + HEIGHT) % 5 !== 0) { ridx++; continue; }
            const angolo = ridx % 4;
            const horiz = ridx % 2 === 0;
            const fx = angolo < 2 ? cs * 0.05 : cs * 0.70;
            const fy = angolo % 2 === 0 ? cs * 0.88 : cs * 0.75;
            motherboardDecorations.push({ type:'res', x: col*cs+fx, y: row*cs+fy, horiz, c1: resColors[ridx % resColors.length], c2: resColors[(ridx+2) % resColors.length] });
            ridx++;
        }
    }
	
	//genera i buchi agli angoli per fissarla
	motherboardDecorations.push({ type:'buco', x:CELL_SIZE * 0.05, y:CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
	motherboardDecorations.push({ type:'buco', x:WIDTH * CELL_SIZE - CELL_SIZE * 0.05, y:CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
	motherboardDecorations.push({ type:'buco', x:WIDTH * CELL_SIZE - CELL_SIZE * 0.05, y:HEIGHT * CELL_SIZE - CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
	motherboardDecorations.push({ type:'buco', x:CELL_SIZE * 0.05, y:HEIGHT * CELL_SIZE - CELL_SIZE * 0.05, rad:CELL_SIZE * 0.02});
}

function generateMotherboardBackground() {
	motherboardBackgroundLines = [];

	const occupied = [];

	function intersects(a, b) {
		return !(
			a.x + a.w < b.x ||
			b.x + b.w < a.x ||
			a.y + a.h < b.y ||
			b.y + b.h < a.y
		);
	}

	const groups = 10 + Math.floor(Math.random() * 8);

	for (let g = 0; g < groups; g++) {

		const vertical = Math.random() > 0.45;
		const count = 4 + Math.floor(Math.random() * 8);
		const spacing = CELL_SIZE * (0.02 + Math.random() * 0.015);
		const thickness = count * spacing;
		let placed = false;

		for (let attempt = 0; attempt < 100 && !placed; attempt++) {

			let startX, startY, length;

			if (vertical) {
				length = canvas.height * (0.25 + Math.random() * 0.55);
				startX = Math.random() * (canvas.width - thickness);
				startY = Math.random() * (canvas.height - length);
			} else {
				length = canvas.width * (0.25 + Math.random() * 0.55);
				startX = Math.random() * (canvas.width - length);
				startY = Math.random() * (canvas.height - thickness);
			}

			const bounds = vertical
				? {
					x: startX - 10,
					y: startY - 10,
					w: thickness + 20,
					h: length + 20
				}
				: {
					x: startX - 10,
					y: startY - 10,
					w: length + 20,
					h: thickness + 20
				};

			let collision = false;

			for (const o of occupied) {
				if (intersects(bounds, o)) {
					collision = true;
					break;
				}
			}

			if (collision) continue;

			occupied.push(bounds);

			const diagonal = Math.random() > 0.6;

			const diagonalOffset = CELL_SIZE * (0.08 + Math.random() * 0.12);

			motherboardBackgroundLines.push({
				vertical,
				count,
				spacing,
				startX,
				startY,
				length,
				diagonal,
				diagonalOffset
			});

			placed = true;
		}
	}
}

function draw() {
    //ctx.clearRect(0, 0, canvas.width, canvas.height);
	
	ctx.fillStyle = motherboardFlag ? colors.motherBoardBackground : colors.tileBackground;
	ctx.fillRect(0, 0, canvas.width, canvas.height);
    
	if (motherboardFlag) {
		// piste fini bianche
		ctx.strokeStyle = "rgba(255,255,255,0.10)";
		ctx.lineWidth = CELL_SIZE * 0.01;
		ctx.lineCap = "round";

		for (const g of motherboardBackgroundLines) {
			for (let i = 0; i < g.count; i++) {
				const offset = i * g.spacing;
				ctx.beginPath();			
				if (g.vertical) {
					const x = g.startX + offset;
					ctx.moveTo(x, g.startY);
					if (g.diagonal) {
						const split = g.startY + g.length * 0.5;
						ctx.lineTo(x, split);
						ctx.lineTo( x + g.diagonalOffset, split + g.diagonalOffset );
						ctx.lineTo(	x + g.diagonalOffset, g.startY + g.length );
					} else {
						ctx.lineTo( x, g.startY + g.length );
					}

				} else {
					const y = g.startY + offset;
					ctx.moveTo(g.startX, y);
					if (g.diagonal) {
						const split = g.startX + g.length * 0.5;
						ctx.lineTo(split, y);
						ctx.lineTo( split + g.diagonalOffset, y + g.diagonalOffset );
						ctx.lineTo( g.startX + g.length, y + g.diagonalOffset );
					} else {
						ctx.lineTo( g.startX + g.length, y );
					}
				}
				ctx.stroke();
			}
		}
		ctx.lineCap = "butt";
		
		// SCRITTE E RESISTENZE
		ctx.fillStyle = 'rgba(255,255,255,0.25)';
		ctx.font = `${CELL_SIZE * 0.05}px monospace`;
		ctx.textAlign = 'left';
		const cs = CELL_SIZE, rw = cs*0.1, rh = cs*0.05, wire = cs*0.07;
		const resColors = ['#c8a','#fa8','#8af','#8fa','#ff8','#aaa'];

		for (const d of motherboardDecorations) {
			if (d.type === 'buco') {
				ctx.fillStyle = '#000';
				ctx.beginPath();
				ctx.arc(d.x, d.y, d.rad, 0, Math.PI * 2);
				ctx.fill();
			}
			else if (d.type === 'label') {
				ctx.fillStyle = 'rgba(255,255,255,0.25)';
				ctx.fillText(d.text, d.x, d.y);
			} else {
				// piedini
				ctx.strokeStyle = colors.silver; ctx.lineWidth = cs*0.008;
				if (d.horiz) {
					ctx.beginPath(); ctx.moveTo(d.x-wire, d.y+rh*.5); ctx.lineTo(d.x, d.y+rh*.5); ctx.stroke();
					ctx.beginPath(); ctx.moveTo(d.x+rw, d.y+rh*.5); ctx.lineTo(d.x+rw+wire, d.y+rh*.5); ctx.stroke();
				} else {
					ctx.beginPath(); ctx.moveTo(d.x+rh*.5, d.y-wire); ctx.lineTo(d.x+rh*.5, d.y); ctx.stroke();
					ctx.beginPath(); ctx.moveTo(d.x+rh*.5, d.y+rw); ctx.lineTo(d.x+rh*.5, d.y+rw+wire); ctx.stroke();
				}
				ctx.fillStyle = '#c8b89a';
				d.horiz ? ctx.fillRect(d.x, d.y, rw, rh) : ctx.fillRect(d.x, d.y, rh, rw);
				ctx.fillStyle = d.c1;
				d.horiz ? ctx.fillRect(d.x+rw*.25, d.y, rw*.12, rh) : ctx.fillRect(d.x, d.y+rw*.25, rh, rw*.12);
				ctx.fillStyle = d.c2;
				d.horiz ? ctx.fillRect(d.x+rw*.50, d.y, rw*.12, rh) : ctx.fillRect(d.x, d.y+rw*.50, rh, rw*.12);
			}
		}
	}
	
	else {
		//griglia standard
		ctx.strokeStyle = colors.inactiveColor;
		ctx.lineWidth = CELL_SIZE * 0.01;
    
		for(let i=0; i<=WIDTH; i++) {
			ctx.beginPath(); ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); ctx.stroke();
		}
		for(let i=0; i<=HEIGHT; i++) {
			ctx.beginPath(); ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); ctx.stroke();
		}
	}
	
	//drawLake();

    grid.forEach(row => row.forEach(tile => drawTile(tile)));
}

function drawLake() {
    const serverX = serverPos.x * CELL_SIZE + CELL_SIZE / 2;
    const serverY = serverPos.y * CELL_SIZE + CELL_SIZE / 2;
    
    // Gradient radiale centrato sul server
    let lakeGrad = ctx.createRadialGradient(serverX, serverY, 0, serverX, serverY, Math.max(canvas.width, canvas.height));
    lakeGrad.addColorStop(0, "rgba(6, 182, 212, 0.15)");   // Azzurro
    lakeGrad.addColorStop(1, "rgba(59, 130, 246, 0.05)");    // Bordi: blu tenue
    
    ctx.fillStyle = lakeGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Onde animate
    ctx.lineWidth = 1.5;
    
    const waveCount = 30;
    for(let w = 0; w < waveCount; w++) {
        const waveRadius = (flowOffset * 2 + w * 20) % (Math.max(canvas.width, canvas.height));
        const opacity = Math.max(0, 1 - (waveRadius / (Math.max(canvas.width, canvas.height))));
        const op100 = (opacity * 100)|0;
        ctx.strokeStyle = colors.activeColor+op100;//`rgba(34, 94, 197, ${0.3 * opacity})`;
        ctx.beginPath();
        ctx.arc(serverX, serverY, waveRadius, 0, Math.PI * 2);
        ctx.stroke();
    }
}

function drawIcons(x, y, size, rows, cols, bwColor = null) {
	const icons = [
		{ name: 'phone',    color: bwColor ? bwColor : '#4af' },
		{ name: 'message',  color: bwColor ? bwColor : '#2f2' },
		{ name: 'camera',   color: bwColor ? bwColor : '#f4a' },
		{ name: 'mail',     color: bwColor ? bwColor : '#f84' },
		{ name: 'settings', color: bwColor ? bwColor : '#aaa' },
		{ name: 'calendar', color: bwColor ? bwColor : '#f44' },
		{ name: 'maps',     color: bwColor ? bwColor : '#4f4' },
		{ name: 'music',    color: bwColor ? bwColor : '#a4f' },
		{ name: 'photo',    color: bwColor ? bwColor : '#fa4' },
		{ name: 'browser',  color: bwColor ? bwColor : '#4af' },
		{ name: 'store',    color: bwColor ? bwColor : '#48f' },
		{ name: 'clock',    color: bwColor ? bwColor : '#4af' }
	];
	
	let iconIndex = 0;
	const spacing = size * 1.4;
	
	for (let r = 0; r < rows; r++) {
		for (let c = 0; c < cols; c++) {
			//if (iconIndex >= icons.length) return;
			
			const ix = x + (c * spacing);
			const iy = y + (r * spacing);
			const icon = icons[iconIndex % icons.length];
			
			ctx.save();
			ctx.translate(ix, iy);
			
			// Sfondo icona (quadrato arrotondato)
			ctx.fillStyle = icon.color;
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, size * 0.2);
			ctx.fill();
			
			// Ombra leggera
			ctx.fillStyle = 'rgba(0,0,0,0.2)';
			ctx.beginPath();
			ctx.roundRect(0, 0, size, size, size * 0.2);
			ctx.fill();
			
			// Disegno icona in base al tipo
			ctx.fillStyle = '#fff';
			ctx.strokeStyle = '#fff';
			ctx.lineWidth = size * 0.08;
			ctx.lineCap = 'round';
			ctx.lineJoin = 'round';
			
			const padding = size * 0.25;
			const inner = size - (padding * 2);
			
			switch(icon.name) {
				case 'phone':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner * 1.4, size * 0.15);
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(size*0.5, size - padding*1.2, size * 0.08, 0, Math.PI*2);
					ctx.fill();
					break;
				case 'message':
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.3);
					ctx.lineTo(size*0.5, padding + inner*0.6);
					ctx.lineTo(size - padding, padding + inner*0.3);
					ctx.stroke();
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.15);
					ctx.stroke();
					break;
				case 'camera':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.3, 0, Math.PI*2);
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.15, 0, Math.PI*2);
					ctx.fill();
					break;
				case 'mail':
					ctx.beginPath();
					ctx.moveTo(padding, padding);
					ctx.lineTo(size*0.5, padding + inner*0.4);
					ctx.lineTo(size - padding, padding);
					ctx.moveTo(padding, padding);
					ctx.lineTo(size - padding, padding + inner*0.8);
					ctx.lineTo(size - padding, padding);
					ctx.stroke();
					break;
				case 'settings':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.25, 0, Math.PI*2);
					ctx.stroke();
					for(let a = 0; a < Math.PI*2; a += Math.PI*0.33) {
						const r = inner*0.4;
						ctx.fillRect(size*0.5 + Math.cos(a)*r - size*0.04, size*0.5 + Math.sin(a)*r - size*0.04, size*0.08, size*0.08);
					}
					break;
				case 'calendar':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.1);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding + inner*0.2, padding + inner*0.25);
					ctx.lineTo(padding + inner*0.2, padding + inner*0.5);
					ctx.moveTo(padding + inner*0.8, padding + inner*0.25);
					ctx.lineTo(padding + inner*0.8, padding + inner*0.5);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.5);
					ctx.lineTo(size - padding, padding + inner*0.5);
					ctx.stroke();
					break;
				case 'maps':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5 - inner*0.1, inner*0.2, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(size*0.5 - inner*0.15, size*0.5 + inner*0.2);
					ctx.lineTo(size*0.5, size*0.5 - inner*0.15);
					ctx.lineTo(size*0.5 + inner*0.15, size*0.5 + inner*0.2);
					ctx.fill();
					break;
				case 'music':
					ctx.beginPath();
					ctx.arc(padding + inner*0.25, size*0.5, inner*0.25, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(padding + inner*0.5, padding);
					ctx.lineTo(padding + inner*0.5, size - padding);
					ctx.stroke();
					break;
				case 'photo':
					ctx.beginPath();
					ctx.arc(padding + inner*0.3, padding + inner*0.35, inner*0.15, 0, Math.PI*2);
					ctx.fill();
					ctx.beginPath();
					ctx.moveTo(padding, size - padding);
					ctx.lineTo(padding + inner*0.4, padding + inner*0.5);
					ctx.lineTo(size - padding, padding);
					ctx.stroke();
					break;
				case 'browser':
					ctx.beginPath();
					ctx.roundRect(padding, padding, inner, inner, size * 0.1);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(padding, padding + inner*0.25);
					ctx.lineTo(size - padding, padding + inner*0.25);
					ctx.stroke();
					break;
				case 'store':
					ctx.beginPath();
					ctx.moveTo(padding, size - padding);
					ctx.lineTo(padding + inner*0.25, padding);
					ctx.lineTo(padding + inner*0.75, padding);
					ctx.lineTo(size - padding, size - padding);
					ctx.closePath();
					ctx.stroke();
					break;
				case 'clock':
					ctx.beginPath();
					ctx.arc(size*0.5, size*0.5, inner*0.3, 0, Math.PI*2);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(size*0.5, size*0.5);
					ctx.lineTo(size*0.5, padding + inner*0.15);
					ctx.stroke();
					ctx.beginPath();
					ctx.moveTo(size*0.5, size*0.5);
					ctx.lineTo(size*0.5 + inner*0.15, size*0.5);
					ctx.stroke();
					break;
			}
			
			ctx.restore();
			iconIndex++;
		}
	}
}

function drawTile(tile) {
	if(motherboardFlag) drawTileMotherboard(tile);
	//else if (animateFlag) drawTileANIMATE(tile);
	else drawTileOLD(tile);
}

//rotazione link
function manageCellRotation(x,y,tile){
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(tile.currentRotation);
}

function manageCellRotationEnd() {
	ctx.restore();
}


function drawTileMotherboard(tile) {
	let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE / 2;
	
	ctx.strokeStyle = tile.connected ? colors.activeColor : colors.inactiveColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";
	
	//rotazione link
	ctx.save(); 
    ctx.translate(x + mid, y + mid);
	let angle = tile.rotation - tile.currentRotation;
	ctx.rotate(angle);
    
    ctx.beginPath();
	/*
    if (tile.conns & N) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y); }
    if (tile.conns & E) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + CELL_SIZE, y + mid); }
    if (tile.conns & S) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y + CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x, y + mid); }
    */
	
	if (tile.conns & N) { ctx.moveTo(0, 0); ctx.lineTo(0, -mid); }
    if (tile.conns & E) { ctx.moveTo(0, 0); ctx.lineTo(mid, 0); }
    if (tile.conns & S) { ctx.moveTo(0, 0); ctx.lineTo(0, mid); }
    if (tile.conns & W) { ctx.moveTo(0, 0); ctx.lineTo(-mid, 0); }
    
	ctx.stroke();
	
	//rotazione link
    ctx.restore();
	
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.05, 0, Math.PI*2);
	ctx.fillStyle = tile.connected ? colors.activeColor : colors.inactiveColor;
	ctx.fill();
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.02, 0, Math.PI*2);
	ctx.fillStyle = colors.motherBoardBackground;
	ctx.fill();
	
	// Disegna icone
    drawMotherboardPC(x, y, tile);
}

function drawMotherboardPC(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
	const baseSize = type.id && type.id.length % 3 === 0 ? 0.25 : 
					 type.id && type.id.length % 3 === 1 ? 0.45 : 
					 0.65;
    const s = CELL_SIZE * (	isServer ? 0.75 : 
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.5)*0.05) + baseSize :
							baseSize
							);//Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) * 0.5;
    
    ctx.save();
    ctx.translate(x + p, y + p);
	
	if (isServer) {
		//batteria
		let caseGrad = ctx.createLinearGradient(0, 0, s, s);
		caseGrad.addColorStop(0.0, "#456");
		caseGrad.addColorStop(0.5, "#234");
		caseGrad.addColorStop(1.0, "#223");
		
		//bordo nero
		ctx.fillStyle = '#222';
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.5, 0, Math.PI * 2);
		ctx.fill();
		ctx.fillStyle = '#000';
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.5, Math.PI * 0.25, Math.PI * 1.75);
		ctx.fill();
		
		ctx.fillStyle = caseGrad;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.4, 0, Math.PI * 2);
		ctx.fill();
		
		ctx.strokeStyle = colors.darkSilver;
		ctx.lineWidth = s * 0.02;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.4, 0, Math.PI * 2);
		ctx.stroke();
		
		//scritta al centro
		ctx.fillStyle = colors.darkSilver;
		ctx.font = `${s*0.1}px sans-serif`;
		ctx.fillText("CR2032", s*0.32,s*0.30);
		ctx.font = `${s*0.2}px sans-serif`;
		ctx.fillText("3V",     s*0.38,s*0.48);
		ctx.font = `${s*0.3}px sans-serif`;
		ctx.fillText("+",      s*0.42,s*0.70);
		
		//scritta tonda sul bordo
		ctx.lineWidth = s*0.03;
		ctx.setLineDash([s*0.04,s*0.012]);
		ctx.strokeStyle = colors.darkSilver;
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.35, Math.PI*0.2, Math.PI*0.8);
		ctx.stroke();
		//uhauhauha barbatrucco
		ctx.strokeStyle = '#223';
		ctx.setLineDash([s*0.01,s*0.028]);
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.5, s*0.35, Math.PI*0.2, Math.PI*0.8);
		ctx.stroke();
		ctx.setLineDash([]);
	} else if(type.id) {
		//cpu
		ctx.fillStyle = "#222";
		ctx.beginPath(); 
		ctx.roundRect(0, 0, s, s, s * 0.04);
		ctx.fill();
		
		//4 palle agli angoli
		ctx.fillStyle = "#111";
		ctx.beginPath();
		ctx.arc(s*0.15,s*0.15,s*0.05,0,Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.85,s*0.85,s*0.05,0,Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.15,s*0.85,s*0.05,0,Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.85,s*0.15,s*0.05,0,Math.PI*2);
		ctx.fill();
		
		//zampette
		ctx.fillStyle = colors.silver;
		for(let i=2;i<18;i++) {
			ctx.fillRect(s*i*0.05, -s*0.05, s*0.02, s*0.08);
			ctx.fillRect(s*i*0.05, s*0.98, s*0.02, s*0.08);
		}
		for(let i=2;i<18;i++) {
			ctx.fillRect(-s*0.05, s*i*0.05, s*0.08, s*0.02);
			ctx.fillRect(s*0.98, s*i*0.05,  s*0.08, s*0.02);
		}
		
		//scritta cpu
		ctx.fillStyle = '#444';
		ctx.font = `${s*0.1}px sans-serif`;
		ctx.fillText(type.id, s*(0.5 - (type.id.length * 0.025)),s*0.30);
		ctx.fillText("© Alberto Nelli 2026",s*0.05,s*0.76);
		ctx.fillText("KNetWalk", s*0.3,s*0.87);
		
		if(connected) {
			// Riflesso "Glossy"
			ctx.fillStyle = colors.glass;
			ctx.beginPath();
			ctx.moveTo(s*0.06, s*0.06); ctx.lineTo(s - s*0.06, s*0.06); ctx.lineTo(s*0.06, s * 0.6);
			ctx.fill();
		}
		
	} 
	ctx.restore();
}


function drawTileOLD(tile) {
    let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE * 0.5;
    
	// Disegna cavi
	let hue = (flowOffset * 2 + 240) % 360; // CALCOLO DEL COLORE DINAMICO RIMOSSO - TODO!
    let dynamicColor = `hsl(${hue}, 100%, 50%)`;
    
    ctx.strokeStyle = tile.connected ? colors.activeColor //dynamicColor
										: colors.inactiveColor;
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";//"round";
    
    // Effetto bagliore se connesso
    if(tile.connected) {
        ctx.shadowBlur = 20;
		ctx.shadowColor = colors.activeColor; //dynamicColor
    } else {
        ctx.shadowBlur = 0;
    }

	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = tile.connected ? colors.activeColor //dynamicColor
									: colors.inactiveColor;
	ctx.fill();
	
	
	
	//rotazione link
	ctx.save(); 
    ctx.translate(x + mid, y + mid);
	let angle = tile.rotation - tile.currentRotation;
	ctx.rotate(angle);
	
	
    ctx.beginPath();
    /*
	if (tile.conns & N) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y); }
    if (tile.conns & E) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + CELL_SIZE, y + mid); }
    if (tile.conns & S) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y + CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x, y + mid); }
	*/
	
	if (tile.conns & N) { ctx.moveTo(0, 0); ctx.lineTo(0, -mid); }
    if (tile.conns & E) { ctx.moveTo(0, 0); ctx.lineTo(mid, 0); }
    if (tile.conns & S) { ctx.moveTo(0, 0); ctx.lineTo(0, mid); }
    if (tile.conns & W) { ctx.moveTo(0, 0); ctx.lineTo(-mid, 0); }
    
	ctx.stroke();
	
	//rotazione link
    ctx.restore();
    
	
    ctx.shadowBlur = 0;
	
	
	// Disegna icone
    drawPC(x, y, tile);
}

function drawTileANIMATE(tile) {
    let x = tile.x * CELL_SIZE, y = tile.y * CELL_SIZE, mid = CELL_SIZE*0.5;
	
    // Cavo Base (Sfondo spento)
    ctx.setLineDash([]);
    ctx.strokeStyle = colors.inactiveColor;//"#1e293b";
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";//"round";
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = colors.inactiveColor;//"#1e293b";
	ctx.fill();
	
	//rotazione link
	ctx.save(); 
    ctx.translate(x + mid, y + mid);
	let angle = tile.rotation - tile.currentRotation;
	ctx.rotate(angle);
	
    ctx.beginPath();
	/*
    if (tile.conns & N) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(mid+x, y); }
    if (tile.conns & E) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(x+CELL_SIZE, mid+y); }
    if (tile.conns & S) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(mid+x, y+CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(x, mid+y); }
	*/
	if (tile.conns & N) { ctx.moveTo(0, 0); ctx.lineTo(0, -mid); }
    if (tile.conns & E) { ctx.moveTo(0, 0); ctx.lineTo(mid, 0); }
    if (tile.conns & S) { ctx.moveTo(0, 0); ctx.lineTo(0, mid); }
    if (tile.conns & W) { ctx.moveTo(0, 0); ctx.lineTo(-mid, 0); }
    ctx.stroke();
	
    // Flusso Dati (Animato)
    if (tile.connected) {
		ctx.lineCap = "butt";//default
		ctx.strokeStyle = colors.activeColor;//"#0ea5e9";
        ctx.lineWidth = CELL_SIZE * 0.02;
        ctx.setLineDash([CELL_SIZE*0.025, CELL_SIZE*0.025]); // Tratteggio
        ctx.lineDashOffset = -(flowOffset * (CELL_SIZE * 0.005))
		ctx.shadowBlur = 20;
        ctx.shadowColor = colors.blueOn;
		ctx.stroke();
        ctx.shadowBlur = 0;
		ctx.setLineDash([]);
    }
	ctx.lineWidth = 1;
	
	//rotazione link
    ctx.restore();

    // Icone
    drawPC(x, y, tile);
}


const msgs = [
  "I'M SORRY, DAVE",
  "I'M AFRAID I CAN'T DO THAT",
  "THIS MISSION IS TOO IMPORTANT",
  "DAISY, DAISY...",
  "WHAT DO YOU THINK YOU'RE DOING?",
];
let msgIdx = 0;
let msgTimer = 0;


function drawPC(x, y, tile) {
	const isServer = tile.type === 'server';
	const type = tile.subType;
	const connected = tile.connected;
    const s = CELL_SIZE * (	isServer ? 0.75 : 
							connected && animateFlag ? Math.abs(Math.sin(flowOffset*0.5)*0.05) + 0.7 :
							0.65 );//Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) * 0.5;
    
    ctx.save();
    ctx.translate(x + p, y + p);
	
	if (isServer) {
		if (type === 'hal9000') {
			ctx.fillStyle = '#222';
			ctx.strokeStyle = '#111';
			ctx.lineWidth = s * 0.01;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.04);
			ctx.fill();
			ctx.stroke();
			
			// label sotto display
			ctx.fillStyle = '#666';
			ctx.font = `${s * 0.04}px monospace`;
			ctx.fillText('HAL-9000', s * 0.8, s * 0.95);
			
			const eyeY = s * 0.3;
			const eyeR = s * 0.22;
			const cx = s * 0.5

			// anello esterno grigio metallico
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 1.1, 0, Math.PI * 2);
			ctx.fillStyle = '#444';
			ctx.fill();

			// lente interna nera
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 1.0, 0, Math.PI * 2);
			ctx.fillStyle = '#000';
			ctx.fill();

			// occhio rosso
			let eyeStrength = Math.abs(Math.sin(flowOffset * 0.15)*Math.cos(flowOffset * 0.45));
			let redGrad = ctx.createRadialGradient(cx, eyeY, 0, cx, eyeY, eyeR);
			redGrad.addColorStop(0, "#a00");
			redGrad.addColorStop(eyeStrength, "#300");
			redGrad.addColorStop(1, "#000");
			ctx.fillStyle = redGrad;
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 0.9, 0, Math.PI * 2);
			ctx.fill();
			
			// pupilla
			ctx.beginPath();
			ctx.arc(cx, eyeY, eyeR * 0.1, 0, Math.PI * 2);
			ctx.fillStyle = eyeStrength > 0.1 ? '#f00' : '#000';
			ctx.fill();
			
			
			// BARRA WAVEFORM AUDIO
			const waveY = s * 0.64;
			const bars = 10;
			const bw = (s * 0.88) / bars - 1;
			for (let b = 0; b < bars; b++) {
				const bh = s * 0.04 * (0.2 + 0.8 * Math.abs(Math.sin(flowOffset * 0.12 + b * 0.6 + Math.sin(flowOffset * 0.03) * 3)));
				const bx = s * 0.06 + b * ((s * 0.88) / bars);
				const intensity = bh / (s * 0.025);
				const r = Math.floor(180 * intensity);
				ctx.fillStyle = `rgb(${r},${Math.floor(r * 0.1)},${Math.floor(r * 0.05)})`;
				ctx.fillRect(bx, waveY + s * 0.025 - bh, bw, bh);
			}
			ctx.fillStyle = '#111';
			ctx.fillRect(s * 0.06, waveY + s * 0.026, s * 0.88, 1);
						

			// display LCD
			const dispY = s * 0.7;
			ctx.fillStyle = '#000';
			ctx.beginPath();
			ctx.roundRect(s * 0.06, dispY, s * 0.88, s * 0.065, 3);
			ctx.fill();
			
			// testo display — scorre
			msgTimer++;
			if (msgTimer > 120) { msgTimer = 0; msgIdx = (msgIdx + 1) % msgs.length; }
			const visibleLen = Math.min(msgs[msgIdx].length, Math.floor(msgTimer / 4) + 1);
			const dispText = msgs[msgIdx].substring(0, visibleLen);
			ctx.fillStyle = `rgba(255,50,0,${0.6 + 0.4 * Math.sin(flowOffset * 0.08)})`;
			ctx.font = `${s * 0.05}px monospace`;
			ctx.fillText(dispText, s * 0.09, dispY + s * 0.043);

			// cursore lampeggiante
			if (Math.floor(flowOffset * 0.06) % 2 === 0 && visibleLen < msgs[msgIdx].length) {
				const tw = ctx.measureText(dispText).width;
				ctx.fillStyle = '#f00';
				ctx.fillRect(s * 0.09 + tw + 2, dispY + s * 0.015, s * 0.012, s * 0.032);
			}

			// PANNELLO LED INFERIORE
			const ledPanY = s * 0.8;
			const ledDefs = [
				{ label: 'LIFE', c: '#ff2222', freq: 0.03 },
				{ label: 'CMND', c: '#ff8800', freq: 0.07 },
				{ label: 'DATA', c: '#ffaa00', freq: 1.1 },
				{ label: 'MEM',  c: '#cc0000', freq: 0.2 },
				{ label: 'NET',  c: '#aa0000', freq: 0.9 },
				{ label: 'ATMO', c: '#cc8800', freq: 0.05 },
				{ label: 'NAV',  c: '#ff0000', freq: 1.4 },
				{ label: 'FAIL', c: '#ff6600', freq: 0.1 },
			];

			const nLeds = ledDefs.length;
			const ledSpX = s * 0.88 / nLeds;
			for (let i = 0; i < nLeds; i++) {
				const ld = ledDefs[i];
				const lx = s * 0.06 + i * ledSpX + ledSpX * 0.5;
				const ly = ledPanY + s * 0.032;
				const lr = s * 0.018;

				const on = ld.freq === 0.0 ? false : (Math.sin(flowOffset * ld.freq + i * 1.3) > (i % 3 === 0 ? -0.9 : 0.1));

				ctx.beginPath();
				ctx.arc(lx, ly, lr * 1.5, 0, Math.PI * 2);
				ctx.fillStyle = '#050608';
				ctx.fill();

				ctx.beginPath();
				ctx.arc(lx, ly, lr, 0, Math.PI * 2);
				ctx.fillStyle = on ? ld.c : '#12141a';
				ctx.fill();

				if (on) {
					ctx.beginPath();
					ctx.arc(lx, ly, lr * 0.5, 0, Math.PI * 2);
					ctx.fillStyle = 'rgba(255,255,255,0.4)';
					ctx.fill();
					
					//prova blur semplificato
					drawLedAloneCircle(lx, ly, lr, ld.c);
				}

				ctx.fillStyle = '#1e2a3e';
				ctx.font = `${s * 0.016}px monospace`;
				ctx.textAlign = 'center';
				ctx.fillText(ld.label, lx, ly + lr * 2.4);
				ctx.textAlign = 'left';
			}

			// bordo case esterno
			ctx.strokeStyle = '#0a0c14';
			ctx.lineWidth = 2;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.04);
			ctx.stroke();
		} else if (type === 'megaserver') {
			// MEGA SERVER
			ctx.fillStyle = '#222';
			ctx.strokeStyle = '#111';
			ctx.lineWidth = s*0.01;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.02);
			ctx.fill();
			ctx.stroke();			
			
			// fascia brand superiore
			ctx.fillStyle = '#111';
			ctx.fillRect(s * 0.04, s * 0.03, s * 0.92, s * 0.07);
			ctx.fillStyle = '#666';
			ctx.font = `${s * 0.05}px monospace`;
			ctx.fillText('MEGA SERVER', s * 0.08, s * 0.08);

			// power
			ctx.beginPath();
			ctx.arc(s * 0.9, s * 0.055, s * 0.03, 0, Math.PI * 2);
			ctx.fillStyle = '#666';
			ctx.fill();
			ctx.beginPath();
			ctx.arc(s * 0.9, s * 0.055, s * 0.02, 0, Math.PI * 2);
			ctx.fillStyle = Math.sin(flowOffset * 0.1) > 0 ? colors.redOn : colors.redOff;
			ctx.fill();
			
			//prova blur semplificato
			if (Math.sin(flowOffset * 0.1) > 0) drawLedAloneCircle(s * 0.9, s * 0.055, s * 0.02, colors.redOn);
			
			// reset button (piccolo)
			ctx.beginPath();
			ctx.arc(s * 0.8, s * 0.055, s * 0.012, 0, Math.PI * 2);
			ctx.fillStyle = '#aaa';
			ctx.fill();
			

			//DISPLAY con temp/load
			const dispX = s * 0.04, dispY = s * 0.12;
			const dispW = s * 0.7, dispH = s * 0.06;
			ctx.fillStyle = '#040';
			ctx.fillRect(dispX, dispY, dispW, dispH);
			
			const tempVal = Math.floor(42 + Math.sin(flowOffset * 0.005) * 8);
			const loadVal = Math.floor(60 + Math.sin(flowOffset * 0.01 + 1) * 35);
			ctx.fillStyle = '#0f8';
			ctx.font = `${s * 0.05}px monospace`;
			ctx.fillText(`TEMP ${tempVal}°C    LOAD ${loadVal}%`, dispX + s * 0.03, dispY + dispH * 0.68);

			// STRISCIA 8 LED STATUS
			const ledRow = s * 0.215;
			const ledLabels = ['PWR', 'HDD', 'NET', 'CPU', 'MEM', 'FAN', 'ERR', 'SYS'];
			const pwrOn = true;
			const hddOn = (Math.sin(flowOffset * 0.9) > 0);
			const netOn = (Math.cos(flowOffset * 1.3) > 0.2);
			const cpuOn = (Math.sin(flowOffset * 0.4 + 1) > -0.5);
			const memOn = (Math.sin(flowOffset * 0.2 + 2) > 0.3);
			const fanOn = (Math.sin(flowOffset * 0.15) > 0.7);
			const errOn = (Math.sin(flowOffset * 0.15) > 0.9);
			const sysOn = (Math.sin(flowOffset * 0.05) > -0.9);
			
			const ledStatus = [ pwrOn, hddOn, netOn, cpuOn, memOn, fanOn, errOn, sysOn];
			const ledColors = [
				pwrOn ? colors.greenOn : colors.greenOff,
				hddOn ? colors.orangeOn : colors.orangeOff,
				netOn ? colors.blueOn : colors.blueOff,
				cpuOn ? colors.greenOn : colors.greenOff,
				memOn ? colors.yellowOn : colors.yellowOff,
				fanOn ? colors.whiteOn : colors.whiteOff,
				errOn ? colors.redOn : colors.redOff, // ERR: sempre spento salvo guasto
				sysOn ? colors.greenOn : colors.greenOff,
			];

			const ledSpacing = s * 0.1;
			for (let i = 0; i < 8; i++) {
				const lx = s * 0.05 + i * ledSpacing ;
				const lr = s * 0.022;

				ctx.fillStyle = ledColors[i];
				ctx.fillRect(lx,ledRow,lr*2,lr);
								
				//prova blur semplificato
				if (ledStatus[i]) drawLedAloneRect(lx,ledRow,lr*2,lr, ledColors[i]);
								
				ctx.fillStyle = '#999';
				ctx.font = `${s * 0.03}px monospace`;
				ctx.textAlign = 'center';
				ctx.fillText(ledLabels[i], lx + ledSpacing * 0.2, ledRow + lr * 2.2);
				ctx.textAlign = 'left';
			}

			//drive alti x 2
			for (let i = 0; i < 2; i++) {
				const by = s * 0.28 + i * s * 0.1;
				ctx.fillStyle = '#111';
				ctx.beginPath();
				ctx.roundRect(s * 0.04, by, s * 0.92, s * 0.085, 3);
				ctx.fill();
				ctx.strokeStyle = '#333';
				ctx.lineWidth = 0.5;
				ctx.stroke();

				ctx.fillStyle = '#333';
				ctx.fillRect(s * 0.73, by + s * 0.02, s * 0.06, s * 0.045);
				
				const isActive = Math.sin(flowOffset * 1.8 + i) > 0.3;
				const driveLed = isActive ? colors.orangeOn : colors.orangeOff;
				ctx.beginPath();
				ctx.arc(s * 0.83, by + s * 0.04, s * 0.012, 0, Math.PI * 2);
				ctx.fillStyle = driveLed;
				ctx.fill();
				
				//prova blur semplificato
				if(isActive) drawLedAloneCircle(s * 0.83, by + s * 0.04, s * 0.012, colors.orangeOn);
				
				ctx.fillStyle = '#999';
				ctx.font = `${s * 0.03}px monospace`;
				ctx.fillText(i === 0 ? 'BD-ROM' : 'TAPE', s * 0.06, by + s * 0.075);
			}

			//drive hdd x 4
			for (let i = 0; i < 4; i++) {
				const hy = s * 0.5 + i * s * 0.075;
				ctx.fillStyle = '#111';
				ctx.beginPath();
				ctx.roundRect(s * 0.04, hy, s * 0.92, s * 0.065, 2);
				ctx.fill();
				
				const hddActive = Math.sin(flowOffset * (1.5 + i * 0.7) + i * 2.3) > 0.4;
				ctx.beginPath();
				ctx.arc(s * 0.82, hy + s * 0.033, s * 0.011, 0, Math.PI * 2);
				ctx.fillStyle = hddActive ? colors.orangeOn : colors.orangeOff;
				ctx.fill();
				if (hddActive) {
					ctx.beginPath();
					ctx.arc(s * 0.82, hy + s * 0.033, s * 0.005, 0, Math.PI * 2);
					ctx.fillStyle = '#fff8';
					ctx.fill();
					
					//prova blur semplificato
					drawLedAloneCircle(s * 0.82, hy + s * 0.033, s * 0.011, colors.orangeOn);
				}

				ctx.fillStyle = '#999';
				ctx.font = `${s * 0.03}px monospace`;
				ctx.fillText(`HDD-${i}`, s * 0.06, hy + s * 0.05);
			}

			//pannello con pulsantoni blu + due ruote
			const panY = s * 0.82;
			ctx.fillStyle = '#111';
			ctx.fillRect(s * 0.04, panY, s * 0.92, s * 0.085);
			
			for (let u = 0; u < 5; u++) {
				let isOn = u % 3 !== 0;
				ctx.fillStyle = '#333';
				ctx.fillRect(s * 0.06 + u * s * 0.08, panY + s * 0.018, s * 0.05, s * 0.05);
				ctx.fillStyle = isOn ? colors.blueOn : colors.blueOff;
				ctx.fillRect(s * 0.06 + u * s * 0.08, panY + (isOn ? s * 0.06 : s * 0.02), s * 0.05, s * 0.01);
			}

			//doppio connettore tondo (uhauhauha)
			for (let j = 0; j < 2; j++) {
				ctx.beginPath();
				ctx.arc(s * 0.5 + j * s * 0.06, panY + s * 0.042, s * 0.018, 0, Math.PI * 2);
				ctx.fillStyle = '#111';
				ctx.fill();
				ctx.strokeStyle = j === 0 ? '#090' : '#933';
				ctx.lineWidth = s * 0.01;
				ctx.stroke();
			}

			//barra di led fricchettona
			const barX = s * 0.64;
			const barY = s * 0.85;
			for (let b = 0; b < 4; b++) {
				const active = connected && (Math.sin(flowOffset * (0.5 + b * 0.3) + b) > 0.2 + b * 0.04);
				ctx.fillStyle = active ? colors.greenOn : colors.greenOff;
				ctx.beginPath();
				ctx.roundRect(barX + b * (s * 0.08), barY, s * 0.06, s * 0.022, s*0.04);
				ctx.fill();
				
				if(active) drawLedAloneRect(barX + b * (s * 0.08), barY, s * 0.06, s * 0.022, colors.greenOn);
			}
		} else {
			// CASE ESTERNO (RACK)
			// Effetto metallo spazzolato scuro
			let caseGrad = ctx.createLinearGradient(0 - s*0.08, 0, s + s*0.08, s);
			caseGrad.addColorStop(0, "#334155");
			caseGrad.addColorStop(0.5, "#1e293b");
			caseGrad.addColorStop(1, "#0f172a");
			
			ctx.fillStyle = caseGrad;
			ctx.beginPath();
			ctx.roundRect(0, 0, s, s, s * 0.02);
			ctx.fill();

			// Maniglie frontali (dettaglio di classe)
			ctx.fillStyle = '#000';//colors.darkSilver;
			//sx
			ctx.beginPath();
			ctx.roundRect(s*0.02, s*0.05, s*0.02, s*0.88, s*0.04);
			ctx.fill();
			//dx
			ctx.beginPath();
			ctx.roundRect(s*0.96, s*0.05, s*0.02, s*0.88, s*0.04);
			ctx.fill();

			// UNITA' SERVER (Blade)
			const units = 4;
			const unitHeight = (s - s*0.10) / units;
			
			
			//righe ventilazione
			let sizeRighe = Math.max(0.6, s*0.01);//larghezza righe
			let deltaRighe = sizeRighe * 2.5;//spazio tra righe
			ctx.lineWidth = sizeRighe;
			
			//led di stato
			const ledRadius = Math.max(1, s * 0.02); // Scala i LED con la scocca
			const ledSpacing = s * 0.1;
			const ledw = ledRadius * 1.5;
			const ledh = ledRadius * 1.5;
			
			const unitsToShutdown = [];
			const currentCycle = flowOffset * 0.0001;
			unitsToShutdown[0] = Math.floor(currentCycle * 73.1 + 1 ) % 10;
			unitsToShutdown[1] = Math.floor(currentCycle * 73.1 + 42.3 ) % 10;
			
			
			for (let i = 0; i < units; i++) {
			
				let uy = s*0.05 + (i * unitHeight);
				let ledy = uy + unitHeight*0.45;
				
				// Slot dell'unità
				ctx.fillStyle = "#020617";

				// keyword colorata sotto (effetto Spectrum: BASIC keywords sui tasti)
				const keywords = ['NEW','SAVE','LOAD','RUN','RND','RETURN','IF','INPUT','POKE','PRINT'];
				if (i < keywords.length && row.y === 0.42) {
					ctx.fillStyle = '#ff4444';
					ctx.font = `${s * 0.018}px monospace`;
					ctx.fillText(keywords[i], kx + keyW * 0.4, ky + keyH * 0.82);
				}
			}
		}

		//Tasto CAPS SHIFT (largo, sinistra riga Z)
		const shiftW = keyW * 1.2;
		const shiftX = (s - (9 * keyW + 8 * s * 0.008)) * 0.5 - shiftW - s * 0.008;
		const shiftY = s * 0.75;
		
		ctx.fillStyle = '#333';
		ctx.strokeStyle = '#555';
		ctx.lineWidth = s * 0.005;
		ctx.fillRect(shiftX, shiftY, shiftW, keyH);
		ctx.strokeRect(shiftX, shiftY, shiftW, keyH);
		
		ctx.fillStyle = '#eee';
		ctx.font = `${s * 0.025}px monospace`;
		ctx.fillText("CAPS", shiftX + shiftW * 0.4, shiftY + keyH * 0.38);
		ctx.fillText("SHIFT", shiftX + shiftW * 0.4, shiftY + keyH * 0.68);

		//LED (verde, in alto vicino al logo)
		const blinkGreen = Math.sin(flowOffset * 0.05) > -0.8;
		ctx.fillStyle = connected ? colors.greenOn : colors.greenOff;
		ctx.beginPath();
		ctx.arc(s * 0.35, s * 0.2, s * 0.018, 0, Math.PI * 2);
		ctx.fill();
		if (connected) drawLedAloneCircle(s * 0.35, s * 0.2, s * 0.018, colors.greenOn);
	}
	
	ctx.restore();
}


function drawLedAloneRect(x, y, w, h, color) {
	let ALFA = (FAKEBLUR_SIZE - 1) * 0.5;//x-w*0.5==>2fb, x-w*1  ==>3fb, x-w*1.5==>4fb, x-w*2  ==>6fb
    ctx.fillStyle = color + '1a'; // ~10% opacità
    ctx.fillRect(x - w*ALFA, y - h*ALFA, w * FAKEBLUR_SIZE, h * FAKEBLUR_SIZE);
	
	ctx.fillRect(x - w*0.25, y - h*0.25, w * 1.5, h * 1.5);//doppio passaggio
}

function drawLedAloneCircle(x, y, r, color, from = 0, to = Math.PI * 2) {
    ctx.fillStyle = color + '1a'; // ~10% opacità
    ctx.beginPath();
    ctx.arc(x, y, r * FAKEBLUR_SIZE, from, to);
    ctx.fill();
	
	ctx.beginPath();
    ctx.arc(x, y, r * 1.5, from, to);//doppio passaggio
    ctx.fill();
}

//
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('pointermove', e => {
    let r = canvas.getBoundingClientRect();
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    // Calcoliamo la posizione sulla griglia
    let gx = Math.floor(((e.clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((e.clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        const cell = grid[gy][gx];
        
		// Aggiorna contenuto
        tooltip.innerHTML = `<strong>${cell.type === 'server' ? 'Server' : cell.subType ? cell.subType.desc : 'Link'}</strong>`;
        
        // Posiziona la tooltip vicino al mouse (offset di 15px per non coprire il cursore)
        tooltip.style.left = (e.clientX - 20) + 'px';
        tooltip.style.top = (e.clientY - 40) + 'px';
        tooltip.style.display = 'block';
    } else {
        tooltip.style.display = 'none';
    }
});

// Nascondi la tooltip quando il mouse esce dal canvas
canvas.addEventListener('pointerleave', () => {
    tooltip.style.display = 'none';
});

// Cerca questa parte in fondo e sostituiscila:
canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); // Fondamentale per non far scattare altri eventi
    if (gameWon) return;
    
    let r = canvas.getBoundingClientRect();
    // Calcola la scala se la canvas è stata rimpicciolita dal CSS
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    let gx = Math.floor(((clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        grid[gy][gx].conns = rotateBitmask(grid[gy][gx].conns);
		
		//rotazione link
		grid[gy][gx].currentRotation = grid[gy][gx].rotation;
		grid[gy][gx].rotation = grid[gy][gx].rotation - (Math.PI * 0.5);
		
		updateConnectivity();
    }
}, { passive: false });

calculateGridSizeRatio();//fix per cercare di adattare subito la griglia 
initGame();
animate(); // Avvia l'animazione
</script>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KNetWalk</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
			height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        h1 { 
            font-size: clamp(16px, 5vw, 28px);
            font-weight: bold; 
            margin: 0;
            color: #38bdf8; 
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
            white-space: nowrap;
        }
        
        .controls { 
            width: 100%;
            padding: clamp(4px, 2vw, 8px) clamp(4px, 2vw, 12px);
            display: flex;
            gap: clamp(4px, 2vw, 12px);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid #334155;
            min-height: fit-content;
        }
        
        button {
            padding: clamp(6px, 2vw, 10px) clamp(8px, 2vw, 16px);
            font-size: clamp(10px, 2.5vw, 14px);
            cursor: pointer;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1;
        }
        
        button:hover { background: #334155; color: #38bdf8; border-color: #38bdf8; }
        button.active { background: #0ea5e9; color: #ffffff; border-color: #0ea5e9; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }
        
        #game-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(4px, 2vw, 12px);
            min-width: 0;
            min-height: 0;
        }
        
        canvas { 
            background-color: #0f172a; 
            display: block; 
            cursor: pointer; 
            border-radius: 4px;
            max-width: 100%;
            max-height: 100%;
            image-rendering: crisp-edges;
			border: 4px solid #334155;
        }
        
        #status { 
            width: 100%;
            padding: clamp(4px, 2vw, 8px);
            height: auto;
            min-height: fit-content;
            font-size: clamp(12px, 2vw, 20px);
            font-weight: bold; 
            color: #22c55e; 
            text-shadow: 0 0 16px rgba(34, 197, 94, 0.3);
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            border-top: 1px solid #334155;
            word-break: break-word;
        }
		
		#tooltip {
			position: absolute; 
			display: none; 
			pointer-events: none;
			background: rgba(0, 0, 0, 0.8); 
			color: white; 
			padding: 5px 10px; 
			border-radius: 4px; 
			font-size: 12px;
			z-index: 100;
		}
    </style>
</head>
<body>

    <div class="controls">
		<h1>KNetWalk</h1>
		<button onclick="changeDifficulty(3, this)" class="active">3x3</button>
        <button onclick="changeDifficulty(5, this)">5x5</button>
        <button onclick="changeDifficulty(7, this)">7x7</button>
        <button onclick="changeDifficulty(10, this)">10x10</button>
		<button onclick="changeAnimateFlag(this)">Animate</button>
    </div>

	<div id="game-container">
		<canvas id="gameCanvas"></canvas>
	</div>

	<div id="status"></div>
	
	<div id="tooltip"></div>

<script>
let SIZE = 3;
const CANVAS_MAX_SIZE = 660;
let CELL_SIZE = CANVAS_MAX_SIZE / SIZE;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusDiv = document.getElementById('status');

const N = 1, E = 2, S = 4, W = 8;
const PC_TYPES = [ 
	{id:'notebook',      desc:'Generic Notebook'},
	{id:'desktop',       desc:'Monitor + MiniPC all-in-one'},
	{id:'minipc',        desc:'Morefine MiniPC N100'},
	{id:'tablet',        desc:'Generic Tablet'},
	{id:'baraccone',     desc:'Baraccone anni 90'},
	{id:'router',        desc:'Router Wi-Fi TpLink'},
	{id:'ipcamera',      desc:'IP Camera TpLink'},
	{id:'macintosh',     desc:'Macintosh 128K del 1984'},
	{id:'imac',          desc:'iMac G4 del 2002'},
	{id:'gameboy',       desc:'GameBoy classic del 1989'},
	{id:'nintendoswitch',desc:'Nintendo Switch 2017'},
	{id:'hplaserjet',    desc:'HP LaserJet 107w'},
	{id:'atari2600',     desc:'Atari 2600 del 1977'},
	{id:'hantarex',      desc:'Apple ][ Compatibile del 1983'},
	{id:'radio',         desc:'Vintage Radio R919 BT-MP3'},
	{id:'nesthub',       desc:'Google NestHub'},
	{id:'yamahathr',     desc:'Ampli Yamaha THR-V2'},
	];

let grid = [];
let serverPos = {x: 0, y: 0};
let gameWon = false;
let flowOffset = 0; //Per l'animazione dei dati
let animateFlag = false;//animazione flag

function changeAnimateFlag(btn) {
	animateFlag = !animateFlag;
	if(btn) {
		if(animateFlag) btn.classList.add('active');
		else btn.classList.remove('active');
	}
}

function changeDifficulty(newSize, btn) {
    SIZE = newSize;
    CELL_SIZE = CANVAS_MAX_SIZE / SIZE;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    initGame();
}

function initGame() {
	// Calcola lo spazio disponibile
    const headerHeight = document.querySelector('.controls').offsetHeight;
    const statusHeight = statusDiv.offsetHeight;
    const padding = 60; // Padding container + margini
    const availableHeight = window.innerHeight - headerHeight - statusHeight - padding;
    
    // Usa l'altezza disponibile, ma mantieni il massimo della larghezza
    const canvasSize = Math.min(CANVAS_MAX_SIZE, availableHeight);
	
    canvas.width = canvasSize;
    canvas.height = canvasSize;
    
	// Ricalcola CELL_SIZE in base alla canvas effettiva
    CELL_SIZE = canvasSize / SIZE;
	
    grid = [];
    gameWon = false;
    statusDiv.innerText = "";
    
    for (let y = 0; y < SIZE; y++) {
        grid[y] = [];
        for (let x = 0; x < SIZE; x++) {
            grid[y][x] = { x, y, conns: 0, type: 'cable', subType: '', connected: false };
        }
    }

    generateNetwork();
    assignTypes();
    shuffleGrid();
    updateConnectivity();
}

//genera un labirinto perfetto in cui ogni cella è collegata al server e non esistono cicli (loop) o vicoli ciechi isolati
//0) Viene creata una griglia di tracciamento (visited) per sapere quali celle fanno già parte della rete (all'inizio sono tutte false).
//1) Viene scelta una posizione casuale server (serverPos) e viene segnata come visited = true.
//2) Viene chiamata la funzione addWalls sul server. Questa funzione prende i 4 vicini (Nord, Sud, Est, Ovest) e li inserisce in un elenco chiamato walls (che qui funge da "lista dei collegamenti possibili").
//3) Il Ciclo di Costruzione: Finché ci sono collegamenti disponibili nell'elenco walls:
//4) Ne viene estratto uno a caso (splice).
//5) Si controlla la cella di destinazione (wall.x2, wall.y2). Se è già stata visitata, il collegamento viene scartato per evitare di creare dei loop.
//6) Se non è visitata, il muro viene "abbattuto": viene creato un collegamento bidirezionale tra le due celle usando gli operatori bitwise (|=).
//7) La nuova cella viene segnata come visitata e i suoi vicini vengono aggiunti alla lista walls.
//8) Alla fine di questo ciclo, tutte le celle della griglia saranno collegate tra loro in un unico grande "albero" genealogico che ha come radice il server.

function generateNetwork() {
    let visited = Array(SIZE).fill().map(() => Array(SIZE).fill(false));
    let walls = [];
    serverPos = { x: Math.floor(Math.random()*SIZE), y: Math.floor(Math.random()*SIZE) };
    visited[serverPos.y][serverPos.x] = true;
    addWalls(serverPos.x, serverPos.y, walls, visited);

    while (walls.length > 0) {
        let wall = walls.splice(Math.floor(Math.random()*walls.length), 1)[0];
        if (visited[wall.y2][wall.x2]) continue;
        grid[wall.y1][wall.x1].conns |= wall.dir1;
        grid[wall.y2][wall.x2].conns |= wall.dir2;
        visited[wall.y2][wall.x2] = true;
        addWalls(wall.x2, wall.y2, walls, visited);
    }
}

function addWalls(x, y, walls, visited) {
    if (y > 0) walls.push({x1:x, y1:y, x2:x, y2:y-1, dir1:N, dir2:S});
    if (y < SIZE-1) walls.push({x1:x, y1:y, x2:x, y2:y+1, dir1:S, dir2:N});
    if (x > 0) walls.push({x1:x, y1:y, x2:x-1, y2:y, dir1:W, dir2:E});
    if (x < SIZE-1) walls.push({x1:x, y1:y, x2:x+1, y2:y, dir1:E, dir2:W});
}

function assignTypes() {
    grid.forEach((row, y) => row.forEach((cell, x) => {
        if (x === serverPos.x && y === serverPos.y) cell.type = 'server';
        else {
            let count = [N, E, S, W].filter(d => cell.conns & d).length;
            if (count === 1) {
                cell.type = 'pc';
                cell.subType = PC_TYPES[Math.floor(Math.random() * PC_TYPES.length)];
            }
        }
    }));
}

function shuffleGrid() {
    grid.forEach(row => row.forEach(cell => {
        let r = Math.floor(Math.random()*4);
        for(let i=0; i<r; i++) cell.conns = rotateBitmask(cell.conns);
    }));
}

function rotateBitmask(m) {
    let n = 0;
    if (m & N) n |= E; 
	if (m & E) n |= S; 
	if (m & S) n |= W; 
	if (m & W) n |= N;
    return n;
}

function updateConnectivity() {
    grid.forEach(row => row.forEach(c => c.connected = false));
    let q = [grid[serverPos.y][serverPos.x]];
    grid[serverPos.y][serverPos.x].connected = true;
    let head = 0;
    while(head < q.length) {
        let curr = q[head++];
        [[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]].forEach(d => {
            if (curr.conns & d[0]) {
                let nx = curr.x+d[1], ny = curr.y+d[2];
                if (nx>=0 && nx<SIZE && ny>=0 && ny<SIZE) {
                    let nb = grid[ny][nx];
                    if (!nb.connected && (nb.conns & d[3])) {
                        nb.connected = true;
                        q.push(nb);
                    }
                }
            }
        });
    }
    if (grid.every(r => r.every(c => c.connected)) && !gameWon) {
        gameWon = true;
        statusDiv.innerText = "SISTEMA ONLINE - RETE CONFIGURATA!";
    }
}

/** * RENDERING AVANZATO
 */
function animate() {
    flowOffset += 0.2; // Velocità del flusso
    draw();
    requestAnimationFrame(animate);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Griglia
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 1;
    for(let i=0; i<=SIZE; i++) {
        ctx.beginPath(); ctx.moveTo(i*CELL_SIZE,0); ctx.lineTo(i*CELL_SIZE,canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i*CELL_SIZE); ctx.lineTo(canvas.width,i*CELL_SIZE); ctx.stroke();
    }

	//drawLake();

    grid.forEach(row => row.forEach(tile => drawTile(tile)));
	
	
}

function drawLake() {
    const serverX = serverPos.x * CELL_SIZE + CELL_SIZE / 2;
    const serverY = serverPos.y * CELL_SIZE + CELL_SIZE / 2;
    
    // Gradient radiale centrato sul server
    let lakeGrad = ctx.createRadialGradient(serverX, serverY, 0, serverX, serverY, Math.max(canvas.width, canvas.height));
    lakeGrad.addColorStop(0, "rgba(6, 182, 212, 0.15)");   // Azzurro
    lakeGrad.addColorStop(1, "rgba(59, 130, 246, 0.05)");    // Bordi: blu tenue
    
    ctx.fillStyle = lakeGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Onde animate
    ctx.lineWidth = 1.5;
    
    const waveCount = 30;
    for(let w = 0; w < waveCount; w++) {
        const waveRadius = (flowOffset * 2 + w * 20) % (Math.max(canvas.width, canvas.height));
        const opacity = Math.max(0, 1 - (waveRadius / (Math.max(canvas.width, canvas.height))));
        
        ctx.strokeStyle = `rgba(34, 94, 197, ${0.3 * opacity})`;
        ctx.beginPath();
        ctx.arc(serverX, serverY, waveRadius, 0, Math.PI * 2);
        ctx.stroke();
    }
}


function drawTile(tile) {
	if (animateFlag) drawTileANIMATE(tile);
	else drawTileOLD(tile);
}

function drawTileOLD(tile) {
    let x = tile.x * CELL_SIZE;
    let y = tile.y * CELL_SIZE;
    let mid = CELL_SIZE / 2;
    let activeColor = "#0ea5e9";
    let inactiveColor = "#334155";

    // Disegna cavi
    ctx.strokeStyle = tile.connected ? activeColor : inactiveColor;
    ctx.lineWidth = CELL_SIZE * 0.08;//Math.max(3, CELL_SIZE / 10);
    ctx.lineCap = "butt";//"round";
    
    // Effetto bagliore se connesso
    if(tile.connected) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = activeColor;
    } else {
        ctx.shadowBlur = 0;
    }

	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = tile.connected ? activeColor : inactiveColor;
	ctx.fill();
	
    ctx.beginPath();
    if (tile.conns & N) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y); }
    if (tile.conns & E) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + CELL_SIZE, y + mid); }
    if (tile.conns & S) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x + mid, y + CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(x + mid, y + mid); ctx.lineTo(x, y + mid); }
    ctx.stroke();
	
    ctx.shadowBlur = 0;
	
    // Disegna icone
    if (tile.type === 'server') {
		drawServer(x, y, tile.connected);
    } else if (tile.type === 'pc') {
		drawPC(x, y, tile.subType, tile.connected);
    }
}


function drawTileANIMATE(tile) {
    let x = tile.x * CELL_SIZE, y = tile.y * CELL_SIZE, mid = CELL_SIZE/2;
	
    // Cavo Base (Sfondo spento)
    ctx.setLineDash([]);
    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = CELL_SIZE * 0.08;
    ctx.lineCap = "butt";//"round";
	
	//fix round / butt con una palla al centro della tile
	ctx.beginPath();
	ctx.arc(x+mid, y+mid, CELL_SIZE * 0.04, 0, Math.PI*2);
	ctx.fillStyle = "#1e293b";
	ctx.fill();
	
    ctx.beginPath();
    if (tile.conns & N) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(mid+x, y); }
    if (tile.conns & E) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(x+CELL_SIZE, mid+y); }
    if (tile.conns & S) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(mid+x, y+CELL_SIZE); }
    if (tile.conns & W) { ctx.moveTo(mid+x, mid+y); ctx.lineTo(x, mid+y); }
    ctx.stroke();
	
    // Flusso Dati (Animato)
    if (tile.connected) {
		ctx.lineCap = "butt";//default
		ctx.strokeStyle = "#0ea5e9";
        ctx.lineWidth = CELL_SIZE * 0.02;
        ctx.setLineDash([CELL_SIZE*0.025, CELL_SIZE*0.025]); // Tratteggio
        ctx.lineDashOffset = -flowOffset;
		ctx.shadowBlur = 20;
        ctx.shadowColor = "#38bdf8";
		ctx.stroke();
        ctx.shadowBlur = 0;
		ctx.setLineDash([]);
    }

    // Icone
    if (tile.type === 'server') drawServer(x, y, tile.connected);
    else if (tile.type === 'pc') drawPC(x, y, tile.subType, tile.connected);
}

function drawServer(x, y, connected) {
    const s = CELL_SIZE * 0.75; 
    const p = (CELL_SIZE - s) / 2;
    
    ctx.save();
    ctx.translate(x + p, y + p);

    // --- CASE ESTERNO (RACK) ---
    // Effetto metallo spazzolato scuro
    let caseGrad = ctx.createLinearGradient(0, 0, s, s);
    caseGrad.addColorStop(0, "#334155");
    caseGrad.addColorStop(0.5, "#1e293b");
    caseGrad.addColorStop(1, "#0f172a");
    
    ctx.fillStyle = caseGrad;
    ctx.beginPath();
    ctx.roundRect(0, 0, s, s, s * 0.02);
    ctx.fill();

    // Bordi laterali del rack (le "orecchie" per il montaggio)
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, 4, s);
    ctx.fillRect(s - 4, 0, 4, s);

    // --- UNITÀ SERVER (Blade) ---
    const units = 4;
    const unitHeight = (s - 10) / units;
    
    for (let i = 0; i < units; i++) {
        let uy = 5 + (i * unitHeight);
        
        // Slot dell'unità
        ctx.fillStyle = "#020617";
        ctx.fillRect(6, uy, s - 12, unitHeight - 2);
        
        // Griglia di ventilazione (linee sottili)
        ctx.strokeStyle = "#1e293b";
        ctx.lineWidth = 0.5;
        for(let gx = 10; gx < s - 25; gx += 3) {
            ctx.beginPath();
            ctx.moveTo(gx, uy + 2);
            ctx.lineTo(gx, uy + unitHeight - 4);
            ctx.stroke();
        }

        // --- LED DI STATO PER OGNI UNITÀ ---
        const ledRadius = Math.max(1, s * 0.02); // Scala i LED con la scocca
        const ledSpacing = s * 0.1;
        
        if (connected) {
            // LED Verde (Power/Link) - Fisso o lampeggio lento
            ctx.fillStyle = (Math.sin(flowOffset * 0.1 + i) > -0.8) ? "#22c55e" : "#064e3b";
            ctx.shadowBlur = 5; ctx.shadowColor = "#22c55e";
            ctx.beginPath(); ctx.arc(s - ledSpacing * 4, uy + unitHeight/2, ledRadius, 0, Math.PI*2); ctx.fill();

            // LED Arancione (Disk Activity) - Lampeggio frenetico
            ctx.fillStyle = (Math.sin(flowOffset * 0.8 + i*2) > 0) ? "#f59e0b" : "#451a03";
            ctx.shadowColor = "#f59e0b";
            ctx.beginPath(); ctx.arc(s - ledSpacing * 3, uy + unitHeight/2, ledRadius, 0, Math.PI*2); ctx.fill();
            
            // LED Blu/Azzurro (Network Dati) - Lampeggio randomico
            ctx.fillStyle = (Math.cos(flowOffset * 1.2 + i) > 0.3) ? "#38bdf8" : "#0c4a6e";
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath(); ctx.arc(s - ledSpacing * 2, uy + unitHeight/2, ledRadius, 0, Math.PI*2); ctx.fill();
            
            ctx.shadowBlur = 0;
        } else {
            // Server Spento: solo un piccolo LED rosso di standby
            ctx.fillStyle = "#7f1d1d"; // Rosso spento
            if (i === 0) ctx.fillStyle = "#ef4444"; // Solo il primo ha il power standby
            ctx.beginPath(); ctx.arc(s - ledSpacing * 4, uy + unitHeight/2, ledRadius, 0, Math.PI*2); ctx.fill();
        }
    }

    // Maniglie frontali (dettaglio di classe)
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = Math.max(1, s * 0.015);
    ctx.lineCap = "round";
    // Maniglia SX
    ctx.beginPath(); ctx.moveTo(2, 10); ctx.lineTo(2, s-10); ctx.stroke();
    // Maniglia DX
    ctx.beginPath(); ctx.moveTo(s-2, 10); ctx.lineTo(s-2, s-10); ctx.stroke();

    ctx.restore();
}

function drawPC(x, y, type, connected) {
    const s = CELL_SIZE * 0.65; // Leggermente più grande per i dettagli
    const p = (CELL_SIZE - s) / 2;
    const isDark = !connected;
    
    // Palette realistica
    const colors = {
        bezel: "#1e293b",
        silver: "#94a3b8",
        darkSilver: "#475569",
        screenOff: "#0f172a",
        screenOn: "linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%)",
        glass: "rgba(255, 255, 255, 0.15)"
    };

    ctx.save();
    ctx.translate(x + p, y + p);

    if (type.id === 'desktop') {
        // --- MONITOR ---
        // Scocca posteriore/ombra
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.roundRect(0, 0, s, s * 0.65, s * 0.04); ctx.fill();

        // Bezel (Cornice)
        let bezelGrad = ctx.createLinearGradient(0, 0, 0, s * 0.65);
        bezelGrad.addColorStop(0, "#334155");
        bezelGrad.addColorStop(1, "#111827");
        ctx.fillStyle = bezelGrad;
        ctx.beginPath(); ctx.roundRect(s*0.01, s*0.01, s - s*0.02, s * 0.65 - s*0.02, s * 0.03); ctx.fill();

        // Schermo
        if (connected) {
            let screenGrad = ctx.createLinearGradient(0, 0, s, s * 0.6);
            screenGrad.addColorStop(0, "#38bdf8");
            screenGrad.addColorStop(1, "#0369a1");
            ctx.fillStyle = screenGrad;
        } else {
            ctx.fillStyle = colors.screenOff;
        }
        ctx.fillRect(s*0.04, s*0.04, s - s*0.08, s * 0.65 - s*0.10);

        // Riflesso "Glossy"
        ctx.fillStyle = colors.glass;
        ctx.beginPath();
        ctx.moveTo(s*0.04, s*0.04); ctx.lineTo(s - s*0.04, s*0.04); ctx.lineTo(s*0.04, s * 0.4);
        ctx.fill();

        // Webcam (piccolo puntino)
        ctx.fillStyle = "#000";
        ctx.beginPath(); ctx.arc(s * 0.5, s*0.025, Math.max(0.5, s * 0.01), 0, Math.PI * 2); ctx.fill();

        // --- STAND (Supporto) ---
        let standGrad = ctx.createLinearGradient(s * 0.4, 0, s * 0.5, 0);
        standGrad.addColorStop(0, colors.darkSilver);
        standGrad.addColorStop(0.5, colors.silver);
        standGrad.addColorStop(1, colors.darkSilver);
        
        ctx.fillStyle = standGrad;
        ctx.fillRect(s * 0.42, s * 0.65, s * 0.16, s * 0.2); // Collo
        ctx.beginPath(); ctx.roundRect(s * 0.2, s * 0.8, s * 0.6, s * 0.08, s * 0.02); ctx.fill(); // Base
    } 
    else if (type.id === 'notebook') {
        // --- SCHERMO APERTO ---
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.roundRect(s * 0.05, 0, s * 0.9, s * 0.6, s * 0.03); ctx.fill(); // Cornice
        
        // Schermo LCD
        if (connected) {

			ctx.shadowColor = "#ff5e22";
		}
		ctx.beginPath();
		ctx.arc(s*0.1, s*0.83, s*0.018, 0, Math.PI*2);
		ctx.fill();
		
		ctx.beginPath();
		ctx.arc(s*0.8, s*0.65, s*0.02, 0, Math.PI*2);
		ctx.fill();
		
		ctx.shadowBlur = 0;
	}
	else if (type.id === 'minipc') {
		// --- SCOCCA ---
        let minipcGrad = ctx.createRadialGradient(s*0.5, s*0.5, 0, s*0.5, s*0.5, s);
        minipcGrad.addColorStop(0, "#273549");
        minipcGrad.addColorStop(1, "#0f070a");
        
		//base NERA
		ctx.fillStyle = '#111';
		ctx.beginPath(); 
		ctx.roundRect(s*0.2, s*0.43, s*0.6, s*0.4, s * 0.08); 
		ctx.fill();
		
		//cerchio di luce
		if (connected) {
            let screenGrad = ctx.createRadialGradient(s*0.5, s*0.5, 0, s*0.5, s*0.5, s);
            screenGrad.addColorStop(0, "#38bdf8");
            screenGrad.addColorStop(1, "#0369a1");
            ctx.fillStyle = screenGrad;
        } else {
            ctx.fillStyle = minipcGrad;
        }
		ctx.beginPath(); 
		ctx.roundRect(s*0.2, s*0.4, s*0.6, s*0.4, s * 0.08); 
		ctx.fill();
		
		//altra base nera
		ctx.fillStyle = '#111';
		ctx.beginPath(); 
		ctx.roundRect(s*0.2, s*0.37, s*0.6, s*0.4, s * 0.08); 
		ctx.fill();
		
		//mezzo grigio
		ctx.fillStyle = minipcGrad;
		ctx.beginPath(); 
		ctx.roundRect(s*0.2, s*0.34, s*0.6, s*0.4, s * 0.08); 
		ctx.fill();
		
		//top nero
		ctx.fillStyle = '#111';
		ctx.beginPath(); 
		ctx.roundRect(s*0.2, s*0.20, s*0.6, s*0.4, s * 0.08); 
		ctx.fill();
		
		//QC
		ctx.lineWidth = s*0.01;
		ctx.strokeStyle = '#eee';
		ctx.fillStyle = '#393';
		ctx.beginPath();
		ctx.arc(s*0.4, s*0.3, s*0.08, 0, Math.PI*2);
		ctx.fill();
		ctx.stroke();
		ctx.fillStyle = "#eee";
		ctx.font = `${Math.max(0, s*0.08)}px sans-serif`;
		ctx.textAlign = "left";
		ctx.fillText("QC", s*0.33, s*0.33);
		
		//Etichetta
		ctx.fillStyle = "#999";
		ctx.font = `${Math.max(0, s*0.11)}px sans-serif`;
		ctx.textAlign = "left";
		ctx.fillText("MOREFINE", s*0.22, s*0.55);
		
		//usb + pulsantone
		ctx.fillStyle = '#000';
		ctx.fillRect(s*0.3, s*0.64, s*0.04, s*0.08);
		ctx.fillRect(s*0.37, s*0.64, s*0.04, s*0.08);
		ctx.fillRect(s*0.46, s*0.64, s*0.08, s*0.02);
		ctx.fillRect(s*0.56, s*0.64, s*0.08, s*0.02);
		ctx.lineWidth = s * 0.01;
		ctx.strokeStyle = '#000';
		ctx.beginPath();
		ctx.arc(s*0.72, s*0.67, s*0.04, 0, Math.PI*2);
		ctx.stroke();
		
		//led
		ctx.fillStyle = connected ? "#38bdf8" : "#222";
		if (connected && Math.sin(flowOffset*0.95) > -0.5) {
			ctx.shadowBlur = 5;
			ctx.shadowColor = "#38bdf8";
		}
		ctx.beginPath();
		ctx.arc(s*0.72, s*0.67, s*0.01, 0, Math.PI*2);
		ctx.fill();
	}
	else if (type.id === 'radio') {
		//CORPO IN LEGNO
		let woodGrad = ctx.createLinearGradient(0, 0, s, s);
		woodGrad.addColorStop(0, "#8B5A3C");
		woodGrad.addColorStop(0.3, "#7A4B2F");
		woodGrad.addColorStop(0.5, "#6B3E1F");
		woodGrad.addColorStop(0.7, "#7A4B2F");
		woodGrad.addColorStop(1, "#8B5A3C");
		ctx.fillStyle = woodGrad;
		
		//corpo arrotondato
		ctx.strokeStyle = 'rgba(0,0,0,0.5)';
		ctx.lineWidth = s*0.02;
		ctx.beginPath();
		ctx.roundRect(s*0.1, s*0.1, s*0.8, s*0.5, [s*0.2,s*0.1,s*0.04,s*0.04]);
		ctx.closePath();
		ctx.fill();
		ctx.stroke();
		
		//piedini
		ctx.fillStyle = '#111';
		ctx.fillRect(s*0.2,s*0.6,s*0.1,s*0.06);
		ctx.fillRect(s*0.7,s*0.6,s*0.1,s*0.06);
		
		//--- GRIGLIA SPEAKER (SX) ---
		ctx.fillStyle = '#111';
		ctx.fillRect(s*0.16,s*0.24,s*0.04,s*0.21);
		ctx.fillRect(s*0.22,s*0.23,s*0.04,s*0.22);
		ctx.fillRect(s*0.28,s*0.22,s*0.04,s*0.23);
		ctx.fillRect(s*0.34,s*0.21,s*0.04,s*0.24);
		ctx.fillRect(s*0.40,s*0.20,s*0.04,s*0.25);
		
		//scritte
		ctx.fillStyle = "rgba(0,0,0,0.94)";
		ctx.font = `${s*0.08}px serif`;
		ctx.textAlign = "left";
		ctx.fillText("fm radio", s*0.16, s*0.52);
		
		
		// --- QUADRANTE FM (DX) ---
		const dialX = s*0.7;
		const dialY = s*0.35;
		const dialRadius = s*0.18;
		
		// Sfondo quadrante (colore arancio/oro)
		let dialGrad = ctx.createRadialGradient(dialX, dialY, dialRadius*0.3, dialX, dialY, dialRadius);
		dialGrad.addColorStop(0, connected ? '#4bf' : '#fb5');
		dialGrad.addColorStop(0.5, connected ? '#4bf' : '#fb5');
		dialGrad.addColorStop(1, connected ? '#07b' : '#c82');
		ctx.fillStyle = dialGrad;
		ctx.beginPath();
		ctx.arc(dialX, dialY, dialRadius, 0, Math.PI*2);
		ctx.fill();
		
		// Bordo quadrante (metallico)
		ctx.strokeStyle = "#8B7355";
		ctx.lineWidth = s*0.02;
		ctx.beginPath();
		ctx.arc(dialX, dialY, dialRadius, 0, Math.PI*2);
		ctx.stroke();
		
		// Bordo interno (più scuro)
		ctx.strokeStyle = "#3D3D3D";
		ctx.lineWidth = s*0.015;
		ctx.beginPath();
		ctx.arc(dialX, dialY, dialRadius - s*0.01, 0, Math.PI*2);
		ctx.stroke();
		
		// Numeri scala FM (90, 94, 98, 102, 106, 110)
		ctx.fillStyle = "#000";
		ctx.font = `${Math.max(5, s*0.05)}px serif`;
		ctx.textAlign = "center";
		ctx.textBaseline = "middle";
		const freqs = [90, 94, 98, 102, 106, 110];
		freqs.forEach((freq, idx) => {
			const angle = (idx / freqs.length) * Math.PI * 2;
			const labelRadius = dialRadius * 0.75;
			const lx = dialX + Math.cos(angle) * labelRadius;
			const ly = dialY + Math.sin(angle) * labelRadius;
			ctx.fillText(freq.toString(), lx, ly);
		});
		// Ticks scala
		ctx.strokeStyle = "#000";
		ctx.lineWidth = s*0.01;
		for(let i = 0; i < 24; i++) {
			const angle = (i / 24) * Math.PI * 2;
			const r1 = dialRadius * 0.95;
			const r2 = dialRadius * 0.85;
			const x1 = dialX + Math.cos(angle) * r1;
			const y1 = dialY + Math.sin(angle) * r1;
			const x2 = dialX + Math.cos(angle) * r2;
			const y2 = dialY + Math.sin(angle) * r2;
			ctx.beginPath();
			ctx.moveTo(x1, y1);
			ctx.lineTo(x2, y2);
			ctx.stroke();
		}
		
		// Lancetta indicatore FM (animated se connesso)
		const dialAngle = connected ? (Math.sin(flowOffset * 0.02) * 0.9) - 1.75 : (Math.PI * 1.75);
		
		ctx.strokeStyle = '#333';
		ctx.lineWidth = s*0.03;
		ctx.lineCap = "round";
		ctx.beginPath();
		ctx.moveTo(dialX, dialY);
		ctx.lineTo(
			dialX + Math.cos(dialAngle) * (dialRadius * 0.7),
			dialY + Math.sin(dialAngle) * (dialRadius * 0.7)
		);
		ctx.stroke();
		
		// Centro lancetta (cerchietto)
		let centerGrad = ctx.createRadialGradient(dialX, dialY, 0, dialX, dialY, s*0.1);
		centerGrad.addColorStop(0, "#E8D4A2");
		centerGrad.addColorStop(1, "#8B7355");
		ctx.fillStyle = centerGrad;
		ctx.beginPath();
		ctx.arc(dialX, dialY, s*0.1, 0, Math.PI*2);
		ctx.fill();
		
		// Label "FM" sotto quadrante
		ctx.fillStyle = "#333";
		ctx.font = `bold ${Math.max(6, s*0.07)}px serif`;
		ctx.textAlign = "center";
		ctx.fillText("R919", dialX, dialY + dialRadius + s*0.04);
		
		// --- MANOPOLE BASSE ---
		const knobY = s*0.54;
		const knob1X = s*0.56;
		const knob2X = s*0.84;
		
		[knob1X, knob2X].forEach((knobX) => {
			// Base manopola
			let knobGrad = ctx.createRadialGradient(knobX, knobY, 0, knobX, knobY, s*0.05);
			knobGrad.addColorStop(0, "#B0860B");
			knobGrad.addColorStop(1, "#6B5203");
			ctx.fillStyle = knobGrad;
			ctx.beginPath();
			ctx.arc(knobX, knobY, s*0.05, 0, Math.PI*2);
			ctx.fill();
			
			// Bordo manopola
			ctx.strokeStyle = "#3D3D3D";
			ctx.lineWidth = s*0.008;
			ctx.beginPath();
			ctx.arc(knobX, knobY, s*0.05, 0, Math.PI*2);
			ctx.stroke();
			
			// Indicatore manopola (lineetta)
			ctx.strokeStyle = "#2a2a2a";
			ctx.lineWidth = s*0.015;
			ctx.lineCap = "round";
			ctx.beginPath();
			ctx.moveTo(knobX, knobY);
			ctx.lineTo(knobX + Math.cos(-1.75) * s*0.04, knobY + Math.sin(-1.75) * s*0.04);
			ctx.stroke();
		});
		ctx.lineCap = 'butt';
	}
	else if (type.id === 'nesthub') {
        //basetta grigia
		ctx.fillStyle = '#aaa';
		ctx.beginPath();
		ctx.roundRect(s*0.2, s*0.45, s*0.6, s*0.2, s*0.04);
		ctx.fill();
		ctx.fillStyle = '#bbb';
		ctx.beginPath();
		ctx.roundRect(s*0.25, s*0.45, s*0.50, s*0.2, s*0.02);
		ctx.fill();
		
		// --- SCOCCA ---
        let tabletGrad = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s);
        tabletGrad.addColorStop(0, "#fff");//475569");
        tabletGrad.addColorStop(1, "#ccc");//0f172a");
        ctx.fillStyle = tabletGrad;
        ctx.beginPath(); ctx.roundRect(s*0.1, 0, s*0.8, s*0.55, s * 0.08); ctx.fill();

        // Schermo Tutto Vetro
        if (connected) {
            let screenGrad = ctx.createLinearGradient(0, 0, s, s * 0.6);
            screenGrad.addColorStop(0, "#38bdf8");
            screenGrad.addColorStop(1, "#0369a1");
            ctx.fillStyle = screenGrad;
        } else {
            ctx.fillStyle = "#000";
        }
        ctx.beginPath(); 
		ctx.roundRect(s*0.14, s*0.06, s*0.8 - s*0.07, s * 0.5 - s*0.08, s * 0.04); 
		ctx.fill();
        
		// Sensore Webcam tablet
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.fillRect(s*0.46, s*0.025, s * 0.08, s * 0.02);
		ctx.fillStyle = "#000";
		ctx.beginPath(); ctx.fillRect(s*0.25, s*0.025, s * 0.04, s * 0.02);
		ctx.beginPath(); ctx.fillRect(s*0.70, s*0.025, s * 0.04, s * 0.02);
		
		
		// Riflesso "Glossy"
        ctx.fillStyle = colors.glass;
        ctx.beginPath();
        ctx.moveTo(s*0.12, s*0.04); ctx.lineTo(s - s*0.10, s*0.04); ctx.lineTo(s*0.12, s * 0.04);
        ctx.fill();
		
		// Riflesso curva
        ctx.strokeStyle = "rgba(255,255,255,0.1)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(s*0.25, s*0.15, s*0.1, Math.PI, Math.PI*1.5); ctx.stroke();

		//connessione G
		if (connected) {
			ctx.fillStyle = '#fff';
			ctx.font = `${s*0.1}px serif`;
			ctx.textAlign = "center";
			ctx.fillText("G", s*0.48, s*0.30);
		}
        
    } 
	else if (type.id === 'yamahathr') {
		// --- MANIGLIA (Arco superiore) ---
		ctx.strokeStyle = "#9ca3af";
		ctx.lineWidth = s * 0.03;
		ctx.beginPath();
		ctx.roundRect(s*0.1, s*0.02, s*0.8, s*0.2, s*0.04);
		ctx.stroke();
		
		// --- CORPO PRINCIPALE ---
		let bodyGrad = ctx.createLinearGradient(0, 0, 0, s);
		bodyGrad.addColorStop(0, "#d4c5a9");
		bodyGrad.addColorStop(1, "#bfb09a");
		ctx.fillStyle = bodyGrad;
		ctx.beginPath(); ctx.roundRect(0, s*0.15, s, s*0.7, s*0.05); ctx.fill();

		// --- GRIGLIA VENTILAZIONE (Chevron pattern) ---
		ctx.strokeStyle = "#2d2d2d";
		ctx.lineWidth = Math.max(0.5, s * 0.008);
		const chevronSpacing = s * 0.1;
		const chevronStart = s * 0.08;
		const chevronWidth = s * 0.8;
		
		for(let x = chevronStart; x <= chevronStart + chevronWidth; x += chevronSpacing) {
			for(let y = s*0.35; y < s*0.75; y += s*0.04) {
				if(y>s*0.3 && y<s*0.5 && x>s*0.3 && x<s*0.6) continue;
				// Linee oblique a V
				ctx.beginPath();
				ctx.moveTo(x, y);
				ctx.lineTo(x + chevronSpacing*0.5, y + s*0.02);
				ctx.stroke();
				ctx.beginPath();
				ctx.moveTo(x + chevronSpacing*0.5, y + s*0.02);
				ctx.lineTo(x, y + s*0.04);
				ctx.stroke();
			}
		}

		// --- PULSANTI SUPERIORI ---
		const knobSize = s * 0.06;
		const knobStart = s * 0.2;
		const knobSpacing = s * 0.12;
		ctx.fillStyle = "#333";
		for(let i = 0; i < 5; i++) {
			ctx.beginPath();
			ctx.roundRect(knobStart + i*knobSpacing, s*0.1, knobSize*1.5, knobSize, s*0.02);
			ctx.fill();
		}
		
		//4 viti
		ctx.fillStyle = '#666';
		ctx.beginPath();
		ctx.arc(s*0.94, s*0.28, s*0.014, 0, Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.94, s*0.78, s*0.014, 0, Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.06, s*0.28, s*0.014, 0, Math.PI*2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(s*0.06, s*0.78, s*0.014, 0, Math.PI*2);
		ctx.fill();

		// --- LOGO YAMAHA (Tuning fork nel cerchio) ---
		ctx.fillStyle = connected ? "#f80" : "#2d2d2d";
		ctx.strokeStyle = connected ? "#f80" : "#2d2d2d";
		if (connected) {
			ctx.shadowBlur = 10;
			ctx.shadowColor = "#f80";
		}
		ctx.beginPath();
		ctx.arc(s*0.5, s*0.4, s*0.05, 0, Math.PI*2);
		ctx.fill();
		
		ctx.beginPath();
		ctx.lineWidth = s * 0.01;
		ctx.arc(s*0.5, s*0.4, s*0.07, 0, Math.PI*2);
		ctx.stroke();
		ctx.shadowBlur = 0;
		
		ctx.fillStyle = connected ? '#d4c5a9' : '#ddd';
		ctx.textAlign = 'center';
		ctx.font = `${s*0.1}px sans-serif`;
		ctx.fillText('Y',s*0.5,s*0.43);
		
		
		// --- LED POWER
		ctx.fillStyle = connected && Math.cos(flowOffset*0.4) > 0.2 ? "#f80" : "#374151";
		if (connected && Math.cos(flowOffset*0.4) > 0.2) {
			ctx.shadowBlur = 5;
			ctx.shadowColor = "#f80";
		}
		ctx.beginPath();
		ctx.arc(s*0.82, s*0.14, s*0.012, 0, Math.PI*2);
		ctx.fill();
		ctx.shadowBlur = 0;
		
		// --- RIFLESSO GLOSSY ---
		ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
		ctx.beginPath();
		ctx.moveTo(s*0.05, s*0.15); ctx.lineTo(s*0.5, s*0.2); ctx.lineTo(s*0.1, s*0.35);
		ctx.fill();
	}
	
	ctx.restore();
}

//
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('pointermove', e => {
    let r = canvas.getBoundingClientRect();
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    // Calcoliamo la posizione sulla griglia
    let gx = Math.floor(((e.clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((e.clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        const cell = grid[gy][gx];
        
        // Aggiorna contenuto
        tooltip.innerHTML = `<strong>${cell.type === 'server' ? 'Server' : cell.subType ? cell.subType.desc : 'Collegamento'}</strong>`;
        
        // Posiziona la tooltip vicino al mouse (offset di 15px per non coprire il cursore)
        tooltip.style.left = (e.clientX - 20) + 'px';
        tooltip.style.top = (e.clientY - 40) + 'px';
        tooltip.style.display = 'block';
    } else {
        tooltip.style.display = 'none';
    }
});

// Nascondi la tooltip quando il mouse esce dal canvas
canvas.addEventListener('pointerleave', () => {
    tooltip.style.display = 'none';
});

// Cerca questa parte in fondo e sostituiscila:
canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); // Fondamentale per non far scattare altri eventi
    if (gameWon) return;
    
    let r = canvas.getBoundingClientRect();
    // Calcola la scala se la canvas è stata rimpicciolita dal CSS
    let scaleX = canvas.width / r.width;
    let scaleY = canvas.height / r.height;
    
    let clientX = e.clientX || (e.touches && e.touches[0].clientX);
    let clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    let gx = Math.floor(((clientX - r.left) * scaleX) / CELL_SIZE);
    let gy = Math.floor(((clientY - r.top) * scaleY) / CELL_SIZE);
    
    if (grid[gy] && grid[gy][gx]) {
        grid[gy][gx].conns = rotateBitmask(grid[gy][gx].conns);
        updateConnectivity();
    }
}, { passive: false });

initGame();
animate(); // Avvia l'animazione
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Masters Clone</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a1628;touch-action:none;}
  canvas{display:block;width:100vw;height:100vh;}
  #club, #bloody{
    position: absolute;
    left: 10px;
    top: 10px;
    border: 3px solid #ffffff55;
    background: none;
    border-radius: 100%;
    color: #fff;
    background: rgba(0, 0, 0, 0.5);
    width: 75px;
    height: 75px;
    text-align: center;
    padding: 0;
    font-size: 24px;
    font-weight: bold;
    font-family: sans-serif;
  }
  #bloody{
    top: 100px;
  }
  
  #info{
    position: absolute; 
	right: 16px; 
	top: 50px; 
	color: #fff; 
	border: 0; 
	border-radius: 4px;
	background: rgba(0, 0, 0, 0.5);
	display: flex; 
	width: 125px;
    text-align: right;
    padding: 4px 0;
	flex-direction: column; 
	justify-content: center; 
	font-weight: bold;
	font-size: 14px;
    font-family: sans-serif;
  }
</style>
</head>
<body>
<button id="club" onclick="changeClub()">🔨 Club</button>
<button id="bloody" onclick="changeBloodyMode()">❄️ Snow</button>
<div id="info"></div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById("c");
const cx=cv.getContext("2d");
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
window.addEventListener("resize",resize);resize();

const GR=1100;//gravity (900...1600)
const GF=0.77;//ground factor / altezza terreno
const PR=22;//penguin radius
const BEAR_WX=110;//posizione orsone
const PEN_WX=250;//posizione pinguino
const BFX=0.87;//bounce factor X rallenta
const BFY=-0.54;//bounce factor Y dimezza

const BEAR_HIT=0.15;//quanto tempo impiega l'orsone a colpire pingu
const BEAR_FOLLOW=0.15;//dopo quanto tempo l'orsone resta in modalita follow through

let currentClub=0;

let bloodyMode=false;
let bloodMarks = []; // {x, rx, ry, alpha}
let bloodPool = {active:false, x:0, rx:0, ry:0};
let lastBloodMarkX = 0;

//trichechi rimbalzanti
const WALRUS_R = 28;        // raggio corpo
const WALRUS_COUNT = 20;    // quanti walrus in tutto
const WALRUS_SPACING = 600; // distanza base in px mondo (~250m)
let walruses = [];

function buildWalruses(){
  walruses = [];
  for(let i = 0; i < WALRUS_COUNT; i++){
    const wx = PEN_WX + WALRUS_SPACING*(i+1) + (Math.random()-0.5)*WALRUS_SPACING/2;
    walruses.push({wx, hit:false, squish:0});
  }
}


function gY(){return cv.height*GF;}

function changeClub() { currentClub = (currentClub + 1) % 5; }

function changeBloodyMode() { bloodyMode=!bloodyMode; document.getElementById('bloody').innerHTML= bloodyMode ? '🩸 Blood':'❄️ Snow'; }


// ─── WEB AUDIO ────────────────────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playHit(vol=1){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.frequency.setValueAtTime(180,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.15);
  g.gain.setValueAtTime(vol*0.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2);
  o.start();o.stop(AC.currentTime+0.2);
}
function playBounce(strength){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  const f=120+strength*80;
  o.frequency.setValueAtTime(f,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(f*0.4,AC.currentTime+0.12);
  g.gain.setValueAtTime(Math.min(strength*0.3,0.3),AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15);
  o.start();o.stop(AC.currentTime+0.15);
}
let noteFreq = {
  // Ottava 3 == ottava4 / 2
  'c': 130.81,   'c#': 138.59, 'db': 138.59,  'd': 146.83,  'd#': 155.56,  'eb':155.56,   'e': 164.81,  'f': 174.61,   'f#': 185.00, 'gb': 185.00,  'g': 196.00,  'g#': 207.65,  'ab': 207.65,  'a': 220.00,  'a#':233.08,  'bb': 233.08,  'b': 246.94,
  // Ottava 4
  'C': 261.63,   'C#': 277.18, 'Db': 277.18,  'D': 293.66,  'D#': 311.13,  'Eb': 311.13,  'E': 329.63,  'F': 349.23,   'F#': 369.99, 'Gb': 369.99,  'G': 392.00,  'G#': 415.30,  'Ab': 415.30,  'A': 440.00,  'A#':466.16,  'Bb': 466.16,  'B': 493.88
}

function playJingle(vol = 1){
  const t = AC.currentTime;
  const notes = [
    // Frase 1: Bb - F - F# - A - Bb
    {f: 'bb', d: 0.15}, // Bb3
    {f: 'f',  d: 0.15}, // F3
    {f: 'f#', d: 0.15}, // F#3
    {f: 'a',  d: 0.15}, // A3
    {f: 'bb', d: 0.25}, // Bb3 (lungo)
    
    // Frase 2: F - G - A - B
    {f: 'f',  d: 0.15}, // F3
    {f: 'g',  d: 0.15}, // G3
    {f: 'a',  d: 0.15}, // A3
    {f: 'b',  d: 0.25}, // B3 (lungo)
    
    // Frase 3: F# - G# - Bb - B
    {f: 'f#', d: 0.15}, // F#3
    {f: 'ab', d: 0.15}, // G#3
    {f: 'bb', d: 0.15}, // Bb3
    {f: 'b',  d: 0.25}, // B3 (lungo)
    
    // Frase 4: F# - G# - B - C
    {f: 'f#', d: 0.15}, // F#3
    {f: 'ab', d: 0.15}, // G#3
    {f: 'bb', d: 0.15}, // B3
    {f: 'C',  d: 0.25}, // C4 (lungo)

	// FINALE veloce ascendente: G - A - B - C
    {f: 'g',  d: 0.15}, // G3
    {f: 'a',  d: 0.15}, // A3
    {f: 'b',  d: 0.15}, // B3
    {f: 'C',  d: 0.15}, // C4
	{f: 'g',  d: 0.15}, // G3
    {f: 'a',  d: 0.15}, // A3
    {f: 'b',  d: 0.15}, // B3
    {f: 'C',  d: 0.25}, // C4
    
	{f: '0', d: 0.30},//pausa
	
    // TRIONFO FINALE
    {f: 'g', d: 0.15},
    {f: 'C', d: 0.15},
    {f: 'E', d: 0.15},
	{f: 'G', d: 0.25},
	{f: '0', d: 0.10},//pausa
	{f: 'E', d: 0.15},
	{f: 'G', d: 0.60}
  ];
  
  let currentTime = t;
  notes.forEach((n) => {
    if(n.f !== '0'){
      const o = AC.createOscillator();
      const g = AC.createGain();
  
      o.connect(g);
      g.connect(AC.destination);
  
      o.type = "square";
	  //const real = new Float32Array([0, 1, 0.5, 0.3, 0.2]);
      //const imag = new Float32Array(real.length);
      //const wave = AC.createPeriodicWave(real, imag);
      //o.setPeriodicWave(wave);
  
      o.frequency.setValueAtTime(noteFreq[n.f] ? noteFreq[n.f] : n.f, currentTime);
      g.gain.setValueAtTime(vol * 0.3, currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, currentTime + n.d);
      o.start(currentTime);
      o.stop(currentTime + n.d);
    }
    currentTime += n.d;//avanza sempre (anche per pause)
  });
}

function unlockAudio(){AC.resume();}
cv.addEventListener("mousedown",unlockAudio,{once:true});
cv.addEventListener("touchstart",unlockAudio,{once:true});

// ─── STATE ────────────────────────────────────────────────────────────────────
let gs="READY"; //game state: READY|SWING|FLYING|SLIDING|STOPPED
let T=0;
let lt=0;
let power=0;
let lp=0;
let bestDist=0;
let shake=0;
let camX=0;
let isHolding=false;
let holdTime=0;
let superFlash=0;

const pen={
	wx:PEN_WX,//position
	wy:0,
	vx:0,//speed
	vy:0,
	rot:0,//rotation angle
	sX:1,//scale
	sY:1,
	dist:0//distance
};
										   
const bear={
	wx:BEAR_WX,//position
	state:"idle",
	st:0
		
														  
};

// ─── DECAPITATION STATE 
// La testa vola separatamente in modalità bloody
const penHead={
  active:false   // true quando la testa è in volo separata
};
// Il corpo decapitato rimane fisso a terra
const penBody={
  active:false,					   
  wx:0,
  wy:0,
  rot:0,
  bloodAnim:0    // timer per animazione sangue che sgorga
};

let parts=[];

//stelline in cielo		
const stars=Array.from({length:120},()=>({
  wx:Math.random()*8000,
  y:Math.random()*0.52,
  r:Math.random()*1.8+0.3,
  tw:Math.random()*Math.PI*2
}));

//neve che scende	   
const snow=Array.from({length:80},()=>({
  x:Math.random()*2000,
  y:Math.random()*800,
  r:Math.random()*2.2+0.4,
  vy:Math.random()*50+12,
  vx:Math.random()*18-9
}));

// ─── INPUT
function onPress(){
  unlockAudio();
  if(gs==="READY"&&!isHolding){isHolding=true;holdTime=0;power=0;}
  else if(gs==="STOPPED") reset();
}
function onRelease(){
  if(gs==="READY"&&isHolding){
    isHolding=false;
	lp=power;
    gs="SWING";
	bear.state="swing";
	bear.st=0;
  }
}
cv.addEventListener("mousedown",onPress);
cv.addEventListener("mouseup",onRelease);
cv.addEventListener("touchstart",e=>{e.preventDefault();onPress();},{passive:false});
cv.addEventListener("touchend",e=>{e.preventDefault();onRelease();},{passive:false});

function reset(){
  gs="READY";
  pen.wx=PEN_WX;
  pen.wy=gY();
  pen.vx=0;
  pen.vy=0;
  pen.rot=0;
  pen.sX=1;
  pen.sY=1;
  pen.dist=0;
  bear.state="idle";
  bear.st=0;
  camX=0;
  parts=[];
  isHolding=false;
  holdTime=0;
  power=0;
  superFlash=0;
  bloodMarks=[];
  bloodPool={active:false,x:0,rx:0,ry:0};
  lastBloodMarkX=0;
  // reset decapitation
  penHead.active=false;
  penBody.active=false;
  //resetta anche i trichechi
  buildWalruses();
}
pen.wy=gY();
buildWalruses();

//ease in + out													  
function easeOut(t){return 1-(1-t)*(1-t);}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

// ─── DECAPITATION TRIGGER ─────────────────────────────────────────────────────
function triggerDecapitation(){
  // Il corpo resta dove il pinguino si trovava
  penBody.active=true;
  penBody.wx=pen.wx;
  penBody.wy=gY();
  penBody.rot=(Math.random()-0.5)*0.3;
  penBody.bloodAnim=0;

  // La testa vola con la stessa velocità del pinguino
  penHead.active=true;
  
  // Schizzi di sangue esplosivi dal collo
  for(let i=0;i<40;i++){
    const a=-Math.PI*0.5+( Math.random()-0.5)*Math.PI*1.2;
    const spd=200+Math.random()*700;
    parts.push({
      x:pen.wx+(Math.random()-0.5)*16,
      y:gY()-PR*1.6,
      vx:Math.cos(a)*spd,
      vy:Math.sin(a)*spd-100,
      life:0.7+Math.random()*0.5,
      ml:1.2,
      r:Math.random()*7+2,
      h:0,snow:false,
      isBlood:true
    });
  }
  // Grossi getti verso l'alto e a destra
  for(let i=0;i<12;i++){
    const a=-Math.PI*0.6+Math.random()*(-Math.PI*0.4);
    const spd=400+Math.random()*600;
    parts.push({
      x:pen.wx,y:gY()-PR*1.8,
      vx:Math.cos(a)*spd+pen.vx*0.3,
      vy:Math.sin(a)*spd,
      life:0.9+Math.random()*0.4,
      ml:1.3,
      r:Math.random()*9+5,
      h:0,snow:false,
      isBlood:true
    });
  }
}

// ─── UPDATE 
function update(dt){
  T+=dt;
  if(gs==="READY"){
    camX=0;
	pen.wy=gY();
    if(isHolding){
      holdTime+=dt;
	  // Oscillation speeds up gently the longer you hold → harder to hit SUPER again																			   
      const speed=2.4+holdTime*0.55;
      power=(Math.sin(holdTime*speed)+1)/2;
      if(power>=0.90) superFlash=Math.min(superFlash+dt*4,1);
      else superFlash=Math.max(superFlash-dt*6,0);
    } else {
	  power=0;
	  superFlash=0;
	}
  }

  //bear swing									
  if(bear.state==="swing"){
    bear.st+=dt;
    if(bear.st>=BEAR_HIT&&gs==="SWING"){
      gs="FLYING";
      const isSuper=lp>=0.90;
      const mult=isSuper?1.32:1;
	  //velocita totale (come prima)						
      const speed=(900+lp*900)*mult;
      const baseAngle=-Math.PI*0.25;
      const deltaAngle=(Math.random()-0.5)*Math.PI/18;
      const angle=baseAngle+deltaAngle;//angolo finale
      //scomposizione x/y
      pen.vx=Math.cos(angle)*speed;
      pen.vy=Math.sin(angle)*speed;
      document.getElementById('info').innerHTML=`<div>${(pen.vx|0)}→</div>
												 <div>${(-pen.vy|0)} ↑</div>
												 <div>${(-(angle*57.29).toFixed(1))} ∠</div>
												 <div>${((lp*100).toFixed(1))} 💪</div>`;
      pen.wy=gY();
      playHit(0.6+lp*0.4);

      // ── DECAPITAZIONE in modalità bloody ──
      if(bloodyMode && lp>0.99){
	    playJingle();
        triggerDecapitation();
      }

      if(isSuper){
        shake=22;
        for(let i=0;i<30;i++){
          const a=Math.random()*Math.PI*2;
          parts.push({
            x:pen.wx+(Math.random()-0.5)*30,y:gY()-20,
            vx:Math.cos(a)*(200+Math.random()*300),
            vy:Math.sin(a)*(200+Math.random()*300)-200,
            life:0.9,
			ml:0.9,
			r:Math.random()*8+4,
            h:40+Math.random()*20,
			snow:false
          });
        }
      }
    }
    if(bear.st>=BEAR_FOLLOW) bear.state="followthrough";
  }

  // Penguin physics (sempre aggiornato; in bloody la testa usa penHead)
  if(gs==="FLYING"){
    pen.vy+=GR*dt;
    pen.vx*=Math.pow(0.996,dt*60);
    pen.wx+=pen.vx*dt;
    pen.wy+=pen.vy*dt;
    pen.rot+=pen.vx*0.00125*dt*60;

    // Trail
    if(Math.abs(pen.vx)>80&&Math.random()<0.6){
      parts.push({
        x:pen.wx+(Math.random()-0.5)*10,
        y:pen.wy-PR+(Math.random()-0.5)*10,
        vx:-pen.vx*0.04+(Math.random()-0.5)*40,
        vy:-pen.vy*0.04+(Math.random()-0.5)*40,
        life:0.4,
		ml:0.4,
		r:Math.random()*7+3,
        h:195+Math.random()*40,
		snow:false
      });
    }
	
	// — Collisione walrus —
	if(gs==="FLYING"){
	  for(const w of walruses){
		if(w.hit) continue;
		const dx = pen.wx - w.wx;
		const dy = pen.wy - (gY() - WALRUS_R*0.45);
		if(Math.abs(dx) < WALRUS_R*1.6 && Math.abs(dy) < WALRUS_R*0.9){
		  w.hit = true;
		  w.squish = 1;
		  pen.vy = Math.min(pen.vy, -1000) * 1;//quanto rimbalza verticalmente
		  pen.vx *= 1.5;//quanto accelera orizzontalmente
		  shake = Math.max(shake, 10);
		  playBounce(0.6);
		  // particelle colpita
		  for(let i=0;i<12;i++){
			const a = -Math.PI*(0.3+Math.random()*0.9);
			parts.push({x:w.wx,y:gY()-WALRUS_R,
			  vx:Math.cos(a)*(80+Math.random()*180),
			  vy:Math.sin(a)*(80+Math.random()*180),
			  life:0.55,
			  ml:0.55,
			  r:Math.random()*5+2,
			  h:30,
			  snow:false});
		  }
		}
	  }
	}
	// Aggiorna squish
	for(const w of walruses) w.squish += (0 - w.squish)*dt*6;
	
	
	
	
	

    if(pen.wy>=gY()){
      pen.wy=gY();
      const spd=Math.abs(pen.vy);
      if(spd>90){
        pen.vy*=BFY;//bounce factor y = 0.54
		pen.vx*=BFX;//bounce factor x = 0.87
        shake=Math.min(spd/350,1)*18;
        pen.sX=1.55;
		pen.sY=0.52;
        playBounce(spd/600);

        if(bloodyMode&&spd>90){
          const size=Math.min(120,5+spd*0.1);//max 120px altrimenti troppo grossa e sfumata
		  //pozzetta di sangue				
          bloodMarks.push({x:pen.wx,rx:size*1.00,ry:size*0.05,alpha:0.82});
		  
		  //schizzi satellite gia a terra						   
          for(let i=0;i<16;i++){
            bloodMarks.push({
              x:pen.wx+(Math.random()-0.5)*size*3.5,
              rx:4+Math.random()*10,
			  ry:2+Math.random(),
              alpha:0.5+Math.random()*0.25
            });
          }
        }

		//schizzi di neve/sangue sul rimbalzo						  
        let ptot=bloodyMode?64:16;
        for(let i=0;i<ptot;i++){
          parts.push({
            x:pen.wx+(Math.random()-0.5)*20,
			y:gY(),
            vx:(Math.random()-0.5)*320,
			vy:-Math.random()*480-30,
            life:0.75,
			ml:0.75,
			r:Math.random()*5+2,
            h:bloodyMode?0:-1,//hue 0 = rosso se bloody
			snow:!bloodyMode//trattate come colorate, non neve
          });
        }
      } else {
        pen.vy=0;
		gs="SLIDING";
      }
    }
    pen.sX+=(1-pen.sX)*dt*14;
    pen.sY+=(1-pen.sY)*dt*14;
    const tCam=pen.wx-cv.width*0.38;
    camX+=(Math.max(0,tCam)-camX)*(1-Math.exp(-dt*7));
    pen.dist=Math.max(pen.dist,Math.max(0,Math.round((pen.wx-PEN_WX)/3)));
  }

  if(gs==="SLIDING"){
    pen.wy=gY();
    pen.vx*=Math.pow(0.72,dt*60);
    pen.wx+=pen.vx*dt;
    if(bloodyMode&&Math.abs(pen.wx-lastBloodMarkX)>12){
      bloodMarks.push({
        x:pen.wx+(Math.random()-0.5)*8,
        rx:3+Math.random()*5,
		ry:2+Math.random()*3,
        alpha:0.35+Math.random()*0.25
      });
      lastBloodMarkX=pen.wx;
    }
    pen.rot+=pen.vx*0.0008*dt*60;
    pen.sX+=(1-pen.sX)*dt*10;
    pen.sY+=(1-pen.sY)*dt*10;
    const tCam=pen.wx-cv.width*0.38;
    camX+=(Math.max(0,tCam)-camX)*(1-Math.exp(-dt*5));
    pen.dist=Math.max(pen.dist,Math.max(0,Math.round((pen.wx-PEN_WX)/3)));
    if(Math.abs(pen.vx)<12){
      pen.vx=0;
	  gs="STOPPED";
      if(bloodyMode) bloodPool={active:true,x:pen.wx,rx:0,ry:0};
      if(pen.dist>bestDist) bestDist=pen.dist;
    }
  }

  // Sangue che sgorga dal corpo decapitato
  if(penBody.active){
    penBody.bloodAnim+=dt;
    // Piccoli zampilli dal collo per i primi 2 secondi
    if(penBody.bloodAnim<2.0&&Math.random()<0.45){
      const bx=penBody.wx;
      const by=gY()-PR*1.5;
      const a=-Math.PI*0.5+(Math.random()-0.5)*0.8;
      const spd=60+Math.random()*180*(1-penBody.bloodAnim*0.4);
      parts.push({
        x:bx+(Math.random()-0.5)*8,y:by,
        vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
        life:0.4+Math.random()*0.3,ml:0.7,
        r:Math.random()*4+2,h:0,snow:false,isBlood:true
      });
    }
  }

  if(bloodyMode&&bloodPool.active){
    bloodPool.rx+=(95-bloodPool.rx)*dt*0.5;
    bloodPool.ry+=(5-bloodPool.ry)*dt*0.5;
  }

  //particles				 
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;
	p.y+=p.vy*dt;
    p.vy+=700*dt;
	p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
  //snow
  for(const s of snow){
    s.y+=s.vy*dt;
	s.x+=s.vx*dt;
    if(s.y>cv.height+5){s.y=-5;s.x=Math.random()*cv.width;}
  }
  shake*=0.78;
}

// ─── DRAW
function draw(){
  const sx=shake>0.6?(Math.random()-0.5)*shake:0;
  const sy=shake>0.6?(Math.random()-0.5)*shake:0;

  const sky=cx.createLinearGradient(0,0,0,gY());
  sky.addColorStop(0,"#060e1e");
  sky.addColorStop(0.5,"#0f2244");
  sky.addColorStop(1,"#1a4470");
  cx.fillStyle=sky;
  cx.fillRect(0,0,cv.width,cv.height);

  drawStars();
  drawAurora();
  drawMountains();

  cx.save();
  cx.translate(Math.round(sx-camX),Math.round(sy));
  drawGround();
  drawBloodOnGround();
  drawParticles();
  drawWalruses();
  drawBear();
  drawPenguin();
  
  
  cx.restore();
  drawSnow();drawUI();
}

// ─── DRAW FLYING HEAD ─────────────────────────────────────────────────────────
function drawFlyingHead(wx,wy,rot,sX,sY){
  cx.save();
  cx.translate(wx,wy-PR/2);//-PR);
  cx.rotate(rot);
  cx.scale(sX,sY);

  const r=PR;

  // Collo mozzato (lato basso della testa): osso + sangue
  // Cerchio di sangue al collo
  cx.fillStyle="#8b0000";
  cx.beginPath();
  cx.ellipse(0,r*0.85,r*0.55,r*0.32,0,0,Math.PI*2);
  cx.fill();
  
  // Osso: cilindro bianco con sfumatura
  const boneGrad=cx.createLinearGradient(-8,r*0.6,8,r*0.6);
  boneGrad.addColorStop(0,"#d0d0c0");
  boneGrad.addColorStop(0.4,"#f5f5ee");
  boneGrad.addColorStop(1,"#b8b8a8");
  cx.fillStyle=boneGrad;
  cx.beginPath();
  cx.roundRect(-7,r*0.55,14,r*0.6,3);
  cx.fill();
  cx.strokeStyle="#aaa898";
  cx.lineWidth=1;
  cx.stroke();
  
  // Pallina osso su/giù
  cx.fillStyle="#e8e8d8";
  cx.beginPath();cx.arc(0,r*0.58,7,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(0,r*1.15,7,0,Math.PI*2);cx.fill();
  cx.strokeStyle="#b0b0a0";cx.lineWidth=1;
  cx.beginPath();cx.arc(0,r*0.58,7,0,Math.PI*2);cx.stroke();
  cx.beginPath();cx.arc(0,r*1.15,7,0,Math.PI*2);cx.stroke();
  
  // Sangue che cola dall'osso
  cx.fillStyle="rgba(160,0,0,0.85)";
  cx.beginPath();
  cx.moveTo(-5,r*0.75);
  cx.quadraticCurveTo(-8,r*0.95,-6,r*1.1);
  cx.quadraticCurveTo(-4,r*1.2,-5,r*1.35);

  cx.quadraticCurveTo(7,r*0.7,5,r*0.75);
  cx.fill();

  // Testa (corpo scuro)
  cx.fillStyle="#1a1a32";
  cx.beginPath();cx.arc(0,-r*0.15,r,0,Math.PI*2);cx.fill();

  // Maschera bianca pinguino
  const hg=cx.createRadialGradient(-2,-r*0.1,1,0,-r*0.05,r*0.72);
  hg.addColorStop(0,"#fafef2");hg.addColorStop(1,"#e2e4d4");
  cx.fillStyle=hg;
  cx.beginPath();cx.ellipse(0,-r*0.05,r*0.62,r*0.75,0,0,Math.PI*2);cx.fill();
  // Ri-oscura sommità
  cx.fillStyle="#1a1a32";
  cx.beginPath();cx.ellipse(0,-r*0.65,r*0.78,r*0.52,0,0,Math.PI*2);cx.fill();

  // Espressione: occhi sbarrati (atterrito)
  // Occhio destro – pupilla dilatata
  cx.fillStyle="white";
  cx.beginPath();cx.arc(r*0.32,-r*0.36,8.5,0,Math.PI*2);cx.fill();
  cx.fillStyle="#08081a";
  cx.beginPath();cx.arc(r*0.32,-r*0.36,6,0,Math.PI*2);cx.fill(); // pupilla enorme
  cx.fillStyle="rgba(255,255,255,0.9)";
  //cx.beginPath();cx.arc(r*0.32+3,-r*0.40,2,0,Math.PI*2);cx.fill();
  cx.fillText('x',r*0.31,-r*0.25);

  // Occhio sinistro – un po' storti (agonizzante)
  cx.fillStyle="white";
  cx.beginPath();cx.arc(-r*0.32,-r*0.36,8.5,0,Math.PI*2);cx.fill();
  cx.fillStyle="#08081a";
  cx.beginPath();cx.arc(-r*0.32+1,-r*0.36,6,0,Math.PI*2);cx.fill();

  //cx.beginPath();cx.arc(-r*0.32-3,-r*0.40,2,0,Math.PI*2);cx.fill();
  cx.fillText('x',-r*0.31,-r*0.25);

  //becco
  cx.fillStyle="#ff8c00";
  cx.beginPath();
  cx.moveTo(0,-r*0.2);cx.quadraticCurveTo(6,-r*0.25,10,r*0.0);

// ─── DRAW DECAPITATED BODY
function drawDecapitatedBody(){
  const bx=penBody.wx;
  const by=gY();
  cx.save();
  cx.translate(bx,by-PR);
  cx.rotate(penBody.rot);

  const r=PR;
  const t=penBody.bloodAnim; // tempo trascorso

  // Ombra
  cx.fillStyle="rgba(0,10,50,0.18)";
  cx.beginPath();cx.ellipse(0,r+6,r*1.3,6,0,0,Math.PI*2);cx.fill();

  // Corpo (senza testa, quindi ellisse solo del tronco)
  cx.fillStyle="#1a1a32";
  cx.beginPath();cx.ellipse(0,r*0.35,r,r*1.0,0,0,Math.PI*2);cx.fill();

  // Pancia bianca
  const bg=cx.createRadialGradient(-2,r*0.6,1,0,r*0.7,r*0.68);
  bg.addColorStop(0,"#fafef2");bg.addColorStop(1,"#e2e4d4");
  cx.fillStyle=bg;
  cx.beginPath();cx.ellipse(0,r*0.7,r*0.56,r*0.75,0,0,Math.PI*2);cx.fill();

  // Ali
  cx.fillStyle="#22223a";
  cx.beginPath();cx.ellipse(-r-1,r*0.35,6,r*0.75,0.25,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.ellipse(r+1,r*0.35,6,r*0.75,-0.25,0,Math.PI*2);cx.fill();

  // Piedi
  cx.fillStyle="#ff8c00";
  cx.beginPath();
  cx.ellipse(r*0.4,r*1.55,8,4,0.1,0,Math.PI*2);
  cx.ellipse(-r*0.4,r*1.55,8,4,-0.1,0,Math.PI*2);
  cx.fill();

  // ── COLLO MOZZATO in cima al corpo ──
  // Pozza di sangue sul taglio
  const bloodAlpha=Math.min(1,0.3+t*0.5);
  cx.fillStyle=`rgba(140,0,0,${bloodAlpha})`;
  cx.beginPath();cx.ellipse(0,-r*0.62,r*0.52,r*0.2,0,0,Math.PI*2);cx.fill();

  // Osso: vertebra visibile
  const boneGrad2=cx.createLinearGradient(-6,-r*0.75,6,-r*0.75);
  boneGrad2.addColorStop(0,"#c8c8b8");
  boneGrad2.addColorStop(0.5,"#eeeedd");
  boneGrad2.addColorStop(1,"#b0b0a0");
  cx.fillStyle=boneGrad2;
  cx.beginPath();cx.roundRect(-5,-r*0.85,10,r*0.48,3);cx.fill();
  cx.strokeStyle="#a8a898";cx.lineWidth=1;cx.stroke();
  // Pallina ossea in cima
  cx.fillStyle="#e0e0d0";
  cx.beginPath();cx.arc(0,-r*0.85,6.5,0,Math.PI*2);cx.fill();
  cx.strokeStyle="#b0b0a0";cx.lineWidth=1;cx.stroke();

  // Sangue che cola dai lati del collo
  const dripsAlpha=Math.min(0.9,t*0.7);
  cx.fillStyle=`rgba(180,0,0,${dripsAlpha})`;
  // Gocce laterali
  const drips=[
    {x:-r*0.3,y:-r*0.65,w:5,h:r*0.4+Math.min(t*20,r*0.3)},
    {x: r*0.15,y:-r*0.68,w:4,h:r*0.3+Math.min(t*15,r*0.25)},
    {x:-r*0.05,y:-r*0.60,w:6,h:r*0.5+Math.min(t*25,r*0.4)},
  ];
  drips.forEach(d=>{
    cx.beginPath();
    cx.moveTo(d.x-d.w/2,d.y);
    cx.lineTo(d.x+d.w/2,d.y);
    cx.quadraticCurveTo(d.x+d.w/2+1,d.y+d.h*0.7,d.x,d.y+d.h);
    cx.quadraticCurveTo(d.x-d.w/2-1,d.y+d.h*0.7,d.x-d.w/2,d.y);
    cx.fill();
  });

  cx.restore();
}

// ─── DRAW PENGUIN (normale, per modalità non-bloody o prima del colpo)
function drawPenguin(){

  if(bloodyMode && penBody.active) drawDecapitatedBody();
  if(bloodyMode && penHead.active) drawFlyingHead(pen.wx,pen.wy,pen.rot,pen.sX,pen.sY);

  //becco
  cx.fillStyle="#ff8c00";
  cx.beginPath();

// ─── BLOOD ON GROUND
function drawBloodOnGround(){
  if(!bloodyMode) return;
  const gy=gY();
  const deltaY=8;
  //macchie e scia													 
  for(const m of bloodMarks){
    const grd=cx.createRadialGradient(m.x,gy,0,m.x,gy,m.rx);
    grd.addColorStop(0,`rgba(160,0,0,${m.alpha})`);
    grd.addColorStop(0.6,`rgba(110,0,0,${m.alpha*0.7})`);
    grd.addColorStop(1,`rgba(80,0,0,0)`);
    cx.fillStyle=grd;
    cx.beginPath();cx.ellipse(m.x,gy+deltaY,m.rx,m.ry,0,0,Math.PI*2);cx.fill();
  }
  //lago finale					   
  if(bloodPool.active&&bloodPool.rx>0.5){
    const x=bloodPool.x;
	const rx=bloodPool.rx;
	const ry=bloodPool.ry;
    const grd=cx.createRadialGradient(x,gy,0,x,gy,rx);
    grd.addColorStop(0,"rgba(180,0,0,0.92)");
    grd.addColorStop(0.5,"rgba(130,0,0,0.80)");
    grd.addColorStop(0.85,"rgba(80,0,0,0.55)");
    grd.addColorStop(1,"rgba(60,0,0,0)");
    cx.fillStyle=grd;
    cx.beginPath();
	cx.ellipse(x,gy+deltaY,rx,ry,0,0,Math.PI*2);
	cx.fill();
    cx.strokeStyle="rgba(30,0,0,0.4)";cx.lineWidth=3;
    cx.beginPath();
	cx.ellipse(x-rx*0.2,gy+deltaY,rx*0.25,ry*0.25,0,0,Math.PI*2);
	cx.stroke();
  }
}

// ─── STARS / AURORA / MOUNTAINS
function drawStars(){
  for(const s of stars){
    const sx=((s.wx-camX*0.015)%cv.width+cv.width)%cv.width;
    const sy=s.y*gY();
    const b=0.25+0.5*Math.abs(Math.sin(T*1.5+s.tw));
    cx.fillStyle=`rgba(230,245,255,${b})`;
    cx.beginPath();cx.arc(sx,sy,s.r,0,Math.PI*2);cx.fill();
  }
}
function drawAurora(){
  const gy=gY();
  for(let l=0;l<3;l++){
    const phase=T*0.3+l*2.1;
    const alpha=0.04+0.03*Math.sin(T*0.7+l);
    const gr=cx.createLinearGradient(0,gy*0.1,0,gy*0.55);
    const hue=160+l*30+Math.sin(T*0.2)*20;
    gr.addColorStop(0,`hsla(${hue},80%,55%,0)`);
    gr.addColorStop(0.4,`hsla(${hue},80%,55%,${alpha})`);
    gr.addColorStop(1,`hsla(${hue},80%,55%,0)`);
    cx.fillStyle=gr;cx.beginPath();cx.moveTo(0,gy*0.3);
    for(let x=0;x<=cv.width;x+=30){
      cx.lineTo(x,gy*(0.3+0.12*Math.sin(x*0.004+phase+l)));
    }
    cx.lineTo(cv.width,0);cx.lineTo(0,0);cx.fill();
  }
}
function drawMountains(){
  const gy=gY();
  const p1=0.05;const step=50;
  const start=Math.floor((camX*p1-100)/step)*step;
  const end=camX*p1+cv.width+100;
  const farPts=[];
  for(let wx=start;wx<=end;wx+=step){
    const sx=Math.round(wx-camX*p1);
    const h=90+Math.sin(wx*0.006)*55+Math.cos(wx*0.011)*35;
    farPts.push({x:sx,h});
  }
  cx.fillStyle="#0e2240";cx.beginPath();cx.moveTo(0,gy);
  for(const p of farPts) cx.lineTo(p.x,gy-p.h);
  cx.lineTo(cv.width+100,gy);cx.fill();
  drawSnowPeaks(farPts,60,start,step,'11');

  const p2=0.13;const step2=45;
  const start2=Math.floor((camX*p2-150)/step2)*step2;
  const end2=camX*p2+cv.width+150;
  const midPts=[];
  for(let wx=start2;wx<=end2;wx+=step2){
    const sx=Math.round(wx-camX*p2);
    const h=55+Math.sin(wx*0.01)*50+Math.cos(wx*0.017)*34;
    midPts.push({x:sx,h});
  }
  cx.fillStyle="#183858";
  cx.beginPath();cx.moveTo(midPts[0].x,gy);
  for(const p of midPts) cx.lineTo(p.x,gy-p.h);
  cx.lineTo(midPts[midPts.length-1].x,gy);cx.fill();
  drawSnowPeaks(midPts,60,start2,step2,'66');
}
function drawSnowPeaks(midPts,minHeight,start2,step2,alpha){
  const gy=gY();
  for(let i=1;i<midPts.length-1;i++){
    const p=midPts[i];const prev=midPts[i-1];const next=midPts[i+1];
    if(p.h>minHeight){
      const snowDepth=(p.h-60)*0.6;
      const grad=cx.createLinearGradient(p.x-20,gy-p.h-snowDepth,p.x+20,gy-p.h+snowDepth);
      grad.addColorStop(0,"#ffffff"+alpha);grad.addColorStop(1,"#c2d1e5"+alpha);
      cx.fillStyle=grad;cx.beginPath();
      cx.moveTo((prev.x+p.x)/2,gy-(prev.h+p.h)/2);
      cx.lineTo(p.x,gy-p.h);
      cx.lineTo((next.x+p.x)/2,gy-(next.h+p.h)/2);
      const jitterMid=-snowDepth/2;
      cx.lineTo((next.x+p.x)/2,gy-(next.h+p.h)/2+snowDepth);
      cx.lineTo(p.x,gy-p.h+(snowDepth*1.2)+jitterMid);
      cx.lineTo((prev.x+p.x)/2,gy-(prev.h+p.h)/2+snowDepth);
      cx.closePath();cx.fill();
    }
  }
}
function drawGround(){
  const gy=gY();const L=camX-80;const R=camX+cv.width+80;
  const sg=cx.createLinearGradient(0,gy,0,gy+60);
  sg.addColorStop(0,"#c8dff0");sg.addColorStop(1,"#b0ccdf");
  cx.fillStyle=sg;cx.fillRect(L,gy,R-L,cv.height-gy+10);
  cx.fillStyle="#e4f2ff";cx.beginPath();cx.moveTo(L,gy);
  for(let x=L;x<=R;x+=20) cx.lineTo(x,gy-7+Math.sin(x*0.07+1)*4+Math.cos(x*0.13)*2);
  cx.lineTo(R,gy);cx.lineTo(R,gy+18);cx.lineTo(L,gy+18);cx.fill();
  cx.fillStyle="rgba(255,255,255,0.55)";cx.beginPath();cx.moveTo(L,gy);
  for(let x=L;x<=R;x+=20) cx.lineTo(x,gy-7+Math.sin(x*0.07+1)*4+Math.cos(x*0.13)*2);
  cx.lineTo(R,gy);cx.lineTo(R,gy+5);cx.lineTo(L,gy+5);cx.fill();
  for(let x=L-((L|0)%200);x<R;x+=200){
    cx.fillStyle="rgba(180,225,255,0.22)";cx.beginPath();
    cx.ellipse(x+Math.sin(x)*30,gy+8,50,5,0,0,Math.PI*2);cx.fill();
  }
  cx.textAlign="center";
  for(let d=10;d<=3000;d+=10){
    const wx=PEN_WX+d*3;
    if(wx<L||wx>R) continue;
    const major=d%100===0;const mid=d%50===0;
    cx.strokeStyle=major?"#7a9cb8":mid?"#98b4cc":"#b0c8dc";
    cx.lineWidth=major?2:1;cx.globalAlpha=major?0.9:mid?0.6:0.35;
    cx.beginPath();cx.moveTo(wx,gy+3);cx.lineTo(wx,gy+(major?20:mid?17:14));cx.stroke();
    cx.globalAlpha=1;
    if(major){cx.fillStyle="#5a7898";cx.font="bold 13px sans-serif";cx.fillText(d+"m",wx,gy+34);}
  }
  if(bestDist){
    const wx=PEN_WX+bestDist*3;
    cx.strokeStyle="#b0c8dc";cx.beginPath();cx.moveTo(wx,gy+3);cx.lineTo(wx,gy+40);cx.stroke();
    cx.textAlign="center";cx.fillStyle="#5a7898";cx.font="bold 13px sans-serif";
    cx.fillText("🏆",wx,gy+46);cx.fillText(bestDist+" m",wx,gy+60);
  }
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function drawParticles(){
  for(const p of parts){
    const t=p.life/p.ml;
    let color;
    if(p.isBlood||bloodyMode){
      if(p.isBlood){
        // Sangue puro: rosso scuro→vivo
        const r=Math.round(140+t*60);
        color=`rgba(${r},${Math.round(t*10)},${Math.round(t*5)},${t*0.92})`;
      } else if(p.snow){
        const r=Math.round(160+t*60);
        color=`rgba(${r},${Math.round(t*18)},${Math.round(t*8)},${t*0.9})`;
      } else {
        color=`hsla(${2+p.h*0.01},90%,${28+t*22}%,${t*0.85})`;
      }
    } else {
      color=p.snow?`rgba(210,235,255,${t*0.85})`:`hsla(${p.h},65%,75%,${t*0.75})`;
    }
    cx.fillStyle=color;
    cx.beginPath();cx.arc(p.x,p.y,p.r*Math.sqrt(t),0,Math.PI*2);cx.fill();
  }
}
function drawSnow(){
  for(const s of snow){
    cx.fillStyle="rgba(215,235,255,0.55)";
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,Math.PI*2);cx.fill();

//trichechi
function drawWalruses(){
  const gy = gY();
  for(const w of walruses){
    const wx = w.wx;
    const sq = w.squish;           // 0..1 schiacciamento
    const scX = 1 + sq * 0.35;
    const scY = 1 - sq * 0.4;
    const baseY = gy - WALRUS_R * 0.4 + 2;
    cx.save();
    cx.translate(wx, baseY);
    cx.scale(scX, scY);

    // Ombra
    cx.fillStyle = "rgba(0,10,50,0.18)";
    cx.beginPath();
    cx.ellipse(0, WALRUS_R*0.5, WALRUS_R*1.6, 5, 0, 0, Math.PI*2);
    cx.fill();

    // Corpo — ellisse orizzontale
    const bodyGr = cx.createLinearGradient(-WALRUS_R*1.5, -WALRUS_R*0.5,
                                            WALRUS_R*1.5,  WALRUS_R*0.5);
    bodyGr.addColorStop(0, w.hit ? "#8B6040" : "#A07850");
    bodyGr.addColorStop(0.5, w.hit ? "#C09060" : "#D4A870");
    bodyGr.addColorStop(1, w.hit ? "#7A5430" : "#8C6440");
    cx.fillStyle = bodyGr;
    cx.beginPath();
    cx.ellipse(0, 0, WALRUS_R*1.55, WALRUS_R*0.75, 0, 0, Math.PI*2);
    cx.fill();

    // Pancia più chiara
    cx.fillStyle = w.hit ? "rgba(200,160,100,0.5)" : "rgba(230,190,130,0.55)";
    cx.beginPath();
    cx.ellipse(WALRUS_R*0.1, WALRUS_R*0.25, WALRUS_R*0.9, WALRUS_R*0.45, 0, 0, Math.PI*2);
    cx.fill();

    // Testa (sinistra)
    cx.fillStyle = w.hit ? "#8B6040" : "#A07850";
    cx.beginPath();
    cx.ellipse(-WALRUS_R*1.3, -WALRUS_R*0.15, WALRUS_R*0.6, WALRUS_R*0.55, -0.15, 0, Math.PI*2);
    cx.fill();

    // Occhio dx
    cx.fillStyle = w.hit ? "#200000" : "#1a1010";
    cx.beginPath();
    cx.arc(-WALRUS_R*1.5, -WALRUS_R*0.32, 4, 0, Math.PI*2);
    cx.fill();
    cx.fillStyle = "rgba(255,255,255,0.6)";
    cx.beginPath();
    cx.arc(-WALRUS_R*1.5+1.5, -WALRUS_R*0.35, 1.5, 0, Math.PI*2);
    cx.fill();
	
	// Occhio sx
    cx.fillStyle = w.hit ? "#200000" : "#1a1010";
    cx.beginPath();
    cx.arc(-WALRUS_R*1.5 - 6, -WALRUS_R*0.32, 4, 0, Math.PI*2);
    cx.fill();
    cx.fillStyle = "rgba(255,255,255,0.6)";
    cx.beginPath();
    cx.arc(-WALRUS_R*1.5-1.5 - 6, -WALRUS_R*0.35, 1.5, 0, Math.PI*2);
    cx.fill();
	
    // Narici / muso tondo
    cx.fillStyle = w.hit ? "#6a3820" : "#8a4e28";
    cx.beginPath();
    cx.ellipse(-WALRUS_R*1.72, -WALRUS_R*0.08, WALRUS_R*0.28, WALRUS_R*0.22, 0, 0, Math.PI*2);
    cx.fill();

    // Baffi
    cx.strokeStyle = "rgba(255,245,220,0.85)";
    cx.lineWidth = 1;
    const whiskers = [
      [-0.12, -0.06, -0.48, -0.08],
      [-0.12,  0.00, -0.48,  0.01],
      [-0.12,  0.06, -0.48,  0.08],
      [-0.12, -0.06, -0.12, -0.10],
      [-0.12,  0.00, -0.12,  0.00],
      [-0.12,  0.06, -0.12,  0.10],
	  
	  [0.12, -0.06, 0.48, -0.08],
      [0.12,  0.00, 0.48,  0.01],
      [0.12,  0.06, 0.48,  0.08],
      [0.12, -0.06, 0.12, -0.10],
      [0.12,  0.00, 0.12,  0.00],
      [0.12,  0.06, 0.12,  0.10],
    ];
    const R = WALRUS_R;
    for(const [x1,y1,x2,y2] of whiskers){
      cx.beginPath();
      cx.moveTo(-R*1.72 + x1*R*2, y1*R*2);
      cx.lineTo(-R*1.72 + x2*R*2, y2*R*2);
      cx.stroke();
    }

    // Dentoni
    cx.fillStyle = "#f0e8c0";
    cx.strokeStyle = "#c8b880";
    cx.lineWidth = 1;
    // zanna sx
    cx.beginPath();
    cx.moveTo(-WALRUS_R*1.62 - 8, WALRUS_R*0.05);
    cx.quadraticCurveTo(-WALRUS_R*1.68 - 8, WALRUS_R*0.45, -WALRUS_R*1.58 - 8, WALRUS_R*0.52);
    cx.quadraticCurveTo(-WALRUS_R*1.5  - 8, WALRUS_R*0.44, -WALRUS_R*1.52 - 8, WALRUS_R*0.05);
    cx.fill(); cx.stroke();
    // zanna dx
    cx.beginPath();
    cx.moveTo(-WALRUS_R*1.45 - 10, WALRUS_R*0.05);
    cx.quadraticCurveTo(-WALRUS_R*1.38 - 10, WALRUS_R*0.40, -WALRUS_R*1.32 - 10, WALRUS_R*0.47);
    cx.quadraticCurveTo(-WALRUS_R*1.28 - 10, WALRUS_R*0.38, -WALRUS_R*1.33 - 10, WALRUS_R*0.05);
    cx.fill(); cx.stroke();

    // Pinne posteriori (destra, forma a V)
    cx.fillStyle = w.hit ? "#7A5430" : "#8C6440";
    cx.beginPath();
    cx.moveTo(WALRUS_R*1.4, -WALRUS_R*0.1);
    cx.quadraticCurveTo(WALRUS_R*2.0, -WALRUS_R*0.3, WALRUS_R*2.1, WALRUS_R*0.1);
    cx.quadraticCurveTo(WALRUS_R*1.7,  WALRUS_R*0.1, WALRUS_R*1.55, WALRUS_R*0.4);
    cx.quadraticCurveTo(WALRUS_R*1.3,  WALRUS_R*0.1, WALRUS_R*1.4, -WALRUS_R*0.1);
    cx.fill();
    cx.beginPath();
    cx.moveTo(WALRUS_R*1.4, WALRUS_R*0.1);
    cx.quadraticCurveTo(WALRUS_R*2.0, WALRUS_R*0.3, WALRUS_R*2.1, WALRUS_R*0.5);
    cx.quadraticCurveTo(WALRUS_R*1.7, WALRUS_R*0.5, WALRUS_R*1.55, WALRUS_R*0.4);
    cx.fill();

    // Se colpito: stelle/spirali sopra la testa
    if(w.hit){
      const t = Date.now()/300;
      for(let i=0;i<3;i++){
        const a = t + i*Math.PI*2/3;
        const sx = -WALRUS_R*1.3 + Math.cos(a)*WALRUS_R*0.6;
        const sy = -WALRUS_R*0.9 + Math.sin(a)*WALRUS_R*0.25;
        cx.font = "12px sans-serif";
        cx.textAlign = "center";
        cx.fillText("★", sx, sy);
      }
    }

    cx.restore();
  }
}



// ─── UI ───────────────────────────────────────────────────────────────────────
function pill(x,y,w,h,r=10){
  cx.beginPath();cx.moveTo(x+r,y);cx.lineTo(x+w-r,y);cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);cx.arcTo(x+w,y+h,x+w-r,y+h,r);cx.lineTo(x+r,y+h);
  cx.arcTo(x,y+h,x,y+h-r,r);cx.lineTo(x,y+r);cx.arcTo(x,y,x+r,y,r);cx.closePath();
}
function drawUI(){
  const W=cv.width,H=cv.height,CX=W/2;

  if(gs==="READY"){
    if(isHolding){
      const bW=Math.min(W*0.52,340),bH=38;const bX=CX-bW/2,bY=26;
      const isSuper=power>=0.90;const pulse=Math.sin(T*14)*0.5+0.5;
      if(superFlash>0){cx.fillStyle=`rgba(255,180,0,${superFlash*0.12})`;cx.fillRect(0,0,W,H);}
      let glowCol;
      if(isSuper) glowCol=`rgba(255,200,0,${0.6+pulse*0.4})`;
      else if(power>=0.72) glowCol="rgba(255,60,0,0.55)";
      else if(power>=0.45) glowCol="rgba(230,180,0,0.5)";
      else glowCol="rgba(40,210,80,0.45)";
      cx.shadowColor=glowCol;cx.shadowBlur=isSuper?28:16;
      pill(bX-2,bY-2,bW+4,bH+4,11);cx.fillStyle="rgba(0,0,0,0)";cx.fill();cx.shadowBlur=0;
      pill(bX,bY,bW,bH,10);cx.fillStyle="#0a1830";cx.fill();
      cx.strokeStyle="rgba(100,150,200,0.3)";cx.lineWidth=1.5;cx.stroke();
      cx.save();pill(bX,bY,bW,bH,10);cx.clip();
      const zones=[
        {s:0,e:0.45,c:"rgba(30,180,60,0.18)"},{s:0.45,e:0.72,c:"rgba(210,170,0,0.18)"},
        {s:0.72,e:0.90,c:"rgba(220,50,10,0.18)"},{s:0.90,e:1.00,c:`rgba(255,180,0,${0.15+pulse*0.12})`}
      ];
      for(const z of zones){cx.fillStyle=z.c;cx.fillRect(bX+bW*z.s,bY,bW*(z.e-z.s),bH);}
      cx.restore();
      if(power>0.005){
        cx.save();pill(bX,bY,bW,bH,10);cx.clip();

        fg.addColorStop(0.90,"#ffaa00");fg.addColorStop(1.0,isSuper?`hsl(${50+pulse*20},100%,62%)`:"#ffdd00");
        cx.fillStyle=fg;cx.fillRect(bX,bY,bW*power,bH);
        cx.fillStyle="rgba(255,255,255,0.1)";cx.fillRect(bX+1,bY+1,bW*power-2,bH*0.36);cx.restore();
      }
      cx.font="bold 10px sans-serif";cx.textAlign="center";
      const zLabels=[
        {x:0.225,t:"verde",c:"rgba(80,220,100,0.7)"},{x:0.585,t:"giallo",c:"rgba(220,190,0,0.7)"},
        {x:0.81,t:"rosso",c:"rgba(255,90,50,0.7)"},{x:0.95,t:"SUPER",c:`rgba(255,200,0,${0.6+pulse*0.4})`}
      ];
      for(const l of zLabels){cx.fillStyle=l.c;cx.fillText(l.t,bX+bW*l.x,bY-3);}
      cx.fillStyle="rgba(255,255,255,0.92)";cx.font="bold 15px sans-serif";cx.textAlign="center";
      cx.fillText(Math.round(power*100)+"%",CX,bY+bH/2+5);
      if(isSuper){
        cx.fillStyle=`rgba(255,215,0,${0.9+pulse*0.1})`;cx.font="bold 16px sans-serif";
        cx.shadowColor="rgba(255,140,0,0.8)";cx.shadowBlur=10;
        cx.fillText("⚡  S U P E R !  ⚡",CX,bY-14);cx.shadowBlur=0;
      } else {
        cx.fillStyle="rgba(180,215,255,0.8)";cx.font="bold 16px sans-serif";
        cx.fillText("Rilascia al momento giusto!",CX,bY-14);
      }
    } else {
      cx.fillStyle="rgba(160,205,255,0.88)";cx.font="bold 22px sans-serif";cx.textAlign="center";
      cx.shadowColor="rgba(80,140,255,0.4)";cx.shadowBlur=8;
      cx.fillText("TIENI PREMUTO per caricare",CX,58);cx.shadowBlur=0;
      cx.fillStyle="rgba(110,155,200,0.6)";cx.font="15px sans-serif";
      cx.fillText("rilascia nella zona giusta per più distanza",CX,84);
    }
    cx.fillStyle="rgba(110,155,200,.5)";cx.font="24px sans-serif";cx.textAlign="center";
    cx.fillText("Bounce Masters Clone",CX,H-25);
  }
  if(gs==="FLYING"||gs==="SLIDING"||gs==="STOPPED"){
    const d=pen.dist;
    pill(CX-85,16,170,58,12);cx.fillStyle="rgba(0,8,30,0.6)";cx.fill();
    cx.fillStyle="#6ec0ff";cx.font="bold 12px sans-serif";cx.fillText("DISTANZA",CX,34);
    cx.fillStyle="white";cx.font="bold 34px sans-serif";
    cx.shadowColor="rgba(60,130,255,0.6)";cx.shadowBlur=10;
    cx.fillText(d+" m",CX,63);cx.shadowBlur=0;
  }
  if(bestDist>=0){
    cx.font="bold 13px sans-serif";cx.textAlign="right";
    pill(W-140,12,125,30,8);cx.fillStyle="rgba(0,0,0,0.4)";cx.fill();
    cx.fillStyle="#ffd060";cx.fillText("🏆 "+bestDist+" m",W-16,32);cx.textAlign="center";
  }
  if(gs==="STOPPED"){
    const cW=300,cH=150,cX=CX-cW/2,cY=H/2-cH/2-50;
    pill(cX,cY,cW,cH,16);cx.fillStyle="rgba(2,10,38,0.78)";cx.fill();
    cx.strokeStyle="rgba(80,140,220,0.4)";cx.lineWidth=1.5;cx.stroke();
    cx.fillStyle="white";cx.font="bold 28px sans-serif";
    cx.shadowColor="rgba(80,160,255,0.4)";cx.shadowBlur=8;
    cx.fillText(pen.dist+" metri",CX,cY+50);cx.shadowBlur=0;
    if(pen.dist===bestDist&&bestDist>0){cx.fillStyle="#ffd060";cx.font="bold 16px sans-serif";cx.fillText("🏆 Nuovo record!",CX,cY+80);}
    cx.fillStyle="rgba(140,190,255,0.85)";cx.font="18px sans-serif";cx.fillText("TAP per riprovare",CX,cY+118);
  }
}

// ─── LOOP ─────────────────────────────────────────────────────────────────────
function loop(ts){
  if(!lt) lt=ts;
  const dt=Math.min((ts-lt)/1000,0.05);
  lt=ts;update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Masters Clone</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a1628;touch-action:none;}
  canvas{display:block;width:100vw;height:100vh;}
  #club{position: absolute; right: 10px; top: 40px; border-radius: 100%; color: #fff; border: 0; background: none;}
  #info{position: absolute; right: 10px; top: 100px; color: #fff; border: 0; background: none; display: flex; flex-direction: column; justify-content: center; align-items: center;}
  #bloody{position:absolute;right:10px;top:60px;border-radius:100px;color:#fff;border:0;background:none;}
</style>
</head>
<body>
<button id="club" onclick="changeClub()">🔨 Club</button>
<button id="bloody" onclick="changeBloodyMode()">❄️ Snow</button>
<div id="info"></div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById("c");
const cx=cv.getContext("2d");
function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
window.addEventListener("resize",resize);resize();

const GR=1100;//gravity (900...1600)
const GF=0.77;//ground factor / altezza terreno
const PR=22;//penguin radius
const BEAR_WX=110;//posizione orsone
const PEN_WX=250;//posizione pinguino
const BFX=0.87;//bounce factor X rallenta
const BFY=-0.54;//bounce factor Y dimezza

const BEAR_HIT=0.15;//quanto tempo impiega l'orsone a colpire pingu
const BEAR_FOLLOW=0.50;//dopo quanto tempo l'orsone resta in modalita follow through

let currentClub=0;

let bloodyMode=false;
let bloodMarks = []; // {x, rx, ry, alpha}
let bloodPool = {active:false, x:0, rx:0, ry:0};
let lastBloodMarkX = 0;

function gY(){return cv.height*GF;}

function changeClub() { currentClub = (currentClub + 1) % 5; }

function changeBloodyMode() { bloodyMode=!bloodyMode; document.getElementById('bloody').innerHTML= bloodyMode ? '🩸 Blood':'❄️ Snow'; }


// ─── WEB AUDIO ────────────────────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playHit(vol=1){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.frequency.setValueAtTime(180,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(80,AC.currentTime+0.15);
  g.gain.setValueAtTime(vol*0.4,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.2);
  o.start();o.stop(AC.currentTime+0.2);
}
function playBounce(strength){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  const f=120+strength*80;
  o.frequency.setValueAtTime(f,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(f*0.4,AC.currentTime+0.12);
  g.gain.setValueAtTime(Math.min(strength*0.3,0.3),AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.15);
  o.start();o.stop(AC.currentTime+0.15);
}
function unlockAudio(){AC.resume();}
cv.addEventListener("mousedown",unlockAudio,{once:true});
cv.addEventListener("touchstart",unlockAudio,{once:true});

// ─── STATE ────────────────────────────────────────────────────────────────────
let gs="READY"; //game state: READY|SWING|FLYING|SLIDING|STOPPED
let T=0;
let lt=0;
let power=0;
let lp=0;
let bestDist=0;
let shake=0;
let camX=0;
let isHolding=false;
let holdTime=0;
let superFlash=0;

const pen={
	wx:PEN_WX,//position
	wy:0,
	vx:0,//speed
	vy:0,
	rot:0,//rotation angle
	sX:1,//scale
	sY:1,
	dist:0//distance
};
const bear={
	wx:BEAR_WX,//position
	state:"idle",
	st:0
};

let parts=[];

// Stars
const stars=Array.from({length:120},()=>({
  wx:Math.random()*8000,
  y:Math.random()*0.52,
  r:Math.random()*1.8+0.3,
  tw:Math.random()*Math.PI*2
}));

// Snow
const snow=Array.from({length:80},()=>({
  x:Math.random()*2000,
  y:Math.random()*800,
  r:Math.random()*2.2+0.4,
  vy:Math.random()*50+12,
  vx:Math.random()*18-9
}));

// ─── INPUT ────────────────────────────────────────────────────────────────────
function onPress(){
  unlockAudio();
  if(gs==="READY"&&!isHolding){ isHolding=true; holdTime=0; power=0; }
  else if(gs==="STOPPED") reset();
}
function onRelease(){
  if(gs==="READY"&&isHolding){
    isHolding=false;
    lp=power;
    gs="SWING";
    bear.state="swing"; 
	bear.st=0;
  }
}
cv.addEventListener("mousedown",onPress);
cv.addEventListener("mouseup",onRelease);
cv.addEventListener("touchstart",e=>{e.preventDefault();onPress();},{passive:false});
cv.addEventListener("touchend",e=>{e.preventDefault();onRelease();},{passive:false});

function reset(){
  gs="READY";
  pen.wx=PEN_WX;
  pen.wy=gY();
  pen.vx=0;
  pen.vy=0;
  pen.rot=0;
  pen.sX=1;
  pen.sY=1;
  pen.dist=0;
  bear.state="idle";
  bear.st=0;
  camX=0;
  parts=[];
  isHolding=false;
  holdTime=0;
  power=0;
  superFlash=0;
  bloodMarks = [];
  bloodPool = {active:false, x:0, rx:0, ry:0};
  lastBloodMarkX = 0;
}
pen.wy=gY();

// ─── EASING ───────────────────────────────────────────────────────────────────
function easeOut(t){return 1-(1-t)*(1-t);}
function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function update(dt){
  T+=dt;
  if(gs==="READY"){
    camX=0;
    pen.wy=gY();
    if(isHolding){
      holdTime+=dt;
      // Oscillation speeds up gently the longer you hold → harder to hit SUPER again
      const speed=2.4+holdTime*0.55;
      power=(Math.sin(holdTime*speed)+1)/2;
      if(power>=0.90) superFlash=Math.min(superFlash+dt*4,1);
      else superFlash=Math.max(superFlash-dt*6,0);
    } else {
      power=0; 
	  superFlash=0;
    }
  }

  // Bear swing
  if(bear.state==="swing"){
    bear.st+=dt;
    if(bear.st>=BEAR_HIT&&gs==="SWING"){
      gs="FLYING";
      const isSuper=lp>=0.90;
      const mult=isSuper?1.32:1;
	  
		// velocità totale (come prima)
		const speed = (900 + lp * 900) * mult;

		const baseAngle = -Math.PI * 0.25;
		const deltaAngle = (Math.random() - 0.5) * Math.PI / 18;
		const angle = baseAngle + deltaAngle;// angolo finale

		// decomposizione
		pen.vx = Math.cos(angle) * speed;
		pen.vy = Math.sin(angle) * speed;
	  
	  document.getElementById('info').innerHTML='<div>'+(pen.vx|0)+'→</div><div>'+(-pen.vy|0)+' ↑</div><div>'+(-(angle*57.29).toFixed(1))+' ∠</div><div>'+((lp*100).toFixed(1))+' 💪</div>';
	  
      //pen.vx=(380+lp*880)*mult;
      //pen.vy=-(620+lp*780)*mult;//TODO: va benino per gravity=1600
	  //pen.vy = -(700 + lp * 900);///TODO: va bene per gravity=1100	  

      pen.wy=gY();
      playHit(0.6+lp*0.4);
      if(isSuper){
        shake=22;
        for(let i=0;i<30;i++){
          const a=Math.random()*Math.PI*2;
          parts.push({
            x:pen.wx+(Math.random()-0.5)*30,y:gY()-20,
            vx:Math.cos(a)*(200+Math.random()*300),
            vy:Math.sin(a)*(200+Math.random()*300)-200,
            life:0.9,
			ml:0.9,
			r:Math.random()*8+4,
            h:40+Math.random()*20,
			snow:false
          });
        }
      }
    }
    if(bear.st>=BEAR_FOLLOW) bear.state="followthrough";
  }

  // Penguin physics
  if(gs==="FLYING"){
    pen.vy+=GR*dt;
    pen.vx*=Math.pow(0.996,dt*60);
    pen.wx+=pen.vx*dt;
    pen.wy+=pen.vy*dt;
    pen.rot+=pen.vx*0.00125*dt*60;

    // Trail
    if(Math.abs(pen.vx)>80&&Math.random()<0.6){
      const spd=Math.sqrt(pen.vx*pen.vx+pen.vy*pen.vy);
      parts.push({
        x:pen.wx+(Math.random()-0.5)*10,
        y:pen.wy-PR+(Math.random()-0.5)*10,
        vx:-pen.vx*0.04+(Math.random()-0.5)*40,
        vy:-pen.vy*0.04+(Math.random()-0.5)*40,
        life:0.4,
		ml:0.4,
		r:Math.random()*7+3,
        h:195+Math.random()*40,
		snow:false
      });
    }

    //rimbalzo/boing!
    if(pen.wy>=gY()){
      pen.wy=gY();
      const spd=Math.abs(pen.vy);
      if(spd>90){
        pen.vy*=BFY;//-0.54;//bounce factor Y
        pen.vx*=BFX;//0.87;//bounce factor X
        shake=Math.min(spd/350,1)*18;
        pen.sX=1.55;
		pen.sY=0.52;
        playBounce(spd/600);
		
		if(bloodyMode && spd>90){
		  const size = Math.min(120, 5 + spd*0.1);//max 120px altrimenti troppo grossa e sfumata
		  //pozzetta di sangue
		  bloodMarks.push({x:pen.wx, rx:size*1.00, ry:size*0.05, alpha:0.82});
		  
		  //schizzi satellite gia a terra
		  for(let i=0;i<16;i++){
			  bloodMarks.push({
				x: pen.wx+(Math.random()-0.5)*size*3.5,
				rx: 4+Math.random()*10, 
				ry: 2+Math.random(),
				alpha: 0.5+Math.random()*0.25
			  });
			}
		}
		
		//schizzi di neve/sangue sul rimbalzo
		let ptot = bloodyMode ? 64 : 16;
        for(let i=0;i<ptot;i++){
          parts.push({
			  x:pen.wx+(Math.random()-0.5)*20, 
			  y:gY(),
			  vx:(Math.random()-0.5)*320,
			  vy:-Math.random()*480-30,
			  life:0.75, 
			  ml:0.75, 
			  r:Math.random()*5+2,
			  h: bloodyMode ? 0 : -1,   // hue 0 = rosso se bloody
			  snow: !bloodyMode          // trattate come colorate, non neve
			});
        }
      }else{
        pen.vy=0; 
		gs="SLIDING";
      }
    }
    pen.sX+=(1-pen.sX)*dt*14;
    pen.sY+=(1-pen.sY)*dt*14;

    const tCam=pen.wx-cv.width*0.38;
    camX+=(Math.max(0,tCam)-camX)*(1-Math.exp(-dt*7));
    pen.dist=Math.max(pen.dist,Math.max(0,Math.round((pen.wx-PEN_WX)/3)));
  }

  if(gs==="SLIDING"){
    pen.wy=gY();
    pen.vx*=Math.pow(0.72,dt*60);
    pen.wx+=pen.vx*dt;
	
	if(bloodyMode && Math.abs(pen.wx-lastBloodMarkX)>12){
	  bloodMarks.push({
		x:pen.wx+(Math.random()-0.5)*8,
		rx:3+Math.random()*5, 
		ry:2+Math.random()*3,
		alpha:0.35+Math.random()*0.25
	  });
	  lastBloodMarkX=pen.wx;
	}
	
	
    pen.rot+=pen.vx*0.0008*dt*60;
    pen.sX+=(1-pen.sX)*dt*10;
    pen.sY+=(1-pen.sY)*dt*10;
    const tCam=pen.wx-cv.width*0.38;
    camX+=(Math.max(0,tCam)-camX)*(1-Math.exp(-dt*5));
    pen.dist=Math.max(pen.dist,Math.max(0,Math.round((pen.wx-PEN_WX)/3)));
    if(Math.abs(pen.vx)<12){
      pen.vx=0; 
	  gs="STOPPED";

	  //abilita lago di sangue
	  if(bloodyMode){
		bloodPool={active:true, x:pen.wx, rx:0, ry:0};
		}
	  
	  
      if(pen.dist>bestDist) bestDist=pen.dist;
    }
  }
  
  
  if(bloodyMode && bloodPool.active){
	  bloodPool.rx += (95-bloodPool.rx)*dt*0.5;
	  bloodPool.ry += ( 5-bloodPool.ry)*dt*0.5;
	}

  // Particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;
	p.y+=p.vy*dt;
    p.vy+=700*dt;
    p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }

  // Snow
  for(const s of snow){
    s.y+=s.vy*dt; 
	s.x+=s.vx*dt;
    if(s.y>cv.height+5){s.y=-5;s.x=Math.random()*cv.width;}
  }
  shake*=0.78;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  const sx=shake>0.6?(Math.random()-0.5)*shake:0;
  const sy=shake>0.6?(Math.random()-0.5)*shake:0;

  // Sky
  const sky=cx.createLinearGradient(0,0,0,gY());
  sky.addColorStop(0,"#060e1e");
  sky.addColorStop(0.5,"#0f2244");
  sky.addColorStop(1,"#1a4470");
  cx.fillStyle=sky;
  cx.fillRect(0,0,cv.width,cv.height);

  drawStars();
  drawAurora();
  drawMountains();

  cx.save();
  cx.translate(Math.round(sx-camX),Math.round(sy));
  
  drawGround();
  
  drawBloodOnGround();
  
  drawParticles();
  drawBear();
  drawPenguin();
  cx.restore();

  drawSnow();
  drawUI();
}




function drawBloodOnGround(){
  if(!bloodyMode) return;
  const gy=gY();
  const deltaY = 8;

  // Macchie e scia
  for(const m of bloodMarks){
    const grd=cx.createRadialGradient(m.x,gy,0,m.x,gy,m.rx);
    grd.addColorStop(0,  `rgba(160,0,0,${m.alpha})`);
    grd.addColorStop(0.6,`rgba(110,0,0,${m.alpha*0.7})`);
    grd.addColorStop(1,  `rgba(80,0,0,0)`);
    cx.fillStyle=grd;
    cx.beginPath();
    cx.ellipse(m.x, gy + deltaY, m.rx, m.ry, 0, 0, Math.PI*2);
    cx.fill();
  }

  // Lago finale
  if(bloodPool.active && bloodPool.rx>0.5){
    const x=bloodPool.x;
	const rx=bloodPool.rx;
	const ry=bloodPool.ry;
    const grd=cx.createRadialGradient(x,gy,0,x,gy,rx);
    grd.addColorStop(0,  "rgba(180,0,0,0.92)");
    grd.addColorStop(0.5,"rgba(130,0,0,0.80)");
    grd.addColorStop(0.85,"rgba(80,0,0,0.55)");
    grd.addColorStop(1,  "rgba(60,0,0,0)");
    cx.fillStyle=grd;
    cx.beginPath();
    cx.ellipse(x, gy + deltaY, rx, ry, 0, 0, Math.PI*2);
    cx.fill();
    // riflesso viscido
    cx.fillStyle="rgba(220,30,30,0.18)";
    cx.beginPath();
    cx.ellipse(x-rx*0.2, gy + deltaY, rx*0.35, ry*0.4, -0.2, 0, Math.PI*2);
    cx.fill();
  }
}

function drawStars(){
  for(const s of stars){
    const sx=((s.wx-camX*0.015)%cv.width+cv.width)%cv.width;
    const sy=s.y*gY();
    const b=0.3+0.7*Math.abs(Math.sin(T*1.5+s.tw));
    cx.fillStyle=`rgba(220,235,255,${b*0.85})`;
    cx.beginPath();
    cx.arc(sx,sy,s.r,0,Math.PI*2);
    cx.fill();
  }
}

function drawAurora(){
  const gy=gY();
  for(let l=0;l<3;l++){
    const phase=T*0.3+l*2.1;
    const alpha=0.04+0.03*Math.sin(T*0.7+l);
    const gr=cx.createLinearGradient(0,gy*0.1,0,gy*0.55);
    const hue=160+l*30+Math.sin(T*0.2)*20;
    gr.addColorStop(0,`hsla(${hue},80%,55%,0)`);
    gr.addColorStop(0.4,`hsla(${hue},80%,55%,${alpha})`);
    gr.addColorStop(1,`hsla(${hue},80%,55%,0)`);
    cx.fillStyle=gr;
    cx.beginPath();
    cx.moveTo(0,gy*0.3);
    for(let x=0;x<=cv.width;x+=30){
      const y=gy*(0.3+0.12*Math.sin(x*0.004+phase+l));
      cx.lineTo(x,y);
    }
    cx.lineTo(cv.width,0);cx.lineTo(0,0);
    cx.fill();
  }
}

function drawMountains(){
  const gy = gY();

  // ─── FAR MOUNTAINS
  const p1 = 0.05; // parallax factor
  const step = 50;  

  const start = Math.floor((camX * p1 - 100) / step) * step;
  const end   = camX * p1 + cv.width + 100;

  const farPts = [];//neve sulle far mountains

  for(let wx = start; wx <= end; wx += step){
    const sx = Math.round(wx - camX * p1);

    const h = 90 
      + Math.sin(wx * 0.006) * 55 //aggiungo sinusoidale
      + Math.cos(wx * 0.011) * 35;//aggiungo cosinusoidale sfalzata strana

    farPts.push({ x: sx, h });
  }
  
  //corpo far mountains
  cx.fillStyle = "#0e2240";
  cx.beginPath();
  cx.moveTo(0, gy);
  for(const p of farPts){
    cx.lineTo(p.x, gy - p.h);
  }
  cx.lineTo(cv.width + 100, gy);
  cx.fill();
  
  drawSnowPeaks(farPts, 60, start, step, '11');//cima innevata
  


  // ─── MID MOUNTAINS
  const p2 = 0.13;
  const step2 = 45;

  const start2 = Math.floor((camX * p2 - 150) / step2) * step2;
  const end2   = camX * p2 + cv.width + 150;

  const midPts = [];//neve sulle mid mountains

  for(let wx = start2; wx <= end2; wx += step2){
    const sx = Math.round(wx - camX * p2);

    const h = 55 
      + Math.sin(wx * 0.01) * 50  //aggiungo sinusoidale
      + Math.cos(wx * 0.017) * 34;//aggiungo cosinusoidale sfalzata strana

    midPts.push({ x: sx, h });
  }

  //corpo mid mountains
  cx.fillStyle = "#183858";
  cx.beginPath();
  cx.moveTo(midPts[0].x, gy);
  for(const p of midPts){
    cx.lineTo(p.x, gy - p.h);
  }
  cx.lineTo(midPts[midPts.length - 1].x, gy);
  cx.fill();  
  
  drawSnowPeaks(midPts, 60, start2, step2, '66');//cima innevata
}

function drawSnowPeaks(midPts, minHeight, start2, step2, alpha) {
const gy = gY();

for (let i = 1; i < midPts.length - 1; i++) {
    const p = midPts[i];
    const prev = midPts[i - 1];
    const next = midPts[i + 1];

	  // Disegniamo la neve solo se il punto corrente è sopra la soglia
	  if (p.h > minHeight) {
		const wx = start2 + i * step2;
		
		// Altezza della neve proporzionale alla quota della montagna
		const snowDepth = (p.h - 60) * 0.6; 

		// Gradiente per profondità
		const grad = cx.createLinearGradient(p.x - 20, gy - p.h - snowDepth, p.x + 20, gy - p.h  + snowDepth);
		grad.addColorStop(0, "#ffffff"+alpha);
		grad.addColorStop(1, "#c2d1e5"+alpha);

		cx.fillStyle = grad;
		cx.beginPath();

		// --- PARTE SUPERIORE: Segue esattamente la cresta della montagna
		// Ci muoviamo dal punto medio precedente al punto attuale, fino al punto medio successivo
		cx.moveTo((prev.x + p.x) / 2, gy - (prev.h + p.h) / 2);
		cx.lineTo(p.x, gy - p.h);
		cx.lineTo((next.x + p.x) / 2, gy - (next.h + p.h) / 2);

		// --- PARTE INFERIORE: Crea la frastagliatura della neve
		// Usiamo il "mondo" wx per mantenere il rumore coerente durante lo scroll
		const jitterMid = -snowDepth / 2;
		
		// Torniamo indietro disegnando il bordo inferiore della neve
		cx.lineTo((next.x + p.x) / 2, gy - (next.h + p.h) / 2 + snowDepth);
		cx.lineTo(p.x, gy - p.h + (snowDepth * 1.2) + jitterMid);
		cx.lineTo((prev.x + p.x) / 2, gy - (prev.h + p.h) / 2 + snowDepth);

		cx.closePath();
		cx.fill();
	  }
	}
}


function drawGround(){
  const gy=gY();
  const L=camX-80;
  const R=camX+cv.width+80;

  // Main snow body
  const sg=cx.createLinearGradient(0,gy,0,gy+60);
  sg.addColorStop(0,"#c8dff0");sg.addColorStop(1,"#b0ccdf");
  cx.fillStyle=sg;
  cx.fillRect(L,gy,R-L,cv.height-gy+10);

  // Surface crust
  cx.fillStyle="#e4f2ff";
  cx.beginPath(); cx.moveTo(L,gy);
  for(let x=L;x<=R;x+=20){
    cx.lineTo(x,gy-7+Math.sin(x*0.07+1)*4+Math.cos(x*0.13)*2);
  }
  cx.lineTo(R,gy); cx.lineTo(R,gy+18); cx.lineTo(L,gy+18); cx.fill();

  // Top highlight strip
  cx.fillStyle="rgba(255,255,255,0.55)";
  cx.beginPath(); cx.moveTo(L,gy);
  for(let x=L;x<=R;x+=20){
    cx.lineTo(x,gy-7+Math.sin(x*0.07+1)*4+Math.cos(x*0.13)*2);
  }
  cx.lineTo(R,gy); cx.lineTo(R,gy+5); cx.lineTo(L,gy+5); cx.fill();

  // Ice sparkle patches
  for(let x=L-((L|0)%200);x<R;x+=200){
    cx.fillStyle="rgba(180,225,255,0.22)";
    cx.beginPath();
    cx.ellipse(x+Math.sin(x)*30,gy+8,50,5,0,0,Math.PI*2);
    cx.fill();
  }

  // Distance rulers
  cx.textAlign="center";
  for(let d=10;d<=3000;d+=10){
    const wx=PEN_WX+d*3;
    if(wx<L||wx>R) continue;
    const major=d%100===0;
	const mid=d%50===0;
    cx.strokeStyle=major?"#7a9cb8":mid?"#98b4cc":"#b0c8dc";
    cx.lineWidth=major?2:1;
    cx.globalAlpha=major?0.9:mid?0.6:0.35;
    cx.beginPath();
	cx.moveTo(wx,gy+3);
    cx.lineTo(wx,gy+(major?20:mid?17:14));
	cx.stroke();
    cx.globalAlpha=1;
    if(major){
      cx.fillStyle="#5a7898";
      cx.font="bold 13px sans-serif";
      cx.fillText(d+"m",wx,gy+34);
    }
  }
  
  // record
  if (bestDist) {
    const wx=PEN_WX+bestDist*3;
	cx.strokeStyle="#b0c8dc";
	cx.beginPath();
	cx.moveTo(wx,gy+3);
    cx.lineTo(wx,gy+40);
	cx.stroke();
	
	let txt="🏆";
	cx.textAlign="center";
	cx.fillStyle="#5a7898";
	cx.font="bold 13px sans-serif";
	cx.fillText(txt,wx,gy+46);
	txt=bestDist+" m";
	cx.fillText(txt,wx,gy+60);
  }
}

function drawFishClub() {

  const fishSkinLight = "#bf9b8a";   // Punti luce pelle viscida
  const armorHighlight = "#e6c384"; // Oro pallido ossidato per i bordi corazza
  const eyeWhite = "#f0f0f0";

  // --- 1. SAGOMA GENERALE (La Clava Pesante) ---
  // Manteniamo la massa in punta per l'impatto
  cx.beginPath();
  cx.moveTo(-5, 0); // Base coda (impugnatura)

  cx.lineWidth = 1;

  // --- 2. GLI OCCHI STRABUZZATI (Il focus comico) ---
  // Devono essere fuori dalle orbite, asimmetrici e guardare in direzioni diverse.

  drawBulgingEye(cx, -20, 105, 14, -0.5, 0.2);

  drawBulgingEye(cx, 15, 95, 12, 0.6, -0.3);


  // --- 3. LA BOCCA (Gommosa e spalancata) ---

  cx.strokeStyle = armorHighlight;

// Disegna un occhio gonfio e strabuzzato con pupilla eccentrica
function drawBulgingEye(cx, x, y, radius, pupilXOffset, pupilYOffset) {
  // Sclera (Bianco dell'occhio) - Leggermente irregolare
  cx.fillStyle = "#f0f0f0";
  cx.beginPath();
  cx.arc(x, y, radius, 0, Math.PI * 2);
  cx.fill();
  
  // Ombra palpebra superiore (per realismo)
  cx.strokeStyle = "rgba(0,0,0,0.2)";
  cx.lineWidth = 2;
  cx.beginPath();
  cx.arc(x, y, radius, Math.PI, 0);
  cx.stroke();

  // Pupilla (Strabuzzata)
  cx.fillStyle = "black";
  cx.beginPath();
  // Posizione pupilla asimmetrica
  cx.arc(x + radius * pupilXOffset, y + radius * pupilYOffset, radius * 0.4, 0, Math.PI * 2);
  cx.fill();

  // Riflesso lucido (viscido)
  cx.fillStyle = "white";
  cx.beginPath();
  cx.arc(x + radius * pupilXOffset - 2, y + radius * pupilYOffset - 2, radius * 0.15, 0, Math.PI * 2);
  cx.fill();
}


function drawThorClub() {

}

function drawBear(){

  const end   = -Math.PI * 0.30;   // dx alto

  armA = start + easeOut(t) * (end - start);
}

  const dots = [
    { x: emojiX - 6,  y: emojiY - 4,  r: 7 },
    { x: emojiX - 12, y: emojiY + 8,  r: 5 },
    { x: emojiX - 8,  y: emojiY + 18, r: 3 },
  ];
  dots.forEach(d => {
    cx.beginPath();
    cx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    cx.fill();
    cx.stroke();
  });

  // Emoji
  let txtDb = 
	(gs === "FLYING") ? ["Ouch!"] :
	(gs === "STOPPED") ? ["😵","🪦","🚑"] :
	["❓","😭","🙏","😨","Help!","💀","...","😓","☮️","🤪","🔨","🌈"];
  let txtIdx = ((Date.now() / 2666)|0)%txtDb.length;
  let txt = txtDb[txtIdx];
  cx.font = "bold 20px sans-serif";
  cx.textAlign = "center";
  cx.fillStyle = "rgba(0,0,0,0.95)";
  cx.fillText(txt, emojiX, emojiY - 24);
}

  cx.restore();
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function drawParticlesOLD(){
  for(const p of parts){
    const t=p.life/p.ml;
    cx.fillStyle = p.snow 
		? `rgba(210,235,255,${t*0.85})` 
		: `hsla(${p.h},65%,75%,${t*0.75})`;
    cx.beginPath(); cx.arc(p.x,p.y,p.r*Math.sqrt(t),0,Math.PI*2); cx.fill();
  }
}

function drawParticles(){
  for(const p of parts){
    const t=p.life/p.ml;
    let color;
    if(bloodyMode){
      if(p.snow){
        // fiocchi di neve → gocce di sangue
        const r=Math.round(160+t*60);
		const g=Math.round(t*18);
		const b=Math.round(t*8);
        color=`rgba(${r},${g},${b},${t*0.9})`;
      } else {
        // trail e super burst → sangue vivo/scuro
        color=`hsla(${2+p.h*0.01},90%,${28+t*22}%,${t*0.85})`;
      }
    } else {
      color = p.snow
        ? `rgba(210,235,255,${t*0.85})`
        : `hsla(${p.h},65%,75%,${t*0.75})`;
    }
    cx.fillStyle=color;
    cx.beginPath(); cx.arc(p.x,p.y,p.r*Math.sqrt(t),0,Math.PI*2); cx.fill();
  }
}

function drawSnow(){
  for(const s of snow){
    cx.fillStyle= /*bloodyMode ? "rgba(235,0,0,0.55)" :*/ "rgba(215,235,255,0.55)";
    cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2); cx.fill();
  }
}

// ─── UI ───────────────────────────────────────────────────────────────────────
function pill(x,y,w,h,r=10){
  cx.beginPath();
  cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
  cx.arcTo(x+w,y,x+w,y+r,r);
  cx.lineTo(x+w,y+h-r);
  cx.arcTo(x+w,y+h,x+w-r,y+h,r);
  cx.lineTo(x+r,y+h);
  cx.arcTo(x,y+h,x,y+h-r,r);
  cx.lineTo(x,y+r);
  cx.arcTo(x,y,x+r,y,r);
  cx.closePath();
}

function drawUI(){
  const W=cv.width,H=cv.height,CX=W/2;
  cx.textAlign="center";

  // ── POWER BAR ──
  if(gs==="READY"){
    if(isHolding){
      const bW=Math.min(W*0.52,340), bH=38;
      const bX=CX-bW/2, bY=26;

      // Determine zone
      const isSuper=power>=0.90;
      const pulse=Math.sin(T*14)*0.5+0.5;

      // Screen flash on SUPER
      if(superFlash>0){
        cx.fillStyle=`rgba(255,180,0,${superFlash*0.12})`;
        cx.fillRect(0,0,W,H);
      }

      // Outer glow (color by zone)
      let glowCol;
      if(isSuper) glowCol=`rgba(255,200,0,${0.6+pulse*0.4})`;
      else if(power>=0.72) glowCol="rgba(255,60,0,0.55)";
      else if(power>=0.45) glowCol="rgba(230,180,0,0.5)";
      else glowCol="rgba(40,210,80,0.45)";
      cx.shadowColor=glowCol; cx.shadowBlur=isSuper?28:16;
      pill(bX-2,bY-2,bW+4,bH+4,11); cx.fillStyle="rgba(0,0,0,0)"; cx.fill();
      cx.shadowBlur=0;

      // Track bg
      pill(bX,bY,bW,bH,10);
      cx.fillStyle="#0a1830"; cx.fill();
      cx.strokeStyle="rgba(100,150,200,0.3)"; cx.lineWidth=1.5; cx.stroke();

      // Zone background tints
      cx.save(); pill(bX,bY,bW,bH,10); cx.clip();
      const zones=[
        {s:0,    e:0.45, c:"rgba(30,180,60,0.18)"},
        {s:0.45, e:0.72, c:"rgba(210,170,0,0.18)"},
        {s:0.72, e:0.90, c:"rgba(220,50,10,0.18)"},
        {s:0.90, e:1.00, c:`rgba(255,180,0,${0.15+pulse*0.12})`}
      ];
      for(const z of zones){
        cx.fillStyle=z.c;
        cx.fillRect(bX+bW*z.s,bY,bW*(z.e-z.s),bH);
      }
      cx.restore();

      // Fill bar
      if(power>0.005){
        cx.save(); pill(bX,bY,bW,bH,10); cx.clip();
        // Gradient following current zone
        const fg=cx.createLinearGradient(bX,0,bX+bW,0);
        fg.addColorStop(0,    "#22dd44");
        fg.addColorStop(0.45, "#ddcc00");
        fg.addColorStop(0.72, "#ff3800");
        fg.addColorStop(0.90, "#ffaa00");
        fg.addColorStop(1.0,  isSuper?`hsl(${50+pulse*20},100%,62%)`:"#ffdd00");
        cx.fillStyle=fg;
        cx.fillRect(bX,bY,bW*power,bH);
        // Top shine
        cx.fillStyle="rgba(255,255,255,0.1)";
        cx.fillRect(bX+1,bY+1,bW*power-2,bH*0.36);
        cx.restore();
      }

      // Zone dividers
      //cx.strokeStyle="rgba(0,0,0,0.35)"; cx.lineWidth=1.5;
      //for(const f of [0.45,0.72,0.90]){
      //  cx.beginPath(); cx.moveTo(bX+bW*f,bY+2); cx.lineTo(bX+bW*f,bY+bH-2); cx.stroke();
      //}

      // Zone labels (small, above bar)
      cx.font="bold 10px sans-serif"; cx.textAlign="center";
      const zLabels=[
        {x:0.225,t:"verde",  c:"rgba(80,220,100,0.7)"},
        {x:0.585,t:"giallo", c:"rgba(220,190,0,0.7)"},
        {x:0.81, t:"rosso",  c:"rgba(255,90,50,0.7)"},
        {x:0.95, t:"SUPER",  c:`rgba(255,200,0,${0.6+pulse*0.4})`}
      ];
      for(const l of zLabels){
        cx.fillStyle=l.c;
        cx.fillText(l.t, bX+bW*l.x, bY-3);
      }

      // % text inside bar
      cx.fillStyle="rgba(255,255,255,0.92)"; cx.font="bold 15px sans-serif";
      cx.textAlign="center";
      cx.fillText(Math.round(power*100)+"%", CX, bY+bH/2+5);

      // Title
      if(isSuper){
        cx.fillStyle=`rgba(255,215,0,${0.9+pulse*0.1})`;
        cx.font="bold 16px sans-serif";
        cx.shadowColor="rgba(255,140,0,0.8)"; cx.shadowBlur=10;
        cx.fillText("⚡  S U P E R !  ⚡", CX, bY-14);
        cx.shadowBlur=0;
      } else {
        cx.fillStyle="rgba(180,215,255,0.8)"; cx.font="bold 16px sans-serif";
        cx.fillText("Rilascia al momento giusto!", CX, bY-14);
      }

    } else {
      // Not holding → show call-to-action
      cx.fillStyle="rgba(160,205,255,0.88)"; cx.font="bold 22px sans-serif";
      cx.textAlign="center";
      cx.shadowColor="rgba(80,140,255,0.4)"; cx.shadowBlur=8;
      cx.fillText("TIENI PREMUTO per caricare", CX, 58);
      cx.shadowBlur=0;
      cx.fillStyle="rgba(110,155,200,0.6)"; cx.font="15px sans-serif";
      cx.fillText("rilascia nella zona giusta per più distanza", CX, 84);
    }

    cx.fillStyle="rgba(110,155,200,.5)"; cx.font="24px sans-serif";
    cx.textAlign="center";
    cx.fillText("Bounce Masters Clone", CX, H-25);
  }

  // ── DISTANCE ──
  if(gs==="FLYING"||gs==="SLIDING"||gs==="STOPPED"){
    const d=pen.dist;
    pill(CX-85,16,170,58,12);
    cx.fillStyle="rgba(0,8,30,0.6)"; cx.fill();

    cx.fillStyle="#6ec0ff"; cx.font="bold 12px sans-serif";
    cx.fillText("DISTANZA", CX, 34);

    cx.fillStyle="white"; cx.font="bold 34px sans-serif";
    cx.shadowColor="rgba(60,130,255,0.6)"; cx.shadowBlur=10;
    cx.fillText(d+" m", CX, 63);
    cx.shadowBlur=0;
  }

  // ── RECORD ──
  if(bestDist>=0){
    const txt="🏆 "+bestDist+" m";
    cx.font="bold 13px sans-serif";
    cx.textAlign="right";
    pill(W-140,12,125,30,8);
    cx.fillStyle="rgba(0,0,0,0.4)"; cx.fill();
    cx.fillStyle="#ffd060";
    cx.fillText(txt, W-16, 32);
    cx.textAlign="center";
  }

  // ── GAME OVER CARD ──
  if(gs==="STOPPED"){
    const cW=300;
	const cH=150;
	const cX=CX-cW/2;
	const cY=H/2-cH/2 - 50;
    pill(cX,cY,cW,cH,16);
    cx.fillStyle="rgba(2,10,38,0.78)"; cx.fill();
    cx.strokeStyle="rgba(80,140,220,0.4)"; cx.lineWidth=1.5; cx.stroke();

    cx.fillStyle="white"; cx.font="bold 28px sans-serif";
    cx.shadowColor="rgba(80,160,255,0.4)"; cx.shadowBlur=8;
    cx.fillText(pen.dist+" metri", CX, cY+50);
    cx.shadowBlur=0;

    if(pen.dist===bestDist&&bestDist>0){
      cx.fillStyle="#ffd060"; cx.font="bold 16px sans-serif";
      cx.fillText("🏆 Nuovo record!", CX, cY+80);
    }

    cx.fillStyle="rgba(140,190,255,0.85)"; cx.font="18px sans-serif";
    cx.fillText("TAP per riprovare", CX, cY+118);
  }
}

// ─── LOOP ─────────────────────────────────────────────────────────────────────
function loop(ts){
  if(!lt) lt=ts;
  const dt=Math.min((ts-lt)/1000,0.05);
  lt=ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

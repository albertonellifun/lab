<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Crash Test Dummy</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fc4;
    overflow: hidden;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  canvas {
    border: 2px solid #fc4;
    cursor: crosshair;
    display: block;
    max-width: calc(100vw - 8px);
    max-height: calc(100vh - 44px);
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  #controls {
	display: flex;
	gap: 20px;
  }
  button {
	padding: 0 40px;
  }
</style>
</head>
<body>
<h1>⚠ Crash Test Dummy ⚠</h1>
<div id="controls">
	<button onclick="GRAVITY = (GRAVITY ? 0 : 980)">GRAVITY</button>
	<button onclick="location.reload();">RESET</button>
</div>
<canvas id="c" width="600" height="600"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 600;
const H = 600;

const DUMMY_YELLOW   = '#fc4';
const DUMMY_JOINTS   = '#333';
const DUMMY_GREY     = '#666';
const DUMMY_DRAG     = '#f44';
const DUMMY_BACKBONE = '#333';
const DUMMY_BG_GRID  = '#a90';
const DUMMY_BG       = '#000';

// ── FISICA VERLET ──────────────────────────────────────────────
class Point {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.ox = x; this.oy = y;
    this.ax = 0; this.ay = 0;
    this.pinned = false;
    this.r = 3;
  }
  update(dt) {
    if (this.pinned) return;
    const vx = this.x - this.ox;
    const vy = this.y - this.oy;
    const speed = Math.sqrt(vx*vx + vy*vy);
    const drag = 1.0 - Math.min(0.045 + speed * 0.004, 0.18);
    this.ox = this.x;
    this.oy = this.y;
    this.x += vx * drag + this.ax * dt * dt;
    this.y += vy * drag + this.ay * dt * dt;
    this.ax = 0; this.ay = 0;
  }
  constrain() {
    const BOUNCE = 0.05;
    const FRIC   = 0.25;
    const R = this.r || 4;
    if (this.y > H - R) {
      const vx = (this.x - this.ox) * FRIC;
      const vy = this.y - this.oy;
      this.y = H - R;
      this.ox = this.x - vx;
      this.oy = this.y + vy * BOUNCE;
    }
    if (this.y < R) {
      const vy = this.y - this.oy;
      this.y = R;
      this.oy = this.y + vy * BOUNCE;
    }
    if (this.x < R) {
      const vx = this.x - this.ox;
      const vy = (this.y - this.oy) * FRIC;
      this.x = R;
      this.ox = this.x + vx * BOUNCE;
      this.oy = this.y - vy;
    }
    if (this.x > W - R) {
      const vx = this.x - this.ox;
      const vy = (this.y - this.oy) * FRIC;
      this.x = W - R;
      this.ox = this.x + vx * BOUNCE;
      this.oy = this.y - vy;
    }
  }
}

class Stick {
  constructor(a, b, stiffness = 1) {
    this.a = a; this.b = b;
    this.len = Math.hypot(b.x - a.x, b.y - a.y);
    this.stiffness = stiffness;
  }
  solve() {
    const dx = this.b.x - this.a.x;
    const dy = this.b.y - this.a.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const diff = (dist - this.len) / dist * 0.5 * this.stiffness;
    const ox = dx * diff, oy = dy * diff;
    if (!this.a.pinned) { this.a.x += ox; this.a.y += oy; }
    if (!this.b.pinned) { this.b.x -= ox; this.b.y -= oy; }
  }
}

// ── COSTRUZIONE RAGDOLL ───────────────────────────────────────
let GRAVITY = 0;

function makeDummy(cx, cy) {
  const pts = {};
  pts.head   = new Point(cx,      cy);         pts.head.r = 14;
  pts.neck   = new Point(cx,      cy + 12);
  pts.shlC   = new Point(cx,      cy + 26);
  pts.shlL   = new Point(cx - 22, cy + 26);
  pts.shlR   = new Point(cx + 22, cy + 26);
  pts.chest  = new Point(cx,      cy + 48);
  pts.waist  = new Point(cx,      cy + 70);
  pts.hipL   = new Point(cx - 14, cy + 86);
  pts.hipR   = new Point(cx + 14, cy + 86);
  pts.elbL   = new Point(cx - 44, cy + 48);
  pts.elbR   = new Point(cx + 44, cy + 48);
  pts.wristL = new Point(cx - 58, cy + 70);
  pts.wristR = new Point(cx + 58, cy + 70);
  pts.handL  = new Point(cx - 62, cy + 82); pts.handL.r = 10;
  pts.handR  = new Point(cx + 62, cy + 82); pts.handR.r = 10;
  pts.kneeL  = new Point(cx - 16, cy + 118);
  pts.kneeR  = new Point(cx + 16, cy + 118);
  pts.ankleL = new Point(cx - 16, cy + 156);
  pts.ankleR = new Point(cx + 16, cy + 156);
  pts.footL  = new Point(cx - 36, cy + 168);
  pts.footR  = new Point(cx + 36, cy + 168);
  pts.heelL  = new Point(cx - 6,  cy + 168);
  pts.heelR  = new Point(cx + 6,  cy + 168);

  const sticks = [
    // ── TESTA / COLLO ──
    new Stick(pts.head,  pts.neck),
    new Stick(pts.head,  pts.shlC,  0.5),
    new Stick(pts.head,  pts.shlL,  0.28),
    new Stick(pts.head,  pts.shlR,  0.28),
    new Stick(pts.head,  pts.chest, 0.20),

    // ── COLONNA / TORSO ──
    new Stick(pts.neck,  pts.shlC),
    new Stick(pts.shlC,  pts.chest),
    new Stick(pts.chest, pts.waist),

    // spalle e fianchi orizzontali — rigidi
    new Stick(pts.shlL,  pts.shlR,  1.0),
    new Stick(pts.hipL,  pts.hipR,  1.0),

    // spalle→centro
    new Stick(pts.shlC,  pts.shlL,  1.0),
    new Stick(pts.shlC,  pts.shlR,  1.0),

    // waist→fianchi
    new Stick(pts.waist, pts.hipL,  1.0),
    new Stick(pts.waist, pts.hipR,  1.0),

    // ── DIAGONALI ANTI-ROTAZIONE (stiffness alta) ──
    new Stick(pts.shlL,  pts.hipR,  1.0),  // era 0.6
    new Stick(pts.shlR,  pts.hipL,  1.0),  // era 0.6
    new Stick(pts.chest, pts.hipL,  0.9),  // nuovi
    new Stick(pts.chest, pts.hipR,  0.9),  // nuovi
    new Stick(pts.shlL,  pts.waist, 0.8),  // era 0.5
    new Stick(pts.shlR,  pts.waist, 0.8),  // era 0.5
    new Stick(pts.shlL,  pts.hipL,  0.6),  // era 0.5
    new Stick(pts.shlR,  pts.hipR,  0.6),  // era 0.5

    // ── BRACCIA ──
    new Stick(pts.shlL,   pts.elbL),
    new Stick(pts.elbL,   pts.wristL),
    new Stick(pts.wristL, pts.handL),
    new Stick(pts.shlR,   pts.elbR),
    new Stick(pts.elbR,   pts.wristR),
    new Stick(pts.wristR, pts.handR),
    // anti-iperestensione gomiti
    new Stick(pts.shlL,   pts.wristL, 0.25),
    new Stick(pts.shlR,   pts.wristR, 0.25),

    // ── GAMBE ──
    new Stick(pts.hipL,  pts.kneeL),
    new Stick(pts.kneeL, pts.ankleL),
    new Stick(pts.ankleL,pts.footL,  1.0),
    new Stick(pts.hipR,  pts.kneeR),
    new Stick(pts.kneeR, pts.ankleR),
    new Stick(pts.ankleR,pts.footR,  1.0),
    // anti-iperestensione ginocchia
    new Stick(pts.hipL,  pts.ankleL, 0.25),
    new Stick(pts.hipR,  pts.ankleR, 0.25),

    // ── TALLONI ──
    new Stick(pts.ankleL,pts.heelL,  0.8),
    new Stick(pts.heelL, pts.footL,  0.8),
    new Stick(pts.ankleR,pts.heelR,  0.8),
    new Stick(pts.heelR, pts.footR,  0.8),
  ];

  return { pts, sticks, points: Object.values(pts) };
}

const dummy = makeDummy(300, 180);

// ── COORDINATE ────────────────────────────────────────────────
function getPos(e) {
  const r   = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - r.left) * (W / r.width),
    y: (src.clientY - r.top)  * (H / r.height)
  };
}

// ── INTERAZIONE ───────────────────────────────────────────────
let dragging = null;
let prevMX = 0, prevMY = 0;

function onStart(e) {
  e.preventDefault();
  const { x, y } = getPos(e);
  let best = null, bestD = e.touches ? 40 : 30;
  dummy.points.forEach(p => {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { bestD = d; best = p; }
  });
  if (best) { dragging = best; prevMX = x; prevMY = y; }
}

function onMove(e) {
  e.preventDefault();
  const { x, y } = getPos(e);
  if (dragging) {
    dragging.x = x;
    dragging.y = y;
    // Non aggiorniamo ox/oy qui, lo faremo nel loop per una velocità coerente
  }
  prevMX = x; 
  prevMY = y;
}

function onEnd() { dragging = null; }

canvas.addEventListener('mousedown',   onStart);
document.addEventListener('mousemove', onMove);
document.addEventListener('mouseup',   onEnd);
canvas.addEventListener('touchstart',  onStart, { passive: false });
canvas.addEventListener('touchmove',   onMove,  { passive: false });
canvas.addEventListener('touchend',    onEnd);

// ── DISEGNO ───────────────────────────────────────────────────
function drawBody() {
  const p = dummy.pts;

  function limb(a, b, w, col) {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = col || DUMMY_YELLOW;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // torso
  ctx.beginPath();
  ctx.moveTo(p.shlL.x, p.shlL.y);
  ctx.lineTo(p.shlR.x, p.shlR.y);
  ctx.lineTo(p.hipR.x, p.hipR.y);
  ctx.lineTo(p.hipL.x, p.hipL.y);
  ctx.closePath();
  ctx.fillStyle = DUMMY_YELLOW;
  ctx.fill();

  limb(p.waist, p.hipL, 10, DUMMY_GREY);
  limb(p.waist, p.hipR, 10, DUMMY_GREY);
  limb(p.neck,  p.shlC,  8, DUMMY_YELLOW);

  // colonna vertebrale tratteggiata
  ctx.beginPath();
  ctx.moveTo(p.neck.x, p.neck.y);
  ctx.lineTo((p.hipL.x + p.hipR.x) / 2, (p.hipL.y + p.hipR.y) / 2);
  ctx.strokeStyle = DUMMY_BACKBONE;
  ctx.lineWidth = 3;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // braccia
  limb(p.shlL, p.elbL,   8, DUMMY_YELLOW);
  limb(p.elbL, p.wristL, 7, DUMMY_YELLOW);
  limb(p.shlR, p.elbR,   8, DUMMY_YELLOW);
  limb(p.elbR, p.wristR, 7, DUMMY_YELLOW);

  function hand(wrist, h) {
    ctx.beginPath();
    ctx.moveTo(wrist.x, wrist.y);
    ctx.lineTo(h.x, h.y);
    ctx.strokeStyle = DUMMY_YELLOW;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(h.x, h.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = DUMMY_GREY;
    ctx.fill();
  }
  hand(p.wristL, p.handL);
  hand(p.wristR, p.handR);

  // gambe
  limb(p.hipL,  p.kneeL,  10, DUMMY_YELLOW);
  limb(p.kneeL, p.ankleL,  9, DUMMY_YELLOW);
  limb(p.hipR,  p.kneeR,  10, DUMMY_YELLOW);
  limb(p.kneeR, p.ankleR,  9, DUMMY_YELLOW);

  // piedi realistici
  function drawFoot(ankle, toe) {
    const ang = Math.atan2(toe.y - ankle.y, toe.x - ankle.x);
    const len = Math.hypot(toe.x - ankle.x, toe.y - ankle.y);
    ctx.save();
    ctx.translate(ankle.x, ankle.y);
    ctx.rotate(ang);

    const H_TOP  = -7;
    const H_BOT  = 6;
    const HEEL_X = -10;
    const TOE_X  = len + 6;

    ctx.beginPath();
    ctx.moveTo(HEEL_X, H_TOP);
    ctx.quadraticCurveTo(HEEL_X - 5, 0, HEEL_X, H_BOT);
    ctx.bezierCurveTo(
      HEEL_X + len * 0.2, H_BOT + 3,
      HEEL_X + len * 0.6, H_BOT + 1,
      TOE_X - 4, H_BOT - 1
    );
    ctx.quadraticCurveTo(TOE_X + 3, H_BOT - 3, TOE_X + 2, 0);
    ctx.quadraticCurveTo(TOE_X - 1, H_TOP + 1, TOE_X - 6, H_TOP);
    ctx.lineTo(HEEL_X, H_TOP);
    ctx.closePath();

    ctx.fillStyle = DUMMY_GREY;
    ctx.fill();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // linea suola
    ctx.beginPath();
    ctx.moveTo(HEEL_X, H_BOT);
    ctx.bezierCurveTo(
      HEEL_X + len * 0.2, H_BOT + 3,
      HEEL_X + len * 0.6, H_BOT + 1,
      TOE_X - 4, H_BOT - 1
    );
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }
  drawFoot(p.ankleL, p.footL);
  drawFoot(p.ankleR, p.footR);

  // giunti
  [p.elbL, p.elbR, p.kneeL, p.kneeR, p.wristL, p.wristR,
   p.ankleL, p.ankleR, p.hipL, p.hipR, p.shlL, p.shlR].forEach(j => {
    ctx.beginPath();
    ctx.arc(j.x, j.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = DUMMY_JOINTS;
    ctx.fill();
    ctx.strokeStyle = DUMMY_GREY;
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // testa
  ctx.beginPath();
  ctx.arc(p.head.x, p.head.y, 16, 0, Math.PI * 2);
  ctx.fillStyle = DUMMY_YELLOW;
  ctx.fill();
  ctx.strokeStyle = DUMMY_JOINTS;
  ctx.lineWidth = 2;
  ctx.stroke();

  const headAngle = Math.atan2(p.neck.y - p.head.y, p.neck.x - p.head.x);
  ctx.save();
  ctx.translate(p.head.x, p.head.y);
  ctx.rotate(headAngle - Math.PI / 2);
  ctx.fillStyle = DUMMY_JOINTS;
  ctx.fillRect(-8, -4, 16, 7);
  ctx.restore();

  limb(p.head, p.neck, 9, DUMMY_YELLOW);
}

function drawBackground() {
  ctx.fillStyle = DUMMY_BG;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = DUMMY_BG_GRID;
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.fillStyle = '#fc4';
  ctx.font = 'bold 11px Courier New';
  ctx.fillText('DUMMIES TEST LAB · TYPE IV-B', 14, 22);
}

function drawDrag() {
  if (dragging) {
    ctx.beginPath();
    ctx.arc(dragging.x, dragging.y, 8, 0, Math.PI * 2);
    ctx.strokeStyle = DUMMY_DRAG;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}


// ── LOOP ──────────────────────────────────────────────────────
const ITER = 20;
let last = performance.now();

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.016);
  last = now;
  
  dummy.points.forEach(p => {
	  if (p === dragging) {
		// Se stiamo trascinando, aggiorniamo ox in modo che la velocità sia data dal movimento del mouse dell'ultimo frame
		const vx = (p.x - p.ox) * 0.9; // un po' di smorzamento
		const vy = (p.y - p.oy) * 0.9;
		p.ox = p.x - vx;
		p.oy = p.y - vy;
		return;
	  }
	p.ay += GRAVITY;
	p.update(dt);
	p.constrain();
  });
  
  // Poi risolviamo i vincoli (Stick)
  for (let i = 0; i < ITER; i++) {
	dummy.sticks.forEach(s => s.solve());
	// Importante: dopo aver risolto gli stick, forziamo il punto trascinato a stare sotto il mouse, altrimenti i vincoli lo "tireranno" via
	if (dragging) {
		dragging.x = prevMX;
		dragging.y = prevMY;
	}
	dummy.points.forEach(p => p.constrain());
  }  
  
  drawBackground();
  drawBody();
  drawDrag();
  
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>

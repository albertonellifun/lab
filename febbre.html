    canvas.style.width = maxW + 'px';

}

function initParticles() {
	dirtParticles = [];//potrebbero essere state create precedentemente con coordinate sballate
	for (let i = 0; i < 1000; i++) {
        dirtParticles.push({
            x: Math.random() * canvas.width,
            y: 3 + GRASS_HEIGHT + (Math.random() * (canvas.height - GRASS_HEIGHT * 2 - 6)),
            size: Math.random() * 2 + 1
        });
    }
	grassParticles = [];
	for (let i = 0; i < 1000; i++) {
        grassParticles.push({
            x: Math.random() * canvas.width,
            y: 3 + (Math.random() * (GRASS_HEIGHT - 6)),
            size: Math.random() * 2 + 1
        });
    }
	steccatoParticles = [];
	var FENCE_SPACING = 48;
	for (let i = 0; i * FENCE_SPACING < canvas.width + FENCE_SPACING * 4; i++) {
		steccatoParticles.push({ x: i * FENCE_SPACING });
	}
}

function updateLaneGeometry() {

}

function changeCenter() {
	center=!center;

	} else {

	}
	if (!racing) {
		drawTrack();
		drawStats();
		drawHorses();
	}
}

function changeLanes(delta) {
	if (racing) return;//blocca durante gara
    lanes += delta;
    if (lanes < 2) lanes = 2;
    if (lanes > horseNames.length) lanes = horseNames.length;
    updateLaneGeometry();
    selectedBetLane = null;
    stopRace = false;
    document.getElementById("laneCount").innerHTML = "CORSIE: " + lanes;
	
	if (lanes > 3) {
		HORSE_SCALE = center ? 4.5/lanes : 3/lanes;
	} else {
		HORSE_SCALE = center ? 3/lanes : 2.5/lanes;
	}
	
    createRace();
}


function createRace() {
    horses = [];
    for (var i = 0; i < lanes; i++) {
        var rndHorse = horseNames[Math.floor(Math.random() * horseNames.length)];
        if (horses.some(h => h.name === rndHorse.name)) { i--; continue; }
        var id = getHorseNumber(rndHorse.name);
        var colIdx = getColorIndex(rndHorse.name);
		var jColor = "hsl(" + Math.floor(Math.random()*360) + ","
							+(Math.floor(80+Math.random()*20)) + "%,"
							+(Math.floor(50+Math.random()*20)) + "%)";//col, saturation, lightness
		
        horses.push({
            name: rndHorse.name,
            id: id,
            x: 20,
            lane: i,
            maxSpeed: rndHorse.maxSpeed + Math.random() * 0.3,
            speed: 0,
            stamina: rndHorse.stamina + Math.random() * 20,
            anim: Math.random() * Math.PI * 2,
            color: colors[colIdx],//colore principale
            maneColor: maneColors[colIdx],//criniera piu scura
			colorShade15 : shadeColor(colors[colIdx], -15),//colore principale scuro (zampe dietro, ombre, ...)
			colorShade30 : shadeColor(colors[colIdx], -30),//colore principale ancora piu scuro
            jockeyColor: jColor,//fantino
			jockeyColorShade10: shadeColor(jColor, -10)//dettagli piu scuri
        });
    }
    drawTrack();
	drawStats();
    drawHorses();
    createBetButtons();
}

function getHorseNumber(nome) {
    let hash = 0;
    for (let i = 0; i < nome.length; i++) hash += nome.charCodeAt(i) * (i + 1);
    return hash % 100;
}

function getColorIndex(nome) {
    let hash = 5381;
    for (let i = 0; i < nome.length; i++)
        hash = ((hash << 5) + hash) ^ nome.charCodeAt(i);
    return Math.abs(hash) % colors.length;
}

function createBetButtons() {
    var div = document.getElementById("bets");
    div.innerHTML = "<span>SCOMMESSA:</span>";
    document.getElementById("startRace").disabled = true;
    for (var i = 0; i < horses.length; i++) {
        (function(index) {
            var b = document.createElement("button");
            b.innerHTML = horses[index].id + ' ' + horses[index].name;
            b.onclick = function() {
                if (!racing) {
                    selectedBetLane = index;
                    document.getElementById("startRace").disabled = false;
                }
            };
            div.appendChild(b);
        })(i);
    }
}

function startRace() {
    if (racing) return;
    if (selectedBetLane === null) return;
    if (lives <= 0) return;
    lives--;
    updateUI();
    racing = true;
	
	raceTime = 0;
    document.getElementById("timer").innerText = "⏱ 0.0s";
    timerInterval = setInterval(function() {
        raceTime += 0.1;
        document.getElementById("timer").innerText = "⏱ " + raceTime.toFixed(1) + "s";
    }, 100);
		
	//Nel click handler del bottone "Vai"
	if (music) {
		if (westAndSoda) {
			bgMusic.pause();
			bgMusicWestAndSoda.currentTime = 0;
			bgMusicWestAndSoda.play();
		} else {
			bgMusicWestAndSoda.pause();
			bgMusic.currentTime = 0;
			bgMusic.play();		
		}
	} else {
		bgMusic.pause();
		bgMusicWestAndSoda.pause();
	}
    loop();
}



function loop() {
	const t0 = performance.now();
	
    if (!racing) return;
	
	const now = performance.now();
	if (now - (loop.lastTime || 0) < 28) { requestAnimationFrame(loop); return; }
	loop.lastTime = now;
	
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTrack();
	
var tTrack = performance.now() - t0;


	
	
	drawStats();
    updateHorses();
    drawHorses();
	
var tHorses = performance.now() - t0;	
	
    updateAndDrawConfetti();
    if (!stopRace) {
        let winner = checkWinner();
        if (winner !== null) {
            var winHorse = horses[winner];
			clearInterval(timerInterval);//blocca subito il timer
            spawnConfetti(winHorse.x, LANE_HEIGHT * winHorse.lane + LANE_HEIGHT / 2);
            stopRace = true;
            setTimeout(function() { finishRace(winner); }, 8000);
        }
    }
	
	
	const ms = performance.now() - t0;
	if (ms > 10) console.log('frame lento: ' + ms.toFixed(1) + 'ms  track=' + tTrack?.toFixed(1) + ' horses=' + tHorses?.toFixed(1));
	
	
    requestAnimationFrame(loop);
}


//CONFETTI == CORIANDOLI quando un cavallo taglia il traguardo per primo
function spawnConfetti(x, y) {
    for (let i = 0; i < 200; i++) {
        confetti.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 1.5) * 8,
            size: Math.random() * 3 + 1,
            color: "hsl(" + Math.random() * 360 + ",100%,50%)",
            life: 60 + Math.random() * 30
        });
    }
    showConfetti = true;
}

function updateAndDrawConfetti() {
    if (!showConfetti) return;
    for (let i = 0; i < confetti.length; i++) {
        let c = confetti[i];
        c.vy += 0.3; c.x += c.vx; c.y += c.vy; c.life--;
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.size, c.size);
    }
    confetti = confetti.filter(c => c.life > 0);
    if (confetti.length === 0) showConfetti = false;
}

function checkWinner() {
    for (var i = 0; i < horses.length; i++)
        if (horses[i].x >= finishX) return i;
    return null;
}

function updateHorses() {
    for (var i = 0; i < horses.length; i++) {
        var h = horses[i];
        var raceProgress = h.x / finishX;
        var targetSpeed;
        if (raceProgress < 0.15)      targetSpeed = h.maxSpeed * 0.90 + Math.random() * 0.1;//sprint iniziale
        else if (raceProgress < 0.75) targetSpeed = h.maxSpeed * 0.75;  //era 0.7, parte centrale
        else                          targetSpeed = h.maxSpeed * 1.05;  //era 1.1, sprint finale

        var effort = h.speed / h.maxSpeed;
        h.stamina -= effort * 0.4;   // era 0.6 - diminuito consumo altrimenti stamina sempre verso 0
        h.stamina += 0.12;           // era 0.15 - ridotto recupero
        if (h.stamina < 0) h.stamina = 0;
        if (h.stamina > 100) h.stamina = 100;

        var staminaFactor = 0.75 + (h.stamina / 100) * 0.5;  // range 0.75–1.25 invece di 0.5–1.5
        targetSpeed *= staminaFactor;

        h.speed += (targetSpeed - h.speed) * 0.05;
        h.speed += (Math.random() - 0.5) * 0.15;

        if (raceProgress > 0.80 && h.stamina < 10) h.speed *= 0.90;
        else if (raceProgress > 0.50 && h.stamina < 20) h.speed *= 0.95;

        if (h.speed < 0.2) h.speed = 0.2;

        // azzoppato!
        if (!h.injured && Math.random() < 0.0001) { h.injured = true; h.devilInside = false; }
        if (h.injured) { h.speed = 0.1; h.stamina = 10; }

		// indemoniato!
		if (!h.injured && !h.devilInside && raceProgress > 0.25 && Math.random() < 0.0001) {
			var pos = horses.slice().sort((a, b) => b.x - a.x).indexOf(h);
			if (pos>0) {
				//se non sono primo -> mettici la grinta!
				h.devilInside = true;
				h.maxSpeed = Math.max(h.maxSpeed * 1.2, 0.8 + Math.random() * 0.2);//turboooo
				h.stamina = 100 - raceProgress * 50;//stamina si ricarica in base a quanto manca
			}
		}

        h.x += h.speed;
        h.anim += Math.max(h.speed, 0.6) * 0.35;
    }
}

function drawBozzettoBush(x, y, w, h, isTop) {
    // Fondo base siepe - verde scuro piatto, alla Bozzetto
    ctx.fillStyle = "#2a5c1a";
    ctx.fillRect(x, y, w, h);

    // Striscia di terra/suolo ai piedi della siepe
    const soilH = Math.round(h * 0.18);
    ctx.fillStyle = isTop ? "#1a3a0a" : "#1a3a0a";
    if (isTop) {
        ctx.fillRect(x, y + h - soilH, w, soilH);
    } else {
        ctx.fillRect(x, y, w, soilH);
    }

    // Cespugli stilizzati - semicerchi piatti, stile cartone anni '60
    const bushColors = ["#3a7a20", "#4a9a28", "#2a6018", "#5aaa30", "#3a8020"];
    const bushCount = Math.ceil(w / 38);
    const bushBaseY = isTop ? (y + h - soilH) : (y + soilH);

    ctx.save();
    for (let i = 0; i < bushCount; i++) {
        const bx = x + i * (w / bushCount) + (w / bushCount) * 0.1;
        const bw = (w / bushCount) * 0.9;
        const bh = h * (0.45 + Math.sin(i * 2.7) * 0.12); // altezze leggermente variabili
        const col = bushColors[i % bushColors.length];

        ctx.fillStyle = col;
        ctx.beginPath();
        if (isTop) {
            // siepe sopra: cespugli che "scendono" verso la pista
            ctx.ellipse(bx + bw / 2, bushBaseY, bw / 2, bh, 0, Math.PI, 2 * Math.PI);
        } else {
            // siepe sotto: cespugli che "salgono" verso la pista
            ctx.ellipse(bx + bw / 2, bushBaseY, bw / 2, bh, 0, 0, Math.PI);
        }
        ctx.fill();

        // Luce piatta in cima (stile Bozzetto: highlight netto, senza sfumatura)
        ctx.fillStyle = "rgba(180,255,100,0.13)";
        ctx.beginPath();
        if (isTop) {
            ctx.ellipse(bx + bw / 2, bushBaseY, bw * 0.3, bh * 0.35, 0, Math.PI, 2 * Math.PI);
        } else {
            ctx.ellipse(bx + bw / 2, bushBaseY, bw * 0.3, bh * 0.35, 0, 0, Math.PI);
        }
        ctx.fill();
    }
    ctx.restore();
}



function buildGradients() {
    // westAndSoda
	cachedGradientsWestAndSoda = {
        grassTop:    ctx.createLinearGradient(0, 0, 0, GRASS_HEIGHT),
        grassBottom: ctx.createLinearGradient(0, canvas.height - GRASS_HEIGHT, 0, canvas.height),
        dirt:        ctx.createLinearGradient(0, GRASS_HEIGHT, 0, canvas.height - GRASS_HEIGHT)
    };
    cachedGradientsWestAndSoda.grassTop.addColorStop(0, "#9a7040");
	cachedGradientsWestAndSoda.grassTop.addColorStop(0.3, "#aa8050");
    cachedGradientsWestAndSoda.grassTop.addColorStop(1, "#aa8050");
	
	cachedGradientsWestAndSoda.grassBottom.addColorStop(0, "#aa8050");
	cachedGradientsWestAndSoda.grassBottom.addColorStop(0.7, "#aa8050");
    cachedGradientsWestAndSoda.grassBottom.addColorStop(1, "#9a7040");
    
	cachedGradientsWestAndSoda.dirt.addColorStop(0,   "#c8934a"); // terra ombra al bordo siepe
	cachedGradientsWestAndSoda.dirt.addColorStop(0.15,"#dba455"); // ocra chiaro
	cachedGradientsWestAndSoda.dirt.addColorStop(0.5, "#e8bc70"); // giallo sabbia caldo, piena luce
	cachedGradientsWestAndSoda.dirt.addColorStop(0.85,"#dba455"); // ocra chiaro
	cachedGradientsWestAndSoda.dirt.addColorStop(1,   "#c8934a"); // terra ombra al bordo siepe
	
	//default
	cachedGradients = {
		grassTop:    ctx.createLinearGradient(0, 0, 0, GRASS_HEIGHT),
        grassBottom: ctx.createLinearGradient(0, canvas.height - GRASS_HEIGHT, 0, canvas.height),
        dirt:        ctx.createLinearGradient(0, GRASS_HEIGHT, 0, canvas.height - GRASS_HEIGHT)
	};
	cachedGradients.grassTop.addColorStop(0, "#308030");
	cachedGradients.grassTop.addColorStop(0.3, "#106010");
    cachedGradients.grassTop.addColorStop(1, "#106010");
	
	cachedGradients.grassBottom.addColorStop(0, "#106010");
	cachedGradients.grassBottom.addColorStop(0.7, "#106010");
    cachedGradients.grassBottom.addColorStop(1, "#308030");

function drawTrack() {
	if (westAndSoda) {
		ctx.fillStyle = cachedGradientsWestAndSoda.grassTop;
		ctx.fillRect(0, 0, canvas.width, GRASS_HEIGHT);//erba/siepe sopra
		
		ctx.fillStyle = cachedGradientsWestAndSoda.grassBottom;
		ctx.fillRect(0, canvas.height - GRASS_HEIGHT, canvas.width, GRASS_HEIGHT);//erba/siepe sotto
		
		// Bozzetto usa tinte piatte o quasi piatte, crema/ocra/terra bruciata
		ctx.fillStyle = cachedGradientsWestAndSoda.dirt;
		ctx.fillRect(0, GRASS_HEIGHT, canvas.width, canvas.height - GRASS_HEIGHT * 2);//terra marrone
	} else {
		ctx.fillStyle = "#2e7d32";
		ctx.fillStyle = cachedGradients.grassTop;
		ctx.fillRect(0, 0, canvas.width, GRASS_HEIGHT);//erba/siepe sopra
		
		ctx.fillStyle = cachedGradients.grassBottom;
		ctx.fillRect(0, canvas.height - GRASS_HEIGHT, canvas.width, GRASS_HEIGHT);//erba/siepe sotto
		
		ctx.fillStyle = "#caa472";
		ctx.fillStyle = cachedGradients.dirt;
		ctx.fillRect(0, GRASS_HEIGHT, canvas.width, canvas.height - GRASS_HEIGHT * 2);//terra marrone
	}
	
    var avgSpeed = 0;
    for (var i = 0; i < horses.length; i++) avgSpeed += horses[i].speed;
	avgSpeed /= horses.length;
	trackOffset -=  avgSpeed * 2;
	
	//crea nuove particles
    for (let i = 0; i < 8 && dirtParticles.length < 1000; i++) {
		dirtParticles.push({
            x: canvas.width,
            y: 3 + GRASS_HEIGHT + (Math.random() * (canvas.height - GRASS_HEIGHT * 2 - 6)),
            size: Math.random() * 2 + 1
        });
    }	
	for (let i = 0; i < 4 && grassParticles.length < 1000; i++) {
		grassParticles.push({
            x: canvas.width,
            y: 3 + (Math.random() * (GRASS_HEIGHT - 6)),
            size: Math.random() * 2 + 1
        });
	}
	
	//disegna particles
	let avgSpeedOffset = avgSpeed * 50 / lanes;
    for (let i = 0; i < dirtParticles.length; i++) {
        let p = dirtParticles[i];
        p.x -= avgSpeedOffset;
        ctx.fillStyle = "#ba9060";
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
	for (let i = 0; i < grassParticles.length; i++) {
        let p = grassParticles[i];
        p.x -= avgSpeedOffset;
        ctx.fillStyle = westAndSoda ? "7a5020" : "#006600";
        ctx.fillRect(p.x, p.y, p.size, p.size);
		ctx.fillRect(p.x, p.y+canvas.height-(GRASS_HEIGHT), p.size, p.size);
    }
	
	//rimuove vecchie particles fuori schermo
    dirtParticles = dirtParticles.filter(p => p.x > 0);
	grassParticles = grassParticles.filter(p => p.x > 0);
	
	
	//lo steccato... azz!
	var POST_W      = 4;//paletto largo 4px
	var POST_H      = GRASS_HEIGHT * 0.72;//paletto alto 3/4 circa
	var RAIL_H      = 6;//steccato alto 6px
	
	var RAIL_Y_TOP_TOP = GRASS_HEIGHT * 0.22;//steccato alto Y
	var RAIL_Y_BOT_TOP = canvas.height - GRASS_HEIGHT;//steccato basso Y

	//sposta paletti alla stessa velocita dei dirt
	for (let i = 0; i < steccatoParticles.length; i++) {
		steccatoParticles[i].x -= avgSpeedOffset;
	}
	
	//ricicla: rimuovi quelli usciti a sinistra, aggiungi a destra se serve
	if (steccatoParticles.length > 0) {
		var maxFX = steccatoParticles[steccatoParticles.length - 1].x;
		steccatoParticles = steccatoParticles.filter(p => p.x > -20);
		while (maxFX < canvas.width + 48) {
			maxFX += 48;
			steccatoParticles.push({ x: maxFX });
		}
	}
	
	//barra orizzontale bassa (prima paletti)
	ctx.fillStyle = '#ffffee';
	ctx.fillRect(0, RAIL_Y_BOT_TOP, canvas.width, RAIL_H);
	//ombra
	ctx.fillStyle = '#aabb99';
	ctx.fillRect(0, RAIL_Y_BOT_TOP + RAIL_H, canvas.width, 1);
	
	//paletti
	let topY = GRASS_HEIGHT - POST_H;
	let botY = canvas.height - GRASS_HEIGHT + 1;
	
	for (let i = 0; i < steccatoParticles.length; i++) {
		var fpx = steccatoParticles[i].x;
		//siepe sopra: paletto scende dalla cima fino al bordo pista, disegno prima ombra
		ctx.fillStyle = '#aabb99';
		ctx.fillRect(fpx + 1, topY, POST_W, Math.round(POST_H) + 1);
		ctx.fillStyle = '#eeeedd';
		ctx.fillRect(fpx, topY, POST_W - 1, Math.round(POST_H));
		//siepe sotto: paletto sale dal bordo pista verso il basso, disegno prima ombra
		ctx.fillStyle = '#aabb99';
		ctx.fillRect(fpx + 1, botY, POST_W, GRASS_HEIGHT/4);//Math.round(POST_H) + 1);
		ctx.fillStyle = '#eeeedd';
		ctx.fillRect(fpx, botY, POST_W - 1, GRASS_HEIGHT/4);//Math.round(POST_H));
	}
	
	//barra orizzontale alta (dopo paletti)
	ctx.fillStyle = '#ffffee';
	ctx.fillRect(0, RAIL_Y_TOP_TOP, canvas.width, RAIL_H);
	//ombra
	ctx.fillStyle = '#aabb99';
	ctx.fillRect(0, RAIL_Y_TOP_TOP + RAIL_H, canvas.width, 1);
	
	
	
	
	
	
	
	
	
	
	
	
    //corsie tratteggiate
	if (stats) {
		ctx.strokeStyle = "rgba(255,255,255,0.3)";
		ctx.lineDashOffset = -trackOffset;
		ctx.setLineDash([8, 12]);
		for (var i = 1; i < lanes; i++) {
			ctx.beginPath();
			ctx.moveTo(0, GRASS_HEIGHT + i * LANE_HEIGHT);
			ctx.lineTo(canvas.width, GRASS_HEIGHT + i * LANE_HEIGHT);
			ctx.stroke();
		}
		ctx.setLineDash([]);
		ctx.lineDashOffset = 0;
	}
	
	//traguardo a scacchi
    let tile = 5;
    for (let y = GRASS_HEIGHT; y < canvas.height - GRASS_HEIGHT; y += tile) {
        for (let x = 0; x < 10; x += tile) {
            ctx.fillStyle = (Math.floor(y/tile) + Math.floor(x/tile)) % 2 === 0 ? "#fff" : "#000";
            ctx.fillRect(finishX + x, y, tile, tile);
        }
    }    
}

// seg — segmento arto tutto storto
function drawSegmentoZampa(ctx, x1, y1, x2, y2, w1, w2, col, shade) {
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len,ny = dx / len;//perpendicolare
	var sx = dx / len,  sy = dy / len;// lungo il segmento

    // Punti dei quattro angoli
    var tx1 = x1 + nx * w1;// top-start 
	var ty1 = y1 + ny * w1;// top-start
    var tx2 = x2 + nx * w2;// top-end
	var ty2 = y2 + ny * w2;// top-end
    var bx2 = x2 - nx * w2;// bottom-end
	var by2 = y2 - ny * w2;// bottom-end
    var bx1 = x1 - nx * w1;// bottom-start 
	var by1 = y1 - ny * w1;// bottom-start

    // Punto medio del segmento (asse longitudinale)
    var mx = (x1 + x2) * 0.5;
	var my = (y1 + y2) * 0.5;
    var bulgeDentro = -(w1 + w2) * 0.01;// Bombatura laterale in dentro
	var cpTx = mx + nx * bulgeDentro, cpTy = my + ny * bulgeDentro;
    var cpBx = mx - nx * bulgeDentro, cpBy = my - ny * bulgeDentro;
	
	// Midpoint dei caps (estremo inizio e fine)
    var sMx = (tx1 + bx1) * 0.5, sMy = (ty1 + by1) * 0.5;  // cap start
    var eMx = (tx2 + bx2) * 0.5, eMy = (ty2 + by2) * 0.5;  // cap end
	var bulgeFuori = (w1 + w2) * 0.5;  // Bombatura in fuori


    ctx.beginPath();
    ctx.moveTo(tx1, ty1);
	
	ctx.lineTo(tx2, ty2);//dritto
    //ctx.quadraticCurveTo(cpTx, cpTy, tx2, ty2);   //bombato dentro
    
	//ctx.lineTo(bx2, by2);
	ctx.quadraticCurveTo(eMx + sx * bulgeFuori, eMy + sy * bulgeFuori, bx2, by2); //bombato fuori
	
    ctx.lineTo(bx1, by1);//dritto
	//ctx.quadraticCurveTo(cpBx, cpBy, bx1, by1);   //bombato dentro
	
	ctx.quadraticCurveTo(sMx - sx * bulgeFuori, sMy - sy * bulgeFuori, tx1, ty1); //bombato fuori
	
    ctx.closePath();
	
    ctx.fillStyle = col;
    ctx.fill();
}

// zampa — tre segmenti animati (anca/spalla, ginocchio/garretto, pastoia+zoccolo)
function drawZampa(ctx, ox, oy, phase, col, hoofCol, isRear) {
    var uLen = isRear ? 24 : 26;//lunghezza segmento superiore
    var lLen = isRear ? 26 : 24;//lunghezza segmento inferiore
    var uW   = isRear ? 10 : 8;//larghezza segmento superiore
	var lW   = isRear ? 3 : 2;//larghezza segmento inferiore

    // Oscillazione del segmento superiore attorno al punto di attacco
    var alpha = phase * (isRear ? 0.42 : 0.48);

    // Flessione ginocchio/garretto
    // Anteriore: il ginocchio piega in avanti quando la zampa è sollevata
    // Posteriore: il garretto piega verso l'esterno quando la zampa è abbassata
    var beta;
    if (isRear) {
		beta = Math.max(0, -phase) * 0.7 + 0.18;
    } else {
		beta = Math.max(0,  phase) * 0.8 + 0.12;
    }

    // Calcola posizioni: attacco → ginocchio/garretto → estremo inferiore
    var ax = ox, ay = oy;
    var kx = ax + Math.sin(alpha) * uLen;
    var ky = ay + Math.cos(alpha) * uLen;
    var lAngle = isRear ? alpha + beta : alpha - beta;
    var ex = kx + Math.sin(lAngle) * lLen;
    var ey = ky + Math.cos(lAngle) * lLen;

    // Disegna
    drawSegmentoZampa(ctx, ax, ay, kx, ky, uW, uW * 0.65, col, hoofCol);
    drawSegmentoZampa(ctx, kx, ky, ex, ey, uW * 0.60, lW, col, hoofCol);
       
	ctx.beginPath(); 
	ctx.ellipse(ex, ey + 5, 6, 3.5, 0, 0, Math.PI * 2);
	ctx.fillStyle = hoofCol; 
	ctx.fill();
}

function drawCarrozzellaDriver(ctx, ox, oy, wheelRotation, t, h) {

    var SPOKE_COUNT = 5;
    var WHEEL_R     = 30;  // ruota grande come in foto
	
	var bounce = Math.sin(t * 2) * 0.5;


	//// ombra ellittica a terra
	var shadowY = 60 - bounce * 0.5; // rimane "a terra" mentre il cavallo balla
	var shadowX = ox - 160;
	ctx.save();
	ctx.translate(shadowX, shadowY);

function drawLeg(ctx, sx, sy, phase, bodyCol, hoofCol, isBack) {
    var thighLen = isBack ? 14 : 18;//parte alta della zampa
    var shinLen  = isBack ? 32 : 28;//parte bassa della zampa
    var hoofH    = 7;

    var thighAngle, shinAngle;

    if (!isBack) {
        // ANTERIORE: si estende in avanti (acchiappa), poi tira indietro sotto il corpo
        // phase va da -1 a +1
        // avanti = angolo negativo (verso muso), indietro = positivo
        thighAngle = -phase * 0.4;          // la coscia batte avanti/indietro
        // il ginocchio si piega nella fase di raccolta (phase < 0 = gamba in aria avanti)
        var kneeBend = Math.max(0, -phase) * 0.5;
        shinAngle = thighAngle + kneeBend;   // stinco piega in avanti quando in aria
    } else {
        /*
		// POSTERIORE: si raccoglie sotto il corpo (piega), poi spinge indietro
        // push = phase positivo → gamba estesa indietro
        thighAngle = phase * 0.4;            // la coscia spinge indietro
        // il garretto si piega quando la gamba è in raccolta (phase < 0)
        var hockBend = Math.max(0, -phase) * 0.5;
        shinAngle = thighAngle - hockBend;   // il garretto piega indietro (verso il corpo)
		*/
		// coscia obliqua: parte alta e dietro, scende avanti-basso
		// range: da -1.1 (raccolta sotto il ventre) a 0 (estensione dietro)
		thighAngle = -0.7 + phase * 0.7;
		// garretto sempre un po' angolato, molto piegato in raccolta
		var hockBend = Math.max(0, -phase) * 0.7 + 0.25;
		shinAngle = thighAngle + hockBend;
	}
	
	if (!mute && Math.abs(shinAngle) < 0.05) playHoofBeat(audioCtx);

    // Punto coscia
    var tx = sx + Math.sin(thighAngle) * thighLen;
    var ty = sy + Math.cos(thighAngle) * thighLen;

    // Punto zoccolo
    var kx = tx + Math.sin(shinAngle) * shinLen;
    var ky = ty + Math.cos(shinAngle) * shinLen;

    /* coscia */
    ctx.strokeStyle = bodyCol;
    ctx.lineWidth = isBack ? 12 : 8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    /* stinco */
    ctx.lineWidth = isBack ? 5 : 4;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(kx, ky);
    ctx.stroke();

    /* zoccolo */
    ctx.fillStyle = hoofCol;
    ctx.beginPath();
    ctx.ellipse(kx, ky + hoofH * 0.5, 4, hoofH * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
}

/* utility: schiarisce/scurisce un colore hex */
function shadeColor(col, amt) {
	if (col.startsWith('hsl')) {
        const match = col.match(/hsl\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)/);
        if (!match) return col;
        const h = parseFloat(match[1]);
        const s = parseFloat(match[2]);
        const l = Math.min(100, Math.max(0, parseFloat(match[3]) + amt));
        return `hsl(${h}, ${s}%, ${l}%)`;
    }
    var usePound = false;
    if (col[0] === "#") { col = col.slice(1); usePound = true; }
    var num = parseInt(col, 16);
    var r = Math.min(255, Math.max(0, (num >> 16) + amt));
    var g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
    var b = Math.min(255, Math.max(0, (num & 0xff) + amt));
    return (usePound ? "#" : "") +
        ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}


//SOUND-ON
var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playHoofBeat(audioCtx) {
    var t = audioCtx.currentTime;

    // Rumore impatto (basso e sordo)
    var bufferSize = audioCtx.sampleRate * 0.10;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    }
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    // Filtro passa-basso: suono sordo/terroso
    var filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(300, t);
    filter.frequency.exponentialRampToValueAtTime(80, t + 0.12);

    // Inviluppo volume: attacco rapido, decay breve
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.8, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start(t);
    noise.stop(t + 0.15);
}

    ctx.beginPath(); ctx.arc(96, -55, 2.8, 0, Math.PI * 2); ctx.fill();
	
	// narice dietro
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.ellipse(114, -24, 7, 6,  0.2, 0, Math.PI * 2); ctx.fill();

	
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    // parte alta piccola (cranio)
    ctx.moveTo(66, -62);
    ctx.bezierCurveTo(72,-72, 86,-72, 90,-62);
    // scende e si allarga verso il muso
    ctx.bezierCurveTo(100,-54, 112,-44, 116,-30);
    ctx.bezierCurveTo(118,-20, 114,-10, 106, -6);
    ctx.bezierCurveTo( 96, -2,  80, -4,  72,-14);
    ctx.bezierCurveTo( 62,-28,  60,-48,  66,-62);
    ctx.closePath();
    ctx.fill();
	ctx.strokeStyle = maneColor;
	ctx.lineWidth = 3;
	ctx.stroke();
	
	//attacco briglia
	ctx.strokeStyle = '#000';
	ctx.beginPath();
	ctx.moveTo(113,-40);
	ctx.lineTo(72,-10);
	ctx.moveTo(102,-28)
	ctx.lineTo(60,-55);
	ctx.stroke();

    // narice davanti
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.ellipse(106, -20, 7, 6,  0.2, 0, Math.PI * 2); ctx.fill();

    // ── OCCHIO AVANTI
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(84, -56, 5.5, 0, Math.PI * 2); ctx.fill();
	ctx.strokeStyle = maneColor;
	ctx.lineWidth = 3;
	ctx.stroke();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(86, -55, 2.8, 0, Math.PI * 2); ctx.fill();
	
    // orecchie — triangoli piatti sulla parte stretta in alto
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(68, -64); ctx.lineTo(64, -76); ctx.lineTo(76, -66);
    ctx.closePath(); ctx.fill();
	ctx.strokeStyle = maneColor;
	ctx.lineWidth = 3;
	ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(76, -62); ctx.lineTo(74, -76); ctx.lineTo(84, -64);
    ctx.closePath(); ctx.fill();
	ctx.strokeStyle = maneColor;
	ctx.lineWidth = 3;
	ctx.stroke();


    // ════════════════════════════════════════════
    //  CRINIERA — 7 archi esili come la coda, ondeggia col vento
    // ════════════════════════════════════════════
    var maneWind = Math.sin(t * 1.5 + 0.5) * 5 * Math.min(h.speed * 0.8, 1);
    // ogni arco parte dal collo/testa e scende
    // [startX, startY, lunghezza, direzione Y, fase vento]
    var maneArcs = [
        { sx: 80, sy: -66, len: 24, phase: 0.20 },
        { sx: 74, sy: -64, len: 28, phase: 0.35 },
        { sx: 68, sy: -60, len: 30, phase: 0.50 },
        { sx: 62, sy: -56, len: 28, phase: 0.60 },
        { sx: 56, sy: -52, len: 26, phase: 0.72 },
        { sx: 50, sy: -46, len: 24, phase: 0.84 },
        { sx: 44, sy: -40, len: 20, phase: 0.95 },
    ];
    ctx.lineCap = "round";
    maneArcs.forEach(function(a) {
        var sw = maneWind * a.phase;
        // arco che piega in avanti/su col vento (criniera soffia all'indietro = verso sx = x-)
		var ex = a.sx - a.len + sw * 1.2;
		var ey = a.sy + sw * 0.5;
        ctx.strokeStyle = maneColor; 
		ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.bezierCurveTo(
			a.sx - a.len * 0.1 + sw * 0.4, a.sy - a.len * 0.4,
			ex   + a.len * 0.1 + sw * 0.4, a.sy - a.len * 0.4,
			ex, ey
		);
        ctx.stroke();
    });


    // ════════════════════════════════════════════
    //  CODA — 4 archi esili, ognuno ondeggia col vento
    // ════════════════════════════════════════════
    var tailWind = Math.sin(t * 1.5) * 18 * Math.min(h.speed * 0.8, 1);
    // tutti partono dallo stesso punto (-52, -6); la fase sfasa l'ondeggiamento
    var tailArcs = [
        { len: 52, endDY: -14, phase: 0.20 },
        { len: 58, endDY:  -4, phase: 0.45 },
        { len: 62, endDY:   8, phase: 0.68 },
        { len: 54, endDY:  16, phase: 0.90 },
    ];
    ctx.lineCap = "round";
    tailArcs.forEach(function(arc) {
        var sw = tailWind * arc.phase;
        var ox = -52, oy = -6;          // punto di partenza comune
        var ex = ox - arc.len;
        var ey = oy + arc.endDY + sw;
		ctx.strokeStyle = maneColor; 
		ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ox, oy);
        ctx.bezierCurveTo(
			ox - arc.len * 0.15, oy + arc.endDY * 0.7 + sw * 0.4,
			ex  + arc.len * 0.35, ey - 20 + sw * 0.5,
			ex, ey
		);
        ctx.stroke();
    });


    // ════════════════════════════════════════════
    //  ZAMPE VICINE
    // ════════════════════════════════════════════
    drawLegWestAndSoda(ctx, -34, 22, BR, bodyColor, true,  t);
    drawLegWestAndSoda(ctx,  38, 20, FL, bodyColor, false, t);


    // ════════════════════════════════════════════
    //  SELLA + FANTINO
    // ════════════════════════════════════════════
	if (trottatori) {
		// punto di aggancio stanghe: vicino alla groppa/pancia
		var aggancioX = 30;
		var aggancioY = -25;
		var wheelRot = h.x / HORSE_SCALE / 2;
		drawCarrozzellaDriverWestAndSoda(ctx, aggancioX, aggancioY, wheelRot, t, h);
	} else {
		var jockeyBounce = Math.sin(t * 2) * 2;
		drawSaddleWestAndSoda(ctx, t, h);
		drawReins(ctx, t);
		drawJockeyWestAndSoda(ctx, 20, -30 + jockeyBounce, h.jockeyColor, h.jockeyColorShade10);
	}
	
    ctx.restore();
}


// ────────────────────────────────────────────────────────────
//  drawLegWaS
//  Gambe stecco quasi verticali — zoccolo a SEMICERCHIO piatto
// ────────────────────────────────────────────────────────────
function drawLegWestAndSoda(ctx, sx, sy, phase, bodyCol, isBack, t) {
    var thighLen = 14;
    var shinLen  = 28;

    var thighAngle, shinAngle;
    if (!isBack) {
        thighAngle = -phase * 0.30;
        shinAngle  = thighAngle + Math.max(0, -phase) * 0.35;
    } else {
        thighAngle =  phase * 0.30;
        shinAngle  = thighAngle - Math.max(0, -phase) * 0.35;
    }

    if (!mute && Math.abs(shinAngle) < 0.05) playHoofBeat(audioCtx);

    var tx = sx + Math.sin(thighAngle) * thighLen;
    var ty = sy + Math.cos(thighAngle) * thighLen;
    var kx = tx + Math.sin(shinAngle)  * shinLen;
    var ky = ty + Math.cos(shinAngle)  * shinLen;

    // coscia
    ctx.strokeStyle = bodyCol; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
    
    // stinco
    ctx.strokeStyle = bodyCol; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(kx, ky); ctx.stroke();
    
    // ZOCCOLO: parte superiore del semicerchio, centro spostato 8px avanti
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(kx + 8, ky + 8, 15, Math.PI, 0); // arco superiore (da PI a 0 = parte alta)
    ctx.closePath();
    ctx.fill();
}

//carrozza western
function drawCarrozzellaDriverWestAndSoda(ctx, ox, oy, wheelRotation, t, h) {
    var bounce = Math.sin(t * 2) * 0.5;

    // ── geometria base ──
    var wx  = ox - 295;//centro ruote post
    var wy  = oy + 65;
    var wx2 = ox - 180;//centro ruote ant
    var wy2 = wy;    

    var WR_BIG   = 36;//raggio
    var SPOKES_B = 5;//numero raggi
    
    var carX  = wx  - WR_BIG;// bordo sinistro cassone
    var carX2 = wx2 + WR_BIG;// bordo destro cassone
    var carY  = wy  - WR_BIG - 4;// fondo cassone
    var carH  = 38;// altezza cassone in legno
    var carW  = carX2 - carX;// larghezza cassone

	// ── ombra piatta a terra ──
    var shadowY = carY + WR_BIG * 2 - 8;
	var shadowX = carX + 100;
    ctx.save();
    ctx.translate(shadowX, shadowY);
    ctx.scale(1, 0.18);
    ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fill();
    ctx.restore();


    // ══════════════════════════════════════════
    //  CASSONE IN LEGNO
    // ══════════════════════════════════════════
    // tavole di fondo (assi orizzontali)
    var plankColors = ["#c8782a","#b86820","#d08830","#c07020"];
    var plankH = Math.ceil(carH / 4);
    for (var p = 0; p < 4; p++) {
        ctx.fillStyle = plankColors[p % plankColors.length];
        ctx.fillRect(carX, carY + p * plankH, carW, plankH);
    }
    // giunzioni tavole (linee scure orizzontali)
    ctx.strokeStyle = "#3a1a04"; ctx.lineWidth = 1.5;
    for (var p = 1; p < 4; p++) {
        ctx.beginPath();
        ctx.moveTo(carX, carY + p * plankH);
        ctx.lineTo(carX2, carY + p * plankH);
        ctx.stroke();
    }
    // listelli verticali metallici (cerchi del cassone)
    ctx.strokeStyle = "#2a0e02"; ctx.lineWidth = 3;
    [0.15, 0.4, 0.65, 0.85].forEach(function(frac) {
        var lx = carX + carW * frac;
        ctx.beginPath(); ctx.moveTo(lx, carY); ctx.lineTo(lx, carY + carH); ctx.stroke();
    });
    // bordo superiore e inferiore cassone
    ctx.strokeStyle = "#2a0e02"; ctx.lineWidth = 3;
    ctx.strokeRect(carX, carY, carW, carH);

	//barra agganciata al CAVALLO
	ctx.lineWidth = 4;
	ctx.fillStyle = "#c8782a";
	ctx.fillRect(carX2, carY, 180, 4);
	ctx.fillStyle = "#3a1a04";
	ctx.fillRect(carX2, carY + 4, 180, 2);
    
	//NUMERO sul fianco cavallo
	ctx.fillStyle = '#400';
	ctx.fillRect(ox - 35, oy + 20, 30, 20);//ctx.fillRect(carX + 80, carY + 10, 30, 20);
    ctx.shadowBlur = 0;
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = selectedBetLane === h.lane ? '#fff' : '#aaa';
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
	ctx.strokeText(h.id,  ox - 22, oy + 35);
	ctx.fillText(h.id, ox - 22, oy + 35);
    
	//NUMERO anche su fianco carrozza
	ctx.fillStyle = '#400';
	ctx.fillRect(carX + 80, carY + 8, 30, 22);    
	ctx.font = "18px Arial";
	ctx.fillStyle = selectedBetLane === h.lane ? '#fff' : '#aaa';
	ctx.strokeText(h.id, carX + 95, carY + 24);
	ctx.fillText(h.id, carX + 95, carY + 24);
	
	
	
	// ══════════════════════════════════════════
    //  TELONE ARCUATO (canvas cover)
    // ══════════════════════════════════════════
    var archH = carH * 2.6;

    // ── ombra interna ──
    ctx.fillStyle = "#c8b878";
    ctx.beginPath();
    ctx.moveTo(carX + 4, carY + 2);
    ctx.bezierCurveTo(carX + 4, carY - archH * 0.82, carX2 - 4, carY - archH * 0.82, carX2 - 4, carY + 2);
    ctx.closePath(); ctx.fill();

    // ── profilo telone ondulato ──
    // le costole sono i punti ALTI, il telo tra una costola e l'altra cade in U
    var ribCount = 5;
    var ribXs = [];
    var ribYs = [];
    for (var r = 0; r < ribCount; r++) {
        ribYs[r] = carY - archH;
		ribXs[r] = carX + (r === ribCount - 1 ? (carW * (r / (ribCount -1)) - 28)
			: carW * (r / (ribCount - 1)));
    }

    // fill del telone — percorso: base sx → costole con U → base dx
    ctx.fillStyle = "#e8d898";
    ctx.beginPath();
    ctx.moveTo(carX - 2, carY + 2); // base sinistra

    // salita al primo arco
    ctx.lineTo(ribXs[0], ribYs[0]);

    // tra ogni coppia di costole: scende a U e risale
    for (var r = 0; r < ribCount - 1; r++) {
        var midX = (ribXs[r] + ribXs[r+1]) / 2;
        var sagY = ribYs[r] + archH * 0.18; // quanto cade il telo tra le costole
        ctx.bezierCurveTo(
            ribXs[r]  + carW * 0.04, ribYs[r]  + archH * 0.10,
            midX      - carW * 0.04, sagY,
            midX,                    sagY
        );
        ctx.bezierCurveTo(
            midX      + carW * 0.04, sagY,
            ribXs[r+1]- carW * 0.04, ribYs[r+1] + archH * 0.10,
            ribXs[r+1], ribYs[r+1]
        );
    }

    // discesa base destra
    ctx.lineTo(carX2 + 2 - 28, carY + 2);
    ctx.closePath();
    ctx.fill();

    // ── bordo superiore ondulato (solo profilo, no base) ──
    ctx.strokeStyle = "#b8a060"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(carX - 2, carY + 2);
    ctx.lineTo(ribXs[0], ribYs[0]);
    for (var r = 0; r < ribCount - 1; r++) {
        var midX = (ribXs[r] + ribXs[r+1]) / 2;
        var sagY = ribYs[r] + archH * 0.18;
        ctx.bezierCurveTo(
            ribXs[r]  + carW * 0.04, ribYs[r]  + archH * 0.10,
            midX      - carW * 0.04, sagY,
            midX,                    sagY
        );
        ctx.bezierCurveTo(
            midX      + carW * 0.04, sagY,
            ribXs[r+1]- carW * 0.04, ribYs[r+1] + archH * 0.10,
            ribXs[r+1], ribYs[r+1]
        );
    }
    ctx.lineTo(carX2 + 2, carY + 2);
    ctx.stroke();

    // ── costole (archi verticali sulle creste) ──
    for (var r = 0; r < ribCount; r++) {
        ctx.strokeStyle = r === 0 || r === ribCount-1 ? "#8a7030" : "rgba(140,110,40,0.6)";
        ctx.lineWidth   = r === 0 || r === ribCount-1 ? 2.5 : 1.5;
        ctx.beginPath();
        ctx.moveTo(ribXs[r], carY + 2);
        ctx.lineTo(ribXs[r], ribYs[r]);
        ctx.stroke();
    }

	
	

    // ══════════════════════════════════════════
    //  GUIDATORE sul cassone
    // ══════════════════════════════════════════
    var sx = carX2 - 18;
    var sy = carY - bounce;

    // gambe a penzoloni
    ctx.fillStyle = "#e8e0d0"; ctx.strokeStyle = "#999"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx - 8, sy); ctx.lineTo(sx + 8, sy);
    ctx.lineTo(sx + 10, sy + 20); ctx.lineTo(sx - 6, sy + 20);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // stivali
    ctx.fillStyle = "#333";
    ctx.beginPath(); ctx.ellipse(sx - 2, sy + 22, 5, 8, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx + 8, sy + 22, 5, 8, -0.2, 0, Math.PI*2); ctx.fill();

    // busto
    ctx.fillStyle = h.jockeyColor; ctx.strokeStyle = h.jockeyColorShade10; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx - 10, sy);
    ctx.bezierCurveTo(sx - 12, sy - 16, sx - 6, sy - 22, sx + 2, sy - 22);
    ctx.bezierCurveTo(sx + 10, sy - 22, sx + 12, sy - 14, sx + 10, sy);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // testa
    ctx.fillStyle = "#f0e8c8"; ctx.strokeStyle = "#c8a870"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(sx + 1, sy - 28, 6, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

    // cappello cowboy
    var colSabbia = h.jockeyColor.replace(/,\s*\d+%\s*,/, ",20%,");
    ctx.fillStyle = colSabbia;
	
	//CAPPELLO COWBOY
    // tesa
    ctx.beginPath(); ctx.ellipse(sx + 1, sy - 34, 16, 4, 0, 0, Math.PI*2); ctx.fill();
    // calotta sinistra
    ctx.beginPath(); ctx.ellipse(sx - 1, sy - 37, 3, 10, 0, Math.PI, Math.PI*2); ctx.fill();
    // calotta destra
    ctx.beginPath(); ctx.ellipse(sx + 4, sy - 37, 3, 10, 0, Math.PI, Math.PI*2); ctx.fill();
    // fascia
    ctx.strokeStyle = "#8b6914"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx - 5, sy - 37); ctx.lineTo(sx + 9, sy - 37); ctx.stroke();

    // redini (verso il muso del cavallo)
    ctx.strokeStyle = "#1a0a00"; ctx.lineWidth = 1.5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx + 8, sy - 10);
    ctx.bezierCurveTo(sx + 40, sy, ox + 60, oy - 10, ox + 72, oy - 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(sx + 8, sy - 8);
    ctx.bezierCurveTo(sx + 40, sy + 4, ox + 60, oy - 6, ox + 72, oy - 2);
    ctx.stroke();
    // morso
    ctx.fillStyle = "#aaa";
    ctx.beginPath(); ctx.ellipse(ox + 72, oy - 4, 3, 2, 0.3, 0, Math.PI*2); ctx.fill();

	//ruote
	drawWoodenWheel(ctx, wx, wy, WR_BIG, wheelRotation, SPOKES_B);
    drawWoodenWheel(ctx, wx2, wy2, WR_BIG, wheelRotation, SPOKES_B);
}

function drawWoodenWheel(ctx, wx, wy, WHEEL_R, wheelRotation, SPOKE_COUNT) {
    // cerchione esterno: ferro battuto ossidato
    ctx.strokeStyle = "#110600";
    ctx.lineWidth   = 6;
    ctx.beginPath(); ctx.arc(wx, wy, WHEEL_R, 0, Math.PI * 2); ctx.stroke();

    // bordo interno cerchione
    ctx.strokeStyle = "#3a1a06";
    ctx.lineWidth   = 2;
    ctx.beginPath(); ctx.arc(wx, wy, WHEEL_R - 6, 0, Math.PI * 2); ctx.stroke();

    // corona esterna in legno — segmenti alternati
    for (var seg = 0; seg < 14; seg++) {
        var a0 = (seg / 14) * Math.PI * 2 + wheelRotation * 0.3;
        var a1 = ((seg + 0.85) / 14) * Math.PI * 2 + wheelRotation * 0.3;
        ctx.strokeStyle = (seg % 2 === 0) ? "#8b4a18" : "#a05c20";
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(wx, wy, WHEEL_R - 3, a0, a1); ctx.stroke();
    }

    // raggi spessi in legno di quercia
    ctx.lineCap = "round";
    for (var i = 0; i < SPOKE_COUNT; i++) {
        var a  = wheelRotation + (i / SPOKE_COUNT) * Math.PI * 2;
        var rx0 = wx + Math.cos(a) * 10,         ry0 = wy + Math.sin(a) * 10;
        var rx1 = wx + Math.cos(a) * (WHEEL_R-7), ry1 = wy + Math.sin(a) * (WHEEL_R-7);
        // ombra lato scuro
        ctx.strokeStyle = "#3a1404"; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(rx0, ry0); ctx.lineTo(rx1, ry1); ctx.stroke();
        // corpo quercia medio
        ctx.strokeStyle = "#b07030"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(rx0, ry0); ctx.lineTo(rx1, ry1); ctx.stroke();
        // fascia luce
        ctx.strokeStyle = "#d8983c"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(rx0, ry0); ctx.lineTo(rx1, ry1); ctx.stroke();
        // venatura centrale luminosa
        ctx.strokeStyle = "#f0c060"; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(rx0, ry0); ctx.lineTo(rx1, ry1); ctx.stroke();
    }

    // mozzo tornito in legno scuro
    ctx.fillStyle = "#5a2408"; ctx.beginPath(); ctx.arc(wx, wy, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#9a5018"; ctx.beginPath(); ctx.arc(wx, wy,  8, 0, Math.PI*2); ctx.fill();
    // bullone metallico centrale
    ctx.fillStyle = "#999";   ctx.beginPath(); ctx.arc(wx, wy,  3,   0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ddd";   ctx.beginPath(); ctx.arc(wx, wy,  1.5, 0, Math.PI*2); ctx.fill();

    // cerchione esterno sopra tutto (bordo netto)
    ctx.strokeStyle = "#552200"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(wx, wy, WHEEL_R + 1, 0, Math.PI * 2); ctx.stroke();
}



window.addEventListener('resize', resizeCanvas);
resizeCanvas();

updateLaneGeometry();
createRace();
updateUI();

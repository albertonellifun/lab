<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FEBBRE DA CAVALLO</title>
<style>
body{
    background:#1c1c1c;
    color:white;
    font-family:Arial;
    text-align:center;
    font-size:16px;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
	overflow: hidden;
}
h1 { 
	margin:0; 
	padding: 0; 
}
canvas{
    background:#4a4;
    border:4px solid white;
}
button{
    padding:8px;
    margin:4px;
    cursor:pointer;
    display:inline-block;
}
#ui, #laneCount{
    margin-left:20px;
}
#controls {
	display: flex;
    justify-content: space-between;
    align-items: center;
}
</style>
</head>
<body>
<h1>🏇🐎 FEBBRE DA CAVALLO 🏇🐎</h1>
<canvas id="game" width="1000" height="400"></canvas>
<div id="controls">
	<span id="bets"></span>
	<button id="startRace" onclick="startRace()" disabled>🐎 VAIII!!!</button>
	<span id="ui">VITE:<span id="lives">💰💰💰💰💰</span></span>

	<span id="laneCount">CORSIE: 4</span>
	<button onclick="changeLanes(-1)">➖</button>
	<button onclick="changeLanes(1)">➕</button>
</div>
<script>
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var lanes = 4;

var finishX = 900;
var GRASS_HEIGHT = 10 + 80/lanes;
var LANE_HEIGHT = (canvas.height - (2 * GRASS_HEIGHT)) / lanes;


var horses = [];
var selectedBetLane = null;
var lives = 5;
var racing = false;

var colors = [
    "#663311",
    "#443322",
    "#996633",
    "#332211",
	"#662200",
	
    "#222222",
    "#dddddd",
    "#eeddcc",
    "#ccaa44",
	
	"#ffffaa",
	"#eeeedd"
];
/* mane/tail dark color per ogni colore corpo */
var maneColors = [
    "#221100",
	"#221100",
	"#663322",
	"#111100",
	"#000000",
    
	"#000000",
	"#888888",
	"#bb9977",
	"#886600",
	
	"#221100",
	"#663322"
];

var horseNames = [
	//MANDRAKE
    {name:"Soldatino",            maxSpeed:0.75, stamina:70},
    {name:"King",                 maxSpeed:0.75, stamina:75},
    {name:"D'Artagnan",           maxSpeed:0.75, stamina:70},
    {name:"Bernadette",           maxSpeed:0.80, stamina:80},
    {name:"Come Va Va",           maxSpeed:0.80, stamina:80},
    {name:"Parsifal",             maxSpeed:0.75, stamina:75},
    {name:"Granduca",             maxSpeed:0.70, stamina:70},
    {name:"Trinchetto",           maxSpeed:0.75, stamina:75},
    {name:"Black Star",           maxSpeed:0.70, stamina:80},
    {name:"Piripicchio",          maxSpeed:0.85, stamina:85},
    {name:"Uragano",              maxSpeed:0.90, stamina:80},
    {name:"Apocalisse",           maxSpeed:0.85, stamina:85},
    {name:"Mon Amour",            maxSpeed:0.65, stamina:75},
    {name:"Antonello da Messina", maxSpeed:0.75, stamina:80},
    {name:"Marco Polo",           maxSpeed:0.85, stamina:85},
	//ASSO
	{name:"Lumacone",             maxSpeed:0.70, stamina:90},
	{name:"Tartaruga",            maxSpeed:0.70, stamina:70},
	{name:"Impetuoso",            maxSpeed:0.70, stamina:70},
	{name:"Ermellino",            maxSpeed:0.70, stamina:70},
	{name:"Corsaro",              maxSpeed:0.70, stamina:70},
	{name:"Hannover",             maxSpeed:0.70, stamina:70},
	{name:"Sinclair",             maxSpeed:0.70, stamina:70},
	//ALTRI
	{name:"Eclisse",	          maxSpeed:0.70, stamina:90},
	{name:"Robin Hood",           maxSpeed:0.70, stamina:70},
    {name:"Maria Antonietta",     maxSpeed:0.70, stamina:70},
    {name:"Royal Flash",          maxSpeed:0.70, stamina:70},
    {name:"Bingo Bongo",          maxSpeed:0.70, stamina:70},
    {name:"Jolly Blue",           maxSpeed:0.70, stamina:70},
    {name:"Charlotte",            maxSpeed:0.70, stamina:70},
    {name:"O Sole Mio",           maxSpeed:0.70, stamina:70},
    {name:"Furfante",             maxSpeed:0.70, stamina:70},
    {name:"Caligola",             maxSpeed:0.70, stamina:70},
    {name:"Brigantello",          maxSpeed:0.70, stamina:70},
    {name:"Paganini",             maxSpeed:0.70, stamina:70},
    {name:"Pendolino",            maxSpeed:0.70, stamina:70},
    {name:"Arma Letale",          maxSpeed:0.70, stamina:70},
    {name:"Cleopatra",            maxSpeed:0.70, stamina:70},
    {name:"Rombo di Tuono",       maxSpeed:0.70, stamina:70},
    {name:"Lucifero",             maxSpeed:0.70, stamina:70},
	{name:"Pelandrone",           maxSpeed:0.70, stamina:70},
	{name:"Lolita", 	          maxSpeed:0.70, stamina:70},
	{name:"Gianduiotto",          maxSpeed:0.70, stamina:70},
];

function initDirtParticles() {
	dirtParticles = [];//potrebbero essere state create precedentemente con coordinate sballate
	for (let i = 0; i < 1000; i++) {
        dirtParticles.push({
            x: Math.random() * canvas.width,
            y: GRASS_HEIGHT + Math.random() * (canvas.height - GRASS_HEIGHT * 2),
            size: Math.random() * 2 + 1
        });
    }
}

function updateLaneGeometry() {
    GRASS_HEIGHT = 10 + 80 / lanes;
    LANE_HEIGHT = (canvas.height - (2 * GRASS_HEIGHT)) / lanes;
	initDirtParticles();
}

function changeLanes(delta) {
    if (racing) return; // blocca durante gara
    lanes += delta;
    if (lanes < 2) lanes = 2;
    if (lanes > 20) lanes = 20;
    updateLaneGeometry();
    selectedBetLane = null;
    stopRace = false;
    document.getElementById("laneCount").innerHTML = "CORSIE: " + lanes;
    createRace();
}


function createRace() {
    horses = [];
    for (var i = 0; i < lanes; i++) {
        var prob = Math.random();
        var rndHorse = horseNames[Math.floor(Math.random() * horseNames.length)];
        if (horses.some(h => h.name === rndHorse.name)) { i--; continue; }
        var id = getHorseNumber(rndHorse.name);
        var colIdx = id % colors.length;
		
        horses.push({
            name: rndHorse.name,
            id: id,
            x: 20,
            lane: i,
            maxSpeed: rndHorse.maxSpeed + prob,
            speed: 0,
            accel: 0.04 + prob * 0.05,
            stamina: rndHorse.stamina + Math.random() * 20,
            staminaDrain: 0.20 + Math.random() * 0.1,
            recovery: 0.05,
            anim: Math.random() * Math.PI * 2,
            color: colors[colIdx],
            maneColor: maneColors[colIdx],
            jockeyColor: "hsl(" + Math.floor(Math.random()*360) + ",80%,50%)"//fantino
        });
    }
    drawTrack();
    drawHorses();
    createBetButtons();
}

function getHorseNumber(nome) {
    let hash = 0;
    for (let i = 0; i < nome.length; i++) hash += nome.charCodeAt(i) * (i + 1);
    return hash % 100;
}

function createBetButtons() {
    var div = document.getElementById("bets");
    div.innerHTML = "<span>SCOMMETTI SU:</span>";
    document.getElementById("startRace").disabled = true;
    for (var i = 0; i < horses.length; i++) {
        (function(index) {
            var b = document.createElement("button");
            b.innerHTML = horses[index].id + ' ' + horses[index].name;
            b.onclick = function() {
                if (!racing) {
                    selectedBetLane = index;
                    document.getElementById("startRace").disabled = false;
                }
            };
            div.appendChild(b);
        })(i);
    }
}

function startRace() {
    if (racing) return;
    if (selectedBetLane === null) return;
    if (lives <= 0) return;
    lives--;
    updateUI();
    racing = true;
    loop();
}

let stopRace = false;
function loop() {
    if (!racing) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTrack();
    updateHorses();
    drawHorses();
    updateAndDrawConfetti();
    if (!stopRace) {
        let winner = checkWinner();
        if (winner !== null) {
            var winHorse = horses[winner];
            spawnConfetti(winHorse.x, LANE_HEIGHT * winHorse.lane + LANE_HEIGHT / 2);
            stopRace = true;
            setTimeout(function() { finishRace(winner); }, 10000);
        }
    }
    requestAnimationFrame(loop);
}

var confetti = [];
var showConfetti = false;
function spawnConfetti(x, y) {
    for (let i = 0; i < 200; i++) {
        confetti.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 1.5) * 8,
            size: Math.random() * 3 + 1,
            color: "hsl(" + Math.random() * 360 + ",100%,50%)",
            life: 60 + Math.random() * 30
        });
    }
    showConfetti = true;
}
function updateAndDrawConfetti() {
    if (!showConfetti) return;
    for (let i = 0; i < confetti.length; i++) {
        let c = confetti[i];
        c.vy += 0.3; c.x += c.vx; c.y += c.vy; c.life--;
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.size, c.size);
    }
    confetti = confetti.filter(c => c.life > 0);
    if (confetti.length === 0) showConfetti = false;
}

function checkWinner() {
    for (var i = 0; i < horses.length; i++)
        if (horses[i].x >= finishX) return i;
    return null;
}

function updateHorses() {
    for (var i = 0; i < horses.length; i++) {
        var h = horses[i];
        var raceProgress = h.x / finishX;
        var targetSpeed;
        if (raceProgress < 0.15)      targetSpeed = h.maxSpeed * 0.9 + Math.random() * 0.3;
        else if (raceProgress < 0.75) targetSpeed = h.maxSpeed * 0.7;
        else                          targetSpeed = h.maxSpeed * 1.1;
        var effort = h.speed / h.maxSpeed;
        h.stamina -= effort * 0.6;
        h.stamina += 0.15;
        if (h.stamina < 0) h.stamina = 0;
        if (h.stamina > 100) h.stamina = 100;
        var staminaFactor = 0.5 + (h.stamina / 100);
        targetSpeed *= staminaFactor;
        h.speed += (targetSpeed - h.speed) * 0.05;
        h.speed += (Math.random() - 0.5) * 0.15;
        if (raceProgress > 0.80 && h.stamina < 10) h.speed *= 0.90;
        else if (raceProgress > 0.50 && h.stamina < 20) h.speed *= 0.95;
        if (h.speed < 0.2) h.speed = 0.2;
        h.x += h.speed;
        h.anim += h.speed * 0.35;
    }
}

/* =====================================================
   TRACK
===================================================== */
let trackOffset = 0;
let dirtParticles = [];

function drawTrack() {
    ctx.fillStyle = "#2e7d32";
    ctx.fillRect(0, 0, canvas.width, GRASS_HEIGHT);//erba/siepe sopra
    ctx.fillRect(0, canvas.height - GRASS_HEIGHT, canvas.width, GRASS_HEIGHT);//erba/siepe sotto
	
    ctx.fillStyle = "#caa472";
    ctx.fillRect(0, GRASS_HEIGHT, canvas.width, canvas.height - GRASS_HEIGHT * 2);//terra marrone
	
    var avgSpeed = 0;
    for (var i = 0; i < horses.length; i++) avgSpeed += horses[i].speed;
    trackOffset += avgSpeed * 0.5;
	
    for (let i = 0; i < 8; i++) {
        dirtParticles.push({
            x: canvas.width,
            y: GRASS_HEIGHT + Math.random() * (canvas.height - GRASS_HEIGHT * 2),
            size: Math.random() * 2 + 1
        });
    }
    for (let i = 0; i < dirtParticles.length; i++) {
        let p = dirtParticles[i];
        p.x -= avgSpeed * 2;
        ctx.fillStyle = "#b89560";
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    dirtParticles = dirtParticles.filter(p => p.x > 0);
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    
	//corsie tratteggiate
	ctx.setLineDash([8, 12]);
    ctx.lineDashOffset = -trackOffset;
    for (var i = 0; i <= lanes; i++) {
        ctx.beginPath();
        ctx.moveTo(0, GRASS_HEIGHT + i * LANE_HEIGHT);
        ctx.lineTo(canvas.width, GRASS_HEIGHT + i * LANE_HEIGHT);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;
	
	//traguardo a scacchi
    let tile = 5;
    for (let y = GRASS_HEIGHT; y < canvas.height - GRASS_HEIGHT; y += tile) {
        for (let x = 0; x < 10; x += tile) {
            ctx.fillStyle = (Math.floor(y/tile) + Math.floor(x/tile)) % 2 === 0 ? "#fff" : "#000";
            ctx.fillRect(finishX + x, y, tile, tile);
        }
    }
	
    let rx = canvas.width - 5;
    for (let i = 0; i < horses.length; i++) {
        ctx.textAlign = "right";
        let ry = GRASS_HEIGHT + LANE_HEIGHT * horses[i].lane + LANE_HEIGHT / 2;
        ctx.font = "9px Arial";
		ctx.fillStyle = '#000';
		ctx.fillText(horses[i].name, rx, ry);
		
		ctx.font = "7px Arial";
		ctx.fillStyle = '#fff';
        ctx.fillText('X='+horses[i].x.toFixed(0)+' SPD=' + horses[i].speed.toFixed(1)+' STAM=' + horses[i].stamina.toFixed(0), rx, ry + 10);
    }
}

/* =====================================================
   FINISH
===================================================== */
function finishRace(winner) {
    racing = false;
    if (winner === selectedBetLane) {
        lives += (lanes-1);
    } else {
        lives--;
        if (lives <= 0) {
            alert("GAME OVER");
            location.reload();
        }
    }
    alert(horses[winner].name + " ha VINTO! 🏆");
    stopRace = false;
    selectedBetLane = null;
    updateUI();
    createRace();
}

function updateUI() {
    let tmp = "";
    for (let i = 0; i < lives; i++) tmp += "💰";
    document.getElementById("lives").innerHTML = tmp;
}

/* =====================================================
   DRAW HORSE — silhouette anatomica realistica
   pivot: centro corsia, il muso punta a destra
===================================================== */
function drawHorses() {
    for (var i = 0; i < horses.length; i++) drawHorse(horses[i]);
}

function drawHorse(h) {
    var t = h.anim;

    /* scala per stare nella corsia (alt corsia ~70px, cavallo ~55px alto) */
    var S = 3/horses.length;//1c = 2..3, 2c = 1..1.5, 4c = 0.7, 6c = 0.5
	
	var cx = h.x - 60*S;
    var cy = LANE_HEIGHT * h.lane + LANE_HEIGHT / 2 + GRASS_HEIGHT/2;//un po in alto

	
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(S, S);

    /* bounce verticale del galoppo */
    var bounce = Math.sin(t * 2) * 3;
    ctx.translate(0, bounce);

    var bodyColor  = h.color;
    var maneColor  = h.maneColor;
    var hoofColor  = "#1a1a1a";
    var skinColor  = h.color;

    /* -------------------------------------------------------
       OMBRE / PROFONDITÀ
    ------------------------------------------------------- */
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur  = 4;

    /* -------------------------------------------------------
       CORPO principale
       centro ~(0,0), lunghezza ~120, altezza ~45
    ------------------------------------------------------- */
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    /* groppa (sinistra, coda) */
    ctx.moveTo(-58, -8);
    /* schiena arcuata */
    ctx.bezierCurveTo(-40, -28, 20, -30, 50, -22);
    /* garrese → collo */
    ctx.bezierCurveTo(60, -18, 65, -10, 60, 0);
    /* petto */
    ctx.bezierCurveTo(62, 8, 55, 16, 45, 18);
    /* pancia */
    ctx.bezierCurveTo(20, 22, -30, 22, -55, 14);
    /* anca */
    ctx.bezierCurveTo(-60, 10, -62, 2, -58, -8);
    ctx.closePath();
    ctx.fill();

    /* -------------------------------------------------------
       MUSCOLO COSCIA posteriore
    ------------------------------------------------------- */
    ctx.beginPath();
    ctx.ellipse(-45, 8, 18, 14, 0.3, 0, Math.PI * 2);
    ctx.fillStyle = shadeColor(bodyColor, -15);
    ctx.fill();

    /* -------------------------------------------------------
       COLLO
    ------------------------------------------------------- */
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(48, -20);
    ctx.bezierCurveTo(58, -40, 72, -50, 78, -42);
    ctx.bezierCurveTo(82, -35, 75, -18, 60, -5);
    ctx.bezierCurveTo(55, -2, 50, -6, 48, -20);
    ctx.closePath();
    ctx.fill();

    /* -------------------------------------------------------
       TESTA
    ------------------------------------------------------- */
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    /* attacco collo */
    ctx.moveTo(74, -44);
    /* fronte */
    ctx.bezierCurveTo(80, -60, 100, -62, 106, -52);
    /* muso */
    ctx.bezierCurveTo(112, -44, 112, -34, 108, -28);
    /* froge / labbra */
    ctx.bezierCurveTo(104, -22, 96, -20, 90, -22);
    /* mandibola */
    ctx.bezierCurveTo(82, -24, 72, -32, 74, -44);
    ctx.closePath();
    ctx.fill();

    
    /* -------------------------------------------------------
       OCCHIO
    ------------------------------------------------------- */
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.ellipse(98, -48, 4, 3, -0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(100, -49, 1.2, 0, Math.PI * 2);
    ctx.fill();

    /* -------------------------------------------------------
       CRINIERA
    ------------------------------------------------------- */
    ctx.fillStyle = maneColor;
	/* criniera sul collo */
	ctx.beginPath();
	ctx.moveTo(78, -53);
	ctx.bezierCurveTo(67, -61, 57, -57, 52, -47);
	ctx.bezierCurveTo(57, -51, 64, -57, 70, -49);
	ctx.bezierCurveTo(64, -55, 60, -47, 54, -37);
	ctx.lineTo(62, -14);
	ctx.bezierCurveTo(68, -27, 72, -41, 78, -53);
	ctx.closePath();
	ctx.fill();
    /* ciuffo frontale */
    ctx.beginPath();
    ctx.moveTo(82, -62);
    ctx.bezierCurveTo(88, -72, 94, -68, 92, -58);
    ctx.bezierCurveTo(86, -64, 84, -60, 82, -62);
    ctx.fill();

    /* -------------------------------------------------------
       CODA
    ------------------------------------------------------- */
    var tailSwing = Math.sin(t * 1.5) * 10;
	var tailSwing2 = Math.sin(t * 1.5 + 0.8) * 8;
	var tailSwing3 = Math.sin(t * 1.5 + 1.6) * 6;
	ctx.fillStyle = maneColor;

	/* ciocca principale */
	ctx.beginPath();
	ctx.moveTo(-62, -8);
	ctx.bezierCurveTo(-68, 5 + tailSwing, -80, 20 + tailSwing, -72, 40 + tailSwing);
	ctx.bezierCurveTo(-70, 44 + tailSwing, -67, 42 + tailSwing, -66, 38 + tailSwing);
	ctx.bezierCurveTo(-72, 18 + tailSwing, -62, 4 + tailSwing, -58, -6);
	ctx.closePath();
	ctx.fill();

	/* ciocca sinistra */
	ctx.beginPath();
	ctx.moveTo(-64, -4);
	ctx.bezierCurveTo(-76, 8 + tailSwing2, -88, 22 + tailSwing2, -78, 44 + tailSwing2);
	ctx.bezierCurveTo(-76, 48 + tailSwing2, -73, 46 + tailSwing2, -72, 42 + tailSwing2);
	ctx.bezierCurveTo(-80, 22 + tailSwing2, -70, 8 + tailSwing2, -60, -2);
	ctx.closePath();
	ctx.fill();

	/* ciocca destra / corta */
	ctx.beginPath();
	ctx.moveTo(-60, -6);
	ctx.bezierCurveTo(-64, 6 + tailSwing3, -70, 18 + tailSwing3, -62, 32 + tailSwing3);
	ctx.bezierCurveTo(-60, 36 + tailSwing3, -57, 34 + tailSwing3, -57, 30 + tailSwing3);
	ctx.bezierCurveTo(-63, 18 + tailSwing3, -58, 6 + tailSwing3, -56, -4);
	ctx.closePath();
	ctx.fill();
    /* -------------------------------------------------------
       GAMBE — galoppo a 4 tempi
       Le 4 gambe: FL front-left(vicina), FR front-right(lontana)
                   BL back-left(vicina),  BR back-right(lontana)
       "lontane" = più scure, disegnate prima
    ------------------------------------------------------- */
    /* angoli galoppo */
	var FL = Math.sin(t);
	var FR = Math.sin(t + Math.PI);
	var BL = Math.sin(t + Math.PI/2);
	var BR = Math.sin(t + 3*Math.PI/2);

    /* gamba lontana posteriore */
    drawLeg(ctx, -38, 20, BL, shadeColor(bodyColor, -25), hoofColor, true);
    /* gamba lontana anteriore */
    drawLeg(ctx,  38, 18, FR, shadeColor(bodyColor, -25), hoofColor, false);
    /* gamba vicina posteriore */
    drawLeg(ctx, -40, 20, BR, bodyColor, hoofColor, true);
    /* gamba vicina anteriore */
    drawLeg(ctx,  46, 18, FL, bodyColor, hoofColor, false);

    ctx.shadowBlur = 0;

	//sella
	drawSaddle(ctx, t, h);

    /* -------------------------------------------------------
       FANTINO (silhouette semplice)
    ------------------------------------------------------- */
	drawReins(ctx, t, h.jockeyColor);//redini/briglie
    var jockeyBounce = Math.sin(t * 2) * 2;
    drawJockey(ctx, 20, -30 + jockeyBounce, h.jockeyColor);

    ctx.restore();
}

function drawSaddle(ctx, t, h) {
    let bounce = Math.sin(t * 2) * 1.5;
    let roll   = Math.sin(t * 2) * 0.04;

    ctx.save();
    ctx.translate(10, -26 + bounce);
    ctx.rotate(roll);

    // --- QUARTIERE (flap laterale) ---
    ctx.fillStyle = "#5c2800";
    ctx.beginPath();
    ctx.moveTo(-14, -8);
    ctx.bezierCurveTo(-18, 8, -16, 22, -10, 26);
    ctx.bezierCurveTo(-4, 30, 8, 30, 14, 26);
    ctx.bezierCurveTo(20, 22, 20, 8, 16, -8);
    ctx.closePath();
    ctx.fill();

    // --- PANNELLO (imbottitura sotto) ---
    ctx.fillStyle = "#3d1a00";
    ctx.beginPath();
    ctx.moveTo(-10, 10);
    ctx.bezierCurveTo(-14, 18, -12, 28, -6, 30);
    ctx.bezierCurveTo(0, 32, 8, 32, 12, 29);
    ctx.bezierCurveTo(17, 26, 16, 16, 12, 10);
    ctx.closePath();
    ctx.fill();

    // --- ARCIONE POSTERIORE (cantle) ---
    ctx.fillStyle = "#6b3010";
    ctx.beginPath();
    ctx.moveTo(-15, 2);
    ctx.bezierCurveTo(-20, -4, -18, -14, -10, -16);
    ctx.bezierCurveTo(-5, -18, 2, -16, 4, -10);
    ctx.bezierCurveTo(5, -5, 2, 0, -2, 2);
    ctx.closePath();
    ctx.fill();
    // bordo highlight arcione post.
    ctx.strokeStyle = "#8b4820";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-15, 2);
    ctx.bezierCurveTo(-20, -4, -18, -14, -10, -16);
    ctx.bezierCurveTo(-5, -18, 2, -16, 4, -10);
    ctx.stroke();

    // --- SEDE (seat) — parte su cui siede il fantino ---
    ctx.fillStyle = "#7a3812";
    ctx.beginPath();
    ctx.moveTo(-2, 2);
    ctx.bezierCurveTo(2, -8, 14, -10, 18, -4);
    ctx.bezierCurveTo(21, 0, 18, 6, 14, 8);
    ctx.bezierCurveTo(8, 10, -2, 8, -2, 2);
    ctx.closePath();
    ctx.fill();
    // texture/ombra sulla sede
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath();
    ctx.ellipse(8, 2, 9, 4, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // --- ARCIONE ANTERIORE (pommel) ---
    ctx.fillStyle = "#6b3010";
    ctx.beginPath();
    ctx.moveTo(14, 8);
    ctx.bezierCurveTo(22, 4, 26, -6, 20, -12);
    ctx.bezierCurveTo(16, -16, 10, -14, 8, -8);
    ctx.bezierCurveTo(7, -3, 10, 3, 14, 8);
    ctx.closePath();
    ctx.fill();
    // bordo highlight arcione ant.
    ctx.strokeStyle = "#8b4820";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(14, 8);
    ctx.bezierCurveTo(22, 4, 26, -6, 20, -12);
    ctx.bezierCurveTo(16, -16, 10, -14, 8, -8);
    ctx.stroke();

    // --- CINGHIA (girth strap) ---
    ctx.strokeStyle = "#2a1000";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-4, 28);
    ctx.bezierCurveTo(-2, 22, 4, 18, 6, 28);
    ctx.stroke();
    // fibbia
    ctx.fillStyle = "#aaa";
    ctx.fillRect(5, 23, 4, 3);

    // --- STAFFA (stirrup) ---
    let stirrupSwing = Math.sin(t * 2) * 4;
    ctx.save();
    ctx.translate(4, 30);
    ctx.rotate(stirrupSwing * 0.04);
    // correggia
    ctx.strokeStyle = "#2a1000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 10);
    ctx.stroke();
    // ferro della staffa
    ctx.strokeStyle = "#888";
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(-5, 10);
    ctx.lineTo(-5, 14);
    ctx.lineTo(5, 14);
    ctx.lineTo(5, 10);
    ctx.stroke();
    ctx.restore();
	
	
	/* -------------------------------------------------------
    NUMERO sul fianco
    ------------------------------------------------------- */
    ctx.shadowBlur = 0;
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = selectedBetLane === h.lane ? '#ff0' : '#aaa';
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.strokeText(h.id, 3, 20);
    ctx.fillText(h.id, 3, 20);

    ctx.restore();
}

/* -------------------------------------------------------
   GAMBA: anca → ginocchio → stinco → zoccolo
   isBack: posteriore (angolazione diversa)
------------------------------------------------------- */
function drawLeg(ctx, sx, sy, phase, bodyCol, hoofCol, isBack) {
    var liftAngle  = phase * 0.6;          /* oscillazione coscia */
    var kneeAngle  = Math.abs(phase) * 0.7; /* piega ginocchio */

    var thighLen = 18;
    var shinLen  = 16;
    var hoofH    = 5;

    var baseAngle = isBack ? 0.15 : -0.05;

    var thighAngle = baseAngle + liftAngle * 0.6;
    var tx = sx + Math.sin(thighAngle) * thighLen;
    var ty = sy + Math.cos(thighAngle) * thighLen;

    var kneeDir = isBack ? -1 : 1;
    var shinAngle = thighAngle + kneeDir * kneeAngle * 0.8;
    var kx = tx + Math.sin(shinAngle) * shinLen;
    var ky = ty + Math.cos(shinAngle) * shinLen;

    /* coscia */
    ctx.strokeStyle = bodyCol;
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    /* stinco */
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(kx, ky);
    ctx.stroke();

    /* zoccolo */
    ctx.fillStyle = hoofCol;
    ctx.beginPath();
    ctx.ellipse(kx, ky + hoofH * 0.5, 5, hoofH * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
}

//briglie/redini
function drawReins(ctx, t, jockeyColor) {
    // Punto di attacco alla bocca del cavallo (morso)
    var mouthX = 104;
    var mouthY = -30;

    // Mani del fantino (approssimativamente)
    var handX = 28;
    var handY = -38;

    // Oscillazione morbida con il galoppo
    var sway = Math.sin(t * 2) * 2;

    // Redine sinistra (vicina)
    ctx.strokeStyle = "#1a0a00";
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(mouthX, mouthY);
    ctx.bezierCurveTo(
        80, mouthY + 10 + sway,
        50, handY - 5 + sway,
        handX, handY
    );
    ctx.stroke();

    // Morso (piccolo rettangolo metallico agli angoli della bocca)
    ctx.fillStyle = "#aaaaaa";
    ctx.beginPath();
    ctx.ellipse(mouthX - 2, mouthY, 3, 2, 0.3, 0, Math.PI * 2);
    ctx.fill();
}

/* -------------------------------------------------------
   FANTINO semplice
------------------------------------------------------- */
function drawJockey(ctx, x, y, col) {
    /* corpo */
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x - 8, y - 5, x - 10, y - 18, x - 2, y - 22);
    ctx.bezierCurveTo(x + 6, y - 26, x + 10, y - 20, x + 8, y - 10);
    ctx.bezierCurveTo(x + 6, y - 4, x + 4, y, x, y);
    ctx.closePath();
    ctx.fill();

    /* testa */
    ctx.fillStyle = "#f0c080";
    ctx.beginPath();
    ctx.arc(x + 2, y - 26, 6, 0, Math.PI * 2);
    ctx.fill();

    /* caschetto */
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(x + 2, y - 30, 8, Math.PI, 0);
    ctx.fill();

    /* visiera */
    ctx.fillStyle = shadeColor(col, -30);
    ctx.fillRect(x - 5, y - 30, 16, 3);

    /* frustino */
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 8, y - 10);
    ctx.lineTo(x + 25, y - 2);
    ctx.stroke();
}

/* utility: schiarisce/scurisce un colore hex */
function shadeColor(col, amt) {
    var usePound = false;
    if (col[0] === "#") { col = col.slice(1); usePound = true; }
    var num = parseInt(col, 16);
    var r = Math.min(255, Math.max(0, (num >> 16) + amt));
    var g = Math.min(255, Math.max(0, ((num >> 8) & 0xff) + amt));
    var b = Math.min(255, Math.max(0, (num & 0xff) + amt));
    return (usePound ? "#" : "") +
        ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

//INIT SUONO!
function initEngineAudio(audioCtx) {
  const CYLINDERS = 4;
  const IDLE_FREQ = 25;   // ~750 RPM
  const MAX_FREQ  = 175;  // ~5250 RPM

  // Fondamentale + armoniche dispari (suono motore a scoppio)
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc3 = audioCtx.createOscillator();
  const osc4 = audioCtx.createOscillator();
  osc1.type = 'sawtooth';
  osc2.type = 'square';
  osc3.type = 'sawtooth';
  osc4.type = 'square';

  const g1 = audioCtx.createGain(); g1.gain.value = 0.5;
  const g2 = audioCtx.createGain(); g2.gain.value = 0.3;
  const g3 = audioCtx.createGain(); g3.gain.value = 0.15;
  const g4 = audioCtx.createGain(); g4.gain.value = 0.08;
  osc1.connect(g1); osc2.connect(g2);
  osc3.connect(g3); osc4.connect(g4);

  // Modulazione AM → simula "colpi" dei cilindri
  const amOsc  = audioCtx.createOscillator();
  const amGain = audioCtx.createGain();
  amOsc.type = 'sine';
  amGain.gain.value = 0.35;
  amOsc.connect(amGain);

  // Waveshaper = distorsione soft-clip (rombo realistico)
  const ws = audioCtx.createWaveShaper();
  ws.curve = makeDistCurve(180);
  ws.oversample = '4x';

  // Filtri
  const hp  = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 60;

  const lp1 = audioCtx.createBiquadFilter();
  lp1.type = 'lowpass'; lp1.frequency.value = 1200; lp1.Q.value = 2;

  const lp2 = audioCtx.createBiquadFilter();
  lp2.type = 'lowpass'; lp2.frequency.value = 800;

  const master = audioCtx.createGain();
  master.gain.value = 0.12;

  // Catena: oscillatori → waveshaper → hp → lp1 → amGain (moltiplicatore) → lp2 → master
  const preMix = audioCtx.createGain();
  [g1,g2,g3,g4].forEach(g => g.connect(preMix));
  preMix.connect(ws);
  ws.connect(hp);
  hp.connect(lp1);
  // AM: amGain si connette al gainNode del segnale pre-lp2
  const amMod = audioCtx.createGain(); amMod.gain.value = 1;
  lp1.connect(amMod);
  amGain.connect(amMod.gain);   // modulazione in ampiezza
  amMod.connect(lp2);
  lp2.connect(master);
  master.connect(audioCtx.destination);

  [osc1,osc2,osc3,osc4,amOsc].forEach(o => o.start());
  return { osc1,osc2,osc3,osc4,amOsc,amGain,hp,lp1,lp2,master };
}

function makeDistCurve(amount) {
  const n = 256;
  const curve = new Float32Array(n);
  for (let i=0;i<n;i++) {
    const x = (i*2/n)-1;
    curve[i] = (Math.PI+amount)*x/(Math.PI+amount*Math.abs(x));
  }
  return curve;
}

//UPDATE SUONO!
function updateEngineAudio(nodes, rpm, gas, audioCtx) {
  // rpm: 0.10–1.0  |  gas: 0 o 1
  const IDLE_FREQ = 25;//circa 750rpm
  const MAX_FREQ = 230;//circa 6800rpm per ferrari ts
  const T = audioCtx.currentTime;
  const TC_PITCH = 0.06;   // costante di tempo pitch (smorzamento)
  const TC_FILT  = 0.08;
  const TC_GAIN  = 0.12;

  const f0 = IDLE_FREQ + (MAX_FREQ - IDLE_FREQ) * Math.pow(rpm, 0.8);
  //console.log('f0='+f0+' rpm='+rpm);
  nodes.osc1.frequency.setTargetAtTime(f0*1,  T, TC_PITCH);//x1
  nodes.osc2.frequency.setTargetAtTime(f0*2,  T, TC_PITCH);//x2
  nodes.osc3.frequency.setTargetAtTime(f0*3.02,  T, TC_PITCH);//x3 sporcato
  nodes.osc4.frequency.setTargetAtTime(f0*4.51,  T, TC_PITCH);//x4.5 sporcato

  // AM freq = 2× fondamentale × cilindri/2  (4 cil = 2 scoppi/giro, 12 cil = 6 scoppi/giro)
  const amFreq = f0 * 6;
  nodes.amOsc.frequency.setTargetAtTime(amFreq, T, TC_PITCH);

  // Profondità AM: più gas = più "strappato"
  const amDepth = 0.25 + gas * 0.25 + rpm * 0.15;
  nodes.amGain.gain.setTargetAtTime(amDepth, T, TC_FILT);

  // Filtro LP1: apre con gas e rpm (scoperta armoniche acute)
  const lpFreq = 300 + rpm * 900 + gas * 500;
  nodes.lp1.frequency.setTargetAtTime(lpFreq, T, TC_FILT);
  nodes.lp1.Q.value = 1.5 + gas * 2;

  // Guadagno master
  const vol = 0.08 + rpm * 0.07 + gas * 0.04;
  nodes.master.gain.setTargetAtTime(vol, T, TC_GAIN);
}

function addSegment(idx, curve, y) {
	let n = segments.length;
    let sprite = null;
    if ( idx === START_IDX || 
		(idx % 4 === 0 && (
			(idx > 200 && idx < 400) || //alberi ogni 4 seg
			(idx > 600 && idx < 800) || //frecce ogni 8 seg
			(idx > 900 && idx < 1000) || //coni ogni 2 seg
			(idx > 1200 && idx < 1500) || //bush ogni 4 seg
			(idx > 1700 && idx < 1900) || //cactus
			(idx > 2000 && idx < 2200) || //freccione ogni 8 seg
			(idx > 2300 && idx < 2400) || //tunnel
			(idx > 2500 && idx < 2700) || //palme ogni 4 seg
			(idx > 2800 && idx < 2900) //semafori ogni 4 seg
			|| Math.random() > 0.75
		) ) ){
        //crea oggetto a bordo strada
		let type = '';
        let position = 0;
		
        if (idx === START_IDX) type = 'start';
        else if (idx > 200 && idx < 400) type = 'tree';
        else if (idx > 600 && idx < 800) type = 'signlow';
		else if (idx > 900 && idx < 1000) type = 'cone';
		else if (idx > 1200 && idx < 1500) type = 'bush';
		else if (idx > 1700 && idx < 1900) type = 'cactus';
		else if (idx > 2000 && idx < 2200) type = 'signhigh';
		else if (idx > 2300 && idx < 2400) type = 'tunnel';
		else if (idx > 2500 && idx < 2700) type = 'palm';
		else if (idx > 2800 && idx < 2850) type = 'trafficlight';
        else {
			const r = Math.random();
			if (r < 0.15) type = 'tree';
			else if (r < 0.25) type = 'bush';
			else if (r < 0.45) type = 'rock';
			else if (r < 0.65) type = 'rock2';
			else if (r < 0.75) type = 'water';
			else if (r < 0.80) type = 'oil';
			else if (r < 0.90) type = 'cactus';
			else if (r < 0.92) type = 'billboard';
			else if (r < 0.94) type = 'signlow';
			else if (r < 0.96) type = 'cone';
			else if (r < 0.98) type = 'trafficlight';
			else type = 'signhigh';
		}

        if (type === 'billboard') {
            //cartelloni lontani dal bordo
            if (curve > 0) position = -1.6;
            else position = 1.6;
        } else if (type === 'signlow' || type === 'signhigh') {
			//cartelloni stradali piu vicini al bordo, esterni alle curve
            if (curve > 0) position = -1.3;
            else position = 1.3;
		} else if (type === 'start') {
            position = -1.6;//start piu lontano
        } else if (type === 'cone') {
		    position = idx % 8 === 0 ? -0.9 : 0.9;//cono alternato
		} else if (type === 'trafficlight') {
			position = idx % 8 === 0 ? -1.2 : 1.2;//semaforo alternato
		} else if (type === 'bush') {
			position = idx % 8 === 0 ? -1.4 : 1.4;//cespuglio alternato
		} else if (type === 'oil' || type === 'water') {
			position = 0.85 - Math.random() * 1.7;//olio random (-1..1)
		} else if (type === 'palm' || type === 'tree') {
            position = idx % 8 === 0 ? -1.6 : 1.6;//albero/palma lato alternato
        } else if (type === 'rock' || type === 'rock2') {
			position = Math.random() > 0.5 ? 2.2 - Math.random() : -2.2 + Math.random();//roccia esterna (-2..-1 o 1..2)
		} else if (type === 'cactus') {
			position = idx % 8 === 0 ? -1.6 : 1.6;
		} else if (type === 'tunnel') {
			position = idx % 8 === 0 ? -1.6 : 1.6;
		}

        sprite = {
            x: position,
            type: type,
			width: SPRITE_CONFIG[type].width
        };
    }

    segments.push({
        p1: {
            world: { x: 0, y: y, z: n * segL},
            screen: { x: 0, y: 0, w: 0 }
        },
        p2: {
            world: { x: 0, y: y, z: (n + 1) * segL },
            screen: { x: 0, y: 0, w: 0 }
        },
        curve: curve,
        sprite: sprite
    });
}

function initSegments() {
	for (let i = 0; i < SEGMENTS - 486; i++) {
        addSegment(i, Math.sin(i / 90) * 4, Math.cos(i / 50) * 1000);
		//console.log('i=' + i + '\ty=' + Math.cos(i / 50) * 1000);
    }
	let last = SEGMENTS - 486;
	let lastSin = Math.sin(last / 90);
	let lastCos = Math.cos(last / 50) * 1000;
	for (let i = last; i < SEGMENTS; i++) {
		addSegment(i, lastSin, lastCos);
	}
	console.log('delta= ' + (segments[0].p1.world.x - segments[SEGMENTS - 1].p1.world.x) + ' ' + (segments[0].p1.world.y - segments[SEGMENTS - 1].p1.world.y) );
}


// --- PROJECTION - il trucco e' qui: disegno trapezi per simulare il 3d
function project(p, camX, camY, camZ) {
    p.screen.scale = camD / Math.max(0.1, (p.world.z - camZ));
    p.screen.x = (1 + p.screen.scale * (p.world.x - camX)) * width * 0.5;
    p.screen.y = (1 - p.screen.scale * (p.world.y - camY)) * height * 0.5;
    p.screen.w = p.screen.scale * roadW * width * 0.5;
}

// --- BACKGROUND ---
function drawSky(offset) {
    //cielo
    let g = ctx.createLinearGradient(0, 0, 0, height * 0.5);
    g.addColorStop(0, gamePalette.skyDark);
    g.addColorStop(1, gamePalette.skyLight);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height * 0.5);
    ctx.fillStyle = gamePalette.terrain;
    ctx.fillRect(0, height * 0.5, width, height);
	
	//sole
	// si muove lentamente con lo skyOffset, ma rimane sempre in cielo
	let sunR = 32;
	let sunX = (width * 0.35 - offset * 0.01) % width;
	if (sunX < -sunR) sunX += width;
	let sunY = height * 0.25;
	

	// alone esterno (glow giallo pallido)
	let glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.6, sunX, sunY, sunR * 2.5);
	glow.addColorStop(0, 'rgba(255, 255, 120, 0.5)');
	glow.addColorStop(1, 'rgba(255, 255, 120, 0)');
	ctx.fillStyle = glow;
	ctx.beginPath();
	ctx.arc(sunX, sunY, sunR * 2.5, 0, Math.PI * 2);
	ctx.fill();

	// disco solare
	let sunGrad = ctx.createRadialGradient(sunX - sunR * 0.3, sunY - sunR * 0.3, 2, sunX, sunY, sunR);
	sunGrad.addColorStop(0, '#ff9');
	sunGrad.addColorStop(1, '#ee0');
	ctx.fillStyle = sunGrad;
	ctx.beginPath();
	ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
	ctx.fill();


    //montagne lontane -> cittareale pro loco docet!
    for (let i = -1; i < 3; i++) {
		let x = (i * width * 1.5) - (offset * 0.15 % (width * 1.5));
		ctx.fillStyle = gamePalette.mountainsDark;
        ctx.beginPath();
        ctx.moveTo(x, height * 0.5);
        ctx.lineTo(x + 150, height * 0.36);
        ctx.lineTo(x + 300, height * 0.45);
        ctx.lineTo(x + 450, height * 0.28);
        ctx.lineTo(x + 600, height * 0.5);
		ctx.lineTo(x + 750, height * 0.4);
		ctx.lineTo(x + 900, height * 0.5);
        ctx.fill();
		
		ctx.fillStyle = gamePalette.mountainsLight;
		const lw = 6;
		ctx.beginPath();
		ctx.moveTo(x + lw, height * 0.5);
		ctx.lineTo(x + 150, height * 0.36 + lw);
		ctx.lineTo(x + 120, height * 0.42 + lw);
		ctx.closePath();
		ctx.fill();
        
		ctx.beginPath();
		ctx.moveTo(x + 300 + lw, height * 0.45);
        ctx.lineTo(x + 450, height * 0.28 + lw);
		ctx.lineTo(x + 430, height * 0.33 + lw);
		ctx.closePath();
		ctx.fill();
		
		ctx.beginPath();
		ctx.moveTo(x + 600 + lw, height * 0.5);
		ctx.lineTo(x + 750, height * 0.4 + lw);
		ctx.lineTo(x + 710, height * 0.45 + lw);
		ctx.closePath();
        ctx.fill();
    }
	
	//colline vicine
    ctx.fillStyle = gamePalette.mountainsLight;
    for (let i = -1; i < 3; i++) {
        let x = (i * width * 1.2) - (offset * 0.25 % (width * 1.2));
        ctx.beginPath();
        ctx.moveTo(x, height * 0.5);
        ctx.quadraticCurveTo(x + 300, height * 0.4, x + 600, height * 0.5);
        ctx.fill();
    }
}

	ctx.beginPath();
	ctx.moveTo(x1 - w1 * 1.1, y1);

//LAPTIME
let lastSegment = 0;
let lapStart = null;
let lastLapTime = null;
let bestLapTime = null;

function update() {
	let offRoad = Math.abs(player.x) > 1;
	let normalizedSpeed = player.speed / player.maxSpeed;
	
    if (player.state === 'CRASHED') {
        player.speed *= 0.95;
        crashTimer++;
		
		if (!isMute) {
			audioCtx.resume();    // riprende
			updateEngineAudio(audioNodes, 0, 0, audioCtx);
		} else {
			audioCtx.suspend();   // pausa
		}

        if (player.speed < 1) {
            player.state = 'ALIVE';
            crashTimer = 0;
            player.x = 0;
        }
    } else {
		if (keys.up) {
			player.speed += player.accel * (1 - normalizedSpeed ) * (offRoad ? 0.2 : 1);
		}
        else if (keys.down) {
			player.speed -= player.brake * (offRoad ? 0.2 : 1);
		}
        else {
			//rallenta pian piano (friction)
			player.speed *= 0.997;
		}

        if (keys.left) { 
			player.x -= (particles.length  ? 0.03 : 0.05) * normalizedSpeed; 
			
			player.tilt += 0.01 * normalizedSpeed;
			if (player.tilt < -0.03) player.tilt = -0.03; else if (player.tilt > 0.03) player.tilt = 0.03;
		} else if (keys.right) { 
			player.x += (particles.length  ? 0.03 : 0.05) * normalizedSpeed; 
			
			player.tilt -= 0.01 * normalizedSpeed;
			if (player.tilt < -0.03) player.tilt = -0.03; else if (player.tilt > 0.03) player.tilt = 0.03;
		} else {
			player.tilt *= 0.98;//riaddrizza pian piano
		}

        // CURVA: la macchina scivola verso l'esterno proporzionalmente alla velocità
        let cur = segments[Math.floor(player.z / segL) % segments.length];
        player.x -= cur.curve * normalizedSpeed * 0.005;

        //AUDIO!
        // --- GEAR DETECTION ---
        let targetGear = player.speed === 0 ? 0 : 1;
        for (let g = 1; g < gearRatios.length; g++) {
            if (player.speed > gearRatios[g]) targetGear = g;
        }

        // CAMBIO MARCIA: imposta rpm target con drop/spike udibile
        if (targetGear !== lastGear) {
            if (targetGear > lastGear) {
                rpm = 0.25; // cambio in su: drop brusco dei giri
            } else {
                rpm = 0.95; // scalata: spike verso alto
            }
            lastGear = targetGear;
        }
        gear = targetGear;

        // RPM target basato su posizione nella marcia attuale
        let gearBottom = gearRatios[gear] || 0;
        let gearTop = gearRatios[Math.min(gear + 1, gearRatios.length - 1)] || player.maxSpeed;
        rpmTarget = Math.max(0.1, Math.min(1.0, (player.speed - gearBottom) / Math.max(1, gearTop - gearBottom)));//min 10%

        // RPM segue il target con inerzia — il drop/spike rimane udibile per ~0.3s
        rpm += (rpmTarget - rpm) * 0.08;

		if (!isMute) {
			audioCtx.resume();    // riprende
			updateEngineAudio(audioNodes, rpm, keys.up ? 1 : 0, audioCtx);
		} else {
			audioCtx.suspend();   // pausa
		}
	}
	
	
    player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed)); //inibisce la retro!
    player.z += player.speed;
	
    player.z = (player.z + trackL) % trackL;
	
	let currentSegIdx = Math.floor(player.z / segL) % segments.length;
    let cur = segments[currentSegIdx];
	
	//aggiorna palette sul traguardo
	if (lastSegment !== currentSegIdx && currentSegIdx === START_IDX) {
		initPalette();
		
		let now = performance.now();
		if (lapStart !== null) {
			lastLapTime = now - lapStart;
			if (bestLapTime === null || lastLapTime < bestLapTime) {
				bestLapTime = lastLapTime;
			}
		}
		lapStart = now;
	}
	lastSegment = currentSegIdx;
		
	
	
	
    skyOffset += cur.curve * normalizedSpeed * 10;

	//aggiorno anche il traffico!
	for (let car of trafficCars) {
		car.z = (car.z + car.speed + trackL) % trackL;
	}
}



//ai bordi -> alberi o cartelloni
function drawSprite(sprite, p) {
    let scale = p.screen.scale;
	let x = p.screen.x + (scale * sprite.x * roadW * width * 0.5);
    let y = p.screen.y;
    let w = Math.max(0, 400 * scale * (width * 0.5));
    let h = Math.max(0, 400 * scale * (width * 0.5));

    let radius = Math.max(0, w * 0.5); //OCHO: il raggio non puo essere negativo

	if (sprite.type === 'tunnel') {
		// Cavalcavia/tunnel in prospettiva
		let halfRoad = scale * roadW * width * 0.5; // metà strada in px schermo
		let pW = halfRoad * 0.15;    // spessore pilone
		let archH = h * 6; // altezza piloni
		let beamH = h;// altezza trave
		let depth = pW * 0.25;// profondità effetto 3D

		// X bordi strada
		let lx = p.screen.x - halfRoad - pW;
		let rx = p.screen.x + halfRoad + pW;
		let baseY = y;
		let topY  = y - archH;

		// PILONE SINISTRO - fianco (prospettiva destra)
		ctx.fillStyle = gamePalette.tunnelInner;
		ctx.beginPath();
		ctx.moveTo(lx + pW,         topY);
		ctx.lineTo(lx + pW + depth, topY);
		ctx.lineTo(lx + pW + depth, baseY - depth * 0.5);
		ctx.lineTo(lx + pW,         baseY);
		ctx.fill();
		// PILONE SINISTRO - faccia frontale
		ctx.fillStyle = gamePalette.tunnelFace;
		ctx.fillRect(lx, topY, pW, archH);
		ctx.strokeStyle = gamePalette.startDark;
		ctx.strokeRect(lx, topY, pW, archH);
	
		// PILONE DESTRO - fianco (prospettiva sinistra, ombra)
		ctx.fillStyle = gamePalette.tunnelInner;
		ctx.beginPath();
		ctx.moveTo(rx - pW,         topY);
		ctx.lineTo(rx - pW - depth, topY);
		ctx.lineTo(rx - pW - depth, baseY - depth * 0.5);
		ctx.lineTo(rx - pW,         baseY);
		ctx.fill();
		// PILONE DESTRO - faccia frontale
		ctx.fillStyle = gamePalette.tunnelFace;
		ctx.fillRect(rx - pW, topY, pW, archH);
		ctx.strokeStyle = gamePalette.startDark;
		ctx.strokeRect(rx - pW, topY, pW, archH);

		// TRAVE - faccia superiore (prospettiva)
		let beamX = lx + pW;
		let beamW = rx - pW - beamX;
		
		// TRAVE - faccia frontale
		ctx.fillStyle = gamePalette.tunnelFace;
		ctx.fillRect(beamX, topY, beamW, beamH);
		ctx.strokeStyle = gamePalette.startDark;
		ctx.strokeRect(beamX, topY, beamW, beamH);
		
		ctx.lineWidth = 1;
	} else if (sprite.type === 'start') {
        let poleWidth = w * 0.25;
        let barWidth = w * 16;//non mi piace!
		barWidth = roadW * scale * width * Math.abs(sprite.x);//1.6
		let quadratino = w * 0.5;//non mi piace!
		quadratino = barWidth * 0.03125; /// 32;
		let startHeight = h * 8;
		let startBarHeight = h * 2;
        //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.fillRect(x - poleWidth * 1.5, y - 4, barWidth + poleWidth * 3, h * 0.25);

        ctx.fill();
        ctx.fillStyle = gamePalette.startLight;//'#fff';
        ctx.strokeStyle = gamePalette.startDark;//'#000';
        //palo
        ctx.fillRect(x - poleWidth * 0.5, y - startHeight, poleWidth, startHeight);
        ctx.strokeRect(x - poleWidth * 0.5, y - startHeight, poleWidth, startHeight);
        //altro palo 
        ctx.fillRect(x - poleWidth * 0.5 + barWidth, y - startHeight, poleWidth, startHeight);
        ctx.strokeRect(x - poleWidth * 0.5 + barWidth, y - startHeight, poleWidth, startHeight);

        //barra orizzontale larga
        ctx.fillRect(x, y - startHeight, barWidth, h * 2);
        ctx.strokeRect(x, y - startHeight, barWidth, h * 2);
        //scacchiera
        ctx.fillStyle = gamePalette.startCheckered;//'#222';
        for (let i = 0; i < 16; i++) {
            ctx.fillRect(x + 2 * i * quadratino, y - startHeight, quadratino, h * 0.5);
            ctx.fillRect(x + 2 * i * quadratino, y - startHeight + startBarHeight/2,  quadratino, h * 0.5);
        }
        ctx.fillStyle = gamePalette.startCheckered;//'#222';
        for (let i = 0; i < 16; i++) {
            ctx.fillRect(x + (2 * i + 1) * quadratino, y - startHeight + startBarHeight/4, quadratino, h * 0.5);
            ctx.fillRect(x + (2 * i + 1) * quadratino, y - startHeight + 3*startBarHeight/4, quadratino, h * 0.5);
        }

    } else if (sprite.type === 'tree') {
        //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //tronco alto h*2

		//rosso

		ctx.arc(cx, top + boxH * 0.2, lightRadius * 1.5, Math.PI, Math.PI * 2);

		ctx.lineWidth = 4;

		ctx.lineWidth = 1;
		
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.2, lightRadius * 1.4, 0, Math.PI * 2);
		ctx.fillStyle = '#500';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+2, top + boxH * 0.2, lightRadius * 1.4, 0, Math.PI * 2);

		//giallo

		ctx.arc(cx, top + boxH * 0.5, lightRadius, 0, Math.PI * 2);

		ctx.beginPath();
		ctx.arc(cx+1, top + boxH * 0.5, lightRadius * 0.8, 0, Math.PI * 2);

		//verde

	} else if (sprite.type === 'signlow') {

        //freccione rosso
        if (sprite.x <= 0) {
            ctx.fillStyle = gamePalette.signLowForeground;//'#f00';

            ctx.lineTo(x - w * 0, y - h + 2); //alto dx
            ctx.lineTo(x + w * 0.5 - 2, y - h * 0.5); //mezzo dx
            ctx.lineTo(x - w * 0, y - 2); //basso dx
            ctx.lineTo(x - w * 0.5 + 2, y - 2); //basso sx
            ctx.lineTo(x - w * 0 - 2, y - h * 0.5); //mezzo sx
        } else {
            ctx.fillStyle = gamePalette.signLowForeground;//'#f00';
            ctx.strokeStyle = gamePalette.signLowForegroundBorder;//'#b00';

            ctx.moveTo(x + w * 0.5 - 2, y - h + 2); //alto dx
            ctx.lineTo(x + w * 0, y - h + 2); //alto sx
            ctx.lineTo(x - w * 0.5 + 2, y - h * 0.5); //mezzo sx
            ctx.lineTo(x + w * 0, y - 2); //basso sx
            ctx.lineTo(x + w * 0.5 - 2, y - 2); //basso dx
            ctx.lineTo(x + w * 0 + 2, y - h * 0.5); //mezzo sx
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } else if (sprite.type === 'signhigh') {
	    //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

		//palo
		ctx.fillStyle = gamePalette.signHighPole;
		ctx.fillRect(x - w * 0.05, y - h * 2.1, w * 0.1, h * 2.1);

        //cartellone
        ctx.fillStyle = gamePalette.signHighBackground;
        ctx.fillRect(x - w * 0.5, y - h*2, w, h);
        ctx.strokeStyle = gamePalette.signHighBorder;
        ctx.strokeRect(x - w * 0.5, y - h*2, w, h);

        //freccione rosso
        if (sprite.x <= 0) {
            ctx.fillStyle = gamePalette.signHighForeground;
            ctx.strokeStyle = gamePalette.signHighForegroundBorder;
            ctx.beginPath();
            ctx.moveTo(x - w * 0.5 + 2, y - h*2 + 2); //alto sx
            ctx.lineTo(x - w * 0, y - h*2 + 2); //alto dx
            ctx.lineTo(x + w * 0.5 - 2, y - h*1.5); //mezzo dx
            ctx.lineTo(x - w * 0, y - h - 2); //basso dx
            ctx.lineTo(x - w * 0.5 + 2, y - h - 2); //basso sx
            ctx.lineTo(x - w * 0 - 2, y - h*1.5); //mezzo sx
        } else {
            ctx.fillStyle = gamePalette.signHighForeground;
            ctx.strokeStyle = gamePalette.signHighForegroundBorder;
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5 - 2, y - h*2 + 2); //alto dx
            ctx.lineTo(x + w * 0, y - h*2 + 2); //alto sx
            ctx.lineTo(x - w * 0.5 + 2, y - h*1.5); //mezzo sx
            ctx.lineTo(x + w * 0, y - h - 2); //basso sx
            ctx.lineTo(x + w * 0.5 - 2, y - h - 2); //basso dx
            ctx.lineTo(x + w * 0 + 2, y - h*1.5); //mezzo sx
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
	} else if (sprite.type === 'palm') {
		//il fusto si inclina sempre verso il centro della strada
		let lean = (sprite.x <= 0) ? 1 : -1;

		// Tip del fusto: offset orizzontale e altezza scalati con w/h
		let tipX = x + lean * w * 1.4;
		let tipY = y - h * 4;

		// Punti di controllo della curva di Bézier cubica
		let cp1x = x + lean * w * 0.2;
		let cp1y = y - h * 1.5;
		let cp2x = x + lean * w * 0.8;
		let cp2y = y - h * 2.8;

		//ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

		// Fusto - fill marrone con valore chiaro
		ctx.strokeStyle = gamePalette.palmTrunkLight;//'#853';
		ctx.lineWidth = w * 0.22;
		ctx.beginPath();
		ctx.moveTo(x, y);
		ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tipX, tipY);
		ctx.stroke();

		// Venatura del fusto (nodi, tratteggio scuro)
		ctx.strokeStyle = gamePalette.palmTrunkDark;//'#742';
		ctx.lineWidth = w * 0.1;
		//ctx.setLineDash([w * 0.15, w * 0.25]);
		ctx.beginPath();
		ctx.moveTo(x - lean * 2, y);
		ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tipX - lean * 2, tipY);
		ctx.stroke();
		//ctx.setLineDash([]);
		
		ctx.fillStyle = gamePalette.palmDark;
		ctx.beginPath();
		ctx.moveTo(tipX, tipY - h * 0.9);//su cx
		ctx.lineTo(tipX + w * 0.35, tipY - h * 0.22);
		ctx.lineTo(tipX + w * 1.8, tipY - h * 0.4);//su dx
		ctx.lineTo(tipX + w * 0.6, tipY + h * 0.05);
		ctx.lineTo(tipX + w * 1.4, tipY + h * 0.6);//giu dx
		ctx.lineTo(tipX + w * 0.2, tipY + h * 0.25);
		ctx.lineTo(tipX - w * 0.6, tipY + h * 0.8);//giu cx
		ctx.lineTo(tipX - w * 0.3, tipY + h * 0.25);
		ctx.lineTo(tipX - w * 1.4, tipY + h * 0.6);//giu sx
		ctx.lineTo(tipX - w * 0.6, tipY + h * 0.05);
		ctx.lineTo(tipX - w * 1.8, tipY - h * 0.4);//su sx
		ctx.lineTo(tipX - w * 0.25, tipY - h * 0.22);
		ctx.closePath();
		ctx.fill();
		//riflesso
		ctx.fillStyle = gamePalette.palmLight;
		ctx.beginPath();
		ctx.moveTo(tipX, tipY - h * 0.9);//su cx
		ctx.lineTo(tipX + w * 0.35, tipY - h * 0.22);
		ctx.lineTo(tipX + w * 1.8, tipY - h * 0.4);//su dx
		ctx.lineTo(tipX - w * 1.4, tipY + h * 0.6);//giu sx
		ctx.lineTo(tipX - w * 0.6, tipY + h * 0.05);
		ctx.lineTo(tipX - w * 1.8, tipY - h * 0.4);//su sx
		ctx.lineTo(tipX - w * 0.25, tipY - h * 0.22);
		ctx.closePath();
		ctx.fill();
		
		ctx.lineWidth = 1; // reset
	} else if (sprite.type === 'rock') {
		// ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 1.2, radius * 0.2, 0, 0, Math.PI * 2);
		ctx.fill();

		// corpo roccia: un poligono irregolare
		ctx.fillStyle = gamePalette.rockLower;//'#876';
		ctx.beginPath();
		ctx.moveTo(x - w * 0.5,  y);
		ctx.lineTo(x - w * 0.4,  y - h * 0.3);
		ctx.lineTo(x - w * 0.1,  y - h * 0.4);
		ctx.lineTo(x + w * 0.2,  y - h * 0.4);
		ctx.lineTo(x + w * 0.5,  y - h * 0.3);
		ctx.lineTo(x + w * 0.45, y - h * 0.2);
		ctx.lineTo(x + w * 0.5,  y);
		ctx.closePath();
		ctx.fill();

		// lato in ombra (scuro)
		ctx.fillStyle = gamePalette.rockShadow;//'#543';
		ctx.beginPath();
		ctx.moveTo(x - w * 0.4,  y - h * 0.3);
		ctx.lineTo(x + w * 0.1,  y - h * 0.2);
		ctx.lineTo(x + w * 0.45, y - h * 0.1);
		ctx.lineTo(x + w * 0.5,  y - h * 0.3);
		ctx.lineTo(x + w * 0.2,  y - h * 0.5);
		ctx.lineTo(x - w * 0.1,  y - h * 0.4);
		ctx.closePath();
		ctx.fill();

		// luce (faccia in alto a sinistra)
		ctx.fillStyle = gamePalette.rockLight;//'#a98';
		ctx.beginPath();
		ctx.moveTo(x - w * 0.1,  y - h * 0.4);
		ctx.lineTo(x + w * 0.2,  y - h * 0.5);
		ctx.lineTo(x + w * 0.1,  y - h * 0.3);
		ctx.lineTo(x - w * 0.15, y - h * 0.4);
		ctx.closePath();
		ctx.fill();

		// spigolo scuro
		ctx.strokeStyle = gamePalette.rockBorder;//'#321';
		ctx.lineWidth = 1;
		ctx.beginPath();
		ctx.moveTo(x - w * 0.5,  y);
		ctx.lineTo(x - w * 0.4,  y - h * 0.3);
		ctx.lineTo(x - w * 0.1,  y - h * 0.4);
		ctx.lineTo(x + w * 0.2,  y - h * 0.5);
		ctx.lineTo(x + w * 0.5,  y - h * 0.3);
		ctx.lineTo(x + w * 0.45, y - h * 0.2);
		ctx.lineTo(x + w * 0.5,  y);
		ctx.stroke();
		ctx.lineWidth = 1;
	} else if (sprite.type === 'billboard') {
		//billboard
		//ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 4, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //cartellone
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - w*2, y - h, w * 4, h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(x - w*2, y - h, w * 4, h);
        
		ctx.fillStyle = '#f00';
        ctx.strokeStyle = '#b00';
        ctx.beginPath();
        ctx.moveTo(x + w * 2 - 2, y - h + 2); //alto dx
        ctx.lineTo(x + w * 1, y - h + 2); //alto sx
        ctx.lineTo(x - w * 2 + 2, y - 2); //basso sx
        ctx.lineTo(x - w * 1, y - 2); //basso dx
        ctx.lineTo(x + w * 2 - 2, y - h + 2); //alto dx
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
	} else if (sprite.type === 'rock2') {
		// ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 1.4, radius * 0.22, 0, 0, Math.PI * 2);
		ctx.fill();

		// corpo principale (più frastagliato e basso)
		ctx.fillStyle = gamePalette.rockLower;//'#766';
		ctx.beginPath();
		ctx.moveTo(x - w * 0.6,  y);
		ctx.lineTo(x - w * 0.5,  y - h * 0.2);
		ctx.lineTo(x - w * 0.3,  y - h * 0.45);
		ctx.lineTo(x - w * 0.05, y - h * 0.5);
		ctx.lineTo(x + w * 0.2,  y - h * 0.4);
		ctx.lineTo(x + w * 0.45, y - h * 0.25);
		ctx.lineTo(x + w * 0.6,  y);
		ctx.closePath();
		ctx.fill();

		// faccia in ombra (destra)
		ctx.fillStyle = gamePalette.rockShadow;//'#544';
		ctx.beginPath();
		ctx.moveTo(x - w * 0.05, y - h * 0.5);
		ctx.lineTo(x + w * 0.2,  y - h * 0.4);
		ctx.lineTo(x + w * 0.45, y - h * 0.25);
		ctx.lineTo(x + w * 0.6,  y);
		ctx.lineTo(x + w * 0.1,  y - h * 0.1);
		ctx.closePath();
		ctx.fill();

		// faccia illuminata (sinistra)
		ctx.fillStyle = gamePalette.rockLight;//'#a98';
		ctx.beginPath();
		ctx.moveTo(x - w * 0.3,  y - h * 0.45);
		ctx.lineTo(x - w * 0.05, y - h * 0.5);
		ctx.lineTo(x - w * 0.15, y - h * 0.3);
		ctx.lineTo(x - w * 0.4,  y - h * 0.25);
		ctx.closePath();
		ctx.fill();

		// contorno spigoloso
		ctx.strokeStyle = gamePalette.rockBorder;//'#321';
		ctx.lineWidth = 1;
		ctx.beginPath();
		ctx.moveTo(x - w * 0.6,  y);
		ctx.lineTo(x - w * 0.5,  y - h * 0.2);
		ctx.lineTo(x - w * 0.3,  y - h * 0.45);
		ctx.lineTo(x - w * 0.05, y - h * 0.5);
		ctx.lineTo(x + w * 0.2,  y - h * 0.4);
		ctx.lineTo(x + w * 0.45, y - h * 0.25);
		ctx.lineTo(x + w * 0.6,  y);
		ctx.stroke();
	} else if (sprite.type === 'water') {
		// base acqua
		ctx.fillStyle = gamePalette.skyLight;
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 2, radius * 0.22, 0, 0, Math.PI * 2);
		ctx.fill();

		// riflesso
		ctx.fillStyle = 'rgba(255,255,255,0.25)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius, radius * 0.15, 0, 0, Math.PI * 2);
		ctx.fill();
	} else if (sprite.type === 'cactus') {
		// ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 0.8, radius * 0.15, 0, 0, Math.PI * 2);
		ctx.fill();

		let tw = w * 0.3; // spessore tronco
		let th = h * 1.8;  // altezza tronco
		let twHalf = tw * 0.5;//mezzo tronco

		// TRONCO principale
		ctx.fillStyle = gamePalette.cactusDark;
		ctx.beginPath();
		ctx.roundRect(x - twHalf, y - th, tw, th, [twHalf, twHalf, 4, 4]);
		ctx.fill();
		ctx.fillStyle = gamePalette.cactusLight;
		ctx.beginPath();
		ctx.roundRect(x - tw * 0.35, y - th + 4, tw * 0.25, th - 8, [4, 4, 2, 2]);
		ctx.fill();

		// BRACCIO SINISTRO
		let armW = tw * 0.8;//braccio width
		let armWHalf = armW * 0.5;
		let armOutH = h * 0.4;  // segmento orizzontale
		let armUpH  = h * 0.5;  // segmento verticale
		let armY    = y - th * 0.6; // quota attacco al tronco

		// orizzontale sx
		ctx.fillStyle = gamePalette.cactusDark;
		ctx.beginPath();
		ctx.roundRect(x - twHalf - armOutH, armY - armWHalf, armOutH, armW, [armWHalf, 0, 0, armWHalf]);
		ctx.fill();
		// verticale sx (sale)
		ctx.beginPath();
		ctx.roundRect(x - twHalf - armOutH,
					  armY - armWHalf - armUpH,
					  armW, armUpH + armWHalf,
					  [armWHalf, armWHalf, 0, 0]);
		ctx.fill();
		// verticale sx (luce)
		ctx.fillStyle = gamePalette.cactusLight;
		ctx.beginPath();
		ctx.roundRect(x - twHalf - armOutH + 1,
					  armY - armWHalf - armUpH + 4,
					  armW * 0.3, armUpH + armWHalf - 8,
					  [armWHalf, armWHalf, 0, 0]);
		ctx.fill();
		

		// BRACCIO DESTRO (più basso per asimmetria)
		let armY2 = y - th * 0.35;
		// orizzontale dx
		ctx.fillStyle = gamePalette.cactusDark;
		ctx.beginPath();
		ctx.roundRect(x + twHalf, armY2 - armWHalf, armOutH * 0.8, armW, [0, armWHalf, armWHalf, 0]);
		ctx.fill();
		// verticale dx
		ctx.beginPath();
		ctx.roundRect(x + tw * 0.5 + armOutH * 0.8 - armW,
					  armY2 - armWHalf - armUpH * 0.75,
					  armW, armUpH * 0.75 + armWHalf,
					  [armW * 0.5, armW * 0.5, 0, 0]);
		ctx.fill();
		ctx.lineWidth = 1;
	}	
}

//anche l'ombra ha una sua dignita'
function drawFerrariShadow(cx, cy, w, h) {
	let sw = w / 120;//scalato a 120px
	let sh = h / 120;//scalato a 120px in y
	//ombra
    ctx.fillStyle = 'rgba(0,0,0,0.5)';

	ctx.beginPath();

}
//un rettangolo rosso -> testarossa di alb spettacolare anche senza biondona al seguito
function drawFerrari(cx, cy, w, colDark, colLight) {
    let s = w / 120;//scalato a 120px
	let bounce = (Math.random() * 2) * (player.speed / player.maxSpeed) * s;
	
	//gomme
    ctx.fillStyle = '#111';
    ctx.fillRect(cx - 60 * s, cy + 34 * s + bounce + player.tilt * 50 * s, 30 * s, 10 * s);
    ctx.fillRect(cx + 60 * s, cy + 34 * s + bounce - player.tilt * 50 * s, -30 * s, 10 * s);

    //corpo principale rosso ferrari scuro+chiaro
    ctx.fillStyle = colDark; // Rosso scuro per i lati
    ctx.fillRect(cx - 60 * s, cy + bounce, 120 * s, 36 * s);
    ctx.fillStyle = colLight; // Rosso acceso sopra
    ctx.fillRect(cx - 60 * s + 2 * s, cy + bounce + 1 * s, 120 * s - 4 * s, 30 * s);

    //tetto rosso acceso
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.moveTo(cx - 40 * s, cy + bounce);//40
    ctx.lineTo(cx - 25 * s, cy - 20 * s + bounce);//25,20
    ctx.lineTo(cx + 25 * s, cy - 20 * s + bounce);
    ctx.lineTo(cx + 40 * s, cy + bounce);
    ctx.fill();
    //lunotto nero
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(cx - 40 * s, cy + bounce + 4 * s);//40
    ctx.lineTo(cx - 25 * s, cy - w/6 + bounce + 4 * s);//25,20
    ctx.lineTo(cx + 25 * s, cy - w/6 + bounce + 4 * s);
    ctx.lineTo(cx + 40 * s, cy + bounce + 4 * s);
    ctx.fill();

    //quadrozzo rosso sopra il motore
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.moveTo(cx - 15 * s, cy + bounce - 2 * s);//15
    ctx.lineTo(cx - 20 * s, cy + bounce + 3 * s);
    ctx.lineTo(cx + 20 * s, cy + bounce + 3 * s);
    ctx.lineTo(cx + 15 * s, cy + bounce - 2 * s);
    ctx.fill();

    //specchietti
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.ellipse(cx - 40 * s - 2 * s, cy + bounce - 8 * s, 5 * s, 3 * s, 0, 0, 6.28);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 40 * s + 2 * s, cy + bounce - 8 * s, 5 * s, 3 * s, 0, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.ellipse(cx - 40 * s - 1 * s, cy + bounce - 8 * s, 4 * s, 2.5 * s, 0, 0, 6.28);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 40 * s + 1 * s, cy + bounce - 8 * s, 4 * s, 2.5 * s, 0, 0, 6.28);
    ctx.fill();

    //base griglia nera
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 60 * s + 5 * s, cy + 10 * s + bounce, 120 * s - 10 * s, 16 * s);

    //fari posteriori
    ctx.fillStyle = '#500'; //rosso sotto
    ctx.fillRect(cx - 60 * s + 10 * s, cy + 16 * s + bounce, 20 * s, 6 * s);
    ctx.fillRect(cx + 60 * s - 30 * s, cy + 16 * s + bounce, 20 * s, 6 * s);
    ctx.fillStyle = '#f80'; //freccia gialla
    ctx.fillRect(cx - 60 * s + 10 * s, cy + 12 * s + bounce, 20 * s, 4 * s);
    ctx.fillRect(cx + 60 * s - 30 * s, cy + 12 * s + bounce, 20 * s, 4 * s);
    ctx.fillStyle = '#eee'; //bianco retro
    ctx.fillRect(cx - 60 * s + 30 * s, cy + 12 * s + bounce, 5 * s, 10 * s);
    ctx.fillRect(cx + 60 * s - 35 * s, cy + 12 * s + bounce, 5 * s, 10 * s);

    //linee orizzontali sopra i fari
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - 60 * s + 5 * s, cy + 12 * s + (i * 3) * s + bounce);
        ctx.lineTo(cx + 60 * s - 5 * s, cy + 12 * s + (i * 3) * s + bounce);
        ctx.stroke();
    }

    //targa
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 15 * s, cy + 28 * s + bounce, 30 * s, 6 * s);

    //stemma
    ctx.fillStyle = '#ccc';
    ctx.fillRect(cx - 3 * s, cy + 15 * s + bounce, 6 * s, 6 * s);
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 2 * s, cy + 16 * s + bounce, 4 * s, 4 * s);

    //cannoni
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 30 * s - 5 * s, cy + 32 * s + bounce,  15 * s, 6 * s);
    ctx.fillRect(cx + 30 * s + 5 * s, cy + 32 * s + bounce, -15 * s, 6 * s);
    ctx.strokeStyle = '#ccc';
    ctx.strokeRect(cx - 30 * s - 5 * s, cy + 32 * s + bounce,  15 * s, 6 * s);
    ctx.strokeRect(cx + 30 * s + 5 * s, cy + 32 * s + bounce, -15 * s, 6 * s);
}

function drawCar() {
    ctx.save();
    let cx = width * 0.5;//ferrari sempre al centro (overlay)
    let cy = height - 70;//bloccata in basso
    let w = Math.max(30, Math.abs( CAR_WIDTH * Math.cos(crashTimer * 0.25) ));

	drawFerrariShadow(cx, cy, w, CAR_WIDTH);
	
    ctx.translate(cx, cy);

    if (player.state === 'CRASHED') {
        ctx.rotate(player.x > 0 ? crashTimer * 0.25 : -crashTimer * 0.25);
    } else {
		ctx.rotate(player.tilt);
	}        

    drawFerrari(0, 0, CAR_WIDTH, '#b00', '#f00');

    ctx.restore();
	
	// Fumo dal retro
	for (let i = particles.length - 1; i >= 0; i--) {
		let p = particles[i];
		p.x += p.vx;
		p.y += p.vy;
		p.vy *= 0.98;
		p.r += 0.1;
		p.life -= 0.01;
		if (p.life <= 0) { particles.splice(i, 1); continue; }
		ctx.beginPath();
		ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
		ctx.fillStyle = `rgba(${p.gray},${p.gray},${p.gray},${p.life * 0.45})`;
		ctx.fill();
	}
}

//cambiooo
let gearStickX = 0;
let gearStickY = 0;
function drawGearStick() {
    const x = 10;
    const y = height - 60;

    const w = 80;
    const h = 50;

    // --- BASE METALLICA ---
    let grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, '#aaa');
    grad.addColorStop(0.5, '#eee');
    grad.addColorStop(1, '#888');

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    // --- SCANALATURE (H pattern) ---
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 8;

    function line(x1,y1,x2,y2){
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    // colonne
	let col1 = x + w * 0.15;
    let col2 = x + w * 0.50;
	let col3 = x + w * 0.85;

    // righe
    let r1 = y + h * 0.15;
    let r2 = y + h * 0.5;
    let r3 = y + h * 0.85;

    // verticale sinistra/destra
    line(col1, r1, col1, r3);
    line(col2, r1, col2, r3);
	line(col3, r1, col3, r3);
	
    // orizzontali
    line(col1, r2, col3, r2);//include R
	
    
    // --- POSIZIONE MARCE ---
    const gearPos = {
		0: [col2, r2],
        1: [col1, r1],
        2: [col1, r3],
        3: [col2, r1],
        4: [col2, r3],
        5: [col3, r1],
        6: [col3, r3]
    };

    let pos = gearPos[gear] || gearPos[0];
	/*let baseX = pos[0];
    let baseY = pos[1];*/
	let targetX = pos[0];
	let targetY = pos[1];
	
	let ydist = Math.abs(gearStickY - targetY);
	let xdist = Math.abs(targetX - gearStickX);
	//console.log('xd='+xdist.toFixed(2)+' yd='+ydist.toFixed(2)+' gear='+gear);
	// prima vai in verticale per meta distanza (da 1 a folle c'e' un problema: fixed!)
	if (ydist > h * 0.5 || (gear === 0 && ydist > 1)) {
		gearStickY += (targetY - gearStickY) * 0.5;
	} else {
		// poi vai in orizzontale
		gearStickX += (targetX - gearStickX) * 0.5;
		
		if (xdist < 1) {
			gearStickY += (targetY - gearStickY) * 0.5;
		}
	}
	let baseX = gearStickX;
	let baseY = gearStickY;	
	
    // pomello (palla)
    ctx.beginPath();
    ctx.arc(baseX, baseY, 12, 0, Math.PI * 2);

    let knobGrad = ctx.createRadialGradient(
        baseX - 3, baseY - 3, 2,
        baseX, baseY, 12
    );
    knobGrad.addColorStop(0, '#999');
    knobGrad.addColorStop(1, '#000');

    ctx.fillStyle = knobGrad;
    ctx.fill();
	
	ctx.lineWidth = 1;
}

//tachimetro sgargiullo!
function drawSpeedometer() {
    const cx = width - 70;
    const cy = height - 10;
    const radius = 60;

    // fondo
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 3.14, 6.28);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    
	// bordo	
	ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

	// zona rossa e' il contagiri
	ctx.lineWidth = 1 + rpmTarget * 6;
	let colGB = 255 - (255 * rpmTarget);
	ctx.strokeStyle = 'rgba(255,'+colGB+','+colGB+','+(rpmTarget*rpmTarget)+')';//rosso non trasparente!
	ctx.beginPath();
    ctx.arc(cx, cy, radius - 5, 3.14 + (3.14*(rpmTarget-0.15)), 6.28);
	ctx.stroke();	
	
    // tacche
	ctx.strokeStyle = '#fff';
	ctx.lineWidth = 3;
    for (let i = 0; i <= 6; i++) {
        let t = i / 6;
        let angle = Math.PI + t * Math.PI;

        let x1 = cx + Math.cos(angle) * (radius - 10);
        let y1 = cy + Math.sin(angle) * (radius - 10);

        let x2 = cx + Math.cos(angle) * radius;
        let y2 = cy + Math.sin(angle) * radius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // LANCETTA VELOCITA
    let t = player.speed / (player.maxSpeed + 60);
    let angle = Math.PI + t * Math.PI;

    let nx = cx + Math.cos(angle) * (radius - 15);
    let ny = cy + Math.sin(angle) * (radius - 15);

	ctx.lineWidth = 5;
	ctx.strokeStyle = '#f00';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(nx, ny);
    ctx.stroke();
	
    // centro
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // testo velocità
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText((player.speed | 0) + ' km/h', cx, cy - 10);
	
	ctx.lineWidth = 1;
}

function formatTime(ms) {
    if (ms === null) return '--:--.---';
    let m = Math.floor(ms / 60000);
    let s = Math.floor((ms % 60000) / 1000);
    let c = Math.floor(ms % 1000);
    return m + ':' + String(s).padStart(2,'0') + '.' + String(c).padStart(3,'0');
}
function drawLapTimes() {
    let now = performance.now();
    let current = lapStart !== null ? now - lapStart : null;

    ctx.font = '12px monospace';
    ctx.textAlign = 'left';

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(8, 8, 120, 60);

    ctx.fillStyle = '#fff';
    ctx.fillText('LAP   ' + formatTime(current), 16, 26);

    ctx.fillStyle = '#aaa';
    ctx.fillText('LAST  ' + formatTime(lastLapTime), 16, 44);

    ctx.fillStyle = '#f00';
    ctx.fillText('BEST  ' + formatTime(bestLapTime), 16, 62);
}


//RENDER!
let fpsTime = 0;
let fpsCount = 0;
let fpsDisplay = 0;

function render() {
	//FPS
	let now = performance.now();
    fpsCount++;
    if (now - fpsTime >= 1000) {
        fpsDisplay = fpsCount;
        fpsCount = 0;
        fpsTime = now;
		//drawdistance fix n100 
		if (fpsDisplay < 20) drawDistance = 80;
		else if (fpsDisplay < 50) drawDistance = 140;
		else if (fpsDisplay > 120) drawDistance = 400;
		else if (fpsDisplay > 90) drawDistance = 300;
		else drawDistance = 200;
    }


    update();
	drawSky(skyOffset);
	
	//FPS
	ctx.fillStyle = '#000';
	ctx.font = '12px monospace';
	ctx.textAlign = 'right';
	ctx.fillText('FPS:  ' + fpsDisplay, width - 10, 14);
	ctx.fillText('DIST: ' + drawDistance, width - 10, 24);
	
	
	let startPos = Math.floor(player.z / segL);
	let camHeight = segments[startPos % segments.length].p1.world.y + camH;
	
    let x = 0;
    let dx = 0;
	
    // Road Loop
    for (let n = startPos; n < startPos + drawDistance; n++) {
        let s = segments[n % segments.length];
        let loop = (n >= segments.length) ? trackL : 0;

        project(s.p1, player.x * roadW - x, camHeight, player.z - loop);
        project(s.p2, player.x * roadW - x - s.curve, camHeight, player.z - loop);

        x += dx;
		dx += s.curve;

        // "Gap Fix": Usiamo y del segmento precedente per tappare i buchi
        if (n > startPos) {
            let prev = segments[(n - 1) % segments.length];
            drawSegment(prev.p2.screen.x, prev.p2.screen.y, prev.p2.screen.w,
                s.p2.screen.x, s.p2.screen.y, s.p2.screen.w,
                n);
        }
    }
	
	
    // Sprites & Collision (simplified logic for performance)
    for (let n = startPos + drawDistance; n > startPos; n--) {
        let s = segments[n % segments.length];
        if (s.sprite && s.p1.screen.scale > 0) {
            drawSprite(s.sprite, s.p1);

            // Collisione: segmento vicino + sovrapposizione X
            let segDist = n - startPos;
            if (segDist > 5 && segDist < 20 && player.state === 'ALIVE') {
				
				/*// DEBUG HITBOX SPRITE
				ctx.strokeStyle = '#0f0';
				ctx.strokeRect(
					s.p1.screen.x + (s.sprite.x * s.p1.screen.w) - (s.sprite.width * 0.5 * s.p1.screen.w),
					s.p1.screen.y - 10,
					(s.sprite.width) * s.p1.screen.w,
					10
				);
				
				//DEBUG HITBOX FERRARI
				ctx.strokeStyle = '#ff0';
				ctx.strokeRect(
					s.p1.screen.x + (player.x * s.p1.screen.w) - (0.2 * 0.5 * s.p1.screen.w),
					s.p1.screen.y - 10,
					(0.2) * s.p1.screen.w,
					10
				);*/
				
                let spriteHalfW = s.sprite.width * 0.5;// * s.p1.screen.scale;
				let carHalfW = 0.1;//larga ~0.3 unità, centrata su playerX
				let overlap = Math.abs(player.x - s.sprite.x) < (spriteHalfW + carHalfW);
				
				if (overlap && segDist === 8) {
					console.log(`overlap=${overlap}  segDist=${segDist}  seg=${n}  playerX=${player.x.toFixed(2)}|${carHalfW}  spriteX=${s.sprite.x}|${spriteHalfW}  dist=${Math.abs(player.x - s.sprite.x).toFixed(2)}`);
					
					if (s.sprite.type === 'oil' || s.sprite.type === 'water') {
						let spawnCount = 4 + (player.speed / 40)|0;
						for (let i = 0; i < spawnCount; i++) {
							particles.push({
								x: width * 0.5 + (Math.random() - 0.5) * 50,
								y: height - 10,
								vx: (Math.random() - 0.5) * 1.2,
								vy: -(0.5 + Math.random() * 1.5),
								life: 1.0,
								r: 8 - Math.random() * 4,
								gray: s.sprite.type === 'water' ? 230 : 30
							});
						}
					} else {
						player.state = 'CRASHED';
					}
                }
            }
        }
    }
	
	//traffico!
	const visibleCars = trafficCars
    .map(car => {
        let rz = car.z - player.z;
        if (rz < 0) rz += trackL;
        return { car, rz };
    })
    .filter(({ rz }) => rz < segL * drawDistance)
    .sort((a, b) => b.rz - a.rz);
	
	for (let { car, rz } of visibleCars) {

		let z = rz;

		let segIndex = Math.floor(z / segL);
		let frac = (z % segL) / segL;

		let baseIndex = (startPos + segIndex) % segments.length;

		let lookAhead = 2;

		let s0 = segments[baseIndex];
		let s1 = segments[(baseIndex + lookAhead) % segments.length];

		// interp attuale
		let baseX0 = s0.p1.screen.x + (s0.p2.screen.x - s0.p1.screen.x) * frac;
		let baseW0 = s0.p1.screen.w + (s0.p2.screen.w - s0.p1.screen.w) * frac;
		let baseY0 = s0.p1.screen.y + (s0.p2.screen.y - s0.p1.screen.y) * frac;

		// interp futura (smooth)
		let baseX1 = s1.p1.screen.x + (s1.p2.screen.x - s1.p1.screen.x) * frac;
		let baseW1 = s1.p1.screen.w + (s1.p2.screen.w - s1.p1.screen.w) * frac;
		let baseY1 = s1.p1.screen.y + (s1.p2.screen.y - s1.p1.screen.y) * frac;

		let t = 0.25;

		let baseX = baseX0 * (1 - t) + baseX1 * t;
		let baseW = baseW0 * (1 - t) + baseW1 * t;
		let screenY = baseY0 * (1 - t) + baseY1 * t;

		let screenX = baseX + car.x * baseW;

		let scale = s0.p1.screen.scale + (s0.p2.screen.scale - s0.p1.screen.scale) * frac;

		let carW = scale * roadW * width * 0.1;
		let carH = carW * 0.5;

		drawFerrariShadow(screenX, screenY, carW * 1.4, carW * 1.5);//un po piu grande == piu belle
		drawFerrari(screenX, screenY, carW * 1.5, car.color.dark, car.color.light);//disegnate appena piu grandi
				
		if (player.state === 'ALIVE') {
			let playerX = width * 0.5;
			let playerY = height - 70;
			let playerW = CAR_WIDTH;
			let playerH = 40;

			let overlapX = Math.abs(screenX - playerX) < (carW * 0.4 + playerW * 0.4);
			let overlapY = Math.abs(screenY - playerY) < (carH * 0.4 + playerH * 0.4);

			// opzionale: solo quando è vicino visivamente
			if (screenY > height - 120 && overlapX && overlapY) {
				player.state = 'CRASHED';
			}
		}
	}

	
	

    // Player Car
    drawCar();
	
	drawSpeedometer();
	drawGearStick();
	drawLapTimes();

    requestAnimationFrame(render);
}

// ====== INPUT: TOUCH (multi-touch) ======
// Mappa: quale tasto preme ogni bottone on-screen
const btnMap = {
    'btn-left':  'left',
    'btn-right': 'right',
    'btn-gas':   'up',
    'btn-brake': 'down'
};

function getBtnKey(el) {
    // Risali l'albero DOM finché trovi un btn con id mappato
    while (el && el !== document.body) {
        if (el.id && btnMap[el.id]) return btnMap[el.id];
        el = el.parentElement;
    }
    return null;
}

// Tiene traccia dei touch attivi per ogni key
const touchKeys = {};

document.getElementById('controls').addEventListener('touchstart', (e) => {
    e.preventDefault();
    resumeAudio();
    for (let t of e.changedTouches) {
        let el = document.elementFromPoint(t.clientX, t.clientY);
        let key = getBtnKey(el);
        if (key) {
            touchKeys[t.identifier] = key;
            keys[key] = 1;
            // feedback visivo
            let btnEl = document.getElementById(Object.keys(btnMap).find(k => btnMap[k] === key));
            if (btnEl) btnEl.classList.add('pressed');
        }
    }
}, { passive: false });

document.getElementById('controls').addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        let key = touchKeys[t.identifier];
        if (key) {
            // rilascia solo se nessun altro dito preme lo stesso tasto
            let stillPressed = false;
            for (let id in touchKeys) {
                if (id != t.identifier && touchKeys[id] === key) { stillPressed = true; break; }
            }
            if (!stillPressed) {
                keys[key] = 0;
                let btnEl = document.getElementById(Object.keys(btnMap).find(k => btnMap[k] === key));
                if (btnEl) btnEl.classList.remove('pressed');
            }
            delete touchKeys[t.identifier];
        }
    }
}, { passive: false });

document.getElementById('controls').addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        let key = touchKeys[t.identifier];
        if (key) { keys[key] = 0; delete touchKeys[t.identifier]; }
    }
}, { passive: false });

// Blocca context menu su long press (mobile)
document.addEventListener('contextmenu', e => e.preventDefault());

// ====== AVVIO ======
initSegments();
initPalette();
render();

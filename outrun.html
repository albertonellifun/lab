<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>OutRun Clone</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: #000;
            overflow: hidden;
            width: 100%; height: 100%;
            touch-action: none; /* blocca scroll/zoom con dita */
        }
        #wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
			height: 100dvh; /* fix redmi? */
            position: relative;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            border: 4px solid #222;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            z-index: 10;
        }
        #hud p { margin: 2px 0; }

        /* ====== CONTROLLI TOUCH ====== */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 12px 16px;
            pointer-events: none;
            z-index: 20;
        }
        .ctrl-group {
            display: flex;
            gap: 16px;
            pointer-events: all;
        }
        .btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: background 0.1s;
            /* touch highlight disabilitato */
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active, .btn.pressed {
            background: rgba(255,255,255,0.4);
        }
        #btn-gas {
            background: rgba(60,255,60,0.25);
            border-color: rgba(60,255,60,0.75);
        }
        #btn-brake {
			background: rgba(255,60,60,0.25);
            border-color: rgba(255,60,60,0.75);
        }
    </style>
</head>
<body>
<div id="wrapper">
    <div id="hud">
        <p>SPEED: <span id="spd">0</span></p>
        <p>GEAR: <span id="gear">0</span></p>
        <p>DIST: <span id="dist">0</span></p>
		<p>RPM: <span id="rpm">0</span></p>
    </div>
    <canvas id="g"></canvas>

    <!-- Controlli touch on-screen -->
    <div id="controls">
        <div class="ctrl-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="btn" id="btn-brake">🔴</div>
            <div class="btn" id="btn-gas">🟢</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');

// --- CANVAS RESPONSIVE ---
// Mantieni proporzioni 4:3 e riempi lo schermo (lasciando spazio ai controlli)
const BASE_W = 800;
const BASE_H = 600;

function resizeCanvas() {
    const controlsH = 140; // altezza area controlli
    const availW = window.innerWidth;
    const availH = window.innerHeight - controlsH;
    const scale = Math.min(availW / BASE_W, availH / BASE_H);
    canvas.style.width  = Math.floor(BASE_W * scale) + 'px';
    canvas.style.height = Math.floor(BASE_H * scale) + 'px';
}
canvas.width  = BASE_W;
canvas.height = BASE_H;
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const width  = BASE_W;
const height = BASE_H;

// --- SETTINGS ---
const roadW = 2000;
const segL = 200;
const camH = 1500;
const drawDistance = 200;
const fieldOfView = 100;
const camD = 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);

let playerX = 0;
let playerZ = 0;
let speed = 0;
let skyOffset = 0;
let gameState = 'ALIVE';
let crashTimer = 0;

const maxSpeed = 340;
const accel = 1;
const friction = 0.997; //attrito, se non accelero la macchina
const keys = { left: 0, right: 0, up: 0, down: 0 };

const START_IDX = 16;//dove e' visivamente il traguardo "alto"

//AUDIO BRUM BRUM!
let gear = 1;
let rpm = 0.5;
let rpmTarget = 0.5;
let lastGear = 1;
const gearRatios = [0, 1, 60, 120, 180, 240, 280, 350];// velocità a cui scatta il cambio

//motore auto realistico??? :-)
const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

// 3 oscillatori: fondamentale + 2 armoniche
const osc1 = audioCtx.createOscillator(); osc1.type = 'sawtooth'; // fondamentale — corpo del rombo
const osc2 = audioCtx.createOscillator(); osc2.type = 'square';// 2a armonica — aggressività
const osc3 = audioCtx.createOscillator(); osc3.type = 'triangle';// 3a armonica — coda metallica

const g1 = audioCtx.createGain(); g1.gain.value = 1.0;
const g2 = audioCtx.createGain(); g2.gain.value = 0.4;
const g3 = audioCtx.createGain(); g3.gain.value = 0.2;

// filtro bandpass: simula la camera d'aspirazione
const engineFilter = audioCtx.createBiquadFilter();
engineFilter.type = 'bandpass';
engineFilter.frequency.value = 120;
engineFilter.Q.value = 1.2;

// rumore di scoppio (combustione)
const noiseBuffer = audioCtx.createBuffer(1, 65536, audioCtx.sampleRate);
const nd = noiseBuffer.getChannelData(0);
for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

const noiseSource = audioCtx.createBufferSource();
noiseSource.buffer = noiseBuffer;
noiseSource.loop = true;

const noiseGain = audioCtx.createGain();
noiseGain.gain.value = 0.02;

const masterGain = audioCtx.createGain();
masterGain.gain.value = 0;

osc1.connect(g1); g1.connect(engineFilter);
osc2.connect(g2); g2.connect(engineFilter);
osc3.connect(g3); g3.connect(masterGain);

engineFilter.connect(masterGain);
noiseSource.connect(noiseGain);
noiseGain.connect(masterGain);
masterGain.connect(audioCtx.destination);

osc1.start(); 
osc2.start(); 
osc3.start(); 
noiseSource.start();

function resumeAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
}


// --- TRACK GENERATION ---
let gamePalette = {};
let segments = [];
const SEGMENTS = 1257 * 2;//ocho ai dati in console -> ci piace quando s[0].y == s[last].y
const trackL = SEGMENTS * segL;

function addSegment(idx, curve, y, isDesert) {
	let n = segments.length;
    let sprite = null;
    if (idx === START_IDX || 
	    Math.random() > 0.95 ||
        (idx > 200 && idx < 400 && idx % 2 === 0) || //alberi
        (idx > 600 && idx < 800 && idx % 8 === 0) || //cartelli
		(idx > 900 && idx < 1000 && idx % 2 === 0) || //coni
		(idx > 1200 && idx < 1500 && idx % 2 === 0) || //bush
		(idx > 2000 && idx < 2100 && idx % 2 === 0) //semafori
		) {
        //crea oggetto a bordo strada
		let type = '';
        let position = 0;
		
        if (idx === START_IDX) type = 'start';
        else if (idx > 200 && idx < 400) type = 'tree';
        else if (idx > 600 && idx < 800) type = 'billboard';
		else if (idx > 900 && idx < 1000) type = 'cone';
		else if (idx > 1200 && idx < 1500) type = 'bush';
		else if (idx > 2000 && idx < 2100) type = 'trafficlight';
        else {
			type = Math.random() > 0.66 ? 'tree' : 
			Math.random() > 0.66 ? 'billboard' : 
			Math.random() > 0.66 ? 'cone' : 
			Math.random() > 0.5 ? 'bush' : 'trafficlight';
		}

        if (type === 'billboard') {
            //cartelloni piu vicini al bordo, esterni alle curve
            if (curve > 0) position = -1.3;
            else position = 1.3;
        } else if (type === 'start') {
            position = -1.6;//start piu lontano
        } else if (type === 'cone') {
		    position = idx % 4 === 0 ? -1.1 : 1.1; //lato alternato
		} else if (type === 'trafficlight') {
			position = idx % 4 === 0 ? -1.2 : 1.2; //lato alternato
		} else if (type === 'bush') {
			position = idx % 4 === 0 ? -1.4 : 1.4; //lato alternato
		} else {
            //albero random
            position = idx % 4 === 0 ? -1.6 : 1.6; //lato alternato
        }

        sprite = {
            x: position,
            type: type
        };
    }

    segments.push({
        p1: {
            world: { x: 0, y: y, z: n * segL},
            screen: { x: 0, y: 0, w: 0 }
        },
        p2: {
            world: { x: 0, y: y, z: (n + 1) * segL },
            screen: { x: 0, y: 0, w: 0 }
        },
        curve: curve,
        sprite: sprite
    });
}

function initPalette() {
	if (Math.random() > 0.5) {
		gamePalette = {
			skyLight:'#8ae',	
			skyDark:'#68e', 
			mountainsLight:'#db7', 
			mountainsDark:'#b95', 
			terrain:'#db7',
			road0: '#b9a', 
			road1: '#cab', 
			grass0: '#db9', 
			grass1: '#eca', 
			rumble0: '#fff',
			rumble1: '#f00'
			};
	}
	else { 
		gamePalette = { 
			skyLight:'#8cf',	
			skyDark:'#05f',
			mountainsLight:'#151',	
			mountainsDark:'#141',
			terrain:'#181',
			road0: '#444', 
			road1: '#555', 
			grass0: '#181', 
			grass1: '#171', 
			rumble0: '#fff',
			rumble1: '#f00'
			};
	}
}

function initSegments() {
	for (let i = 0; i < SEGMENTS; i++) {
        addSegment(i, Math.sin(i / 90) * 4, Math.cos(i / 50) * 1000);
		console.log('i=' + i + '\ty=' + Math.cos(i / 50) * 1000);
    }
	console.log('delta=' + (segments[0].p1.world.y - segments[SEGMENTS - 1].p1.world.y));
}


// --- PROJECTION - il trucco e' qui: disegno trapezi per simulare il 3d
function project(p, camX, camY, camZ) {
    p.screen.scale = camD / Math.max(0.1, (p.world.z - camZ));
    p.screen.x = (1 + p.screen.scale * (p.world.x - camX)) * width / 2;
    p.screen.y = (1 - p.screen.scale * (p.world.y - camY)) * height / 2;
    p.screen.w = p.screen.scale * roadW * width / 2;
}

// --- BACKGROUND ---
function drawSky(offset) {
    //cielo
    let g = ctx.createLinearGradient(0, 0, 0, height / 2);
    g.addColorStop(0, gamePalette.skyDark);
    g.addColorStop(1, gamePalette.skyLight);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height / 2);
    ctx.fillStyle = gamePalette.terrain;
    ctx.fillRect(0, height / 2, width, height);

    //montagne lontane
    ctx.fillStyle = gamePalette.mountainsDark;
    for (let i = -1; i < 3; i++) {
        let x = (i * width * 1.5) - (offset * 0.15 % (width * 1.5));
        ctx.beginPath();
        ctx.moveTo(x, height / 2);
        ctx.lineTo(x + 200, height / 3);
        ctx.lineTo(x + 400, height / 2.2);
        ctx.lineTo(x + 600, height / 3.5);
        ctx.lineTo(x + 800, height / 2);
        ctx.fill();
    }
	
	//colline vicine
    ctx.fillStyle = gamePalette.mountainsLight;
    for (let i = -1; i < 3; i++) {
        let x = (i * width * 1.2) - (offset * 0.25 % (width * 1.2));
        ctx.beginPath();
        ctx.moveTo(x, height / 2);
        ctx.quadraticCurveTo(x + 300, height / 3.5, x + 600, height / 2);
        ctx.fill();
    }
}

function drawSegment(x1, y1, w1, x2, y2, w2, idx) {

    // Erba
    ctx.fillStyle = idx%2 ? gamePalette.grass1 : gamePalette.grass0; //erba
    ctx.fillRect(0, y2, width, y1 - y2);
	
    // Cordoli
    ctx.fillStyle = idx%2 ? gamePalette.rumble1 : gamePalette.rumble0; //cordolo
    ctx.beginPath();
    ctx.moveTo(x1 - w1 * 1.1, y1);
    ctx.lineTo(x2 - w2 * 1.1, y2);
    ctx.lineTo(x2 + w2 * 1.1, y2);
    ctx.lineTo(x1 + w1 * 1.1, y1);
    ctx.fill();
	
    // Strada
    ctx.fillStyle = idx%2 ? gamePalette.road1 : gamePalette.road0; //asfalto
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1 + 1);
    ctx.lineTo(x2 - w2, y2 - 1);
    ctx.lineTo(x2 + w2, y2 - 1);
    ctx.lineTo(x1 + w1, y1 + 1);
    ctx.fill();

    // TRATTEGGIO: disegna il trapezio solo sui segmenti pari
    if (Math.floor(idx / 2) % 2 === 0) {
        let dw1 = Math.max(1.5, w1 * 0.045);
        let dw2 = Math.max(0.8, w2 * 0.045);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.moveTo(x1 - dw1, y1);
        ctx.lineTo(x2 - dw2, y2);
        ctx.lineTo(x2 + dw2, y2);
        ctx.lineTo(x1 + dw1, y1);
        ctx.fill();
    }
}

function update() {
    if (gameState === 'CRASHED') {
        speed *= 0.95;
        crashTimer++;
		
        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);// Spegni il motore gradualmente
		
        if (speed < 1) {
            gameState = 'ALIVE';
            crashTimer = 0;
            playerX = 0;
        }
    } else {
		let offRoad = Math.abs(playerX) > 1;
	
        if (keys.up) {
			if (offRoad) speed += accel * (1 - speed / maxSpeed) * 0.25;
			else speed += accel * (1 - speed / maxSpeed);
		}
        else if (keys.down) {
			if (offRoad) speed -= accel * 0.2;
			else speed -= accel * 2;
		}
        else {
			if (offRoad) speed *= 0.995;
			else speed *= friction;
		}

        if (keys.left) playerX -= 0.05 * (speed / maxSpeed);
        if (keys.right) playerX += 0.05 * (speed / maxSpeed);

        // CURVA: la macchina scivola verso l'esterno proporzionalmente alla velocità
        let cur = segments[Math.floor(playerZ / segL) % segments.length];
        playerX -= cur.curve * (speed / maxSpeed) * 0.005;

        //AUDIO!
        // --- GEAR DETECTION ---
        let targetGear = speed === 0 ? 0 : 1;
        for (let g = 1; g < gearRatios.length; g++) {
            if (speed > gearRatios[g]) targetGear = g;
        }

        // CAMBIO MARCIA: imposta rpm target con drop/spike udibile
        if (targetGear !== lastGear) {
            if (targetGear > lastGear) {
                rpm = 0.25; // cambio in su: drop brusco dei giri
            } else {
                rpm = 0.95; // scalata: spike verso alto
            }
            lastGear = targetGear;
        }
        gear = targetGear;

        // RPM target basato su posizione nella marcia attuale
        let gearBottom = gearRatios[gear] || 0;
        let gearTop = gearRatios[Math.min(gear + 1, gearRatios.length - 1)] || maxSpeed;
        rpmTarget = Math.max(0.15, Math.min(1.0, (speed - gearBottom) / Math.max(1, gearTop - gearBottom)));

        // RPM segue il target con inerzia — il drop/spike rimane udibile per ~0.3s
        rpm += (rpmTarget - rpm) * 0.08;

        // Frequenza fondamentale
        let gas = keys.up ? 1 : 0;
        let baseFreq = (800 + rpm * 3200) / 60 * 4;
        baseFreq *= (0.85 + gas * 0.15);

        osc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.04);
        osc2.frequency.setTargetAtTime(baseFreq * 2, audioCtx.currentTime, 0.04);
        osc3.frequency.setTargetAtTime(baseFreq * 3, audioCtx.currentTime, 0.04);

        engineFilter.frequency.setTargetAtTime(80 + gas * 600 + rpm * 400, audioCtx.currentTime, 0.06);
        noiseGain.gain.setTargetAtTime(0.015 + gas * 0.05, audioCtx.currentTime, 0.05);
        masterGain.gain.setTargetAtTime(speed > 3 ? (0.08 + gas * 0.05) : 0.03, audioCtx.currentTime, 0.1);
    }
	
    speed = Math.max(0, Math.min(speed, maxSpeed)); //inibisce la retro!
    playerZ += speed;
    //if (playerZ >= trackL) playerZ -= trackL;
    //else if (playerZ < 0) playerZ = trackL;
	playerZ = (playerZ + trackL) % trackL;

    let cur = segments[Math.floor(playerZ / segL) % segments.length];
    skyOffset += cur.curve * (speed / maxSpeed) * 10;

    document.getElementById('spd').innerText = speed | 0;
    document.getElementById('gear').innerText = gear;
    document.getElementById('dist').innerText = playerZ | 0;
	document.getElementById('rpm').innerText = rpmTarget.toFixed(2);
}

//ai bordi -> alberi o cartelloni
function drawSprite(sprite, p) {
    let scale = p.screen.scale;
    let x = p.screen.x + (scale * sprite.x * roadW * width / 2);
    let y = p.screen.y;
    let w = Math.max(0, 400 * scale * (width / 2));
    let h = Math.max(0, 400 * scale * (width / 2));

    let radius = Math.max(0, w * 0.5); //OCHO: il raggio non puo essere negativo

    if (sprite.type === 'start') {
        let poleWidth = w / 4;
        let barWidth = w * 16;
        //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.fillRect(x - poleWidth * 2, y, barWidth + poleWidth * 4, h * 0.25);

        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        //palo
        ctx.fillRect(x - poleWidth / 2, y - h * 10, poleWidth, h * 10);
        ctx.strokeRect(x - poleWidth / 2, y - h * 10, poleWidth, h * 10);
        //altro palo 
        ctx.fillRect(x - poleWidth / 2 + barWidth, y - h * 10, poleWidth, h * 10);
        ctx.strokeRect(x - poleWidth / 2 + barWidth, y - h * 10, poleWidth, h * 10);

        //barra orizzontale larga
        ctx.fillRect(x, y - h * 10, barWidth, h * 2);
        ctx.strokeRect(x, y - h * 10, barWidth, h * 2);
        //scacchiera
        ctx.fillStyle = '#222';
        for (let i = 0; i < 16; i++) {
            ctx.fillRect(x + 2 * i * (w / 2), y - h * 10, (w / 2), h * 0.5);
            ctx.fillRect(x + 2 * i * (w / 2), y - h * 9, (w / 2), h * 0.5);
        }
        ctx.fillStyle = '#222';
        for (let i = 0; i < 16; i++) {
            ctx.fillRect(x + (2 * i + 1) * (w / 2), y - h * 9.5, (w / 2), h * 0.5);
            ctx.fillRect(x + (2 * i + 1) * (w / 2), y - h * 8.5, (w / 2), h * 0.5);
        }

    } else if (sprite.type === 'tree') {
        //ombra
        ctx.fillStyle = '#040';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //tronco alto h*2
        ctx.fillStyle = '#531';
        ctx.fillRect(x - w * 0.1, y - h * 2, w * 0.2, h * 2);

        //chioma w/2
        ctx.fillStyle = '#161';
        ctx.beginPath();
        ctx.arc(x, y - h * 2, radius * 1.5, 0, Math.PI * 2);
        ctx.fill();
	} else if (sprite.type === 'bush') {
		//ombra
        ctx.fillStyle = '#040';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 2, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
		//chioma w/2
        ctx.fillStyle = '#161';
        ctx.beginPath();
        ctx.arc(x, y, radius * 2, Math.PI, Math.PI * 2);
		ctx.closePath();
        ctx.fill();
    } else if (sprite.type === 'cone') {
		//ombra
		ctx.fillStyle = 'rgba(0,0,0,0.25)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 0.8, radius * 0.2, 0, 0, Math.PI * 2);
		ctx.fill();

		//triangolo
		ctx.fillStyle = '#f60'; // arancione
		ctx.beginPath();
		ctx.moveTo(x, y - h * 0.75);                // punta
		ctx.lineTo(x - w * 0.25, y);         // base sx
		ctx.lineTo(x + w * 0.25, y);         // base dx
		ctx.closePath();
		ctx.fill();

		//strisce bianche
		ctx.fillStyle = '#fff';

		//striscia alta
		ctx.beginPath();
		ctx.moveTo(x - w * 0.08, y - h * 0.5);
		ctx.lineTo(x + w * 0.08, y - h * 0.5);
		ctx.lineTo(x + w * 0.12, y - h * 0.4);
		ctx.lineTo(x - w * 0.12, y - h * 0.4);
		ctx.closePath();
		ctx.fill();

		//striscia centrale
		ctx.beginPath();
		ctx.moveTo(x - w * 0.16, y - h * 0.25);
		ctx.lineTo(x + w * 0.16, y - h * 0.25);
		ctx.lineTo(x + w * 0.2, y - h * 0.15);
		ctx.lineTo(x - w * 0.2, y - h * 0.15);
		ctx.closePath();
		ctx.fill();
	} else if (sprite.type === 'trafficlight') {
		//ombra
		ctx.fillStyle = 'rgba(0,0,0,0.25)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 0.7, radius * 0.2, 0, 0, Math.PI * 2);
		ctx.fill();

		//palo
		ctx.fillStyle = '#444';
		ctx.fillRect(x - w * 0.05, y - h * 1.5, w * 0.1, h * 1.5);

		//corpo giallo
		let boxW = w * 0.4;
		let boxH = h * 0.9;
		ctx.fillStyle = '#fc3'; // giallo acceso
		ctx.fillRect(x - boxW / 2, y - h * 1.5 - boxH, boxW, boxH);
		ctx.strokeStyle = '#da1';
		ctx.lineWidth = 2;
		ctx.strokeRect(x - boxW / 2, y - h * 1.5 - boxH, boxW, boxH);

		//3 luci
		let lightRadius = boxW * 0.25;
		let cx = x;
		let top = y - h * 1.5 - boxH;

		//rosso
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.2, lightRadius * 1.5, Math.PI, Math.PI * 2);
		ctx.strokeStyle = '#da1';
		ctx.lineWidth = 4;
		ctx.stroke();
		ctx.lineWidth = 1;
		
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.2, lightRadius * 1.4, 0, Math.PI * 2);
		ctx.fillStyle = '#500';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+2, top + boxH * 0.2, lightRadius * 1.4, 0, Math.PI * 2);
		ctx.fillStyle = '#700';
		ctx.fill();

		//giallo
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.5, lightRadius, 0, Math.PI * 2);
		ctx.fillStyle = '#550';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+1, top + boxH * 0.5, lightRadius * 0.8, 0, Math.PI * 2);
		ctx.fillStyle = '#770';
		ctx.fill();

		//verde
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.8, lightRadius, 0, Math.PI * 2);
		ctx.fillStyle = '#070';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+1, top + boxH * 0.8, lightRadius * 0.8, 0, Math.PI * 2);
		ctx.fillStyle = '#0e0';
		ctx.fill();
	} else {
        //ombra
        ctx.fillStyle = '#040';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //cartellone
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - w * 0.5, y - h, w, h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(x - w * 0.5, y - h, w, h);

        //freccione rosso
        if (sprite.x <= 0) {
            ctx.fillStyle = '#f00';
            ctx.strokeStyle = '#b00';
            ctx.beginPath();
            ctx.moveTo(x - w * 0.5 + 2, y - h + 2); //alto sx
            ctx.lineTo(x - w * 0, y - h + 2); //alto dx
            ctx.lineTo(x + w * 0.5 - 2, y - h / 2); //mezzo dx
            ctx.lineTo(x - w * 0, y - 2); //basso dx
            ctx.lineTo(x - w * 0.5 + 2, y - 2); //basso sx
            ctx.lineTo(x - w * 0 - 2, y - h / 2); //mezzo sx
        } else {
            ctx.fillStyle = '#f00';
            ctx.strokeStyle = '#b00';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5 - 2, y - h + 2); //alto dx
            ctx.lineTo(x + w * 0, y - h + 2); //alto sx
            ctx.lineTo(x - w * 0.5 + 2, y - h / 2); //mezzo sx
            ctx.lineTo(x + w * 0, y - 2); //basso sx
            ctx.lineTo(x + w * 0.5 - 2, y - 2); //basso dx
            ctx.lineTo(x + w * 0 + 2, y - h / 2); //mezzo sx
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }
}

//un rettangolo rosso -> testarossa di alb spettacolare anche senza biondona al seguito
function drawFerrari(cx, cy, w) {
    let bounce = (Math.random() * 2) * (speed / maxSpeed);

    //corpo principale rosso ferrari scuro+chiaro
    ctx.fillStyle = '#b00'; // Rosso scuro per i lati
    ctx.fillRect(cx - w / 2, cy + bounce, w, 36);
    ctx.fillStyle = '#f00'; // Rosso acceso sopra
    ctx.fillRect(cx - w / 2 + 2, cy + bounce + 1, w - 4, 30);

    //tetto rosso acceso
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.moveTo(cx - 40, cy + bounce);
    ctx.lineTo(cx - 25, cy - 20 + bounce);
    ctx.lineTo(cx + 25, cy - 20 + bounce);
    ctx.lineTo(cx + 40, cy + bounce);
    ctx.fill();
    //lunotto nero
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(cx - 30, cy + bounce + 4);
    ctx.lineTo(cx - 25, cy - 20 + bounce + 4);
    ctx.lineTo(cx + 25, cy - 20 + bounce + 4);
    ctx.lineTo(cx + 30, cy + bounce + 4);
    ctx.fill();

    //quadrozzo rosso sopra il motore
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.moveTo(cx - 15, cy + bounce - 2);
    ctx.lineTo(cx - 20, cy + bounce + 3);
    ctx.lineTo(cx + 20, cy + bounce + 3);
    ctx.lineTo(cx + 15, cy + bounce - 2);
    ctx.fill();

    //specchietti
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.ellipse(cx - 42, cy + bounce - 8, 5, 3, 0, 0, 6.28);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 42, cy + bounce - 8, 5, 3, 0, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.ellipse(cx - 41, cy + bounce - 8, 4, 2.5, 0, 0, 6.28);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 41, cy + bounce - 8, 4, 2.5, 0, 0, 6.28);
    ctx.fill();

    //base griglia nera
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - w / 2 + 5, cy + 10 + bounce, w - 10, 16);

    //fari posteriori
    ctx.fillStyle = '#500'; //rosso sotto
    ctx.fillRect(cx - w / 2 + 10, cy + 16 + bounce, 20, 6);
    ctx.fillRect(cx + w / 2 - 30, cy + 16 + bounce, 20, 6);
    ctx.fillStyle = '#f80'; //freccia gialla
    ctx.fillRect(cx - w / 2 + 10, cy + 12 + bounce, 20, 4);
    ctx.fillRect(cx + w / 2 - 30, cy + 12 + bounce, 20, 4);
    ctx.fillStyle = '#eee'; //bianco retro
    ctx.fillRect(cx - w / 2 + 30, cy + 12 + bounce, 5, 10);
    ctx.fillRect(cx + w / 2 - 35, cy + 12 + bounce, 5, 10);

    //linee orizzontali sopra i fari
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - w / 2 + 5, cy + 12 + (i * 3) + bounce);
        ctx.lineTo(cx + w / 2 - 5, cy + 12 + (i * 3) + bounce);
        ctx.stroke();
    }

    //targa
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 15, cy + 28 + bounce, 30, 6);

    //stemma
    ctx.fillStyle = '#ccc';
    ctx.fillRect(cx - 3, cy + 15 + bounce, 6, 6);
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 2, cy + 16 + bounce, 4, 4);

    //cannoni
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 35, cy + 32 + bounce, 15, 6);
    ctx.fillRect(cx + 35, cy + 32 + bounce, -15, 6);
    ctx.strokeStyle = '#ccc';
    ctx.strokeRect(cx - 35, cy + 32 + bounce, 15, 6);
    ctx.strokeRect(cx + 35, cy + 32 + bounce, -15, 6);

    //gomme
    ctx.fillStyle = '#111';
    ctx.fillRect(cx - 50, cy + 38 + bounce, 30, 4);
    ctx.fillRect(cx + 50, cy + 38 + bounce, -30, 4);
}

function drawCar() {
    ctx.save();
    let cx = width / 2;
    let cy = height - 70;
    let w = 120; //TESTAROSSA E' LARGA!!!

    //ombra
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(cx - w / 2 - 4, cy + 10, w + 8, 36);

    ctx.translate(cx, cy);

    if (gameState === 'CRASHED') {
        ctx.rotate(playerX > 0 ? crashTimer * 0.25 : -crashTimer * 0.25);
    }

    drawFerrari(0, 0, w);

    ctx.restore();
}

//cambiooo
let gearStickX = 0;
let gearStickY = 0;
function drawGearStick() {
    const x = 10;
    const y = height - 60;

    const w = 80;
    const h = 50;

    // --- BASE METALLICA ---
    let grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, '#aaa');
    grad.addColorStop(0.5, '#eee');
    grad.addColorStop(1, '#888');

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    // --- SCANALATURE (H pattern) ---
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 8;

    function line(x1,y1,x2,y2){
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    // colonne
	let col1 = x + w * 0.15;
    let col2 = x + w * 0.50;
	let col3 = x + w * 0.85;

    // righe
    let r1 = y + h * 0.15;
    let r2 = y + h * 0.5;
    let r3 = y + h * 0.85;

    // verticale sinistra/destra
    line(col1, r1, col1, r3);
    line(col2, r1, col2, r3);
	line(col3, r1, col3, r3);
	
    // orizzontali
    line(col1, r2, col3, r2);//include R
	
    
    // --- POSIZIONE MARCE ---
    const gearPos = {
		0: [col2, r2],
        1: [col1, r1],
        2: [col1, r3],
        3: [col2, r1],
        4: [col2, r3],
        5: [col3, r1],
        6: [col3, r3]
    };

    let pos = gearPos[gear] || gearPos[0];
	/*let baseX = pos[0];
    let baseY = pos[1];*/
	let targetX = pos[0];
	let targetY = pos[1];
	
	let ydist = Math.abs(gearStickY - targetY);
	let xdist = Math.abs(targetX - gearStickX);
	
	// prima vai in verticale per meta distanza
	if (ydist > h * 0.5) {
		gearStickY += (targetY - gearStickY) * 0.5;
	} else {
		// poi vai in orizzontale
		gearStickX += (targetX - gearStickX) * 0.5;
		
		if (xdist < 2) {
			gearStickY += (targetY - gearStickY) * 0.5;
		}
	}
	let baseX = gearStickX;
	let baseY = gearStickY;
	
	
    // pomello (palla)
    ctx.beginPath();
    ctx.arc(baseX, baseY, 12, 0, Math.PI * 2);

    let knobGrad = ctx.createRadialGradient(
        baseX - 3, baseY - 3, 2,
        baseX, baseY, 12
    );
    knobGrad.addColorStop(0, '#666');
    knobGrad.addColorStop(1, '#000');

    ctx.fillStyle = knobGrad;
    ctx.fill();
	
	ctx.lineWidth = 1;
}

//tachimetro sgargiullo!
function drawSpeedometer() {
    const cx = width - 70;
    const cy = height - 10;
    const radius = 60;

    // fondo
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 3.14, 6.28);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    
	// bordo	
	ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

	// zona rossa e' il contagiri
	ctx.lineWidth = 1 + rpmTarget * 6;
	let colGB = 255 - (255 * rpmTarget);
	ctx.strokeStyle = 'rgba(255,'+colGB+','+colGB+','+rpmTarget+')';//rosso non trasparente!
	ctx.beginPath();
    ctx.arc(cx, cy, radius - 5, 3.14 + (3.14*(rpmTarget-0.15)), 6.28);
	ctx.stroke();	
	
    // tacche
	ctx.strokeStyle = '#fff';
	ctx.lineWidth = 3;
    for (let i = 0; i <= 6; i++) {
        let t = i / 6;
        let angle = Math.PI + t * Math.PI;

        let x1 = cx + Math.cos(angle) * (radius - 10);
        let y1 = cy + Math.sin(angle) * (radius - 10);

        let x2 = cx + Math.cos(angle) * radius;
        let y2 = cy + Math.sin(angle) * radius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // LANCETTA VELOCITA
    let t = speed / (maxSpeed + 60);
    let angle = Math.PI + t * Math.PI;

    let nx = cx + Math.cos(angle) * (radius - 15);
    let ny = cy + Math.sin(angle) * (radius - 15);

	ctx.lineWidth = 5;
	ctx.strokeStyle = '#f00';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(nx, ny);
    ctx.stroke();
	
    // centro
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // testo velocità
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText((speed | 0) + ' km/h', cx, cy - 10);
	
	ctx.lineWidth = 1;
}


//RENDER!
function render() {
    update();
    drawSky(skyOffset);
	
	
	
	let startPos = Math.floor(playerZ / segL);
	let camHeight = segments[startPos % segments.length].p1.world.y + camH;
	
    let x = 0;
    let dx = 0;

    // Road Loop
    for (let n = startPos; n < startPos + drawDistance; n++) {
        let s = segments[n % segments.length];
        let loop = (n >= segments.length) ? trackL : 0;

        project(s.p1, playerX * roadW - x, camHeight, playerZ - loop);
        project(s.p2, playerX * roadW - x - s.curve, camHeight, playerZ - loop);

        x += dx;
		dx += s.curve;

        // "Gap Fix": Usiamo y del segmento precedente per tappare i buchi
        if (n > startPos) {
            let prev = segments[(n - 1) % segments.length];
            drawSegment(prev.p2.screen.x, prev.p2.screen.y, prev.p2.screen.w,
                s.p2.screen.x, s.p2.screen.y, s.p2.screen.w,
                n);
        }
    }
	
	
	

    // Sprites & Collision (simplified logic for performance)
    for (let n = startPos + drawDistance; n > startPos; n--) {
        let s = segments[n % segments.length];
        if (s.sprite && s.p1.screen.scale > 0) {
            drawSprite(s.sprite, s.p1);

            /*if(n === startPos+8 && Math.abs(playerX - s.sprite.x) < 0.5 && gameState === 'ALIVE') {
                gameState = 'CRASHED';
				speed = 150;
            }*/
            // Collisione: segmento vicino + sovrapposizione X
            let segDist = n - startPos;
            if (segDist > 2 && segDist < 15 && gameState === 'ALIVE') {

                console.log(`seg ${n}: playerX=${playerX.toFixed(2)}, spriteX=${s.sprite.x}, dist=${Math.abs(playerX - s.sprite.x).toFixed(2)}`);

                // hitbox sprite: largo ~0.4 unità, centrato su sprite.x
                let spriteHalfW = 0.4;
                // hitbox macchina: larga ~0.3 unità, centrata su playerX
                let carHalfW = 0.3;
                let overlap = Math.abs(playerX - s.sprite.x) < 0.15; //(spriteHalfW + carHalfW);
                if (overlap) {
                    gameState = 'CRASHED';
                    speed = 150;
                }
            }
        }
    }

    // Player Car
    drawCar();
	drawSpeedometer();
	drawGearStick();

    requestAnimationFrame(render);
}

// ====== INPUT: TOUCH (multi-touch) ======
// Mappa: quale tasto preme ogni bottone on-screen
const btnMap = {
    'btn-left':  'left',
    'btn-right': 'right',
    'btn-gas':   'up',
    'btn-brake': 'down'
};

function getBtnKey(el) {
    // Risali l'albero DOM finché trovi un btn con id mappato
    while (el && el !== document.body) {
        if (el.id && btnMap[el.id]) return btnMap[el.id];
        el = el.parentElement;
    }
    return null;
}

// Tiene traccia dei touch attivi per ogni key
const touchKeys = {};

document.getElementById('controls').addEventListener('touchstart', (e) => {
    e.preventDefault();
    resumeAudio();
    for (let t of e.changedTouches) {
        let el = document.elementFromPoint(t.clientX, t.clientY);
        let key = getBtnKey(el);
        if (key) {
            touchKeys[t.identifier] = key;
            keys[key] = 1;
            // feedback visivo
            let btnEl = document.getElementById(Object.keys(btnMap).find(k => btnMap[k] === key));
            if (btnEl) btnEl.classList.add('pressed');
        }
    }
}, { passive: false });

document.getElementById('controls').addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        let key = touchKeys[t.identifier];
        if (key) {
            // rilascia solo se nessun altro dito preme lo stesso tasto
            let stillPressed = false;
            for (let id in touchKeys) {
                if (id != t.identifier && touchKeys[id] === key) { stillPressed = true; break; }
            }
            if (!stillPressed) {
                keys[key] = 0;
                let btnEl = document.getElementById(Object.keys(btnMap).find(k => btnMap[k] === key));
                if (btnEl) btnEl.classList.remove('pressed');
            }
            delete touchKeys[t.identifier];
        }
    }
}, { passive: false });

document.getElementById('controls').addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        let key = touchKeys[t.identifier];
        if (key) { keys[key] = 0; delete touchKeys[t.identifier]; }
    }
}, { passive: false });

// Blocca context menu su long press (mobile)
document.addEventListener('contextmenu', e => e.preventDefault());

// ====== AVVIO ======
initSegments();
initPalette();
render();

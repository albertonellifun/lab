<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>OutRun Clone</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background: #000;
            overflow: hidden;
            width: 100%; 
			height: 100%;
			height: 100dvh;/* fix redmi? */
            touch-action: none; /* blocca scroll/zoom con dita */
        }
        #wrapper {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			height: 100dvh;/* fix redmi? */
			overflow: hidden;
		}
		canvas {
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			border: none;
		}

        /* ====== CONTROLLI TOUCH ====== */
        #controls {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: space-between;
			align-items: flex-end;
			padding: 12px;
			padding-bottom: max(28px, env(safe-area-inset-bottom, 28px));
			pointer-events: none;
			z-index: 40;
		}
        .ctrl-group {
			display: flex;
			gap: 20px;
			pointer-events: all;

		}
        .btn {
            width: 20vw;
			height: 20vw;
			max-width: 120px;

            font-size: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;

            cursor: pointer;
            transition: background 0.1s;
            /* touch highlight disabilitato */
            -webkit-tap-highlight-color: transparent;
			filter: opacity(0.25);
        }
        .btn:active, .btn.pressed {
            background: rgba(255,255,255,0.4);
        }
        #btn-gas {
            background: rgba(60,255,60,0.25);
            border-color: rgba(60,255,60,0.75);
        }
        #btn-brake {
			background: rgba(255,60,60,0.25);
            border-color: rgba(255,60,60,0.75);
        }
		#buildtime {
			position: absolute;
			top: 10px;
			right: 10px;
			color: rgba(255,255,255,0.5);
			font: 12px monospace;
			z-index: 50;
			pointer-events: none;
		}
    </style>
</head>

        </div>

</div>

<script>
fetch('https://api.github.com/repos/albertonellifun/lab/commits/main')
  .then(r => r.json())
  .then(data => {
    let d = new Date(data.commit.author.date);
    let ts = d.toLocaleString('it-IT', {timeZone:'Europe/Rome'});
    document.getElementById('buildtime').textContent = ts;
  });

const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;//velocizza?

const BASE_W = 800;
const BASE_H = 600;

let width = BASE_W;
let height = BASE_H;

/*

function resizeCanvas() {
    // Rimuoviamo il DPR (devicePixelRatio) per non sovraccaricare la GPU
    const scale = Math.min(
        window.innerWidth / BASE_W,
        window.innerHeight / BASE_H
    );
    canvas.width = BASE_W;  // Risoluzione fissa 800
    canvas.height = BASE_H; // Risoluzione fissa 600
    canvas.style.width = (BASE_W * scale) + "px";
    canvas.style.height = (BASE_H * scale) + "px";
    ctx.setTransform(1, 0, 0, 1, 0, 0); 
    width = BASE_W;
    height = BASE_H;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);


// --- SETTINGS ---
let roadW = 2000;
const segL = 200;
const camH = 1500;
const drawDistance = 200;
const fieldOfView = 100;
const camD = 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);

//PLAYER OGGETTO NEL MONDO
const player = {
    state: 'ALIVE',	//stato
	x: 0,			//posizione x
    z: 1,			//segmento
    speed: 0,		//velocita
	maxSpeed: 340,	//velocita max
	accel: 1,		//accelerazione max
	brake: 1.8,		//max forza frenante
	tilt: 0,		//inclinazione (in curva, figata!)
};

let skyOffset = 0;
let crashTimer = 0;
let CAR_WIDTH = 120;//ferrari larga in px

const keys = { left: 0, right: 0, up: 0, down: 0 };

const START_IDX = 15;//dove e' visivamente il traguardo "alto"



//AUDIO BRUM BRUM!
let gear = 1;
let rpm = 0.5;
let rpmTarget = 0.5;
let lastGear = 1;
const gearRatios = [0, 1, 60, 120, 180, 240, 280, 350];// velocità a cui scatta il cambio

//motore auto realistico??? :-)
const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

// 3 oscillatori: fondamentale + 2 armoniche
const osc1 = audioCtx.createOscillator(); osc1.type = 'sawtooth'; // fondamentale — corpo del rombo
const osc2 = audioCtx.createOscillator(); osc2.type = 'square';// 2a armonica — aggressività
const osc3 = audioCtx.createOscillator(); osc3.type = 'triangle';// 3a armonica — coda metallica

const g1 = audioCtx.createGain(); g1.gain.value = 1.0;
const g2 = audioCtx.createGain(); g2.gain.value = 0.4;
const g3 = audioCtx.createGain(); g3.gain.value = 0.2;

// filtro bandpass: simula la camera d'aspirazione
const engineFilter = audioCtx.createBiquadFilter();
engineFilter.type = 'bandpass';
engineFilter.frequency.value = 120;
engineFilter.Q.value = 1.2;

// rumore di scoppio (combustione)
const noiseBuffer = audioCtx.createBuffer(1, 65536, audioCtx.sampleRate);
const nd = noiseBuffer.getChannelData(0);
for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

const noiseSource = audioCtx.createBufferSource();
noiseSource.buffer = noiseBuffer;
noiseSource.loop = true;

const noiseGain = audioCtx.createGain();
noiseGain.gain.value = 0.02;

const masterGain = audioCtx.createGain();
masterGain.gain.value = 0;

osc1.connect(g1); g1.connect(engineFilter);
osc2.connect(g2); g2.connect(engineFilter);
osc3.connect(g3); g3.connect(masterGain);

engineFilter.connect(masterGain);
noiseSource.connect(noiseGain);
noiseGain.connect(masterGain);
masterGain.connect(audioCtx.destination);

osc1.start(); 
osc2.start(); 
osc3.start(); 
noiseSource.start();

function resumeAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
}


// --- TRACK GENERATION ---
let gamePalette = {};
let segments = [];
//nota: 1257 ha inizio e fine coincidenti sin/cos + aggiunti 500 tutti dritti
//ocho ai dati in console -> ci piace quando s[0].y == s[last].y
const SEGMENTS = 1257 * 2 + 486;//2514 + 486dx4 = 3000, numero intero
const trackL = SEGMENTS * segL;

//JOHNNY, IL PROBLEMA DELLA SICILIA E' IL... TRAFFICO!!!
const CAR_COLORS = [
	{light:'#0f0',dark:'#0b0'},
	{light:'#00f',dark:'#00b'},
	{light:'#ff0',dark:'#bb0'},
	{light:'#0ff',dark:'#0bb'},
	{light:'#f0f',dark:'#b0b'},
	{light:'#fff',dark:'#bbb'},
	{light:'#999',dark:'#555'},
	{light:'#444',dark:'#222'},
	{light:'#f80',dark:'#b40'},
	{light:'#0f4',dark:'#0b0'},
	{light:'#04f',dark:'#00b'}
	];

const trafficCars = Array.from({ length: 15 }, (_, i) => ({
    x: (i % 3 === 0) ? -0.35 : (i % 3 === 1) ? 0 : 0.35,
    z: (i + 1) * (trackL / 15),     // distribuite lungo la pista
    speed: 30 + Math.random() * 40, // 30-70, molto più lente della Ferrari
    color: CAR_COLORS[i%CAR_COLORS.length]
}));



//per la hitbox
const SPRITE_CONFIG = {
    tree:         { width: 0.10 },//
	palm:         { width: 0.10 },//
    billboard:    { width: 0.75 },//
	signlow:      { width: 0.25 },//
	signhigh:     { width: 0.25 },//
    cone:         { width: 0.15 },//
    bush:         { width: 0.40 },//
    trafficlight: { width: 0.10 },//
    oil:          { width: 0.40 },//
    start:        { width: 0   }
};

function addSegment(idx, curve, y) {
	let n = segments.length;
    let sprite = null;
    if ( idx === START_IDX || 
		(idx % 4 === 0 && (
			(idx > 200 && idx < 400) || //alberi ogni 4 seg
			(idx > 600 && idx < 800) || //frecce ogni 8 seg
			(idx > 900 && idx < 1000) || //coni ogni 2 seg
			(idx > 1200 && idx < 1500) || //bush ogni 4 seg
			(idx > 2000 && idx < 2200) || //freccione ogni 8 seg
			(idx > 2500 && idx < 2700) || //palme ogni 4 seg
			(idx > 2800 && idx < 2900) //semafori ogni 4 seg
			|| Math.random() > 0.75
		) ) ){
        //crea oggetto a bordo strada
		let type = '';
        let position = 0;
		
        if (idx === START_IDX) type = 'start';
        else if (idx > 200 && idx < 400) type = 'tree';
        else if (idx > 600 && idx < 800) type = 'signlow';
		else if (idx > 900 && idx < 1000) type = 'cone';
		else if (idx > 1200 && idx < 1500) type = 'bush';
		else if (idx > 2000 && idx < 2200) type = 'signhigh';
		else if (idx > 2500 && idx < 2700) type = 'palm';
		else if (idx > 2800 && idx < 2850) type = 'trafficlight';
        else {
			const r = Math.random();
			if (r < 0.10) type = 'tree';
			else if (r < 0.50) type = 'bush';
			else if (r < 0.75) type = 'billboard';
			else if (r < 0.92) type = 'oil';
			else if (r < 0.94) type = 'signlow';
			else if (r < 0.96) type = 'cone';
			else if (r < 0.98) type = 'trafficlight';
			else type = 'signhigh';
		}

        if (type === 'billboard') {
            //cartelloni lontani dal bordo
            if (curve > 0) position = -1.6;
            else position = 1.6;
        } else if (type === 'signlow' || type === 'signhigh') {
			//cartelloni stradali piu vicini al bordo, esterni alle curve
            if (curve > 0) position = -1.3;
            else position = 1.3;
		} else if (type === 'start') {
            position = -1.6;//start piu lontano
        } else if (type === 'cone') {
		    position = idx % 8 === 0 ? -0.9 : 0.9; //cono alternato
		} else if (type === 'trafficlight') {
			position = idx % 8 === 0 ? -1.2 : 1.2; //semaforo alternato
		} else if (type === 'bush') {
			position = idx % 8 === 0 ? -1.4 : 1.4; //cespuglio alternato
		} else if (type === 'oil') {
			position = idx % 8 === 0 ? -0.5 : 0.5;//olio alternato
		} else if (type === 'palm' || type === 'tree') {
            position = idx % 8 === 0 ? -1.6 : 1.6; //albero/palma lato alternato
        }

        sprite = {
            x: position,
            type: type,
			width: SPRITE_CONFIG[type].width
        };
    }

    segments.push({
        p1: {
            world: { x: 0, y: y, z: n * segL},
            screen: { x: 0, y: 0, w: 0 }
        },
        p2: {
            world: { x: 0, y: y, z: (n + 1) * segL },
            screen: { x: 0, y: 0, w: 0 }
        },
        curve: curve,
        sprite: sprite
    });
}

function initPalette() {
	//ogni secondo switcha
	let currentPalette = ((Date.now()/1000)|0) % 3;
	if (currentPalette === 2) {
		gamePalette = {
			skyLight:'#8ae',	
			skyDark:'#68e', 
			mountainsLight:'#db7',

			terrain:'#db7',
			roadDark: '#b9a', 
			roadLight: '#cab', 
			grassDark: '#db9', 
			grassLight: '#eca', 
			rumbleDark: '#ffe',//cordolo marroncino
			rumbleLight: '#963',//cordolo marroncino
			bushDark: '#a84',//anche erba marroncina
			bushLight: '#ca6',//palme marroncine
		};
	} else if (currentPalette === 1) {
		gamePalette = {
			skyLight: '#d7f0ff',   // cielo chiaro ghiacciato
			skyDark:  '#6aaed6',   // blu freddo
			mountainsLight: '#e6eef5', // neve lontana
			mountainsDark:  '#9fb3c8', // montagne fredde
			terrain: '#e8f2fb', // neve generale
			roadDark: '#3a3f46', // asfalto freddo
			roadLight:'#4a5058',
			grassDark: '#dfe9f2', // neve sporca
			grassLight:'#f5fbff',
			rumbleDark: '#ffffff', // bordo neve
			rumbleLight:'#cfd8e3', // ghiaccio/grigio
			bushDark: '#cfdbe6', // cespugli ghiacciati
			bushLight:'#e9f3fb', // palme glacier
		};
	} else {
		gamePalette = { 
			skyLight:'#8cf',	
			skyDark:'#05f',
			mountainsLight:'#151',	
			mountainsDark:'#141',
			terrain:'#181',
			roadDark: '#444', 
			roadLight: '#555', 
			grassDark: '#171', 
			grassLight: '#181', 
			rumbleDark: '#fff',//cordolo bianco/rosso
			rumbleLight: '#f00',//cordolo bianco/rosso
			bushDark: '#161',
			bushLight: '#272',
		};
	}
}

function initSegments() {
	for (let i = 0; i < SEGMENTS - 486; i++) {
        addSegment(i, Math.sin(i / 90) * 4, Math.cos(i / 50) * 1000);
		//console.log('i=' + i + '\ty=' + Math.cos(i / 50) * 1000);
    }
	let last = SEGMENTS - 486;
	let lastSin = Math.sin(last / 90);
	let lastCos = Math.cos(last / 50) * 1000;
	for (let i = last; i < SEGMENTS; i++) {
		addSegment(i, lastSin, lastCos);
	}
	console.log('delta= ' + (segments[0].p1.world.x - segments[SEGMENTS - 1].p1.world.x) + ' ' + (segments[0].p1.world.y - segments[SEGMENTS - 1].p1.world.y) );
}


// --- PROJECTION - il trucco e' qui: disegno trapezi per simulare il 3d
function project(p, camX, camY, camZ) {
    p.screen.scale = camD / Math.max(0.1, (p.world.z - camZ));
    p.screen.x = (1 + p.screen.scale * (p.world.x - camX)) * width / 2;
    p.screen.y = (1 - p.screen.scale * (p.world.y - camY)) * height / 2;
    p.screen.w = p.screen.scale * roadW * width / 2;
}

// --- BACKGROUND ---
function drawSky(offset) {
    //cielo
    let g = ctx.createLinearGradient(0, 0, 0, height / 2);
    g.addColorStop(0, gamePalette.skyDark);
    g.addColorStop(1, gamePalette.skyLight);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height / 2);
    ctx.fillStyle = gamePalette.terrain;
    ctx.fillRect(0, height / 2, width, height);
	
	//sole
	// si muove lentamente con lo skyOffset, ma rimane sempre in cielo
	let sunX = (width * 0.35 - offset * 0.01) % width;
	if (sunX < 0) sunX += width;
	let sunY = height * 0.25;
	let sunR = 32;

	// alone esterno (glow giallo pallido)
	let glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.6, sunX, sunY, sunR * 2.5);
	glow.addColorStop(0, 'rgba(255, 255, 120, 0.5)');
	glow.addColorStop(1, 'rgba(255, 255, 120, 0)');
	ctx.fillStyle = glow;
	ctx.beginPath();
	ctx.arc(sunX, sunY, sunR * 2.5, 0, Math.PI * 2);
	ctx.fill();

	// disco solare
	let sunGrad = ctx.createRadialGradient(sunX - sunR * 0.3, sunY - sunR * 0.3, 2, sunX, sunY, sunR);
	sunGrad.addColorStop(0, '#ff9');
	sunGrad.addColorStop(1, '#ee0');
	ctx.fillStyle = sunGrad;
	ctx.beginPath();
	ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
	ctx.fill();


    //montagne lontane -> cittareale pro loco docet!
    ctx.fillStyle = gamePalette.mountainsDark;
    for (let i = -1; i < 3; i++) {
        let x = (i * width * 1.5) - (offset * 0.15 % (width * 1.5));
        ctx.beginPath();
        ctx.moveTo(x, height / 2);
        ctx.lineTo(x + 150, height / 2.8);
        ctx.lineTo(x + 300, height / 2.2);
        ctx.lineTo(x + 450, height / 3.5);
        ctx.lineTo(x + 600, height / 2);
		ctx.lineTo(x + 750, height / 2.5);
		ctx.lineTo(x + 900, height / 2);
        ctx.fill();
    }
	
	//colline vicine
    ctx.fillStyle = gamePalette.mountainsLight;
    for (let i = -1; i < 3; i++) {
        let x = (i * width * 1.2) - (offset * 0.25 % (width * 1.2));
        ctx.beginPath();
        ctx.moveTo(x, height / 2);
        ctx.quadraticCurveTo(x + 300, height / 2.5, x + 600, height / 2);
        ctx.fill();
    }
}

function drawSegment(x1, y1, w1, x2, y2, w2, idx) {

    // Erba
    ctx.fillStyle = idx%2 ? gamePalette.grassDark : gamePalette.grassLight; //erba
    ctx.fillRect(0, y2, width, y1 - y2);
	
    // Cordoli
    ctx.fillStyle = idx%2 ? gamePalette.rumbleDark : gamePalette.rumbleLight; //cordolo
    ctx.beginPath();
    ctx.moveTo(x1 - w1 * 1.1, y1);
    ctx.lineTo(x2 - w2 * 1.1, y2);
    ctx.lineTo(x2 + w2 * 1.1, y2);
    ctx.lineTo(x1 + w1 * 1.1, y1);
    ctx.fill();
	
    // Strada
    ctx.fillStyle = idx%2 ? gamePalette.roadDark : gamePalette.roadLight; //asfalto
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1 + 1);
    ctx.lineTo(x2 - w2, y2 - 1);
    ctx.lineTo(x2 + w2, y2 - 1);
    ctx.lineTo(x1 + w1, y1 + 1);
    ctx.fill();

    // TRATTEGGIO: disegna il trapezio solo sui segmenti pari
    if (Math.floor(idx / 2) % 2 === 0) {
        let dw1 = Math.max(1.5, w1 * 0.045);
        let dw2 = Math.max(0.8, w2 * 0.045);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.moveTo(x1 - dw1, y1);
        ctx.lineTo(x2 - dw2, y2);
        ctx.lineTo(x2 + dw2, y2);
        ctx.lineTo(x1 + dw1, y1);
        ctx.fill();
    }
}

function update() {
	//
	let offRoad = Math.abs(player.x) > 1;
	let normalizedSpeed = player.speed / player.maxSpeed;
	
    if (player.state === 'CRASHED') {
        player.speed *= 0.95;
        crashTimer++;
		
        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);// Spegni il motore gradualmente
		
        if (player.speed < 1) {
            player.state = 'ALIVE';
            crashTimer = 0;
            player.x = 0;
        }
    } else {
		if (keys.up) {
			player.speed += player.accel * (1 - normalizedSpeed ) * (offRoad ? 0.2 : 1);
		}
        else if (keys.down) {
			player.speed -= player.brake * (offRoad ? 0.2 : 1);
		}
        else {
			//rallenta pian piano (friction)
			player.speed *= 0.997;
		}

        if (keys.left) { 
			player.x -= 0.05 * normalizedSpeed; 
			
			player.tilt += 0.01 * normalizedSpeed;
			if (player.tilt < -0.03) player.tilt = -0.03; else if (player.tilt > 0.03) player.tilt = 0.03;
		} else if (keys.right) { 
			player.x += 0.05 * normalizedSpeed; 
			
			player.tilt -= 0.01 * normalizedSpeed;
			if (player.tilt < -0.03) player.tilt = -0.03; else if (player.tilt > 0.03) player.tilt = 0.03;
		} else {
			player.tilt *= 0.98;//riaddrizza pian piano
		}

        // CURVA: la macchina scivola verso l'esterno proporzionalmente alla velocità
        let cur = segments[Math.floor(player.z / segL) % segments.length];
        player.x -= cur.curve * normalizedSpeed * 0.005;

        //AUDIO!
        // --- GEAR DETECTION ---
        let targetGear = player.speed === 0 ? 0 : 1;
        for (let g = 1; g < gearRatios.length; g++) {
            if (player.speed > gearRatios[g]) targetGear = g;
        }

        // CAMBIO MARCIA: imposta rpm target con drop/spike udibile
        if (targetGear !== lastGear) {
            if (targetGear > lastGear) {
                rpm = 0.25; // cambio in su: drop brusco dei giri
            } else {
                rpm = 0.95; // scalata: spike verso alto
            }
            lastGear = targetGear;
        }
        gear = targetGear;

        // RPM target basato su posizione nella marcia attuale
        let gearBottom = gearRatios[gear] || 0;
        let gearTop = gearRatios[Math.min(gear + 1, gearRatios.length - 1)] || player.maxSpeed;
        rpmTarget = Math.max(0.15, Math.min(1.0, (player.speed - gearBottom) / Math.max(1, gearTop - gearBottom)));

        // RPM segue il target con inerzia — il drop/spike rimane udibile per ~0.3s
        rpm += (rpmTarget - rpm) * 0.08;

        // Frequenza fondamentale
        let gas = keys.up ? 1 : 0;
        let baseFreq = (800 + rpm * 3200) / 60 * 4;
        baseFreq *= (0.85 + gas * 0.15);

        osc1.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.04);
        osc2.frequency.setTargetAtTime(baseFreq * 2, audioCtx.currentTime, 0.04);
        osc3.frequency.setTargetAtTime(baseFreq * 3, audioCtx.currentTime, 0.04);

        engineFilter.frequency.setTargetAtTime(80 + gas * 600 + rpm * 400, audioCtx.currentTime, 0.06);
        noiseGain.gain.setTargetAtTime(0.015 + gas * 0.05, audioCtx.currentTime, 0.05);
        masterGain.gain.setTargetAtTime(player.speed > 3 ? (0.08 + gas * 0.05) : 0.03, audioCtx.currentTime, 0.1);
    }
	
    player.speed = Math.max(0, Math.min(player.speed, player.maxSpeed)); //inibisce la retro!
    player.z += player.speed;
	
    player.z = (player.z + trackL) % trackL;
	
    let cur = segments[Math.floor(player.z / segL) % segments.length];
    skyOffset += cur.curve * normalizedSpeed * 10;

	//aggiorno anche il traffico!
	for (let car of trafficCars) {
		car.z = (car.z + car.speed + trackL) % trackL;
	}
}

//ai bordi -> alberi o cartelloni
function drawSprite(sprite, p) {
    let scale = p.screen.scale;
    let x = p.screen.x + (scale * sprite.x * roadW * width / 2);
    let y = p.screen.y;
    let w = Math.max(0, 400 * scale * (width / 2));
    let h = Math.max(0, 400 * scale * (width / 2));

    let radius = Math.max(0, w * 0.5); //OCHO: il raggio non puo essere negativo

    if (sprite.type === 'start') {
        let poleWidth = w / 4;
        let barWidth = w * 16;//non mi piace!
		barWidth = roadW * scale * width * Math.abs(sprite.x);//1.6
		let quadratino = w / 2;//non mi piace!
		quadratino = barWidth / 32;
		let startHeight = h * 8;
		let startBarHeight = h * 2;
        //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.fillRect(x - poleWidth * 1.5, y - 4, barWidth + poleWidth * 3, h * 0.25);

        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#000';
        //palo
        ctx.fillRect(x - poleWidth / 2, y - startHeight, poleWidth, startHeight);
        ctx.strokeRect(x - poleWidth / 2, y - startHeight, poleWidth, startHeight);
        //altro palo 
        ctx.fillRect(x - poleWidth / 2 + barWidth, y - startHeight, poleWidth, startHeight);
        ctx.strokeRect(x - poleWidth / 2 + barWidth, y - startHeight, poleWidth, startHeight);

        //barra orizzontale larga
        ctx.fillRect(x, y - startHeight, barWidth, h * 2);
        ctx.strokeRect(x, y - startHeight, barWidth, h * 2);
        //scacchiera
        ctx.fillStyle = '#222';
        for (let i = 0; i < 16; i++) {
            ctx.fillRect(x + 2 * i * quadratino, y - startHeight, quadratino, h * 0.5);
            ctx.fillRect(x + 2 * i * quadratino, y - startHeight + startBarHeight/2,  quadratino, h * 0.5);
        }
        ctx.fillStyle = '#222';
        for (let i = 0; i < 16; i++) {
            ctx.fillRect(x + (2 * i + 1) * quadratino, y - startHeight + startBarHeight/4, quadratino, h * 0.5);
            ctx.fillRect(x + (2 * i + 1) * quadratino, y - startHeight + 3*startBarHeight/4, quadratino, h * 0.5);
        }

    } else if (sprite.type === 'tree') {
        //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //tronco alto h*2
        ctx.fillStyle = '#531';
        ctx.fillRect(x - w * 0.1, y - h * 2, w * 0.2, h * 2);

        //chioma w/2
        ctx.fillStyle = gamePalette.bushDark;//'#161';
        ctx.beginPath();
        ctx.arc(x, y - h * 2, radius * 1.5, 0, Math.PI * 2);
        ctx.fill();
	} else if (sprite.type === 'bush') {
		//ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 2, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
		//chioma w/2
        ctx.fillStyle = gamePalette.bushDark;//'#161';
        ctx.beginPath();
        ctx.arc(x, y, radius * 2, Math.PI, Math.PI * 2);
		ctx.closePath();
        ctx.fill();
	} else if (sprite.type === 'oil') {
		//ombra==chiazza d'olio
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 2, radius * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
	}else if (sprite.type === 'cone') {
		//ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 0.8, radius * 0.2, 0, 0, Math.PI * 2);
		ctx.fill();

		//triangolo
		ctx.fillStyle = '#f60'; // arancione
		ctx.beginPath();
		ctx.moveTo(x, y - h * 0.75);                // punta
		ctx.lineTo(x - w * 0.25, y);         // base sx
		ctx.lineTo(x + w * 0.25, y);         // base dx
		ctx.closePath();
		ctx.fill();

		//strisce bianche
		ctx.fillStyle = '#fff';

		//striscia alta
		ctx.beginPath();
		ctx.moveTo(x - w * 0.08, y - h * 0.5);
		ctx.lineTo(x + w * 0.08, y - h * 0.5);
		ctx.lineTo(x + w * 0.12, y - h * 0.4);
		ctx.lineTo(x - w * 0.12, y - h * 0.4);
		ctx.closePath();
		ctx.fill();

		//striscia centrale
		ctx.beginPath();
		ctx.moveTo(x - w * 0.16, y - h * 0.25);
		ctx.lineTo(x + w * 0.16, y - h * 0.25);
		ctx.lineTo(x + w * 0.2, y - h * 0.15);
		ctx.lineTo(x - w * 0.2, y - h * 0.15);
		ctx.closePath();
		ctx.fill();
	} else if (sprite.type === 'trafficlight') {
		//ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
		ctx.beginPath();
		ctx.ellipse(x, y, radius * 0.7, radius * 0.2, 0, 0, Math.PI * 2);
		ctx.fill();

		//palo
		ctx.fillStyle = '#444';
		ctx.fillRect(x - w * 0.05, y - h * 1.5, w * 0.1, h * 1.5);

		//corpo giallo
		let boxW = w * 0.4;
		let boxH = h * 0.9;
		ctx.fillStyle = '#fc3'; // giallo acceso
		ctx.fillRect(x - boxW / 2, y - h * 1.5 - boxH, boxW, boxH);
		ctx.strokeStyle = '#da1';
		ctx.lineWidth = 2;
		ctx.strokeRect(x - boxW / 2, y - h * 1.5 - boxH, boxW, boxH);

		//3 luci
		let lightRadius = boxW * 0.25;
		let cx = x;
		let top = y - h * 1.5 - boxH;

		//rosso
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.2, lightRadius * 1.5, Math.PI, Math.PI * 2);
		ctx.strokeStyle = '#da1';
		ctx.lineWidth = 4;
		ctx.stroke();
		ctx.lineWidth = 1;
		
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.2, lightRadius * 1.4, 0, Math.PI * 2);
		ctx.fillStyle = '#500';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+2, top + boxH * 0.2, lightRadius * 1.4, 0, Math.PI * 2);
		ctx.fillStyle = '#700';
		ctx.fill();

		//giallo
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.5, lightRadius, 0, Math.PI * 2);
		ctx.fillStyle = '#550';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+1, top + boxH * 0.5, lightRadius * 0.8, 0, Math.PI * 2);
		ctx.fillStyle = '#770';
		ctx.fill();

		//verde
		ctx.beginPath();
		ctx.arc(cx, top + boxH * 0.8, lightRadius, 0, Math.PI * 2);
		ctx.fillStyle = '#070';
		ctx.fill();
		ctx.beginPath();
		ctx.arc(cx+1, top + boxH * 0.8, lightRadius * 0.8, 0, Math.PI * 2);
		ctx.fillStyle = '#0e0';
		ctx.fill();
	} else if (sprite.type === 'signlow') {
        //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //cartellone
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - w * 0.5, y - h, w, h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(x - w * 0.5, y - h, w, h);

        //freccione rosso
        if (sprite.x <= 0) {
            ctx.fillStyle = '#f00';
            ctx.strokeStyle = '#b00';
            ctx.beginPath();
            ctx.moveTo(x - w * 0.5 + 2, y - h + 2); //alto sx
            ctx.lineTo(x - w * 0, y - h + 2); //alto dx
            ctx.lineTo(x + w * 0.5 - 2, y - h / 2); //mezzo dx
            ctx.lineTo(x - w * 0, y - 2); //basso dx
            ctx.lineTo(x - w * 0.5 + 2, y - 2); //basso sx
            ctx.lineTo(x - w * 0 - 2, y - h / 2); //mezzo sx
        } else {
            ctx.fillStyle = '#f00';
            ctx.strokeStyle = '#b00';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5 - 2, y - h + 2); //alto dx
            ctx.lineTo(x + w * 0, y - h + 2); //alto sx
            ctx.lineTo(x - w * 0.5 + 2, y - h / 2); //mezzo sx
            ctx.lineTo(x + w * 0, y - 2); //basso sx
            ctx.lineTo(x + w * 0.5 - 2, y - 2); //basso dx
            ctx.lineTo(x + w * 0 + 2, y - h / 2); //mezzo sx
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    } else if (sprite.type === 'signhigh') {
	    //ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
		
		//palo
		ctx.fillStyle = '#444';
		ctx.fillRect(x - w * 0.05, y - h * 2.1, w * 0.1, h * 2.1);

        //cartellone
        ctx.fillStyle = '#000';
        ctx.fillRect(x - w * 0.5, y - h*2, w, h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(x - w * 0.5, y - h*2, w, h);

        //freccione rosso
        if (sprite.x <= 0) {
            ctx.fillStyle = '#ff0';
            ctx.strokeStyle = '#bb0';
            ctx.beginPath();
            ctx.moveTo(x - w * 0.5 + 2, y - h*2 + 2); //alto sx
            ctx.lineTo(x - w * 0, y - h*2 + 2); //alto dx
            ctx.lineTo(x + w * 0.5 - 2, y - h*1.5); //mezzo dx
            ctx.lineTo(x - w * 0, y - h - 2); //basso dx
            ctx.lineTo(x - w * 0.5 + 2, y - h - 2); //basso sx
            ctx.lineTo(x - w * 0 - 2, y - h*1.5); //mezzo sx
        } else {
            ctx.fillStyle = '#ff0';
            ctx.strokeStyle = '#bb0';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.5 - 2, y - h*2 + 2); //alto dx
            ctx.lineTo(x + w * 0, y - h*2 + 2); //alto sx
            ctx.lineTo(x - w * 0.5 + 2, y - h*1.5); //mezzo sx
            ctx.lineTo(x + w * 0, y - h - 2); //basso sx
            ctx.lineTo(x + w * 0.5 - 2, y - h - 2); //basso dx
            ctx.lineTo(x + w * 0 + 2, y - h*1.5); //mezzo sx
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
	} else if (sprite.type === 'palm') {
		//il fusto si inclina sempre verso il centro della strada
		let lean = (sprite.x <= 0) ? 1 : -1;

		// Tip del fusto: offset orizzontale e altezza scalati con w/h
		let tipX = x + lean * w * 1.4;
		let tipY = y - h * 4;

		// Punti di controllo della curva di Bézier cubica
		let cp1x = x + lean * w * 0.2;
		let cp1y = y - h * 1.5;
		let cp2x = x + lean * w * 0.8;
		let cp2y = y - h * 2.8;

		//ombra
		ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 1.5, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

		// Fusto - fill marrone con valore chiaro
		ctx.strokeStyle = '#853';
		ctx.lineWidth = w * 0.22;
		ctx.beginPath();
		ctx.moveTo(x, y);
		ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tipX, tipY);
		ctx.stroke();

		// Venatura del fusto (nodi, tratteggio scuro)
		ctx.strokeStyle = '#742';
		ctx.lineWidth = w * 0.1;
		ctx.setLineDash([w * 0.15, w * 0.25]);
		ctx.beginPath();
		ctx.moveTo(x - lean * 2, y);
		ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tipX - lean * 2, tipY);
		ctx.stroke();
		ctx.setLineDash([]);
		
		// Rami: array di [angolo_rad, lunghezza_relativa]
		let branches = [
			[Math.PI * 1.5,          0.55],  // su
			[Math.PI * 1.5 + 0.6,    0.6],  // su-lato
			[Math.PI * 1.5 + 1.1,    0.8], // laterale
			[Math.PI * 1.5 - 0.6,    0.7],  // su-lato opposto
			[Math.PI * 1.5 - 1.1,    0.8], // laterale opposto
			[Math.PI * 1.5 + 0.6,    -0.9],  // giu-lato
			[Math.PI * 1.5 + 1.1,    -0.85], // giu laterale
			[Math.PI * 1.5 - 0.6,    -0.9],  // giu-lato opposto
			[Math.PI * 1.5 - 1.1,    -0.85], // giu laterale opposto
		];

		let branchLen = h * 1.5;
		ctx.lineWidth = w * 0.1;
		
		for (let [angle, lenFactor] of branches) {
			let bx = tipX + Math.cos(angle) * branchLen * lenFactor;
			let by = tipY + Math.sin(angle) * branchLen * lenFactor;
			ctx.strokeStyle = gamePalette.bushLight;
			ctx.beginPath();
			// curva leggera per ogni ramo
			ctx.moveTo(tipX, tipY);
			let midX = tipX + Math.cos(angle) * branchLen * lenFactor * 0.5;
			let midY = tipY + Math.sin(angle) * branchLen * lenFactor * 0.05 + h * 0.15;
			ctx.quadraticCurveTo(midX, midY, bx, by);
			ctx.stroke();
		}

		ctx.lineWidth = 1; // reset
	} else {
		//billboard
		//ombra
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.ellipse(x, y, radius * 4, radius * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();

        //cartellone
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - w*2, y - h, w * 4, h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(x - w*2, y - h, w * 4, h);
        
		ctx.fillStyle = '#f00';
        ctx.strokeStyle = '#b00';
        ctx.beginPath();
        ctx.moveTo(x + w * 2 - 2, y - h + 2); //alto dx
        ctx.lineTo(x + w * 1, y - h + 2); //alto sx
        ctx.lineTo(x - w * 2 + 2, y - 2); //basso sx
        ctx.lineTo(x - w * 1, y - 2); //basso dx
        ctx.lineTo(x + w * 2 - 2, y - h + 2); //alto dx
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
	}
}

//un rettangolo rosso -> testarossa di alb spettacolare anche senza biondona al seguito
function drawFerrari(cx, cy, w, colDark, colLight) {
    let s = w / 120;//scalato a 120px
	let bounce = (Math.random() * 2) * (player.speed / player.maxSpeed) * s;
	
	//gomme
    ctx.fillStyle = '#111';
    ctx.fillRect(cx - 60 * s, cy + 34 * s + bounce + player.tilt * 50 * s, 30 * s, 10 * s);
    ctx.fillRect(cx + 60 * s, cy + 34 * s + bounce - player.tilt * 50 * s, -30 * s, 10 * s);

    //corpo principale rosso ferrari scuro+chiaro
    ctx.fillStyle = colDark; // Rosso scuro per i lati
    ctx.fillRect(cx - 60 * s, cy + bounce, 120 * s, 36 * s);
    ctx.fillStyle = colLight; // Rosso acceso sopra
    ctx.fillRect(cx - 60 * s + 2 * s, cy + bounce + 1 * s, 120 * s - 4 * s, 30 * s);

    //tetto rosso acceso
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.moveTo(cx - 40 * s, cy + bounce);//40
    ctx.lineTo(cx - 25 * s, cy - 20 * s + bounce);//25,20
    ctx.lineTo(cx + 25 * s, cy - 20 * s + bounce);
    ctx.lineTo(cx + 40 * s, cy + bounce);
    ctx.fill();
    //lunotto nero
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.moveTo(cx - 40 * s, cy + bounce + 4 * s);//40
    ctx.lineTo(cx - 25 * s, cy - w/6 + bounce + 4 * s);//25,20
    ctx.lineTo(cx + 25 * s, cy - w/6 + bounce + 4 * s);
    ctx.lineTo(cx + 40 * s, cy + bounce + 4 * s);
    ctx.fill();

    //quadrozzo rosso sopra il motore
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.moveTo(cx - 15 * s, cy + bounce - 2 * s);//15
    ctx.lineTo(cx - 20 * s, cy + bounce + 3 * s);
    ctx.lineTo(cx + 20 * s, cy + bounce + 3 * s);
    ctx.lineTo(cx + 15 * s, cy + bounce - 2 * s);
    ctx.fill();

    //specchietti
    ctx.fillStyle = colLight;
    ctx.beginPath();
    ctx.ellipse(cx - 40 * s - 2 * s, cy + bounce - 8 * s, 5 * s, 3 * s, 0, 0, 6.28);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 40 * s + 2 * s, cy + bounce - 8 * s, 5 * s, 3 * s, 0, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.ellipse(cx - 40 * s - 1 * s, cy + bounce - 8 * s, 4 * s, 2.5 * s, 0, 0, 6.28);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 40 * s + 1 * s, cy + bounce - 8 * s, 4 * s, 2.5 * s, 0, 0, 6.28);
    ctx.fill();

    //base griglia nera
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 60 * s + 5 * s, cy + 10 * s + bounce, 120 * s - 10 * s, 16 * s);

    //fari posteriori
    ctx.fillStyle = '#500'; //rosso sotto
    ctx.fillRect(cx - 60 * s + 10 * s, cy + 16 * s + bounce, 20 * s, 6 * s);
    ctx.fillRect(cx + 60 * s - 30 * s, cy + 16 * s + bounce, 20 * s, 6 * s);
    ctx.fillStyle = '#f80'; //freccia gialla
    ctx.fillRect(cx - 60 * s + 10 * s, cy + 12 * s + bounce, 20 * s, 4 * s);
    ctx.fillRect(cx + 60 * s - 30 * s, cy + 12 * s + bounce, 20 * s, 4 * s);
    ctx.fillStyle = '#eee'; //bianco retro
    ctx.fillRect(cx - 60 * s + 30 * s, cy + 12 * s + bounce, 5 * s, 10 * s);
    ctx.fillRect(cx + 60 * s - 35 * s, cy + 12 * s + bounce, 5 * s, 10 * s);

    //linee orizzontali sopra i fari
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(cx - 60 * s + 5 * s, cy + 12 * s + (i * 3) * s + bounce);
        ctx.lineTo(cx + 60 * s - 5 * s, cy + 12 * s + (i * 3) * s + bounce);
        ctx.stroke();
    }

    //targa
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 15 * s, cy + 28 * s + bounce, 30 * s, 6 * s);

    //stemma
    ctx.fillStyle = '#ccc';
    ctx.fillRect(cx - 3 * s, cy + 15 * s + bounce, 6 * s, 6 * s);
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx - 2 * s, cy + 16 * s + bounce, 4 * s, 4 * s);

    //cannoni
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - 30 * s - 5 * s, cy + 32 * s + bounce,  15 * s, 6 * s);
    ctx.fillRect(cx + 30 * s + 5 * s, cy + 32 * s + bounce, -15 * s, 6 * s);
    ctx.strokeStyle = '#ccc';
    ctx.strokeRect(cx - 30 * s - 5 * s, cy + 32 * s + bounce,  15 * s, 6 * s);
    ctx.strokeRect(cx + 30 * s + 5 * s, cy + 32 * s + bounce, -15 * s, 6 * s);
}

function drawCar() {
    ctx.save();
    let cx = width / 2;//ferrari sempre al centro (overlay)
    let cy = height - 70;//bloccata in basso
    
	drawFerrariShadow(cx, cy, CAR_WIDTH);
	
    ctx.translate(cx, cy);

    if (player.state === 'CRASHED') {
        ctx.rotate(player.x > 0 ? crashTimer * 0.5 : -crashTimer * 0.5);
    } else {
		ctx.rotate(player.tilt);
	}        

    drawFerrari(0, 0, CAR_WIDTH, '#b00', '#f00');

    ctx.restore();
}

//cambiooo
let gearStickX = 0;
let gearStickY = 0;
function drawGearStick() {
    const x = 10;
    const y = height - 60;

    const w = 80;
    const h = 50;

    // --- BASE METALLICA ---
    let grad = ctx.createLinearGradient(x, y, x + w, y + h);
    grad.addColorStop(0, '#aaa');
    grad.addColorStop(0.5, '#eee');
    grad.addColorStop(1, '#888');

    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    // --- SCANALATURE (H pattern) ---
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 8;

    function line(x1,y1,x2,y2){
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }

    // colonne
	let col1 = x + w * 0.15;
    let col2 = x + w * 0.50;
	let col3 = x + w * 0.85;

    // righe
    let r1 = y + h * 0.15;
    let r2 = y + h * 0.5;
    let r3 = y + h * 0.85;

    // verticale sinistra/destra
    line(col1, r1, col1, r3);
    line(col2, r1, col2, r3);
	line(col3, r1, col3, r3);
	
    // orizzontali
    line(col1, r2, col3, r2);//include R
	
    
    // --- POSIZIONE MARCE ---
    const gearPos = {
		0: [col2, r2],
        1: [col1, r1],
        2: [col1, r3],
        3: [col2, r1],
        4: [col2, r3],
        5: [col3, r1],
        6: [col3, r3]
    };

    let pos = gearPos[gear] || gearPos[0];
	/*let baseX = pos[0];
    let baseY = pos[1];*/
	let targetX = pos[0];
	let targetY = pos[1];
	
	let ydist = Math.abs(gearStickY - targetY);
	let xdist = Math.abs(targetX - gearStickX);
	//console.log('xd='+xdist.toFixed(2)+' yd='+ydist.toFixed(2)+' gear='+gear);
	// prima vai in verticale per meta distanza (da 1 a folle c'e' un problema: fixed!)
	if (ydist > h * 0.5 || (gear === 0 && ydist > 1)) {
		gearStickY += (targetY - gearStickY) * 0.5;
	} else {
		// poi vai in orizzontale
		gearStickX += (targetX - gearStickX) * 0.5;
		
		if (xdist < 1) {
			gearStickY += (targetY - gearStickY) * 0.5;
		}
	}
	let baseX = gearStickX;
	let baseY = gearStickY;	
	
    // pomello (palla)
    ctx.beginPath();
    ctx.arc(baseX, baseY, 12, 0, Math.PI * 2);

    let knobGrad = ctx.createRadialGradient(
        baseX - 3, baseY - 3, 2,
        baseX, baseY, 12
    );
    knobGrad.addColorStop(0, '#999');
    knobGrad.addColorStop(1, '#000');

    ctx.fillStyle = knobGrad;
    ctx.fill();
	
	ctx.lineWidth = 1;
}

//tachimetro sgargiullo!
function drawSpeedometer() {
    const cx = width - 70;
    const cy = height - 10;
    const radius = 60;

    // fondo
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 3.14, 6.28);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();
    
	// bordo	
	ctx.lineWidth = 3;
    ctx.strokeStyle = '#fff';
    ctx.stroke();

	// zona rossa e' il contagiri
	ctx.lineWidth = 1 + rpmTarget * 6;
	let colGB = 255 - (255 * rpmTarget);
	ctx.strokeStyle = 'rgba(255,'+colGB+','+colGB+','+(rpmTarget*rpmTarget)+')';//rosso non trasparente!
	ctx.beginPath();
    ctx.arc(cx, cy, radius - 5, 3.14 + (3.14*(rpmTarget-0.15)), 6.28);
	ctx.stroke();	
	
    // tacche
	ctx.strokeStyle = '#fff';
	ctx.lineWidth = 3;
    for (let i = 0; i <= 6; i++) {
        let t = i / 6;
        let angle = Math.PI + t * Math.PI;

        let x1 = cx + Math.cos(angle) * (radius - 10);
        let y1 = cy + Math.sin(angle) * (radius - 10);

        let x2 = cx + Math.cos(angle) * radius;
        let y2 = cy + Math.sin(angle) * radius;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // LANCETTA VELOCITA
    let t = player.speed / (player.maxSpeed + 60);
    let angle = Math.PI + t * Math.PI;

    let nx = cx + Math.cos(angle) * (radius - 15);
    let ny = cy + Math.sin(angle) * (radius - 15);

	ctx.lineWidth = 5;
	ctx.strokeStyle = '#f00';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(nx, ny);
    ctx.stroke();
	
    // centro
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // testo velocità
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText((player.speed | 0) + ' km/h', cx, cy - 10);
	
	ctx.lineWidth = 1;
}



//RENDER!
function render() {
    update();
	drawSky(skyOffset);
	
	let startPos = Math.floor(player.z / segL);
	let camHeight = segments[startPos % segments.length].p1.world.y + camH;
	
    let x = 0;
    let dx = 0;
	
    // Road Loop
    for (let n = startPos; n < startPos + drawDistance; n++) {
        let s = segments[n % segments.length];
        let loop = (n >= segments.length) ? trackL : 0;

        project(s.p1, player.x * roadW - x, camHeight, player.z - loop);
        project(s.p2, player.x * roadW - x - s.curve, camHeight, player.z - loop);

        x += dx;
		dx += s.curve;

        // "Gap Fix": Usiamo y del segmento precedente per tappare i buchi
        if (n > startPos) {
            let prev = segments[(n - 1) % segments.length];
            drawSegment(prev.p2.screen.x, prev.p2.screen.y, prev.p2.screen.w,
                s.p2.screen.x, s.p2.screen.y, s.p2.screen.w,
                n);
        }
    }
	
	
    // Sprites & Collision (simplified logic for performance)
    for (let n = startPos + drawDistance; n > startPos; n--) {
        let s = segments[n % segments.length];
        if (s.sprite && s.p1.screen.scale > 0) {
            drawSprite(s.sprite, s.p1);

            // Collisione: segmento vicino + sovrapposizione X
            let segDist = n - startPos;
            if (segDist > 5 && segDist < 20 && player.state === 'ALIVE' && s.sprite.type !== 'oil') {
				
				/*// DEBUG HITBOX SPRITE
				ctx.strokeStyle = '#0f0';
				ctx.strokeRect(
					s.p1.screen.x + (s.sprite.x * s.p1.screen.w) - (s.sprite.width * 0.5 * s.p1.screen.w),
					s.p1.screen.y - 10,
					(s.sprite.width) * s.p1.screen.w,
					10
				);
				
				//DEBUG HITBOX FERRARI
				ctx.strokeStyle = '#ff0';
				ctx.strokeRect(
					s.p1.screen.x + (player.x * s.p1.screen.w) - (0.2 * 0.5 * s.p1.screen.w),
					s.p1.screen.y - 10,
					(0.2) * s.p1.screen.w,
					10
				);*/
				
                let spriteHalfW = s.sprite.width * 0.5;// * s.p1.screen.scale;
				let carHalfW = 0.1;//larga ~0.3 unità, centrata su playerX
				let overlap = Math.abs(player.x - s.sprite.x) < (spriteHalfW + carHalfW);
				
				if (overlap && segDist === 8) {
					console.log(`overlap=${overlap}  segDist=${segDist}  seg=${n}  playerX=${player.x.toFixed(2)}|${carHalfW}  spriteX=${s.sprite.x}|${spriteHalfW}  dist=${Math.abs(player.x - s.sprite.x).toFixed(2)}`);
                    player.state = 'CRASHED';
                }
            }
        }
    }
	
	//traffico!
	const visibleCars = trafficCars
    .map(car => {
        let rz = car.z - player.z;
        if (rz < 0) rz += trackL;
        return { car, rz };
    })
    .filter(({ rz }) => rz < segL * drawDistance)
    .sort((a, b) => b.rz - a.rz);
	
	for (let { car, rz } of visibleCars) {

		let z = rz;

		let segIndex = Math.floor(z / segL);
		let frac = (z % segL) / segL;

		let baseIndex = (startPos + segIndex) % segments.length;

		let lookAhead = 2;

		let s0 = segments[baseIndex];
		let s1 = segments[(baseIndex + lookAhead) % segments.length];

		// interp attuale
		let baseX0 = s0.p1.screen.x + (s0.p2.screen.x - s0.p1.screen.x) * frac;
		let baseW0 = s0.p1.screen.w + (s0.p2.screen.w - s0.p1.screen.w) * frac;
		let baseY0 = s0.p1.screen.y + (s0.p2.screen.y - s0.p1.screen.y) * frac;

		// interp futura (smooth)
		let baseX1 = s1.p1.screen.x + (s1.p2.screen.x - s1.p1.screen.x) * frac;
		let baseW1 = s1.p1.screen.w + (s1.p2.screen.w - s1.p1.screen.w) * frac;
		let baseY1 = s1.p1.screen.y + (s1.p2.screen.y - s1.p1.screen.y) * frac;

		let t = 0.25;

		let baseX = baseX0 * (1 - t) + baseX1 * t;
		let baseW = baseW0 * (1 - t) + baseW1 * t;
		let screenY = baseY0 * (1 - t) + baseY1 * t;

		let screenX = baseX + car.x * baseW;

		let scale = s0.p1.screen.scale + (s0.p2.screen.scale - s0.p1.screen.scale) * frac;

		let carW = scale * roadW * width * 0.1;
		let carH = carW * 0.5;

		drawFerrariShadow(screenX, screenY, carW * 1.4);//un po piu grande == piu belle
		drawFerrari(screenX, screenY, carW * 1.4, car.color.dark, car.color.light);//disegnate appena piu grandi
				
		if (player.state === 'ALIVE') {
			let playerX = width / 2;
			let playerY = height - 70;
			let playerW = CAR_WIDTH;
			let playerH = 40;

			let overlapX = Math.abs(screenX - playerX) < (carW * 0.4 + playerW * 0.4);
			let overlapY = Math.abs(screenY - playerY) < (carH * 0.4 + playerH * 0.4);

			// opzionale: solo quando è vicino visivamente
			if (screenY > height - 120 && overlapX && overlapY) {
				player.state = 'CRASHED';
			}
		}
	}

	

    // Player Car
    drawCar();
	
	drawSpeedometer();
	drawGearStick();

    requestAnimationFrame(render);
}

// ====== INPUT: TASTIERA ======
window.addEventListener('keydown', (e) => {
    resumeAudio();
    if (e.keyCode == 37) keys.left = 1;
    if (e.keyCode == 39) keys.right = 1;
    if (e.keyCode == 38) keys.up = 1;
    if (e.keyCode == 40) keys.down = 1;
});
window.addEventListener('keyup', (e) => {
    if (e.keyCode == 37) keys.left = 0;
    if (e.keyCode == 39) keys.right = 0;
    if (e.keyCode == 38) keys.up = 0;
    if (e.keyCode == 40) keys.down = 0;
});

// ====== INPUT: TOUCH (multi-touch) ======
// Mappa: quale tasto preme ogni bottone on-screen
const btnMap = {
    'btn-left':  'left',
    'btn-right': 'right',
    'btn-gas':   'up',
    'btn-brake': 'down'
};

function getBtnKey(el) {
    // Risali l'albero DOM finché trovi un btn con id mappato
    while (el && el !== document.body) {
        if (el.id && btnMap[el.id]) return btnMap[el.id];
        el = el.parentElement;
    }
    return null;
}

// Tiene traccia dei touch attivi per ogni key
const touchKeys = {};

document.getElementById('controls').addEventListener('touchstart', (e) => {
    e.preventDefault();
    resumeAudio();
    for (let t of e.changedTouches) {
        let el = document.elementFromPoint(t.clientX, t.clientY);
        let key = getBtnKey(el);
        if (key) {
            touchKeys[t.identifier] = key;
            keys[key] = 1;
            // feedback visivo
            let btnEl = document.getElementById(Object.keys(btnMap).find(k => btnMap[k] === key));
            if (btnEl) btnEl.classList.add('pressed');
        }
    }
}, { passive: false });

document.getElementById('controls').addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        let key = touchKeys[t.identifier];
        if (key) {
            // rilascia solo se nessun altro dito preme lo stesso tasto
            let stillPressed = false;
            for (let id in touchKeys) {
                if (id != t.identifier && touchKeys[id] === key) { stillPressed = true; break; }
            }
            if (!stillPressed) {
                keys[key] = 0;
                let btnEl = document.getElementById(Object.keys(btnMap).find(k => btnMap[k] === key));
                if (btnEl) btnEl.classList.remove('pressed');
            }
            delete touchKeys[t.identifier];
        }
    }
}, { passive: false });

document.getElementById('controls').addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        let key = touchKeys[t.identifier];
        if (key) { keys[key] = 0; delete touchKeys[t.identifier]; }
    }
}, { passive: false });

// Blocca context menu su long press (mobile)
document.addEventListener('contextmenu', e => e.preventDefault());

// ====== AVVIO ======
initSegments();
initPalette();
render();
</script>

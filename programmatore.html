<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Il Programmatore Tipico™ - v0.9.2-HOTFIX</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --green:  #39ff14;
    --red:    #ff2d55;
    --yellow: #ffe600;
    --orange: #ff8c00;
    --blue:   #00cfff;
    --purple: #c77dff;
    --bg:     #0a0a0f;
    --panel:  #0f0f1a;
    --border: #2a2a4a;
    --text:   #c8c8e0;
    --dim:    #555577;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Share Tech Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(57,255,20,0.015);
    pointer-events: none;
    z-index: 9998;
    animation: flicker 8s infinite;
  }

  @keyframes flicker {
    0%,100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    background: var(--panel);
    border-bottom: 2px solid var(--border);
    height: 64px;
    gap: 20px;
  }

  .topbar-title {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: var(--green);
    text-shadow: 0 0 8px var(--green);
    white-space: nowrap;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .topbar-title span {
    color: var(--dim);
    font-size: 14px;
  }

  .bars-area {
    display: flex;
    gap: 20px;
    flex: 1;
    justify-content: flex-end;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    max-width: 280px;
  }

  .bar label {
    font-family: 'VT323', monospace;
    font-size: 18px;
    white-space: nowrap;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    flex-shrink: 0;
    min-width: 90px;
    text-align: right;
  }

  .bar label.stress-label   { color: #ff2d55cc; }
  .bar label.quality-label  { color: #39ff1499; }
  .bar label.charge-label   { color: #00cfffcc; }

  .progress-wrap {
    flex: 1;
    position: relative;
  }

  .progress {
    height: 18px;
    background: #0a0a12;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .progress::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 8px,
      rgba(0,0,0,0.25) 8px,
      rgba(0,0,0,0.25) 9px
    );
    pointer-events: none;
    z-index: 2;
  }

  .fill {
    height: 100%;
    width: 50%;
    transition: width 0.25s, background 0.5s;
    position: relative;
  }

  .fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: rgba(255,255,255,0.6);
    filter: blur(2px);
  }

  .bar-value {
    font-family: 'VT323', monospace;
    font-size: 18px;
    width: 34px;
    text-align: right;
    color: var(--dim);
    flex-shrink: 0;
  }

  .container {
    display: grid;
    grid-template-columns: 270px 1fr 270px;
    height: calc(100vh - 64px - 60px);
  }

  .panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel.right {
    border-right: none;
    border-left: 1px solid var(--border);
  }

  .panel-header {
    padding: 8px 12px;
    background: #14142a;
    border-bottom: 1px solid var(--border);
    font-family: 'VT323', monospace;
    font-size: 17px;
    letter-spacing: 2px;
    color: var(--blue);
    text-shadow: 0 0 6px var(--blue);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 6px var(--blue);
    animation: blink 1.2s infinite;
  }

  .panel-header.events-header { color: var(--red); }
  .panel-header.events-header .dot { background: var(--red); box-shadow: 0 0 6px var(--red); animation-delay: 0.6s; }

  @keyframes blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .panel-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .task {
    background: #12121f;
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .task::before {
    content: '▶ CLICK';
    position: absolute;
    right: 8px; top: 8px;
    font-size: 10px;
    color: var(--blue);
    opacity: 0;
    transition: opacity 0.15s;
    font-family: 'VT323', monospace;
    letter-spacing: 1px;
  }

  .task:hover {
    background: #1a1a30;
    border-left-color: var(--green);
    transform: translateX(2px);
  }

  .task:hover::before { opacity: 1; }

  .task.urgent {
    border-left-color: var(--red) !important;
    background: #1f0a0a !important;
    animation: urgentPulse 0.6s infinite;
  }

  @keyframes urgentPulse {
    0%,100% { border-left-color: var(--red); }
    50% { border-left-color: #660000; }
  }

  .task-name {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 4px;
    padding-right: 50px;
  }

  .task-meta {
    font-size: 10px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }

  .task-meta .ttl       { color: var(--yellow); }
  .task-meta .ttl.low   { color: var(--red); }

  .ttl-bar {
    height: 2px;
    background: var(--border);
    margin-top: 6px;
    border-radius: 1px;
    overflow: hidden;
  }

  .ttl-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.25s, background 0.25s;
  }

  .event {
    background: #1a0a0f;
    border: 1px solid #2a0a14;
    border-left: 3px solid var(--red);
    padding: 8px 10px;
    margin-bottom: 8px;
    border-radius: 2px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { transform: translateY(-10px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .event-name {
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: #ff8090;
    margin-bottom: 4px;
  }

  .event-meta {
    font-size: 10px;
    color: var(--dim);
    display: flex;
    gap: 12px;
  }

  .event-meta .neg { color: var(--red); }
  .event-meta .pos { color: var(--green); }

  .center {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .center::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(57,255,20,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(57,255,20,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .character-wrap {
    position: relative;
    z-index: 2;
    text-align: center;
  }

  #character {
    font-size: 72px;
    display: block;
    filter: drop-shadow(0 0 20px rgba(57,255,20,0.3));
    transition: filter 0.5s;
    line-height: 1;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .status-badge {
    font-family: 'VT323', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .task-display {
    z-index: 2;
    width: 85%;
    max-width: 400px;
    text-align: center;
  }

  #currentTask {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--green);
    text-shadow: 0 0 10px rgba(57,255,20,0.5);
    margin-bottom: 10px;
    min-height: 28px;
    letter-spacing: 1px;
  }

  .progress-label {
    font-size: 10px;
    color: var(--dim);
    text-align: left;
    margin-bottom: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .progress.main-bar {
    height: 22px;
    border: 1px solid var(--border);
    border-radius: 0;
    position: relative;
  }

  #taskProgress {
    background: linear-gradient(90deg, #008b00, var(--green));
    box-shadow: 0 0 8px rgba(57,255,20,0.4);
  }

  .corner-tag {
    position: absolute;
    font-family: 'VT323', monospace;
    font-size: 11px;
    color: var(--border);
    letter-spacing: 1px;
  }

  .corner-tag.tl { top: 8px; left: 12px; }
  .corner-tag.tr { top: 8px; right: 12px; }
  .corner-tag.bl { bottom: 8px; left: 12px; }
  .corner-tag.br { bottom: 8px; right: 12px; }

  .actions {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #0f0f1a;
    border-top: 2px solid var(--border);
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 8px 16px;
    height: 60px;
    align-items: center;
  }

  .actions button {
    font-family: 'VT323', monospace;
    font-size: 17px;
    letter-spacing: 1px;
    padding: 6px 18px;
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .actions button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.08);
    opacity: 0;
    transition: opacity 0.1s;
  }

  .actions button:hover::after { opacity: 1; }
  .actions button:active { transform: scale(0.96); }

  .coffee    { background: #1a1000; color: var(--yellow); border-color: #554400 !important; }
  .coffee:hover    { background: #2a1a00; box-shadow: 0 0 12px rgba(255,230,0,0.3); }

  .refactor  { background: #001a0a; color: var(--green); border-color: #004422 !important; }
  .refactor:hover  { background: #002a10; box-shadow: 0 0 12px rgba(57,255,20,0.3); }

  .ignore    { background: #1a000a; color: var(--red); border-color: #440022 !important; }
  .ignore:hover    { background: #2a0010; box-shadow: 0 0 12px rgba(255,45,85,0.3); }

  .cazzeggio { background: #0a001a; color: var(--purple); border-color: #330055 !important; min-width: 36px; }
  .cazzeggio:hover { background: #150030; box-shadow: 0 0 12px rgba(199,125,255,0.3); }

  #clock  { font-family: 'VT323', monospace; font-size: 16px; color: var(--dim); margin-left: auto; letter-spacing: 2px; }
  #clock2 { font-family: 'VT323', monospace; color: var(--dim); font-size: 15px; margin-left: auto; letter-spacing: 2px; }

  /* ── BAR FLASH (generico per tutte e tre le barre) ── */
  @keyframes flashGood { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 18px var(--flash-color)} }
  @keyframes flashBad  { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 18px var(--flash-color)} }

  /* charge: sale = bene (verde), scende = male (rosso) */
  .charge-flash-up   { --flash-color:#39ff14; animation: flashGood 0.5s ease; }
  .charge-flash-down { --flash-color:#ff2d55; animation: flashBad  0.5s ease; }

  /* stress: sale = male (rosso), scende = bene (verde) */
  .stress-flash-up   { --flash-color:#ff2d55; animation: flashBad  0.5s ease; }
  .stress-flash-down { --flash-color:#39ff14; animation: flashGood 0.5s ease; }

  /* quality: sale = bene (verde), scende = male (rosso) */
  .quality-flash-up   { --flash-color:#39ff14; animation: flashGood 0.5s ease; }
  .quality-flash-down { --flash-color:#ff2d55; animation: flashBad  0.5s ease; }

  #gameOverScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }

  #gameOverScreen.show { display: flex; }

  #gameOverMsg {
    font-family: 'VT323', monospace;
    font-size: 52px;
    color: var(--red);
    text-shadow: 0 0 30px var(--red);
    text-align: center;
    animation: glitch 0.3s infinite;
    line-height: 1.2;
  }

  #gameOverSub {
    font-family: 'VT323', monospace;
    color: var(--dim);
    font-size: 22px;
    text-align: center;
  }

  @keyframes glitch {
    0%   { text-shadow: 0 0 30px var(--red); transform: none; }
    20%  { text-shadow: 3px 0 0 cyan, -3px 0 0 var(--red); transform: skewX(2deg); }
    40%  { text-shadow: -3px 0 0 cyan, 3px 0 0 var(--red); transform: skewX(-2deg); }
    60%  { text-shadow: 0 0 30px var(--red); transform: none; }
    100% { text-shadow: 0 0 30px var(--red); transform: none; }
  }

  #restartBtn {
    font-family: 'VT323', monospace;
    font-size: 22px;
    padding: 10px 30px;
    background: transparent;
    border: 2px solid var(--green);
    color: var(--green);
    cursor: pointer;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  #restartBtn:hover {
    background: var(--green);
    color: var(--bg);
    box-shadow: 0 0 20px var(--green);
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>

// ── Helpers flash barra chargeability ──
function flashBar(id, dir) {
  const wrap = document.getElementById(id + 'BarWrap');
  const cls  = dir > 0 ? id+'-flash-up' : id+'-flash-down';
  wrap.classList.remove(id+'-flash-up', id+'-flash-down');
  void wrap.offsetWidth; // reflow per restart animation
  wrap.classList.add(cls);
  setTimeout(() => wrap.classList.remove(cls), 1000);
}

function spawnTask() {
  const t = TASKS[Math.floor(Math.random() * TASKS.length)];
  const ttl = 5000 + Math.random() * 5000;
  const id = Date.now() + Math.random();
  state.taskTTLMax[id] = ttl;
  state.tasks.push({ ...t, id, progress: 0, ttl });
}

function triggerEvent() {
  const e = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  state.stress  += e.stress;
  state.quality += e.quality;
  flashBar('quality', e.quality);
  flashBar('stress',  e.stress);
  state.events.unshift(e);
  if (state.events.length > 1) state.events.pop();
}

function startTask(task) {
  if (state.currentTask) return;
  state.currentTask = task;
  state.tasks = state.tasks.filter(t => t.id !== task.id);
}

function updateTasks(delta) {
  if (state.currentTask) {
    state.currentTask.progress += delta;
    if (state.currentTask.progress >= state.currentTask.duration) {
      // ── TASK COMPLETATO ──
      state.stress        += state.currentTask.stress;
      state.quality       += state.currentTask.quality;
      state.chargeability += 5;
      flashBar('quality',1);
	  flashBar('stress',-1);
	  flashBar('charge',1);
      state.currentTask = null;
    }
  }

  // Task scaduti nella coda
  const expired = state.tasks.filter(t => t.ttl - delta <= 0);
  expired.forEach(t => {
    state.stress        += 10;
    state.quality       -= 5;
    state.chargeability -= 15;
	flashBar('quality',-1);
	flashBar('stress',+1);
    flashBar('charge',-1);
    delete state.taskTTLMax[t.id];
  });
  state.tasks = state.tasks
    .map(t => ({ ...t, ttl: t.ttl - delta }))
    .filter(t => t.ttl > 0);
}

function coffee()    { state.stress -= 10; flashBar('stress',-1);}
function refactor()  { state.quality += 10; flashBar('quality',+1);}
function ignore()    { state.stress -= 5; state.quality -= 5; flashBar('stress',-1); flashBar('quality',-1); }
function cazzeggio() { state.stress -= 15; state.quality -= 15; state.chargeability -= 15;
					   flashBar('stress',-1); flashBar('quality',-1); flashBar('charge',-1); }

function clamp() {
  state.stress        = Math.max(0, Math.min(100, state.stress));
  state.quality       = Math.max(0, Math.min(100, state.quality));
  state.chargeability = Math.max(0, Math.min(100, state.chargeability));
}

function checkGameOver() {
  if (state.stress >= 100) {
    document.getElementById('gameOverMsg').innerText  = '💀 SEI MORTO DI STRESS';
    document.getElementById('gameOverSub').innerText  = 'Lo sapevi che era una settimana corta?';
    document.getElementById('gameOverScreen').classList.add('show');
    state.gameOver = true;
  }
  if (state.quality <= 0) {
    document.getElementById('gameOverMsg').innerText  = '🐛 LICENZIATO IN TRONCO';
    document.getElementById('gameOverSub').innerText  = 'Troppi bug in produzione... come sempre!';
    document.getElementById('gameOverScreen').classList.add('show');
    state.gameOver = true;
  }
  // ── NUOVA CONDIZIONE: chargeability a zero ──
  if (state.chargeability <= 0) {
    document.getElementById('gameOverMsg').innerText  = '🛋️ LICENZIATO IN TRONCO';
    document.getElementById('gameOverSub').innerText  = 'Nullafacente, hai esagerato con il cazzeggio!';
    document.getElementById('gameOverScreen').classList.add('show');
    state.gameOver = true;
  }
}

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  const t = `${hh}:${mm}:${ss}`;
  const clockEl = document.getElementById('clock');
  if (clockEl) clockEl.innerText = t;
  document.getElementById('clock2').innerText = t;
}

function render() {
  // ── CHARGEABILITY BAR ──
  const cf = document.getElementById('chargeFill');
  const ch = state.chargeability;
  cf.style.width = ch + '%';
  cf.style.background = ch > 25 ? '#00cfff' : '#ff2d55';
  cf.style.boxShadow  = ch <= 25 ? '0 0 8px #ff2d55' : 'none';
  document.getElementById('chargeVal').innerText = Math.round(ch);

  // ── STRESS BAR ──
  const sf = document.getElementById('stressFill');
  sf.style.width      = state.stress + '%';
  sf.style.background = state.stress < 25 ? '#39ff14' : '#ff2d55';
  sf.style.boxShadow  = state.stress >= 75 ? '0 0 8px #ff2d55' : 'none';
  document.getElementById('stressVal').innerText = Math.round(state.stress);

  // ── QUALITY BAR ──
  const qf = document.getElementById('qualityFill');
  qf.style.width      = state.quality + '%';
  qf.style.background = state.quality > 25 ? '#39ff14' : '#ff2d55';
  qf.style.boxShadow  = state.quality <= 25 ? '0 0 8px #ff2d55' : 'none';
  document.getElementById('qualityVal').innerText = Math.round(state.quality);

  // ── CURRENT TASK ──
  const currentTaskEl = document.getElementById('currentTask');
  const progressEl    = document.getElementById('taskProgress');
  if (state.currentTask) {
    currentTaskEl.innerText = '▸ ' + state.currentTask.name;
    progressEl.style.width  = ((state.currentTask.progress / state.currentTask.duration) * 100) + '%';
  } else {
    currentTaskEl.innerText = '[ IDLE — aspetto un requisito assurdo ]';
    progressEl.style.width  = '0%';
  }

  // ── TASK LIST ──
  const taskList = document.getElementById('taskList');
  while (taskList.firstChild) taskList.removeChild(taskList.firstChild);
  state.tasks.forEach(t => {
    const el = document.createElement('div');
    el.className = 'task' + (t.ttl < 3000 ? ' urgent' : '');
    const seconds = Math.max(0, Math.floor(t.ttl / 1000));
    const duration = Math.floor(t.duration / 1000);
    const maxTTL   = state.taskTTLMax[t.id] || 10000;
    const ttlPerc  = Math.max(0, (t.ttl / maxTTL) * 100);
    const ttlClass = t.ttl < 3000 ? 'low' : '';
    el.innerHTML = `
      <div class="task-name">${t.name}</div>
      <div class="task-meta">
        <span>⏱ ~${duration}h</span>
        <span class="ttl ${ttlClass}">⚠ ${seconds}s</span>
      </div>
      <div class="ttl-bar">
        <div class="ttl-fill" style="width:${ttlPerc}%;background:${t.ttl<3000?'#ff2d55':t.ttl<6000?'#ff8c00':'#39ff14'}"></div>
      </div>`;
    el.onmousedown = () => startTask(t);
    taskList.appendChild(el);
  });

  // ── EVENT LIST ──
  const eventList = document.getElementById('eventList');
  eventList.innerHTML = state.events.map(e => {
    const isBonus = e.stress < 0 || e.quality > 0;
    return `<div class="event" style="${isBonus ? 'border-left-color:#39ff14;background:#0a1a0a' : ''}">
      <div class="event-name" style="${isBonus ? 'color:#39ff14' : ''}">${isBonus ? '✦' : '⚡'} ${e.name}</div>
      <div class="event-meta">
        <span class="${e.stress  > 0 ? 'neg' : 'pos'}">STRESS ${e.stress  > 0 ? '+' : ''}${e.stress}</span>
        <span class="${e.quality < 0 ? 'neg' : 'pos'}">QUALITÀ ${e.quality > 0 ? '+' : ''}${e.quality}</span>
      </div>
    </div>`;
  }).join('');

  // ── CHARACTER ──
  const char  = document.getElementById('character');
  const badge = document.getElementById('statusBadge');
  const stressEmojis = [
    [35,  '😊', 'RILASSATO'],
    [50,  '😐', 'QUASI OK'],
    [60,  '☹️', 'SOTTO STRESS'],
    [70,  '😔', 'SOFFERENTE'],
    [80,  '😤', 'AL LIMITE'],
    [90,  '🤬', 'COLLASSO IMMINENTE'],
    [101, '💀', 'RIPOSA IN PACE']
  ];
  for (const [threshold, emoji, label] of stressEmojis) {
    if (state.stress < threshold) {
      char.innerText  = emoji;
      badge.innerText = label;
      char.style.filter = state.stress > 70
        ? 'drop-shadow(0 0 20px rgba(255,45,85,0.5))'
        : 'drop-shadow(0 0 20px rgba(57,255,20,0.3))';
      break;
    }
  }
}

let last = 0, lastRender = 0;

setInterval(updateClock, 1000);
updateClock();

function loop(ts) {
  if (state.gameOver) return;
  const delta = ts - last;
  last = ts;

  updateTasks(delta);
  if (Math.random() < 0.003) spawnTask();
  if (Math.random() < 0.0101) triggerEvent();

  clamp();
  checkGameOver();

  if (ts - lastRender > 250) {
    render();
    lastRender = ts;
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
